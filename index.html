<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="claudio board">
<title>claudio board</title>
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="agente-web-version" content="4.33">
<link rel="manifest" href="manifest.json?v=4.33">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<!-- agente-web: fuentes chicas, auto actualizacion por version.json cada 60 s, mensajes siempre
     enteros (sin plegado) y **pestañas por tema** (2026-09-11): una pestaña por tema sobre el borde
     de arriba del panel de chat, el tema lo detecta el clasificador sin tokens (copia generada de
     recetas/clasificar_tema.py, bloque TEMAS-JS) y una pestaña se puede mandar al lado de los widgets.
     el texto del chat va en la paleta fluo (resaltar()): **negrita** amarilla, `code` cian, ## magenta,
     tablas con cabecera y filas alternadas, --- verde tenue, [tag] verde, ORDEN:/PROPUESTA: amarillo.
     lo chequea `python3 -m recetas.prueba_web_color` (va adentro de prueba_web). -->
<style>
  :root{
    --verde:#39ff14; --blanco:#e8e8e8; --gris:#666; --cian:#22d3ee;
    --magenta:#ff4fd8; --rojo:#ff4d4d; --amarillo:#ffd60a; --linea:#1c1c1c;
    --verde-tenue:#1f7a12; --linea-clara:#3a3a3a; --yo:#9be88a;
    --naranja:#ff9f1a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:var(--blanco)}
  body{
    font-family:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
    font-size:12px;line-height:1.55;letter-spacing:.01em;
    height:100dvh;height:var(--alto,100dvh);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #cabecera{
    flex:0 0 auto;padding:8px 10px calc(8px) 10px;border-bottom:1px solid var(--linea);
    padding-top:calc(8px + env(safe-area-inset-top));background:#000;
    display:flex;gap:8px;align-items:center;justify-content:flex-end;
  }
  #marca{
    flex:1 1 auto;min-width:0;color:var(--verde);font-size:10px;letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;
  }
  #salir{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid var(--linea);
    border-radius:4px;padding:4px 8px;font:inherit;font-size:9px;cursor:pointer;
  }
  #salir.confirmar{color:var(--rojo);border-color:var(--rojo)}
  #hist{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .msg{margin:0 0 14px 0;white-space:pre-wrap;word-break:break-word;font-size:12px}
  .msg .ts{color:var(--gris);font-size:10px}
  .msg .quien,.msg .ts{user-select:none}
  .msg .quien{color:var(--magenta)}
  .agente .quien{color:var(--verde)}
  .agente .cuerpo{color:var(--blanco)}
  .yo .quien{color:var(--cian)}
  .yo .cuerpo{color:var(--yo)}
  .error .cuerpo{color:var(--rojo)}
  .sistema .cuerpo{color:var(--gris)}
  /* los mensajes se muestran siempre enteros: no hay plegado (facundo, 2026-09-10) */
  .cuerpo .ok{color:var(--verde)}
  .cuerpo .fallo{color:var(--rojo)}
  .cuerpo .pend{color:var(--amarillo)}
  .cuerpo .corriendo{color:var(--cian)}
  .cuerpo .costo{color:var(--magenta)}
  .cuerpo .marca{color:var(--gris)}
  /* ---------- color del texto (facundo, 2026-09-11: la paleta fluo tambien adentro del mensaje) ---------- */
  .cuerpo .neg{color:var(--amarillo);font-weight:600}          /* **negrita** */
  .cuerpo .cod{color:var(--cian);background:#07222a;border-radius:3px;padding:0 3px}  /* `code` */
  .cuerpo .tit{color:var(--magenta);font-weight:600}           /* ## titulo */
  .cuerpo .sep{color:var(--verde-tenue)}                       /* --- */
  .cuerpo .orden{color:var(--amarillo)}                        /* ORDEN: / PROPUESTA: */
  .cuerpo .tag{color:var(--verde)}                             /* [tema] / [openrouter/x] */
  .cuerpo .vin{color:var(--verde-tenue)}                       /* el guion de cada bullet */
  .cuerpo .tcab{color:var(--magenta);font-weight:600}          /* cabecera de tabla */
  .cuerpo .tsep{color:var(--linea-clara)}                      /* |---|---| */
  .cuerpo .tfila{color:var(--blanco)}
  .cuerpo .tfila.par{color:#b9c2c8;background:#0b0b0b}         /* filas alternadas */
  /* imagenes inline (facundo, 2026-09-11): el daemon publica el png en el repo del buzon y aca se
     baja con el mismo token (blob). click = tamaño real en el visor. */
  .cuerpo .img{display:block;margin:6px 0}
  .cuerpo .img img{
    display:block;max-width:100%;max-height:42vh;border:1px solid var(--linea-clara);
    border-radius:4px;background:#000;cursor:zoom-in
  }
  .cuerpo .img .pie{display:block;color:var(--gris);font-size:10px;margin-top:2px}
  .cuerpo .img .cargando{color:var(--cian)}
  .cuerpo .img .rota{color:var(--rojo)}
  #visor{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);overflow:auto;
    display:flex;align-items:center;justify-content:center;cursor:zoom-out
  }
  #visor img{max-width:100%;height:auto}
  #visor .cerrar{position:fixed;top:8px;right:12px;color:var(--verde);font-size:13px}
  #mas{
    display:block;width:100%;margin:0 0 10px 0;background:#000;color:var(--gris);
    border:1px solid var(--linea);border-radius:4px;padding:6px;font:inherit;font-size:10px;cursor:pointer;
  }
  #pie{
    flex:0 0 auto;border-top:1px solid var(--linea);background:#000;
    padding:4px 10px calc(4px + env(safe-area-inset-bottom)) 10px;
  }
  #rapidos{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #rapidos::-webkit-scrollbar{display:none}
  #rapidos button{
    flex:0 0 auto;background:#000;color:var(--cian);border:1px solid var(--linea);
    border-radius:14px;padding:7px 12px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;
  }
  #rapidos button:active{background:#111}
  /* sugerencias de respuesta: salen de la ultima respuesta del daemon en esta pestaña (cero tokens) */
  #chips{display:flex;gap:5px;overflow-x:auto;padding:0 0 5px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  #chips.oculta{display:none}
  #chips button{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid var(--linea);
    border-radius:3px;padding:3px 7px;font:inherit;font-size:10.5px;line-height:1.3;
    cursor:pointer;white-space:nowrap;
  }
  #chips button .l{color:var(--amarillo)}
  #chips button:hover{color:var(--blanco);border-color:#2a2a2a}
  #chips button:active{background:#111}
  #fila{display:flex;gap:6px;align-items:flex-end}
  #prompt{color:var(--magenta);padding-bottom:7px;flex:0 0 auto;user-select:none}
  #txt{
    flex:1 1 auto;background:#000;color:var(--blanco);border:1px solid #1a1a1a;
    border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;line-height:1.4;
    resize:none;max-height:28dvh;min-height:28px;
  }
  #txt:focus{outline:none;border-color:#2a2a2a}
  #mandar{
    flex:0 0 auto;background:#000;color:var(--verde);border:1px solid transparent;
    border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;line-height:1.4;
    cursor:pointer;letter-spacing:0;
  }
  #mandar:active{background:#0a1a06}
  #mandar:disabled{color:var(--gris);border-color:transparent}
  #alfinal{
    position:absolute;right:12px;bottom:8px;z-index:5;display:none;
    background:#001a00;color:var(--verde);border:1px solid var(--verde);
    border-radius:14px;padding:6px 12px;font:inherit;font-size:10.5px;cursor:pointer;
  }
  #envoltorio{position:relative;flex:1 1 auto;min-height:0;display:flex}
  #login{padding:16px;display:none;flex-direction:column;gap:10px}
  #login p{color:var(--gris);font-size:10px;margin:0;white-space:pre-wrap}
  #login input{
    background:#000;color:var(--verde);border:1px solid var(--linea);border-radius:4px;
    padding:9px;font:inherit;
  }
  /* ---------- web 2: dos paneles (chat | widgets) ---------- */
  #cuerpo{flex:1 1 auto;min-height:0;display:flex;flex-direction:row}
  #panel-chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  #panel-widgets{
    flex:0 0 420px;min-width:0;overflow-y:auto;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  /* separador arrastrable entre el chat y los widgets (facundo, 2026-09-11). la linea del medio es
     el borde que antes pintaba #panel-widgets; el area de agarre es mas ancha que la linea. */
  #sep{
    flex:0 0 7px;position:relative;cursor:col-resize;background:transparent;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  #sep::after{
    content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--linea);
  }
  #sep:hover::after,#sep.arrastrando::after{background:var(--verde);box-shadow:0 0 6px var(--verde)}
  body.arrastrando-sep{cursor:col-resize}
  body.arrastrando-sep #hist,body.arrastrando-sep #panel-widgets{pointer-events:none}
  .caja{border:1px solid var(--linea);border-radius:6px;padding:7px 9px 8px 9px;margin:0 0 8px 0}
  .caja > .tit{
    color:var(--gris);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    margin:0 0 5px 0;display:flex;justify-content:space-between;gap:8px;
  }
  .caja .cuerpo{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.5}
  .caja .cuerpo.tabla{white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .caja .vacio{color:var(--gris)}
  .caja .cuerpo a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44}
  .caja .cuerpo a:active{color:var(--verde)}
  .bar .lleno{color:var(--verde)}
  .bar.med .lleno{color:var(--amarillo)}
  .bar.alto .lleno{color:var(--rojo)}
  .bar .hueco{color:#333}
  .pct{font-weight:500}
  .pct.ok{color:var(--verde)} .pct.med{color:var(--amarillo)} .pct.alto{color:var(--rojo)}
  /* ---------- widget usage: una barra grafica por limite, con el tick de la linea ---------- */
  /* el color sale del ratio (pct usado / linea = fraccion de la ventana transcurrida), no del pct */
  .usage{white-space:normal}
  .usage .cta{display:flex;align-items:center;gap:6px;margin:0 0 4px 0}
  .usage .cta + .ub{margin-top:0}
  .usage .cta .nom{color:var(--cian);font-weight:600;letter-spacing:.04em}
  .usage .bloque + .bloque{margin-top:9px;padding-top:8px;border-top:1px solid var(--linea)}
  .ub{display:flex;align-items:center;gap:6px;margin:0 0 5px 0}
  .ub-n{flex:0 0 34px;color:var(--gris);font-size:10px;letter-spacing:.04em}
  .ub-pista{
    flex:1 1 auto;min-width:0;position:relative;height:11px;background:#0d0d0d;
    border:1px solid var(--linea);border-radius:2px;overflow:hidden;
  }
  .ub-lleno{position:absolute;left:0;top:0;bottom:0;background:#333;border-radius:1px}
  .ub-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--blanco);opacity:.8}
  .ub-p{flex:0 0 34px;text-align:right;font-weight:600;color:var(--gris)}
  .ub-r{flex:0 0 46px;text-align:right;color:var(--gris);font-size:10px}
  .ub.n-ok .ub-lleno{background:var(--verde)}
  .ub.n-ok .ub-p{color:var(--verde)}
  .ub.n-cerca .ub-lleno{background:var(--amarillo)}
  .ub.n-cerca .ub-p{color:var(--amarillo)}
  .ub.n-sobre .ub-lleno{background:var(--naranja)}
  .ub.n-sobre .ub-p{color:var(--naranja)}
  .ub.n-mal .ub-lleno{background:var(--rojo);box-shadow:0 0 7px var(--rojo)}
  .ub.n-mal .ub-p{color:var(--rojo);font-weight:700}
  .v{color:var(--verde)} .r{color:var(--rojo)} .a{color:var(--amarillo)}
  .c{color:var(--cian)} .m{color:var(--magenta)} .g{color:var(--gris)}
  .b{font-weight:500}
  .btn{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:12px;
    padding:2px 9px;font:inherit;font-size:9.5px;cursor:pointer;margin:2px 4px 2px 0;
  }
  .btn:active{background:#111}
  .btn.voto{color:var(--verde);border-color:#1f3a14}
  .btn.dale{color:var(--verde);border-color:var(--verde)}
  #vistas{display:none;gap:6px;flex:0 0 auto}
  #vistas button{
    background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:4px 9px;font:inherit;font-size:9px;cursor:pointer;
  }
  #vistas button.on{color:var(--verde);border-color:var(--verde)}
  body.sinlogin #cabecera,body.sinlogin #cuerpo{display:none}
  /* angosto (celu): una vista a la vez, la elige la barra de arriba. puro css, sin js de layout */
  @media (max-width:899px){
    #vistas{display:flex}
    #panel-widgets{flex:1 1 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    #sep{display:none}
    #panel-lado{flex:1 1 auto;border-left:none}
    /* una vista a la vez: la elige la barra de arriba (chat | widgets | la pestaña de al lado) */
    body:not(.ver-widgets) #panel-widgets{display:none}
    body.ver-widgets #panel-chat{display:none}
    body:not(.ver-lado) #panel-lado{display:none}
    body.ver-lado #panel-chat,body.ver-lado #panel-widgets{display:none}
    /* ios zoomea al enfocar un input de menos de 16px: lo frena maximum-scale=1 en el
       viewport, asi que el input del chat va chico como el resto del chat. los de login
       quedan en 16 (se tocan una vez y ahi no molesta). */
    #login input,#clave,#tok{font-size:16px}
  }
  #login button{
    background:#000;color:var(--verde);border:1px solid var(--verde);border-radius:4px;
    padding:9px;font:inherit;cursor:pointer;
  }
  /* ---------- pestañas por tema (2026-09-11, las mismas que la consola) ---------- */
  /* la barra es el borde de arriba del panel de chat (estilo vscode): la pestaña activa se
     come el borde y se funde con la charla, sin renglon extra. */
  #tabs{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:0;overflow-x:auto;
    border-bottom:1px solid var(--linea);padding:0 6px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #tabs::-webkit-scrollbar{display:none}
  #tabs .tab{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid transparent;border-bottom:none;
    border-radius:4px 4px 0 0;padding:4px 9px;font:inherit;font-size:10.5px;cursor:pointer;
    white-space:nowrap;margin-bottom:-1px;
  }
  #tabs .tab.enpanel{color:var(--cian)}
  #tabs .tab.activo{
    color:var(--verde);border-color:var(--linea);border-bottom:1px solid #000;background:#060606;
  }
  #tabs .tab .x{color:#555;margin-left:7px}
  #tabs .tab.arrastrando{opacity:.5}
  #tabs .barrabtn{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:2px 7px;font:inherit;font-size:9.5px;cursor:pointer;white-space:nowrap;
    margin:0 0 3px 5px;
  }
  #tabs .barrabtn:active{background:#111}
  #tabs .relleno{flex:1 1 auto;min-width:8px}
  /* ---------- sincronizando (facundo, 2026-09-11) ----------
     al abrir la web o al volver al foco, el cache de localStorage no se pinta como si fuera el
     estado real: mientras baja el buzon se ve esta linea y lo cacheado queda apagado. */
  #sync{
    flex:0 0 auto;padding:2px 10px;font-size:10px;color:var(--cian);
    border-bottom:1px solid var(--linea);background:#050505;
  }
  #sync.oculta{display:none}
  #sync.off{color:var(--amarillo)}
  body.sincronizando #lista,body.sincronizando #lista1,
  body.sincronizando #widgets,body.sincronizando #tabs .tab{opacity:.45}
  #panel-widgets.soltar,#panel-lado.soltar{border-left:1px dashed var(--verde)}
  /* segundo panel: la pestaña que se manda al lado de la fila de widgets */
  #panel-lado{
    flex:0 0 380px;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--linea);
  }
  #panel-lado.oculta{display:none}
  #panel-lado .ladotit{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:4px 8px;border-bottom:1px solid var(--linea);color:var(--cian);font-size:10.5px;
  }
  #panel-lado .ladotit button{
    background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:2px 7px;font:inherit;font-size:9.5px;cursor:pointer;
  }
  #panel-lado.foco .ladotit{color:var(--verde)}
  #hist1{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  /* dropdown: pestaña nueva, a que panel va, y la pregunta de "esto parece de otro tema" */
  #ddfondo{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.45)}
  #ddfondo.oculta,#dd.oculta{display:none}
  #dd{
    position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:20;
    max-width:460px;margin:0 auto;background:#000;border:1px solid var(--verde);border-radius:6px;
    padding:6px;display:flex;flex-direction:column;gap:4px;max-height:60dvh;overflow-y:auto;
  }
  #dd .ddtit{color:var(--gris);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 4px}
  #dd .ddop{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:4px;
    padding:8px 10px;font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  }
  #dd .ddop:active{background:#111}

  /* ---------- modal de item de widget (facundo, 2026-09-11) ----------
     tocar cualquier fila de un widget la expande y ofrece 2 a 4 acciones a/b/c. look terminal. */
  .it{cursor:pointer;border-radius:3px}
  .it:hover{background:#0d1410}
  #mfondo{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.65)}
  #mfondo.oculta,#modal.oculta{display:none}
  #modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
    width:min(560px,calc(100vw - 20px));max-height:82dvh;overflow-y:auto;
    background:#000;border:1px solid var(--verde);border-radius:6px;
    box-shadow:0 0 0 1px #06210a,0 10px 40px rgba(0,0,0,.85);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  #modal .mtit{
    position:sticky;top:0;background:#000;display:flex;justify-content:space-between;gap:8px;
    align-items:center;border-bottom:1px solid var(--linea);padding:7px 9px;
    color:var(--verde);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
  }
  #modal .mx{
    background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:2px 7px;font:inherit;font-size:9px;cursor:pointer;flex:0 0 auto;
  }
  #modal .mcuerpo{
    padding:9px;font-size:11.5px;line-height:1.55;color:var(--blanco);
    white-space:pre-wrap;word-break:break-word;
  }
  #modal .mcuerpo a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44}
  #modal .macc{display:flex;flex-direction:column;gap:5px;padding:0 9px 10px 9px}
  #modal .macc button{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:4px;
    padding:8px 10px;font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  }
  #modal .macc button:active{background:#111}
  #modal .macc button.principal{color:var(--verde);border-color:var(--verde)}
  #modal .macc .let{color:var(--verde);font-weight:600;margin-right:6px}
  @media (max-width:899px){
    /* en el celu el modal ocupa toda la pantalla */
    #modal{

  }
</style>

<script>
(function(){
"use strict";

var REPO = "facundopichetto/agente-buzon";
var ISSUE = 1;
var MARCA = "<!--agente-->";
var API = "https://api.github.com";

var $ = function(id){ return document.getElementById(id); };
var hist = $("hist"), lista = $("lista"), login = $("login"), pie = $("pie");
var cabecera = $("cabecera"), txt = $("txt");
var alfinal = $("alfinal"), envoltorio = $("envoltorio");

// ---------- pestañas por tema (facundo, 2026-09-11: las mismas que la consola) ----------
// una pestaña por tema, pintada sobre el borde de arriba del panel de chat (estilo vscode).
// el tema de cada mensaje lo decide el mismo clasificador sin tokens que usa el daemon
// (recetas/clasificar_tema.py): prefijo `tema x:` y si no palabras clave. la tabla de abajo es
// una copia GENERADA de esa receta: se actualiza con `python3 -m recetas.clasificar_tema --sync-web`
// y `recetas/prueba_web` falla si quedo vieja. no editarla a mano.
/* TEMAS-JS: generado por `python3 -m recetas.clasificar_tema --sync-web`, no editar a mano */
var TEMAS = ["tools", "awtomic", "awtomic/qa", "flabs", "fuzzer", "juegos", "plata", "server", "personal"];
var PRIORIDAD = ["awtomic/qa", "flabs", "server", "juegos", "plata", "fuzzer", "awtomic", "tools"];
var ALIAS = {"awtomic-qa": "awtomic/qa"};
var RE_CORTE_SRC = "(\\n+)|([.;!?]\\s+)|(^|[\\s,;:])(?:y\\s+otra\\s+cosa|otra\\s+cosa|aparte|adem[a\u00e1]s|tambi[e\u00e9]n)(?!\\w)";
var PALABRAS = {
  "awtomic/qa": ["verificador", "awtomic[- ]?qa", "qa", "tanda de tickets", "revisor de tanda", "loop verificador", "capturas del ticket"],
  "awtomic": ["jira", "ticket", "tickets", "cx", "shopify", "merchant", "merchants", "theme", "mvp-?\\d+", "cx-?\\d+", "subscription", "suscripci\\wn", "bundle", "brian", "emily", "verify", "selling plan", "app de awtomic", "awtomic"],
  "fuzzer": ["banda", "show", "shows", "fuzzer", "meta ads", "instagram", "spotify", "tema nuevo", "disco", "single", "ensayo", "fecha", "flyer", "prensa"],
  "juegos": ["retroid", "rom", "roms", "emulador", "emuladores", "ps2", "psp", "vita", "psvita", "gamecube", "dreamcast", "consolita", "emudeck", "retroarch", "juego", "juegos", "chd", "iso", "black_?5tb"],
  "plata": ["plata", "ahorro", "ahorrar", "inversi\\wn", "invertir", "d\\wlar", "dolares", "cedear", "cedears", "plazo fijo", "banco", "gastos", "presupuesto personal"],
  "server": ["server", "mini ?pc", "minipc", "pendrive", "iso", "autoinstall", "bootstrap", "tailscale", "xubuntu", "migraci\\wn", "ubuntu", "nuc"],
  "flabs": ["flabs", "flabsdev"],
  "tools": ["claude", "iterm", "fish", "chrome", "tui", "consola", "daemon", "agente", "receta", "recetas", "skill", "terminal", "tmux", "widget", "widgets", "web terminal", "mision", "modelo", "tokens", "cola", "launchd", "pesta[\u00f1n]a", "pesta[\u00f1n]as", "interfaz", "chat"],
};
/* /TEMAS-JS */
var AUTO = "auto";
// la general: puerta de entrada sin tema fijo. en el layout se guarda como `auto`, se muestra `general`
var ETIQUETA = {auto: "general"};
var RE_TEMA = /^\s*tema\s+([\w\/-]+)\s*:\s*/i;
// nombres (NOMBRES.md): un **motor** es `tema/motor` (`awtomic/qa`) y vive adentro de su tema padre:
// comparte el log del padre y la pestaña del padre lo muestra. `awtomic-qa` es el alias viejo.
function normTema(t){ t = (t || "").trim().toLowerCase(); return (ALIAS && ALIAS[t]) || t; }
function padreTema(t){ return normTema(t).split("/")[0]; }
function esTema(t){ return TEMAS.indexOf(normTema(t)) >= 0; }
// lo que el daemon atiende por texto exacto (sin modelo): sale crudo, sin `tema x:` adelante
var RE_CRUDO = /^(status|estado|pausa|segu[ií]|log|cola|[oó]rdenes|ordenes|propuestas|avisos|reinicia|reiniciar|cuenta(\s+\S+)?|op\s+\d+\s+[a-dA-D]|dale\s+\d+)$/i;

var _re = {};
(function(){
  // equivale al (?<!\w)p(?!\w) de la receta, sin lookbehind (safari viejo no lo tiene)
  for(var t in PALABRAS) _re[t] = PALABRAS[t].map(function(p){
    return new RegExp("(^|[^\\w])(?:" + p + ")($|[^\\w])", "i");
  });
})();
function porPalabras(txt){
  var puntajes = {}, mejor = 0;
  for(var t in _re){
    var n = 0;
    _re[t].forEach(function(r){ if(r.test(txt || "")) n++; });
    puntajes[t] = n;
    if(n > mejor) mejor = n;
  }
  if(!mejor) return null;
  for(var i = 0; i < PRIORIDAD.length; i++) if(puntajes[PRIORIDAD[i]] === mejor) return PRIORIDAD[i];
  return null;
}
// {tema, fuente}: prefijo | palabras | default. el default lo pone la pestaña, no la ultima charla.
function clasificar(txt){
  var m = RE_TEMA.exec(txt || "");
  if(m && esTema(m[1])) return {tema: normTema(m[1]), fuente: "prefijo"};
  var t = porPalabras(txt);
  if(t) return {tema: t, fuente: "palabras"};
  return {tema: null, fuente: "default"};
}

// ---------- mensajes con dos temas adentro (facundo, 2026-09-11) ----------
// facundo escribe de corrido y la primera mitad es de un tema y la segunda de otro. `partir()` es la
// copia js de `clasificar_tema.partir`: corta por parrafo / oracion / conector (`otra cosa`, `aparte`,
// `ademas`, `tambien`), clasifica cada fragmento solo por palabras y pega los vecinos del mismo tema.
// devuelve [{tema, texto}]; un solo elemento = el mensaje es de un tema solo.
function cortes(txt){
  var re = new RegExp(RE_CORTE_SRC, "gi"), ps = [0], m;
  while((m = re.exec(txt)) !== null){
    var p = (m[1] || m[2]) ? m.index + m[0].length : m.index + (m[3] || "").length;
    if(p > ps[ps.length - 1] && p < txt.length) ps.push(p);
    if(re.lastIndex === m.index) re.lastIndex++;      // por si algun dia el corte es de ancho cero
  }
  ps.push(txt.length);
  return ps;
}
function partir(txt){
  txt = (txt || "").trim();
  if(!txt) return [];
  var m = RE_TEMA.exec(txt);
  if(m && esTema(m[1]))
    return [{tema: m[1].toLowerCase(), texto: txt.slice(m[0].length).trim()}];
  var ps = cortes(txt), grupos = [];
  for(var i = 0; i < ps.length - 1; i++){
    var a = ps[i], b = ps[i + 1];
    if(!txt.slice(a, b).trim()) continue;
    var t = porPalabras(txt.slice(a, b)), g = grupos[grupos.length - 1];
    if(g && (!t || t === g.tema)) g.b = b;
    else if(g && !g.tema){ g.tema = t; g.b = b; }
    else grupos.push({tema: t, a: a, b: b});
  }
  var defecto = clasificar(txt).tema;                 // puede ser null: ahi lo pone la pestaña
  if(grupos.length < 2) return [{tema: defecto, texto: txt}];
  return grupos.map(function(g){ return {tema: g.tema || defecto, texto: txt.slice(g.a, g.b).trim()}; });
}

// ---------- estado de las pestañas, compartido entre dispositivos (facundo, 2026-09-11) ----------
// antes vivia solo en localStorage y por eso el celu y el desktop veian pestañas distintas. ahora el
// layout se publica en el buzon como `tabs.json` (mismo repo y mismo token que `widgets.json`) y
// localStorage queda de **cache offline**: pinta al instante al abrir y sirve si github no contesta.
// resolucion de conflictos: **el ultimo que escribe gana**, por el `ts` de cada layout.
var tabs = ["tools", AUTO], paneles = ["tools"], foco = 0;
var layoutTs = 0;                 // cuando se escribio el layout que estoy mostrando
var shaTabs = null;               // sha del tabs.json remoto (para el PUT)
var etagTabs = null, tabsUlt = 0; // poll con etag, como los widgets
var tabsSync = true;              // si el token no puede escribir el repo, queda en local y no insiste
var aplicando = false;            // pintando un layout remoto: no volver a publicarlo
var layoutFirma = null;           // firma de lo ultimo guardado: si no cambio, el `ts` no se toca
var tabsPendiente = null, tabsPub = 0;
var TABS_ARCHIVO = "tabs.json";
var TABS_DEBOUNCE = 1500, TABS_MINIMO = 8000;   // agrupar cambios seguidos y no pegarle a la api
var BORRA_DEBOUNCE = 1000;        // lo que se esta tipeando se publica mas seguido que el layout
var BORRA_TOPE = 8000;            // un borrador mas largo que esto no se sincroniza entero
var BORRA_VIDA = 172800000;       // 2 dias: un borrador vacio mas viejo que esto se poda
// borradores del input, uno por pestaña: `{tema: {texto, ts}}`. viajan en el mismo `tabs.json` pero se
// resuelven **por tema y no por layout**: gana el `ts` mas nuevo de cada borrador, asi lo que escribiste
// en el celu no lo pisa un cambio de pestañas hecho en la compu (facundo, 2026-09-11: "quiero dejar de
// escribir esto desde la compu y sin tocar enviar terminar este mensaje desde el celu").
var borradores = {};
var temaCaja = null;              // de que pestaña es lo que hay ahora en la caja
var enviando = 0;                 // hay un mensaje saliendo: ese texto ya no es borrador
// donde estabas leyendo cada pestaña: `{tema: {ancla, abajo, ts}}`. viaja en el mismo `tabs.json` y se
// resuelve como los borradores, por tema y por `ts` mas nuevo (facundo, 2026-09-11: "quiero abrir el
// telefono o la compu y estar en el mismo lugar"). la posicion NO se guarda en pixeles: los alto de
// pantalla no coinciden entre celu y desktop. se guarda el **id del comentario** que quedo arriba de
// la vista, y al restaurar se scrollea hasta ese mensaje.
var vistas = {};
// ancho de los paneles: el porcentaje de #cuerpo que ocupa el chat, elegido arrastrando el separador
// (facundo, 2026-09-11). viaja en el mismo `tabs.json` y se resuelve **por su propio `ts`**, como los
// borradores y las vistas: mover el separador en la compu no se lleva puestas las pestañas del celu.
// `null` = nunca se toco: quedan los anchos de siempre (chat elastico, widgets 420px).
var split = null;                 // {pct, ts}
var SPLIT_MIN = 280;              // px minimos por panel
var VISTA_DEBOUNCE = 4000;        // leer scrollea todo el tiempo: no se le pega a la api por eso
var VISTA_VIDA = 604800000;       // 7 dias: una vista mas vieja que esto ya no dice nada
// id corto de este dispositivo: sirve para no re-aplicarme lo que acabo de publicar yo
var DISPOSITIVO = (function(){
  try{
    var d = localStorage.getItem("agente_dispositivo");
    if(!d){ d = Math.random().toString(36).slice(2, 8); localStorage.setItem("agente_dispositivo", d); }
    return d;
  }catch(x){ return Math.random().toString(36).slice(2, 8); }
})();

// {tabs, paneles, foco} saneado: solo temas conocidos, sin repetidos, paneles dentro de tabs.
// las reglas de siempre: una pestaña por tema, y la general (`auto`) es una mas de la lista.
function sanearLayout(L){
  if(!L || !L.tabs || !L.tabs.length) return null;
  var ts = [];
  L.tabs.forEach(function(t){
    t = t === AUTO ? AUTO : normTema(t);                 // `awtomic-qa` viejo -> `awtomic/qa`
    if((esTema(t) || t === AUTO) && ts.indexOf(t) < 0) ts.push(t);
  });
  if(!ts.length) return null;
  var ps = (L.paneles || [ts[0]]).map(function(t){ return t === AUTO ? AUTO : normTema(t); })
            .filter(function(t){ return ts.indexOf(t) >= 0; }).slice(0, 2);
  if(!ps.length) ps = [ts[0]];
  if(ps.length === 2 && ps[0] === ps[1]) ps = [ps[0]];
  return {tabs: ts, paneles: ps, foco: Math.min(Math.max(L.foco || 0, 0), ps.length - 1)};
}
function layoutActual(){ return {tabs: tabs, paneles: paneles, foco: foco}; }
function firmaLayout(L){ return JSON.stringify([L.tabs, L.paneles, L.foco]); }
// pinta un layout (venga del cache o del buzon) sin dispararme una publicacion de vuelta
function aplicarLayout(L, ts){
  var s = sanearLayout(L);
  if(!s) return false;
  var igual = firmaLayout(s) === firmaLayout(layoutActual());
  tabs = s.tabs; paneles = s.paneles; foco = s.foco;
  layoutTs = ts || Date.now();
  aplicando = true;
  try{ pintarTabs(); if(!igual){ render(); irDonde(); } }finally{ aplicando = false; }
  guardarCache();
  return !igual;
}
function guardarCache(){
  layoutFirma = firmaLayout(layoutActual());
  try{
    localStorage.setItem("agente_tabs", JSON.stringify(
      {tabs: tabs, paneles: paneles, foco: foco, ts: layoutTs, origen: DISPOSITIVO,
       borradores: borradoresLimpios(), vistas: vistasLimpias(), split: splitLimpio()}));
  }catch(x){}
}
// cambio local: sube el reloj, guarda el cache y encola la publicacion. si el layout quedo igual
// (el pintado de siempre, un foco que ya estaba) no toca el `ts`: si no, abrir la pagina se llevaria
// por delante lo que dejo el otro dispositivo.
function guardarLayout(){
  if(aplicando || firmaLayout(layoutActual()) === layoutFirma){ guardarCache(); return; }
  layoutTs = Math.max(Date.now(), layoutTs + 1);
  guardarCache();
  publicarTabs();
}

// ---------- separador arrastrable entre chat y widgets (facundo, 2026-09-11) ----------
// solo en escritorio: en el celu las vistas van de a una y el separador ni se pinta.
function anchoDesktop(){ return window.innerWidth >= 900; }
function splitPct(){ return split && typeof split.pct === "number" ? split.pct : null; }
function splitLimpio(){ return split ? {pct: Math.round(split.pct * 100) / 100, ts: +split.ts || 0} : null; }
// el pct que pidieron, recortado para que ningun panel baje de SPLIT_MIN px
function limitarPct(pct){
  if(typeof pct !== "number" || !isFinite(pct)) return null;
  // el pct es sobre el ancho de #cuerpo (el separador va adentro), asi que el minimo de la
  // derecha se mide descontandolo: si no, el bloque de widgets quedaba unos pixeles corto.
  var cuerpo = $("cuerpo"), sep = $("sep");
  var w = cuerpo ? cuerpo.clientWidth : 0, ancho = sep ? sep.offsetWidth : 0;
  if(w - ancho > SPLIT_MIN * 2){
    var min = SPLIT_MIN / w * 100, max = (w - ancho - SPLIT_MIN) / w * 100;
    pct = Math.min(Math.max(pct, min), max);
  }
  return Math.min(Math.max(pct, 5), 95);
}
// pinta el ancho elegido. con un tercer panel (una pestaña al lado de los widgets) el separador
// queda entre el chat y todo el bloque de la derecha: los widgets son los que se estiran.
function aplicarSplit(){
  var chat = $("panel-chat"), w = $("panel-widgets"), pct = splitPct();
  if(!chat || !w) return;
  if(pct === null || !anchoDesktop()){
    chat.style.flex = ""; w.style.flex = "";
    document.body.classList.remove("split");
    return;
  }
  document.body.classList.add("split");
  chat.style.flex = "0 0 " + pct.toFixed(2) + "%";
  w.style.flex = "1 1 auto";
}
// cambio local: `soloVer` = estoy arrastrando (pinta pero no escribe), `ya` = publicar sin esperar
function guardarSplit(pct, ya, soloVer){
  pct = limitarPct(pct);
  if(pct === null) return;
  split = {pct: pct, ts: Math.max(Date.now(), (+(split || {}).ts || 0) + 1)};
  aplicarSplit();
  if(soloVer) return;
  guardarCache();
  publicarTabs(ya);
}
// llego el ancho del buzon (o del cache): gana el `ts` mas nuevo
function recibirSplit(rem){
  if(!rem || typeof rem.pct !== "number") return false;
  if((+rem.ts || 0) <= (+(split || {}).ts || 0)) return false;
  split = {pct: rem.pct, ts: +rem.ts || 0};
  aplicarSplit();
  guardarCache();
  return true;
}

// ---------- borrador del input, continuable en cualquier dispositivo (facundo, 2026-09-11) ----------
// lo que facundo escribe en la caja es un borrador **por pestaña**: se guarda mientras tipea, viaja en
// `tabs.json` y vuelve a aparecer con el cursor al final cuando abre la web en el celu o recarga la
// compu. al mandar el mensaje, el borrador de esa pestaña se borra en todos lados (tumba con `ts`: un
// `{texto: "", ts}` que le gana al borrador viejo del otro dispositivo).
function borradorDe(tema){ var b = borradores[tema]; return (b && b.texto) || ""; }
// lo que sale al buzon: sin las tumbas viejas y con los textos gigantes cortados
function borradoresLimpios(){
  var out = {}, ahora = Date.now();
  Object.keys(borradores).forEach(function(t){
    var b = borradores[t];
    if(!b || typeof b.texto !== "string") return;
    if(!b.texto && ahora - (+b.ts || 0) > BORRA_VIDA) return;          // tumba vieja: ya no hace falta
    out[t] = {texto: b.texto.slice(0, BORRA_TOPE), ts: +b.ts || 0};
  });
  return out;
}
// cambio local del borrador de una pestaña: el estado se actualiza **al instante** (asi un `tabs.json`
// viejo nunca le gana a lo que se esta tipeando) y la publicacion va con debounce.
function guardarBorrador(tema, texto, ya){
  if(!tema) return;
  texto = String(texto === null || texto === undefined ? "" : texto);
  if(borradorDe(tema) === texto) return;
  borradores[tema] = {texto: texto, ts: Math.max(Date.now(), (+(borradores[tema] || {}).ts || 0) + 1)};
  guardarCache();
  publicarTabs(ya, BORRA_DEBOUNCE);
}
// llegaron los borradores del buzon (o del cache): se mezclan uno por uno, gana el `ts` mas nuevo.
// esto corre **siempre**, gane el layout remoto o el mio: si no, publicar mis pestañas borraria lo que
// el otro dispositivo esta escribiendo.
function recibirBorradores(rem){
  var cambio = false;
  Object.keys(rem || {}).forEach(function(t){
    var r = rem[t];
    if(!r || typeof r.texto !== "string") return;
    if((+r.ts || 0) > (+(borradores[t] || {}).ts || 0)){
      borradores[t] = {texto: r.texto.slice(0, BORRA_TOPE), ts: +r.ts || 0};
      cambio = true;
    }
  });
  if(cambio){ guardarCache(); refrescarCaja(); }
  return cambio;
}
// en pantalla tactil (celu, tablet) enter hace salto de linea y manda solo el boton: facundo escribe
// parrafos y terminaba mandando sin querer (2026-09-11). en desktop sigue enter = mandar.
function esTactil(){
  try{ if(window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return true; }catch(x){}
  return window.innerWidth <= 899;
}
var TOPE_LINEAS = 6;   // la caja crece con los parrafos hasta 6 lineas y ahi scrollea
function ajustarCaja(){
  txt.style.height = "auto";   // el min-height del css deja una linea
  var linea = parseFloat(getComputedStyle(txt).lineHeight) || 18;
  var pad = txt.offsetHeight - txt.clientHeight + 10;   // bordes + padding vertical
  var tope = Math.min(linea * TOPE_LINEAS + pad, (vv ? vv.height : window.innerHeight) * 0.28);
  txt.style.height = Math.min(txt.scrollHeight, tope) + "px";

}

// markdown-lite en color (facundo, 2026-09-11: "mas color"): `code` cian, **negrita** amarilla,
// ## titulos magenta, tablas con cabecera y filas alternadas, --- verde tenue, [tag] verde,
// ORDEN:/PROPUESTA: amarillo. el texto ya viene escapado: aca solo se agregan spans.
function enCodigo(l, f){  // saca los `code` antes de tocar el resto y los devuelve al final
  var trozos = [];
  l = l.replace(/`([^`]+)`/g, function(m0, c){
    trozos.push('<span class="cod">' + c + "</span>");
    return "\u0001" + (trozos.length - 1) + "\u0001";
  });
  l = f(l);
  return l.replace(/\u0001(\d+)\u0001/g, function(m0, i){ return trozos[+i]; });
}
function enLinea(l){
  return enCodigo(l, function(x){
    x = costos(x);
    return x.replace(/\*\*([^*]+)\*\*/g, function(m0, c){ return '<span class="neg">' + c + "</span>"; });
  });
}
// imagenes: `![alt](src)`. el daemon ya publico el archivo local en el repo del buzon
// (recetas/mostrar_imagen.py), asi que `src` es una ruta del repo (`img/<hash>-<nombre>.png`) y se
// baja con el mismo token, o una url http(s) que va directo.
var RE_IMG = /!\[([^\]\n]*)\]\(\s*([^)\s]+)\s*\)/g;
function att(s){ return String(s).replace(/"/g, "&quot;"); }   // el texto ya viene escapado
function conImagenes(l){
  RE_IMG.lastIndex = 0;
  if(l.indexOf("![") < 0 || !RE_IMG.test(l)) return null;
  RE_IMG.lastIndex = 0;
  return l.replace(RE_IMG, function(m0, alt, src){
    return '<span class="img" data-src="' + att(src) + '" data-alt="' + att(alt) + '">' +
           '<span class="cargando">bajando imagen...</span></span>';
  });
}
var imgUrls = {};        // src -> object url (una sola bajada por imagen)
function bajarImagen(src){
  if(/^(https?:|data:)/i.test(src)) return Promise.resolve(src);
  if(imgUrls[src]) return Promise.resolve(imgUrls[src]);
  if(!token) return Promise.reject(new Error("401"));
  var ruta = API + "/repos/" + REPO + "/contents/" + src.split("/").map(encodeURIComponent).join("/");
  return fetch(ruta, {headers: {"authorization": "Bearer " + token, "accept": "application/vnd.github.raw"}})
    .then(function(r){
      if(!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(b){
      imgUrls[src] = URL.createObjectURL(b);
      return imgUrls[src];
    });
}
function cargarImagenes(nodo){
  var spans = nodo.querySelectorAll ? nodo.querySelectorAll(".img[data-src]") : [];
  Array.prototype.forEach.call(spans, function(sp){
    var src = sp.dataset.src, alt = sp.dataset.alt || src;
    bajarImagen(src).then(function(url){
      var pego = pegadoAbajo();
      sp.innerHTML = "";
      var im = document.createElement("img");
      im.src = url; im.alt = alt; im.title = alt;
      im.addEventListener("click", function(){ verImagen(url, alt); });
      im.addEventListener("load", function(){ if(pego) alFinal(); });
      var pie = document.createElement("span");
      pie.className = "pie"; pie.textContent = alt;
      sp.appendChild(im); sp.appendChild(pie);
    }).catch(function(e){
      sp.innerHTML = '<span class="rota"></span>';
      sp.firstChild.textContent = "no pude bajar la imagen (" + (e && e.message) + "): " + alt;
    });
  });
}
function verImagen(url, alt){                      // tamaño real, click o esc para cerrar
  var v = document.createElement("div");
  v.id = "visor";
  var im = document.createElement("img");
  im.src = url; im.alt = alt || "";
  var x = document.createElement("span");
  x.className = "cerrar"; x.textContent = "cerrar";
  v.appendChild(im); v.appendChild(x);
  function cerrar(){ if(v.parentNode) v.parentNode.removeChild(v); document.removeEventListener("keydown", tecla); }
  function tecla(e){ if(e.key === "Escape") cerrar(); }
  v.addEventListener("click", cerrar);
  document.addEventListener("keydown", tecla);
  document.body.appendChild(v);
}
function esFila(l){ return /^\s*\|.*\|\s*$/.test(l); }
function esSepFila(l){ return esFila(l) && /^[\s|:-]+$/.test(l) && l.indexOf("-") >= 0; }
function resaltar(t){
  var lineas = esc(t).split("\n"), datos = 0;
  return lineas.map(function(l, i){
    var img = conImagenes(l);
    if(img !== null) return img;
    var tarea = /^(\s*[-*]\s*)\[( |x|X|!|&gt;)\]/.exec(l);
    if(tarea){
      var c = tarea[2].toLowerCase();
      var clase = c === "x" ? "ok" : c === "!" ? "fallo" : c === " " ? "pend" : "corriendo";
      return '<span class="' + clase + '">' + enLinea(l) + "</span>";
    }
    if(esFila(l)){                                   // tabla: cabecera, separador, filas alternadas
      var arranca = i === 0 || !esFila(lineas[i - 1]);
      if(arranca){ datos = 0; return '<span class="tcab">' + enLinea(l) + "</span>"; }
      if(esSepFila(l)) return '<span class="tsep">' + l + "</span>";
      datos++;
      return '<span class="tfila' + (datos % 2 === 0 ? " par" : "") + '">' + enLinea(l) + "</span>";
    }
    if(/^\s*#{1,6}\s+\S/.test(l)) return '<span class="tit">' + enLinea(l) + "</span>";
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) return '<span class="sep">' + l + "</span>";
    if(/^\s*(ORDEN|PROPUESTA|AVISO|PREGUNTA):/.test(l)) return '<span class="orden">' + enLinea(l) + "</span>";
    var linea = enLinea(l);
    if(i === 0){                                     // [tema] / [openrouter/x] al inicio de la respuesta
      linea = linea.replace(/^(\s*)\[([^\]\n]{1,40})\]/, function(m0, sp, dentro){
        return sp + '<span class="tag">[' + dentro + "]</span>";
      });
    }
    return linea.replace(/^(\s*)([-*])(\s)/, function(m0, sp, g, fin){
      return sp + '<span class="vin">' + g + "</span>" + fin;
    });
  }).join("\n");
}

// ---------- mensajes: uno solo por comentario, repartido a la pestaña de su tema ----------
// msgs es la charla entera en orden; cada panel pinta los que caen en su pestaña (deEstaTab).
var msgs = [];
function listaDe(j){ return j === 0 ? lista : $("lista1"); }
function histDe(j){ return j === 0 ? hist : $("hist1"); }
// el tema de un mensaje: el que ya trae explicito, el `[tema]` con el que contesto el daemon, el
// `tema x:` que escribio facundo, las palabras clave, y si no hay nada, el del mensaje anterior
// (lo mismo que hace el daemon con `.ultimo-tema`).
function temaDe(m, prev){
  if(m.explicito) return m.tema;
  if(m.tag) return m.tag;
  if(m.clase === "agente") return prev || "tools";
  var c = clasificar(m.texto);
  return c.tema || prev || "tools";
}
function recalcularTemas(){
  var prev = null;
  msgs.forEach(function(m){ m.tema = temaDe(m, prev); prev = m.tema; });
}
function nodoMsg(m){
  var div = document.createElement("div");
  div.className = "msg " + m.clase;
  if(m.id) div.dataset.id = m.id;
  var cab = document.createElement("div");
  cab.innerHTML = '<span class="quien"></span> <span class="ts"></span>';
  cab.querySelector(".quien").textContent = m.quien + ">";
  cab.querySelector(".ts").textContent = desde(m.iso || new Date().toISOString());
  var b = document.createElement("div");
  b.className = "cuerpo";
  b.innerHTML = resaltar(m.texto);
  div.appendChild(cab); div.appendChild(b);
  cargarImagenes(b);
  return div;
}
function pintarMsg(m, arriba){
  paneles.forEach(function(tab, j){
    if(!deEstaTab(m.tema, tab)) return;
    var l = listaDe(j);
    if(!l) return;
    if(arriba) l.insertBefore(nodoMsg(m), l.firstChild); else l.appendChild(nodoMsg(m));
  });
  if(!arriba && m.clase === "agente") pintarChips();   // contesto el daemon: sugerencias nuevas
}
function render(){
  [0, 1].forEach(function(j){ var l = listaDe(j); if(l) l.innerHTML = ""; });
  msgs.forEach(function(m){ pintarMsg(m, false); });
  pintarChips();
}
function alFinal(){
  abajo();
  var h1 = histDe(1);
  if(h1) h1.scrollTop = h1.scrollHeight;
}
// abrir la web, volver al foco o cambiar de pestaña te deja **donde estabas**, no al final (facundo,
// 2026-09-11). el fondo sigue siendo el default: `aplicarVista` solo mueve si habia algo guardado.
function restaurarVistas(){
  [0, 1].forEach(function(j){ aplicarVista(j); });
}
function irDonde(){
  alFinal();
  requestAnimationFrame(restaurarVistas);   // despues del layout: el alto recien existe aca
}
function ruidoso(e){  // 401 ya abrio el login y "freno" ya aviso: no repetir en rojo
  var m = e && e.message;
  return !!m && m !== "401" && m !== "freno";
}
function sistema(t, clase){
  var pego = pegadoAbajo();
  var m = {clase: clase || "sistema", quien: "web", texto: t, iso: null, explicito: true, tema: temaActivo()};
  msgs.push(m); pintarMsg(m, false);
  if(pego) alFinal();
}

// ---------- api ----------
function frenar(seg, motivo){
  seg = Math.max(20, Math.min(Math.round(seg), 900));
  frenoHasta = Date.now() + seg * 1000;
  if(Date.now() - avisoFreno > 60000){
    avisoFreno = Date.now();
    sistema("github frenó (" + motivo + "). vuelvo a intentar en " + seg + " s.", "error");
  }
  reprogramar();
}
// `recetas/prueba_web_tabs` enchufa aca un POST falso para probar el envio sin tocar github.
// en produccion es null y esta linea no hace nada.
var apiStub = null;
function api(metodo, ruta, cuerpo, etag, accept){
  if(apiStub) return apiStub(metodo, ruta, cuerpo, etag, accept);
  if(!token) return Promise.reject(new Error("401"));
  if(Date.now() < frenoHasta && metodo === "GET"){
    return Promise.reject(new Error("freno"));   // el poll no insiste; mandar un mensaje si
  }
  var h = {
    "authorization": "Bearer " + token,
    "accept": accept || "application/vnd.github+json"
  };
  if(cuerpo) h["content-type"] = "application/json";
  if(etag) h["if-none-match"] = etag;
  return fetch(API + ruta, {
    method: metodo, headers: h,
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    cache: "no-store"
  }).then(function(r){
    if(r.status === 304) return {status:304};
    if(r.status === 401 || r.status === 403 || r.status === 429){
      return r.json().catch(function(){ return {}; }).then(function(j){
        var msg = (j && j.message) || ("http " + r.status);
        if(r.status === 401){
          pedirToken("token rechazado por github (401): " + msg);
          throw new Error("401");
        }
        // 403 puede ser rate limit (frena) o falta de permisos (el token no sirve para este repo)
        var resta = r.headers.get("x-ratelimit-remaining");
        var reset = parseInt(r.headers.get("x-ratelimit-reset"), 10);
        var reint = parseInt(r.headers.get("retry-after"), 10);
        if(r.status === 429 || resta === "0" || reint > 0 || /rate limit|abuse|secondary/i.test(msg)){
          var seg = reint > 0 ? reint : (reset ? reset - Math.floor(Date.now() / 1000) : 60);
          frenar(seg + 5, r.status + " " + (resta === "0" ? "sin cuota" : "rate limit"));
          throw new Error("freno");
        }
        pedirToken("el token no tiene permiso sobre " + REPO + " (403): " + msg);
        throw new Error("401");
      });
    }
    if(!r.ok){
      return r.json().catch(function(){ return {}; }).then(function(j){
        throw new Error("http " + r.status + ((j && j.message) ? " " + j.message : ""));
      });
    }
    return r.json().then(function(j){ return {status:r.status, json:j, etag:r.headers.get("etag")}; });
  });
}

// ---------- estado (body del issue) ----------
// el header ya no pinta nada del daemon (facundo, 2026-09-11): vivo/caido esta en el widget `agent`.
// esto solo deja el boton pausa/segui al dia.
function pintarEstado(body){
  var m = body && body.match(/```json\s*([\s\S]*?)```/);
  if(!m) return;
  var e;
  try{ e = JSON.parse(m[1]); }catch(x){ return; }
  enPausa = !!e.pausa;
  $("btn-pausa").textContent = enPausa ? "segui" : "pausa";
  $("btn-pausa").dataset.cmd = enPausa ? "segui" : "pausa";
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------- carga ----------
function cargarEstado(){
  return api("GET", "/repos/" + REPO + "/issues/" + ISSUE, null, etagIssue).then(function(r){
    if(r.status === 304) return;
    etagIssue = r.etag;
    creadoIso = r.json.created_at || creadoIso;
    pintarEstado(r.json.body || "");
  });
}

function ruta(desdeIso){
  return "/repos/" + REPO + "/issues/" + ISSUE + "/comments?per_page=100&since=" + desdeIso;
}
// el daemon contesta con `[tema] ...` adelante (con_tag_tema): ese tag manda la respuesta a su
// pestaña y no se muestra como texto (ya lo dice la pestaña). los comandos cortos (status, cola,
// op N X) contestan sin tag: caen en la pestaña del mensaje anterior, que es desde donde salieron.
function agregar(c, arriba){
  vistos[c.id] = true;
  var b = c.body || "", m;
  if(b.indexOf(MARCA) === 0){
    var cuerpo = b.slice(MARCA.length).replace(/^\n/, ""), mt = /^\[([\w\/-]+)\]\s*/.exec(cuerpo), tag = null;
    if(mt && esTema(mt[1])){ tag = normTema(mt[1]); cuerpo = cuerpo.slice(mt[0].length); }
    m = {id: c.id, clase: "agente", quien: "agente", texto: cuerpo, iso: c.created_at, tag: tag};
  }else{
    var mp = RE_TEMA.exec(b), tg = null, texto = b;
    if(mp && esTema(mp[1])){ tg = normTema(mp[1]); texto = b.slice(mp[0].length); }
    m = {id: c.id, clase: "yo", quien: "facundo", texto: texto, iso: c.created_at, tag: tg};
  }
  if(arriba) msgs.unshift(m); else msgs.push(m);
  return m;
}

// poll: pide solo desde el ultimo comentario que ya tengo. la url se queda quieta mientras no
// pasa nada, asi que el etag devuelve 304 y no gasta rate limit.
function cargarComentarios(reemplazar){
  if(reemplazar){ ultimoIso = null; masViejoIso = null; sinMasViejo = false; }
  var ventana = new Date(Date.now() - horas * 3600 * 1000).toISOString();
  var desdeIso = (!reemplazar && ultimoIso) ? ultimoIso : ventana;
  return api("GET", ruta(desdeIso), null, reemplazar ? null : etagCom).then(function(r){
    if(r.status === 304) return;
    if(!reemplazar) etagCom = r.etag;
    var cs = r.json || [];
    if(reemplazar){ msgs = []; vistos = {}; masViejoIso = ventana; }
    var pego = pegadoAbajo() || reemplazar;
    var nuevos = 0;
    cs.sort(function(a, b){ return a.id - b.id; }).forEach(function(c){
      if(vistos[c.id]) return;
      agregar(c, false);
      ultimoIso = c.created_at;
      nuevos++;
    });
    if(nuevos) etagCom = null;  // la url del proximo poll cambia (since nuevo)
    // el tema de cada mensaje depende del anterior, asi que se recalcula la charla entera y se
    // reparte de nuevo entre las pestañas (es una pasada por un par de cientos de mensajes)
    if(nuevos || reemplazar){ recalcularTemas(); render(); }
    // un mensaje nuevo siempre se lee entero y al fondo, aunque estuvieras mirando mas arriba
    if(pego || nuevos) alFinal();
  });
}

// paginado hacia atras: trae la ventana anterior y la mete arriba sin mover lo que estas leyendo
function cargarViejos(){
  if(sinMasViejo || !masViejoIso) return Promise.resolve();
  var hasta = new Date(masViejoIso).getTime();
  var nuevoDesde = new Date(hasta - PASO * 3600 * 1000).toISOString();
  return api("GET", ruta(nuevoDesde), null, null).then(function(r){
    var cs = (r.json || []).filter(function(c){
      return !vistos[c.id] && new Date(c.created_at).getTime() < hasta;
    }).sort(function(a, b){ return a.id - b.id; });
    var alto = hist.scrollHeight - hist.scrollTop;
    cs.slice().reverse().forEach(function(c){ agregar(c, true); });
    recalcularTemas(); render();
    hist.scrollTop = hist.scrollHeight - alto;  // la vista se queda donde estaba
    masViejoIso = nuevoDesde;
    horas += PASO;
    if(creadoIso && new Date(nuevoDesde).getTime() <= new Date(creadoIso).getTime()) sinMasViejo = true;
    return cs.length;
  });
}

function tick(){
  Promise.all([cargarEstado(), cargarComentarios(false)])
    .catch(function(e){ if(ruidoso(e)) sistema("error: " + e.message, "error"); });
  // los widgets y las pestañas van a 10 s a la vista (antes 30) y 120 s en background: abrir el
  // celu y ver datos de hace medio minuto se sentia viejo (facundo, 2026-09-11)
  var cada = document.hidden ? 120000 : 10000;
  if(Date.now() - widUlt > cada){
    cargarWidgets().catch(function(e){ if(ruidoso(e)) pintarWidgets(null, e.message); });
  }
  // las pestañas van al mismo ritmo: si las cambiaste en el celu, el desktop las ve en <= 10 s
  if(tabsSync && Date.now() - tabsUlt > cada){
    cargarTabs().catch(function(e){ if(ruidoso(e)) sistema("pestañas: " + e.message, "error"); });
  }
}

// ---------- sincronizacion al abrir y al volver al foco (facundo, 2026-09-11) ----------
// "cuando vuelvo a la interfaz desde el telefono se ven cosas re viejas y va actualizando": el cache
// de localStorage se pintaba como si fuera el estado real. ahora, al abrir la web o al recuperar el
// foco, se baja **todo el buzon en paralelo** (chat, `widgets.json`, `tabs.json`) y hasta que llega se
// ve `sincronizando…` con lo cacheado apagado. si github no contesta, el cartel lo dice y la cache
// queda como lo que es: modo offline.
var sincronizando = false, syncUlt = 0, syncEnVuelo = null;
function pintarSync(estado, texto){
  var n = $("sync");
  if(!n) return;
  sincronizando = estado === "sync";
  document.body.classList.toggle("sincronizando", sincronizando);
  n.classList.toggle("oculta", !estado);
  n.classList.toggle("off", estado === "off");
  if(estado) n.textContent = texto || "sincronizando…";
}
// una sola sincronizacion a la vez; las que llegan encima se cuelgan de la que ya esta en vuelo
function sincronizar(primera){
  if(!token) return Promise.resolve();
  if(syncEnVuelo) return syncEnVuelo;
  syncUlt = Date.now();
  widUlt = 0; tabsUlt = 0;            // que el tick no las saltee por cadencia
  var cartel = setTimeout(function(){ pintarSync("sync"); }, primera ? 0 : 250);
  syncEnVuelo = Promise.all([
    cargarEstado(),
    cargarComentarios(!!primera),
    cargarWidgets().catch(function(e){ if(ruidoso(e)) pintarWidgets(null, e.message); }),
    cargarTabs()
  ]).then(function(){
    clearTimeout(cartel); pintarSync(null);
    irDonde();                         // y te deja donde estabas leyendo esa pestaña
  }).catch(function(e){
    clearTimeout(cartel);
    if(e && e.message === "401"){ pintarSync(null); throw e; }
    pintarSync("off", "sin conexión con el buzón: esto es la copia local");
    if(ruidoso(e)) throw e;
  }).then(function(){ syncEnVuelo = null; }, function(e){ syncEnVuelo = null; throw e; });
  return syncEnVuelo;
}
// volver al foco: sincroniza ya. con un piso corto para que alt-tab no dispare una bajada por segundo.
function alVolver(){
  if(document.hidden || !token) return;
  if(Date.now() - syncUlt < 1200) return;
  sincronizar(false).catch(function(e){ if(ruidoso(e)) sistema("error: " + e.message, "error"); });
}
window.addEventListener("focus", alVolver);
window.addEventListener("pageshow", alVolver);

function reprogramar(){
  if(timer) clearInterval(timer);
  if(!token) return;
  var ms = document.hidden ? 30000 : 5000;
  if(Date.now() < frenoHasta) ms = Math.min(Math.max(frenoHasta - Date.now() + 500, ms), 60000);
  timer = setInterval(tick, ms);
}
document.addEventListener("visibilitychange", function(){
  reprogramar();
  // el borrador viaja en los dos sentidos: al irme publico lo que escribi, al volver releo el del otro
  if(document.hidden) soltarBorrador();   // publica el borrador y la vista antes de irse
  else alVolver();
});
// cerrar la pestaña / bloquear el telefono no puede perder lo escrito: el PUT va con `keepalive`
function soltarBorrador(){
  guardarBorrador(temaCaja || temaActivo(), txt.value, true);
  guardarVista(true);
  if(tabsPendiente){ clearTimeout(tabsPendiente); tabsPendiente = null; ponerTabs(false); }
}
window.addEventListener("pagehide", soltarBorrador);
window.addEventListener("beforeunload", soltarBorrador);

// ---------- auto actualizacion ----------
// el daemon reescribe version.json en cada publish (bump_web). la pagina lo mira cada 60 s y si
// cambio se recarga sola con ?v=<version>, asi pages no puede devolver el html viejo del cache.
// la referencia es la version EMBEBIDA en este html (meta agente-web-version), no el primer fetch:
// si pages me sirvio un html viejo del cache, version.json ya viene nuevo y hay que recargar igual.
var verEmbebida = (document.querySelector('meta[name="agente-web-version"]') || {}).content || null;
var verWeb = null;
function mirarVersion(){
  return fetch("version.json?_=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.version) return;
      var v = j.version + "/" + (j.ts || "");
      var cambio = (verEmbebida && j.version !== verEmbebida) || (verWeb !== null && v !== verWeb);
      verWeb = v;
      if(!cambio) return;
      // ya recargue por esta version (?v= en la url) y el html sigue viniendo viejo: no entro en loop
      if(new URLSearchParams(location.search).get("v") === j.version){ verEmbebida = j.version; return; }
      if(txt.value.trim()){ return; }   // estas escribiendo: la recarga espera al proximo chequeo
      sistema("version " + j.version + " publicada, recargando...");
      var q = new URLSearchParams(location.search);
      q.set("v", j.version);
      setTimeout(function(){ location.replace(location.pathname + "?" + q.toString()); }, 500);
    })
    .catch(function(){});
}
mirarVersion();
setInterval(mirarVersion, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) mirarVersion(); });

// ---------- mandar ----------
// cada mensaje sale con su `tema x:` explicito, asi que cae si o si en la pestaña desde donde se
// escribio (y el daemon contesta con ese mismo tema). `crudo` es para lo que el daemon atiende por
// texto exacto sin modelo (status, cola, op 2 B, dale 3): ahi el prefijo lo rompería.
// el texto tal cual sale al buzon: con `tema x:` adelante, salvo que ya lo traiga, que sea un comando
// crudo, o que venga de la pestaña general (que no fija tema: ahi clasifica el daemon)
function cuerpoMsg(texto, tema, crudo){
  var ya = RE_TEMA.test(texto);
  return (crudo || ya || tema === AUTO) ? texto : "tema " + tema + ": " + texto;
}
// dos enter muy rapidos mandaban el mismo mensaje dos veces (facundo, 2026-09-11): la caja se vaciaba
// recien cuando volvia el POST, asi que el segundo enter leia el mismo texto. ahora `mandar()` es
// idempotente: mientras hay un envio en vuelo no sale nada nuevo, la caja se vacia **al toque** (y con
// ella el borrador, que si no lo resucita el `tabs.json` del otro dispositivo), y un texto identico al
// ultimo enviado hace menos de REPE_MS se ignora. si el POST falla, el texto vuelve a la caja.
var REPE_MS = 2000;
var ultimoTexto = "", ultimoTs = 0;
function mandar(texto, tema, crudo){
  texto = (texto || "").trim();
  if(!texto) return;
  if(enviando) return;                                          // hay uno saliendo: este enter no cuenta
  if(texto === ultimoTexto && Date.now() - ultimoTs < REPE_MS) return;
  tema = tema || temaActivo();
  var cuerpo = cuerpoMsg(texto, tema, crudo);
  var caja = temaCaja;
  ultimoTexto = texto; ultimoTs = Date.now();
  enviando++;
  $("mandar").disabled = true;
  if(txt.value.trim() === texto){ txt.value = ""; txt.style.height = ""; }   // la caja se vacia ya
  borrarBorrador(tema); if(caja && caja !== tema) borrarBorrador(caja);      // y su tumba se publica ya
  return api("POST", "/repos/" + REPO + "/issues/" + ISSUE + "/comments", {body: cuerpo})
    .then(function(r){
      if(r.json && !vistos[r.json.id]){
        vistos[r.json.id] = true;
        var m = {id: r.json.id, clase: "yo", quien: "facundo", texto: texto, iso: r.json.created_at,
                 explicito: true, tema: tema};
        msgs.push(m); pintarMsg(m, false); alFinal();
      }
      etagCom = null;
    })
    .catch(function(e){
      ultimoTexto = ""; ultimoTs = 0;                           // fallo: se puede reintentar igual
      if(!txt.value.trim()){ ponerCaja(texto); guardarBorrador(caja || tema, texto, true); }
      if(ruidoso(e)) sistema("no se pudo mandar: " + e.message, "error");
    })
    .then(function(){ enviando = Math.max(0, enviando - 1); $("mandar").disabled = false; });
}
// un mensaje partido sale como varios mensajes, uno por tema, **en orden** y cada uno con su
// `tema x:` a su pestaña (la abre si no estaba). el foco queda en la del ultimo fragmento.
function mandarPartido(trozos){
  var p = Promise.resolve();
  trozos.forEach(function(tr){
    p = p.then(function(){
      if(tabs.indexOf(tr.tema) < 0 || temaActivo() !== tr.tema) abrirTab(tr.tema);
      return mandar(tr.texto, tr.tema);
    });
  });
  return p;
}

// el tema lo detecta el clasificador (cero tokens) y se cruza con el de la pestaña:
// - `tema x:` escrito a mano: manda, y la charla se va a esa pestaña.
// - pestaña general (`auto`): la puerta de entrada. va sin prefijo (el clasificador es solo el default y el
//   daemon contesta viendo la charla de todos los temas) y **no se renombra nunca** (facundo, 2026-09-11:
//   quiere una puerta de entrada fija ademas de las pestañas de tema). si el tema detectado ya tiene
//   pestaña, salta ahi para que la respuesta se vea donde cae.
// - pestaña X y el mensaje parece de Y: pregunta antes de mandar (3 opciones).
// - si no hay pistas, se queda en la pestaña donde esta.
function enviarMensaje(texto){
  texto = (texto || "").trim();
  if(!texto) return;
  if(RE_CRUDO.test(texto)){ mandar(texto, temaActivo(), true); return; }
  var activo = temaActivo(), c = clasificar(texto);
  if(c.fuente === "prefijo"){
    if(c.tema !== activo) abrirTab(c.tema);
    mandar(texto, c.tema);
    return;
  }
  if(activo === AUTO){
    mandar(texto, AUTO);                                       // crudo: la general no fija tema
    if(c.tema && tabs.indexOf(c.tema) >= 0) abrirTab(c.tema);
    return;
  }
  // el mensaje trae dos temas adentro: se pregunta aunque el tema del conjunto sea el de la pestaña
  var trozos = partir(texto);
  if(trozos.length > 1){
    var otro = null;
    for(var i = 0; i < trozos.length; i++) if(trozos[i].tema !== activo){ otro = trozos[i].tema; break; }
    preguntarDestino(texto, activo, otro || trozos[0].tema, trozos);
    return;
  }
  if(c.fuente === "palabras" && c.tema !== activo){ preguntarDestino(texto, activo, c.tema); return; }
  mandar(texto, activo);
}
// el mensaje parece de otro tema: opciones y no se manda hasta elegir (igual que la consola).
// si ademas viene partido en 2+ temas, la primera opcion es partirlo: cada mitad a su pestaña.
function preguntarDestino(texto, activo, otro, trozos){
  var existe = tabs.indexOf(otro) >= 0, ops = [];
  if(trozos && trozos.length > 1)
    ops.push(["partir: " + trozos.map(function(t){ return t.tema; }).join(" / "), "partir"]);
  ops.push(["mandalo a la pestaña " + otro + (existe ? "" : " (la abre)"), "ir"]);
  ops.push(["abrí " + otro + " al lado de los widgets y mandalo ahí", "lado"]);
  ops.push(["no, dejalo acá como `tema " + activo + ":`", "aqui"]);
  dd(trozos && trozos.length > 1 ? "esto tiene " + trozos.length + " temas" : "esto parece de " + otro,
     ops, function(que){
    if(que === "partir"){ mandarPartido(trozos); return; }
    if(que === "aqui"){ mandar(texto, activo); return; }
    if(que === "lado") splitCon(otro); else abrirTab(otro);
    mandar(texto, otro);
  });
}

// ---------- sugerencias de respuesta arriba del input (facundo, 2026-09-11) ----------
// cero tokens y cero red: los chips salen de leer la **ultima respuesta del daemon en esta pestaña**.
// tocar uno **llena la caja y deja el foco ahi, NO manda**: el `tema x:` lo agrega el envio como
// siempre, asi que el chip lleva el texto pelado (`A`, `dale 3`, `op 2 B`, `status`).
var CHIP_TOPE = 30;      // el titulo de una opcion se recorta a esto
var CHIP_MAX = 10;       // tope de chips sugeridos, sin contar los fijos
function chipRecorte(t, n){
  t = (t || "").replace(/[`*_]/g, "").replace(/\s+/g, " ").trim();
  n = n || CHIP_TOPE;
  return t.length > n ? t.slice(0, n - 1) + "…" : t;
}
// la ultima respuesta del daemon que cae en esta pestaña (null si todavia no contesto nada)
function ultimaRespuesta(tema){
  for(var i = msgs.length - 1; i >= 0; i--){
    var m = msgs[i];
    if(m.clase === "agente" && deEstaTab(m.tema, tema)) return m.texto || "";
  }
  return null;
}
// opciones a/b/c: lineas `A) texto`, `**A** texto`, `- A. texto`, y el cierre "decime A, B o C"
function chipsABC(texto){
  var tit = {}, letras = [];
  function sumar(L, t){
    L = L.toUpperCase();
    if(letras.indexOf(L) < 0) letras.push(L);
    if(t && !tit[L]) tit[L] = t;
  }
  texto.split("\n").forEach(function(l){
    // `**A** texto` (la negrita ya marca que es una opcion) o `A) texto` / `- A. texto` / `A: texto`
    var m = l.match(/^[\s>]*(?:[-*]\s+)?\*\*([A-D])\*\*\s*[\)\.:—-]?\s+(\S.*)$/) ||
            l.match(/^[\s>]*(?:[-*]\s+)?([A-D])\s*[\)\.:—-]\s+(\S.*)$/);
    if(m) sumar(m[1], m[2]);
  });
  var dec = texto.match(/decime[^\n]*/i);
  if(dec && /\b[A-D]\b[^\n]*\b[A-D]\b/.test(dec[0]))
    (dec[0].match(/\b[A-D]\b/g) || []).forEach(function(L){ sumar(L, null); });
  letras.sort();
  return letras.map(function(L){
    return {cmd: L, letra: L, texto: tit[L] ? chipRecorte(tit[L]) : ""};
  });
}
// propuestas numeradas: lineas `- \`N\`` o un "dale N" (tambien "dale 3, 7 y 9")
function chipsDale(texto){
  var ns = [];
  function sumar(n){ if(ns.indexOf(n) < 0 && ns.length < CHIP_MAX) ns.push(n); }
  texto.split("\n").forEach(function(l){
    var m = l.match(/^[\s>]*[-*]\s*`(\d{1,3})`/);
    if(m) sumar(m[1]);
  });
  var d = texto.match(/dale\s+\d{1,3}(?:\s*(?:,|y)\s*\d{1,3})*/gi) || [];
  d.forEach(function(frag){ (frag.match(/\d{1,3}/g) || []).forEach(sumar); });
  return ns.map(function(n){ return {cmd: "dale " + n, letra: "dale", texto: n}; });
}
// oportunidades: si la respuesta nombra `op N` se ofrecen las opciones REALES de ese item
// (widgets.json, que es lo que publica oportunidades.json). si no hay datos, la letra que diga el texto.
function chipsOp(texto){
  var vistos = {}, chips = [], m, re = /\bop\s+(\d{1,3})(?:\s*([A-D])\b)?/gi;
  var items = ((widDatos || {}).oportunidades || {}).items || [];
  while((m = re.exec(texto))){
    var id = m[1];
    if(vistos[id]) continue;
    vistos[id] = 1;
    var item = null;
    items.forEach(function(i){ if(String(i.id) === id) item = i; });
    if(item && (item.opciones || []).length){
      item.opciones.forEach(function(op){
        chips.push({cmd: "op " + id + " " + op.letra, letra: "op " + id + " " + op.letra,
                    texto: chipRecorte(op.texto)});
      });
    }else if(m[2]){
      chips.push({cmd: "op " + id + " " + m[2].toUpperCase(), letra: "op " + id + " " + m[2].toUpperCase(), texto: ""});
    }
  }
  return chips;
}
// las sugerencias de una respuesta, en orden: a/b/c, `dale N`, `op N X`, si/no, y al final los fijos
function sugerencias(texto){
  if(texto === null || texto === undefined) return [];
  var chips = chipsABC(texto).concat(chipsDale(texto)).concat(chipsOp(texto));
  if(/\?\s*$/.test(texto.trim()))
    chips = chips.concat([{cmd: "si", letra: "si", texto: ""}, {cmd: "no", letra: "no", texto: ""}]);
  chips = chips.slice(0, CHIP_MAX);
  chips.push({cmd: "status", letra: "status", texto: ""});
  chips.push({cmd: "cola", letra: "cola", texto: ""});
  var vistos = {};
  return chips.filter(function(c){
    if(vistos[c.cmd]) return false;
    vistos[c.cmd] = 1;
    return true;
  });
}
function pintarChips(){
  var fila = $("chips");
  if(!fila) return;
  var resp = ultimaRespuesta(temaActivo());
  var chips = resp === null ? [] : sugerencias(resp);
  fila.innerHTML = "";
  if(!chips.length){ fila.classList.add("oculta"); return; }
  chips.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.cmd = c.cmd;
    b.title = c.cmd;
    b.innerHTML = '<span class="l"></span>' + (c.texto ? ' <span class="t"></span>' : "");
    b.querySelector(".l").textContent = c.letra;
    if(c.texto) b.querySelector(".t").textContent = c.texto;
    fila.appendChild(b);
  });
  fila.classList.remove("oculta");
}
$("chips").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b || !b.dataset.cmd) return;
  ponerCaja(b.dataset.cmd);                                  // llena la caja, no manda
  guardarBorrador(temaCaja || temaActivo(), txt.value);
  txt.focus();
});

// ---------- widgets (web 2): widgets.json que publica el daemon en el buzon ----------
// misma estetica que la consola: verde ok, rojo fallo, amarillo pendiente, cian corriendo, magenta $.
// el json lo arma `recetas/widgets_json.py` y lo sube el script `widgets_web` del daemon cada 60 s.
var widgetsEl = $("widgets");
var podAbierto = false;   // el desplegable de podcast, se conserva entre repintados

function kilo(n){
  n = n || 0;
  if(n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if(n >= 1000) return Math.round(n / 1000) + "k";
  return String(Math.round(n));
}
function clasePct(p){ return p >= 80 ? "alto" : p >= 50 ? "med" : "ok"; }
function bar(p, ancho){
  ancho = ancho || 10;
  var v = (p === null || p === undefined) ? null : Math.max(0, Math.min(100, p));
  var n = v === null ? 0 : Math.round(v * ancho / 100);
  var cl = v === null ? "" : clasePct(v);
  return '<span class="bar ' + cl + '"><span class="lleno">' + "█".repeat(n) + '</span>' +
         '<span class="hueco">' + "░".repeat(ancho - n) + "</span></span> " +
         '<span class="pct ' + (cl || "g") + '">' + (v === null ? "?" : Math.round(v)) + "%</span>";
}
function horaLocal(iso){
  if(!iso) return "";
  var t = fecha(iso);
  if(!t) return "";
  var d = new Date(t), hoy = new Date();
  var dias = ["dom","lun","mar","mie","jue","vie","sab"];
  var mismo = d.toDateString() === hoy.toDateString();
  return (mismo ? "hoy " : dias[d.getDay()] + " ") + desde(iso);
}
function haceSeg(s){
  if(s === null || s === undefined) return "?";
  if(s < 60) return Math.round(s) + "s";
  if(s < 3600) return Math.round(s / 60) + "m";
  if(s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function pad(t, n, der){
  t = String(t === null || t === undefined ? "" : t);
  if(t.length > n) t = t.slice(0, n);
  var h = " ".repeat(n - t.length);
  return der ? h + t : t + h;
}
function boton(texto, msg, clase){
  return '<button class="btn ' + (clase || "") + '" type="button" data-msg="' + esc(msg) + '">' + esc(texto) + "</button>";
}
function caja(tit, extra, cuerpo, tabla){
  return '<div class="caja"><div class="tit"><span>' + esc(tit) + '</span><span>' + (extra || "") +
         '</span></div><div class="cuerpo' + (tabla ? " tabla" : "") + '">' + cuerpo + "</div></div>";
}
function vacio(t){ return '<span class="vacio">' + esc(t) + "</span>"; }

// ---------- items tocables (facundo, 2026-09-11) ----------
// cada fila de un widget se registra aca y se envuelve en un `.it`: tocarla abre el modal con el item
// expandido y sus acciones. el registro se limpia en cada repintado.
var itemsW = {}, itemN = 0;
function it(o, html){
  var id = ++itemN;
  itemsW[id] = o;
  return '<span class="it" data-it="' + id + '">' + html + "</span>";
}

// falta hasta el reset, corto: 4d23 / 1h55 / 12m. `s` viene calculado del daemon (falta_s).
function faltaTxt(s){
  if(s === null || s === undefined) return "";
  if(s <= 0) return "ya";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if(d) return d + "d" + (h ? h : "");
  if(h) return h + "h" + (m < 10 ? "0" : "") + m;
  return m + "m";
}
// una barra: el ancho es el % usado, el tick blanco es la linea (la parte de la ventana que ya paso)
// y el color sale del `nivel` que ya calculo widgets_json.py (ok / cerca / sobre / mal).
function barraUso(b){
  var pct = (b.pct === null || b.pct === undefined) ? null : Math.max(0, Math.min(100, b.pct));
  var tick = (b.linea === null || b.linea === undefined) ? null : Math.max(0, Math.min(100, b.linea));
  return '<div class="ub n-' + esc(b.nivel || "sin") + '" title="' +
         esc(b.nombre + ": usado " + (pct === null ? "?" : Math.round(pct)) + "%, linea " +
             (tick === null ? "?" : Math.round(tick)) + "%" +
             (b.ratio ? ", ratio " + b.ratio : "")) + '">' +
         '<span class="ub-n">' + esc(b.nombre) + "</span>" +
         '<span class="ub-pista"><span class="ub-lleno" style="width:' + (pct === null ? 0 : pct) + '%"></span>' +
         (tick === null ? "" : '<span class="ub-tick" style="left:' + tick + '%"></span>') + "</span>" +
         '<span class="ub-p">' + (pct === null ? "?" : Math.round(pct)) + "%</span>" +
         '<span class="ub-r">' + esc(faltaTxt(b.falta_s)) + "</span></div>";
}
// facundo (2026-09-11): el widget muestra SOLO las barras, tres por cuenta (5h, week, fable).
// presupuesto, horario laboral y costo siguen en el json pero no se pintan aca.
function cajaUsage(u){
  var cuentas = u.cuentas || [], html = "";
  if(!cuentas.length && (u.barras || []).length)
    cuentas = [{nombre: "cuenta", activa: true, barras: u.barras}];
  cuentas.forEach(function(cu){
    html += '<div class="bloque">' +
            it({tipo: "cuenta", tema: "tools", d: cu},
               '<span class="cta"><span class="nom">' + esc(cu.nombre) + "</span>" +
               (cu.activa ? '<span class="v">activa</span>' : "") + "</span>") +
            (cu.barras || []).map(barraUso).join("") + "</div>";
  });
  return caja("usage", "", '<div class="usage">' + (html || vacio("sin datos")) + "</div>");
}

function cajaAgente(a){
  var filas = [];
  var est = a.pausa ? '<span class="r b">PAUSA</span>'
          : (a.corriendo || []).length ? '<span class="a b">trabajando</span>' : '<span class="v">idle</span>';
  filas.push('cola <span class="c b">' + a.pendientes + "</span> pendientes  " + est);
  (a.corriendo || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "corriendo", tema: t.tema, d: t},
               '<span class="a">&gt;</span> <span class="m b">' + esc(t.modelo) + '</span> <span class="g">' +
               (t.min === null ? "?" : t.min) + "m</span> " + esc(String(t.texto || "").slice(0, 120))));
  });
  filas.push(a.horas + "h  ok <span class=\"v b\">" + a.ok + '</span>  fallo <span class="r b">' + a.fallo +
             '</span>  <span class="g">chat ' + a.chat + "</span>");
  var ult = (a.hechas || []);
  if(!ult.length) filas.push(vacio("nada terminado todavia"));
  ult.forEach(function(t){
    var hora = (t.fecha || "").slice(11, 16) || "--:--";
    filas.push(it({tipo: "tarea", estado: "hecha", tema: t.tema, d: t},
               '<span class="g">' + esc(hora) + "</span> " +
               (t.ok ? '<span class="v">ok</span>' : '<span class="r">!!</span>') + " " +
               esc(String(t.texto || "").slice(0, 90)) +
               (t.usd ? ' <span class="m">$' + t.usd.toFixed(2) + "</span>" : "")));
  });
  (a.cola || []).slice(0, 4).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "cola", tema: t.tema, d: t},
               '<span class="a">[ ]</span> <span class="g">' + esc(t.tema) + "</span> " +
               esc(String(t.texto).slice(0, 80))));
  });
  var pausa = boton(a.pausa ? "segui" : "pausa", a.pausa ? "segui" : "pausa");
  filas.push(pausa + boton("cola", "cola") + boton("status", "status"));
  return caja("agent", 'cuenta <span class="c b">' + esc(a.cuenta || "?") + "</span>", filas.join("\n"));
}

function cajaVerif(v){
  if(v.verify === undefined) return caja("verification agent", "", vacio("sin cache de jira"));
  var edad = v.edad_min > 30 ? ' <span class="g">(' + v.edad_min + "m)</span>" : "";
  return caja("verification agent", "",
    it({tipo: "verif", tema: "awtomic", d: v},
      'verify <span class="c b">' + v.verify + '</span> · mine <span class="b">' + v.mine +
      '</span> · unassigned <span class="b">' + v.unassigned + "</span>" + edad +
      ' · running <span class="' + (v.running ? "a" : "v") + ' b">' + v.running + "</span>"));
}

function cajaTickets(t){
  if(t.sin_datos) return caja("my tickets", "", vacio("sin jira_mine.json"));
  var filas = (t.mine || []).map(function(x){
    return it({tipo: "ticket", tema: "awtomic", d: x},
      '<span class="c b">' + esc(x.key) + '</span> <span class="a">' + esc(x.estado) + '</span> ' +
      '<span class="g">' + haceSeg(x.hace_s) + "</span> " + esc(x.titulo));

function cajaOportunidades(o){

  if(!(o.items || []).length)
    return caja("opportunities", "", vacio("nada pendiente · se rellena solo") +

               sello + "</span> " + esc(i.titulo)));
