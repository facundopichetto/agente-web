function cajaSombra(sb){
  if(sb.error) return caja("backup models", "", '<span class="r">' + esc(sb.error) + "</span>");
  var cols = sb.cols || [], cortos = {principal:"prin", gemini:"gem", groq:"groq", openrouter:"orou", mistral:"mist"};
  var filas = ['<span class="g">' + pad("categoria", 11) + cols.map(function(c){ return pad(cortos[c] || c, 5, true); }).join(" ") +
               " " + pad("veredicto", 9) + "</span>"];
  (sb.cats || []).forEach(function(cat){
    var f = (sb.tabla || {})[cat];
    if(!f) return;
    var celdas = cols.map(function(c){
      var x = f[c];
      if(!x) return '<span class="g">' + pad("-", 5, true) + "</span>";
      if(x.acierto === null || x.acierto === undefined){
        var t = x.sin_clave ? "-" : x.pendientes ? "wait" : "err";
        return '<span class="g">' + pad(t, 5, true) + "</span>";
      }
      var cl = x.acierto >= 80 ? "v" : x.acierto >= 50 ? "a" : "r";
      return '<span class="' + cl + ' b">' + pad(x.acierto + "%", 5, true) + "</span>";
    });
    var v = (sb.veredictos || {})[cat] || {};
    var ver = v.veredicto === "apto" ? '<span class="v b">' + pad("ok " + (cortos[v.proveedor] || v.proveedor || ""), 9) + "</span>"
            : v.veredicto === "no apto" ? '<span class="r b">' + pad("no", 9) + "</span>"
            : '<span class="g">' + pad("pocos", 9) + "</span>";
    filas.push(it({tipo: "catbackup", tema: "tools", d: {cat: cat, fila: f, cols: cols, veredicto: v}},
               pad(cat, 11) + celdas.join(" ") + " " + ver));
  });
  if(filas.length === 1) filas.push(vacio("sin corridas todavia"));
  var hoy = sb.hoy || {}, est = hoy.estados || {};
  if(Object.keys(est).length){
    var clEst = {ok:"v", cuota:"a", pago:"r", roto:"r", "sin clave":"g"};
    var chips = Object.keys(est).map(function(p){
      var e = est[p], c = clEst[e.estado] || "g";
      var lat = e.estado === "ok" && e.latencia !== null ? " " + e.latencia + "s" : "";
      return it({tipo: "modelo", tema: "tools",
                 d: {prov: p, hoy: e, info: (sb.modelos || {})[p] || {}, tabla: sb.tabla || {},
                     cats: sb.cats || [], veredictos: sb.veredictos || {}}},
                '<span class="' + c + ' b">' + esc(cortos[p] || p) + "</span>" +
                '<span class="' + c + '">' + esc(" " + e.estado + lat) + "</span>");
    });
    filas.push('<span class="g">' + pad("hoy", 11) + "</span>" + chips.join('<span class="g"> \u00b7 </span>'));
  }
  filas.push('<span class="g">' + (sb.n || 0) + " corridas · apto = 85%+ &lt;5s 20+" +
             ((sb.faltan || []).length ? " · sin clave: " + sb.faltan.length : "") + "</span>");
  return caja("backup models", "", filas.join("\n"), true);
}

function cajaAvisos(av){
  if(!(av || []).length) return caja("avisos", "", vacio("sin avisos"));
  return caja("avisos", "", av.map(function(l){
    var m = /^(\d{4}-\d\d-\d\d \d\d:\d\d)\s+([\s\S]*)$/.exec(l);
    var t = m ? '<span class="g">' + esc(m[1].slice(5, 16)) + "</span> " + esc(m[2]) : esc(l);
    return it({tipo: "aviso", d: {texto: m ? m[2] : l, fecha: m ? m[1] : null}},
              t.length > 400 ? t.slice(0, 400) + "…" : t);
  }).join("\n"));
}

function cajaPropuestas(pr){
  if(!(pr || []).length) return caja("propuestas", "", vacio("nada esperando un dale"));
  return caja("propuestas", "", pr.map(function(p){
    return it({tipo: "propuesta", tema: p.tema, d: p},
      '<span class="a b">' + p.n + '</span> <span class="g">' + esc(p.tema) + "</span> " +
      esc(String(p.orden).slice(0, 220))) + "\n  " + boton("dale", "dale " + p.n, "dale");
  }).join("\n"));
}

function link(url, texto){
  return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(texto) + "</a>";
}

function cajaPodcast(p){
  var eps = p.episodios || [];
  var btn = '<button class="btn" type="button" data-pod="1">' + (podAbierto ? "cerrar" : "podcast") + "</button>";
  var extra = eps.length ? '<span class="g">' + eps.length + " ep</span>" : "";
  if(!podAbierto) return caja("podcast", extra, btn + '<span class="g">' + (eps.length ? "tocá para ver los links" : "sin episodios") + "</span>");
  var filas = [btn + link(p.web || "#", "la web del podcast")];
  if(!eps.length) filas.push(vacio("sin episodios"));
  eps.forEach(function(e){
    filas.push(it({tipo: "episodio", tema: "tools", d: e},
               '<span class="g">' + esc((e.fecha || "").slice(5)) + "</span> " + esc(e.titulo)));
    filas.push("  " + (e.voces || []).map(function(v){
      return link(v.url, v.voz + (v.min ? " " + v.min + "m" : ""));
    }).join(" · "));
  });
  return caja("podcast", extra, filas.join("\n"));
}

function pintarWidgets(d, err){
  if(!d && !widDatos){
    widgetsEl.innerHTML = caja("widgets", "", err ? '<span class="r">' + esc(err) + "</span>" : vacio("cargando..."));
    return;
  }
  if(d) widDatos = d;
  d = widDatos;
  itemsW = {}; itemN = 0;            // los items del repintado anterior ya no existen
  var edad = haceSeg((Date.now() - fecha(d.ts)) / 1000);
  var partes = [
    cajaUsage(d.usage || {}),
    cajaAgente(d.agente || {}),
    cajaVerif(d.verificaciones || {}),
    cajaTickets(d.tickets || {}),
    cajaOportunidades(d.oportunidades || {}),
    cajaSombra(d.sombra || {}),
    cajaPropuestas(d.propuestas || []),
    cajaAvisos(d.avisos || []),
    cajaPodcast(d.podcast || {}),
    '<div class="caja"><div class="cuerpo g">datos de hace ' + edad +
      (err ? ' · <span class="r">' + esc(err) + "</span>" : "") + "</div></div>"
  ];
  var y = $("panel-widgets").scrollTop;
  widgetsEl.innerHTML = partes.join("");
  $("panel-widgets").scrollTop = y;
  pintarChips();                // los chips `op N X` usan las opciones reales de este json
}

function cargarWidgets(){
  widUlt = Date.now();
  return api("GET", "/repos/" + REPO + "/contents/widgets.json", null, etagWid,
             "application/vnd.github.raw+json").then(function(r){
    if(r.status === 304){ pintarWidgets(null); return; }
    etagWid = r.etag;
    pintarWidgets(r.json);
  });
}

widgetsEl.addEventListener("click", function(e){
  var pod = e.target.closest("button[data-pod]");
  if(pod){ podAbierto = !podAbierto; pintarWidgets(null); return; }
  var b = e.target.closest("button[data-msg]");
  if(b){
    b.disabled = true;
    mandar(b.dataset.msg, temaActivo(), true);   // `op N X` / `dale N`: los resuelve el daemon sin modelo
    setTimeout(function(){ b.disabled = false; }, 1500);
    return;
  }
  var n = e.target.closest("[data-it]");         // tocar la fila = modal con el item expandido
  if(n && itemsW[n.dataset.it]) abrirModal(itemsW[n.dataset.it]);
});

// ---------- modal de item de widget (facundo, 2026-09-11) ----------
// el widget muestra una linea; el modal muestra el item entero (lo que manda widgets_json) y 2 a 4
// acciones a/b/c segun el tipo. lo que termina en un mensaje sale **por la pestaña del tema del item**
// (la abre si no existe), salvo los comandos que el daemon atiende crudos (`dale N`, `op N X`, `cola`).
var JIRA = "https://shopbundle.atlassian.net/browse/";

function corto(t, n){
  t = String(t === null || t === undefined ? "" : t).replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}
function temaItem(o){
  var t = o.tema || clasificar(String((o.d || {}).texto || (o.d || {}).titulo || "")).tema || "tools";
  t = normTema(t);
  return esTema(t) ? t : "tools";
}
// un mensaje que sale del modal: a la pestaña del tema del item (los crudos no llevan prefijo ni saltan)
function actuar(tema, msg, crudo){
  cerrarModal();
  if(!crudo && esTema(tema) && temaActivo() !== tema) abrirTab(tema);
  mandar(msg, esTema(tema) ? tema : temaActivo(), crudo);
}
// "hablar de esto": deja el chat en la pestaña del tema, con el contexto del item ya escrito
function hablar(o, contexto){
  cerrarModal();
  var tema = temaItem(o);
  if(temaActivo() !== tema) abrirTab(tema);
  ponerCaja("sobre " + contexto + ": ");
  guardarBorrador(temaActivo(), txt.value, true);
  if(window.innerWidth < 900) verPanel(foco === 1 ? "lado" : "chat");
  txt.focus();
}
function accHablar(o, contexto){
  return ["hablar de esto en el chat", function(){ hablar(o, contexto); }];
}

function modalDe(o){
  var d = o.d || {}, tema = temaItem(o), m = {tema: tema, acciones: [], titulo: o.tipo, cuerpo: ""};

    m.titulo = o.estado === "corriendo" ? "tarea corriendo" : o.estado === "hecha" ? "tarea terminada" : "tarea en la cola";
    m.cuerpo = esc(d.completo || d.texto || "") + '\n\n<span class="g">tema</span> <span class="c">' + esc(tema) + "</span>" +
      (d.modelo ? ' <span class="g">modelo</span> <span class="m">' + esc(d.modelo) + "</span>" : "") +
      (d.tags ? ' <span class="g">' + esc(d.tags) + "</span>" : "") +
      (d.min !== null && d.min !== undefined ? ' <span class="g">' + d.min + " min</span>" : "") +
      (d.fecha ? ' <span class="g">' + esc(d.fecha) + "</span>" : "") +
      (d.usd ? ' <span class="m">$' + d.usd.toFixed(2) + "</span>" : "") +
      (o.estado === "hecha" ? (d.ok ? ' <span class="v">ok</span>' : ' <span class="r">fallo</span>') : "") +
      (d.meta ? '\n<span class="g">' + esc(d.meta) + "</span>" : "");
    if(o.estado === "hecha")
      m.acciones.push(["ver el log de esta tarea", function(){
        actuar(tema, "mostrame el log de la tarea «" + corto(d.texto, 90) + "»" +
                     (d.log ? " (logs/" + d.log + ".txt)" : "") + ": qué hizo, qué falló y cuánto costó");
      }]);
    else
      m.acciones.push(["ver la cola entera", function(){ actuar(tema, "cola", true); }]);
    m.acciones.push(accHablar(o, "la tarea «" + corto(d.texto, 70) + "»"));
  } else if(o.tipo === "oportunidad"){
    m.titulo = "oportunidad " + d.id;
    m.cuerpo = '<span class="a b">' + esc(d.titulo) + "</span>" +
      (d.porque ? "\n" + esc(d.porque) : "") +
      '\n<span class="g">valor ' + d.valor + " / esfuerzo " + d.esfuerzo +
      (d.dias ? " · " + d.dias + " d esperando" : "") + (d.limbo ? " · refill en pausa" : "") + "</span>" +
      (d.opciones || []).map(function(op){
        return '\n\n<span class="' + (op.letra === d.voto ? "v" : "c") + ' b">' + esc(op.letra) + ")</span> " +
               esc(op.texto) + (op.tiempo ? ' <span class="g">(' + esc(op.tiempo) + ")</span>" : "") +
               (op.letra === d.voto ? ' <span class="v">← mi voto</span>' : "") +
               (op.orden ? '\n<span class="g">' + esc(corto(op.orden, 220)) + "</span>" : "");
      }).join("");
    (d.opciones || []).forEach(function(op){
      m.acciones.push([op.letra + ") " + corto(op.texto, 80) + (op.tiempo ? " (" + op.tiempo + ")" : "") +
                       (op.letra === d.voto ? "  ← mi voto" : ""),
                       function(){ actuar("tools", "op " + d.id + " " + op.letra, true); },
                       op.letra === d.voto]);
    });
    m.acciones.push(accHablar(o, "la oportunidad " + d.id + " (" + corto(d.titulo, 70) + ")"));
  } else if(o.tipo === "propuesta"){
    m.titulo = "propuesta " + d.n;
    m.cuerpo = esc(d.orden) + '\n\n<span class="g">tema</span> <span class="c">' + esc(tema) + "</span>";
    m.acciones.push(["dale: encolala ahora", function(){ actuar(tema, "dale " + d.n, true); }, true]);
    m.acciones.push(accHablar(o, "la propuesta " + d.n + " (" + corto(d.orden, 70) + ")"));
    m.acciones.push(["descartarla", function(){
      actuar(tema, "descartá la propuesta " + d.n + " («" + corto(d.orden, 90) +
                   "»): borrala de propuestas-chat.md y no la encoles");
    }]);
  } else if(o.tipo === "modelo"){
    var inf = d.info || {}, hoy = d.hoy || {};
    m.titulo = "backup model: " + d.prov;
    m.cuerpo = esc(inf.que_es || "modelo de respaldo que se mide en sombra.") +
      '\n\n<span class="g">hoy</span> ' + esc(hoy.estado || "?") +
      (hoy.latencia !== null && hoy.latencia !== undefined ? " " + hoy.latencia + "s" : "") +
      (inf.modelo || hoy.modelo ? '\n<span class="g">modelo</span> <span class="c">' + esc(inf.modelo || hoy.modelo) + "</span>" : "") +
      '\n<span class="g">clave</span> ' + (inf.clave === false ? '<span class="r">falta</span>' : '<span class="v">ok</span>') +
      "\n" + (d.cats || []).map(function(c){
        var x = ((d.tabla || {})[c] || {})[d.prov];
        if(!x || x.acierto === null || x.acierto === undefined) return "";
        return '\n<span class="g">' + pad(c, 11) + "</span>" + x.acierto + "% · " +
               (x.latencia === null ? "?" : x.latencia) + "s · " + x.n + " corridas";
      }).join("");
    m.acciones.push(["probarlo ahora (manda un `eco:`)", function(){
      actuar(tema, "eco: probando " + d.prov + ": contestame en una linea que modelo sos", true);
    }]);
    m.acciones.push(accHablar(o, "el modelo de backup " + d.prov));
    m.acciones.push(["sacarlo del widget", function(){
      actuar("tools", "sacá " + d.prov + " del widget `backup models`: quitalo de COLS_SOMBRA en " +
                      "recetas/widgets_json.py y de donde se mida en recetas/sombra.py, y decime por qué quedó afuera");
    }]);
  } else if(o.tipo === "catbackup"){

        return "\n" + pad(c, 11) + (x.acierto === null || x.acierto === undefined ? "sin datos"
               : x.acierto + "% · " + (x.latencia === null ? "?" : x.latencia) + "s · " + x.n + " corridas");
      }).join("") +
      '\n\n<span class="g">veredicto</span> ' + esc(v.veredicto || "pocos datos") +
      (v.proveedor ? " (" + esc(v.proveedor) + ")" : "");
    m.acciones.push(accHablar(o, "la categoria " + d.cat + " de los modelos de backup"));
  } else if(o.tipo === "ticket"){
    m.titulo = d.key;
    m.cuerpo = esc(d.titulo) + '\n\n<span class="a">' + esc(d.estado) + '</span> <span class="g">hace ' +
      haceSeg(d.hace_s) + "</span>\n" + link(JIRA + d.key, "abrir " + d.key + " en jira");
    m.acciones.push(accHablar(o, "el ticket " + d.key + " (" + corto(d.titulo, 70) + ")"));
  } else if(o.tipo === "cuenta"){

      (d.barras || []).map(function(b){

               (b.linea === null || b.linea === undefined ? "" : ' <span class="g">linea ' + Math.round(b.linea) + "%</span>") +
               (b.falta_s === null || b.falta_s === undefined ? "" : ' <span class="g">reset en ' + esc(faltaTxt(b.falta_s)) + "</span>");
      }).join("");
    if(!d.activa)
      m.acciones.push(["pasar el agente a esta cuenta", function(){ actuar(tema, "cuenta " + d.nombre, true); }, true]);
    m.acciones.push(["ver el uso ahora", function(){ actuar(tema, "status", true); }]);
    m.acciones.push(accHablar(o, "la cuenta " + d.nombre));
  } else if(o.tipo === "verif"){
    m.titulo = "verification agent";
    m.cuerpo = "verify " + d.verify + " · mine " + d.mine + " · unassigned " + d.unassigned +

        ? '\n<span class="g">cache de jira de hace ' + d.edad_min + " min</span>" : "");

    m.acciones.push(accHablar(o, "esto del widget"));
  }
  return m;

var LETRAS = "abcdefgh";
var modalAbierto = null;
function abrirModal(o){
  var m = modalDe(o);
  modalAbierto = m;
  $("mtitulo").textContent = m.titulo || "item";
  $("mcuerpo").innerHTML = m.cuerpo || "";
  var acc = $("macc");
  acc.innerHTML = "";
  (m.acciones || []).forEach(function(a, i){
    var b = document.createElement("button");

  $("mfondo").classList.remove("oculta");

function cerrarModal(){
  modalAbierto = null;
  $("modal").classList.add("oculta");

}
$("mfondo").addEventListener("click", cerrarModal);
$("mcerrar").addEventListener("click", cerrarModal);

// celu: una vista a la vez (chat | widgets | la pestaña de al lado, si esta partido).
// en desktop (>= 900px) los paneles se ven juntos y esta barra no aparece.
function verPanel(cual){
  document.body.classList.toggle("ver-widgets", cual === "widgets");
  document.body.classList.toggle("ver-lado", cual === "lado");
  $("ver-chat").classList.toggle("on", cual === "chat");
  $("ver-widgets").classList.toggle("on", cual === "widgets");
  $("ver-lado").classList.toggle("on", cual === "lado");
  if(cual === "widgets" && Date.now() - widUlt > 15000) cargarWidgets().catch(function(){});
  if(cual === "chat"){ focoEn(0); abajo(); }
  if(cual === "lado") focoEn(1);
}

  // quedaria abajo del minimo (y en celu el separador desaparece y mandan los anchos de siempre)
  if(splitPct() !== null){ var p = limitarPct(splitPct()); if(p !== null) split.pct = p; }

});
// arrastrar el separador: pointer events, asi anda igual con mouse y con dedo en tablet.
// mientras se arrastra solo se pinta; el ancho se guarda y se publica al soltar.
(function(){
  var sep = $("sep"), arr = false;
  function pctDe(e){
    var r = $("cuerpo").getBoundingClientRect();
    if(!r.width) return null;
    return (e.clientX - r.left) / r.width * 100;
  }
  sep.addEventListener("pointerdown", function(e){
    if(!anchoDesktop()) return;
    arr = true;
    sep.classList.add("arrastrando");
    document.body.classList.add("arrastrando-sep");
    try{ sep.setPointerCapture(e.pointerId); }catch(x){}
    e.preventDefault();
  });
  sep.addEventListener("pointermove", function(e){
    if(!arr) return;
    var p = pctDe(e);
    if(p !== null) guardarSplit(p, false, true);      // en vivo, sin escribir en cada pixel
    e.preventDefault();
  });
  function soltar(e){
    if(!arr) return;
    arr = false;
    sep.classList.remove("arrastrando");
    document.body.classList.remove("arrastrando-sep");
    try{ sep.releasePointerCapture(e.pointerId); }catch(x){}
    var p = splitPct();
    if(p !== null) guardarSplit(p, true);             // recien aca se guarda y se publica
  }
  sep.addEventListener("pointerup", soltar);
  sep.addEventListener("pointercancel", soltar);
})();
(function(){
  var arrastrada = null;
  $("tabs").addEventListener("dragstart", function(e){
    var t = e.target.closest("[data-tema]");
    if(!t) return;
    arrastrada = t.dataset.tema;
    t.classList.add("arrastrando");
    try{ e.dataTransfer.setData("text/plain", arrastrada); }catch(x){}
  });
  $("tabs").addEventListener("dragend", function(e){
    var t = e.target.closest("[data-tema]");
    if(t) t.classList.remove("arrastrando");
    arrastrada = null;
  });
  // soltar una pestaña sobre la fila de widgets (o sobre el panel de al lado) = mandarla ahi
  ["panel-widgets", "panel-lado"].forEach(function(id){
    var el = $(id);
    el.addEventListener("dragover", function(e){ e.preventDefault(); el.classList.add("soltar"); });
    el.addEventListener("dragleave", function(){ el.classList.remove("soltar"); });
    el.addEventListener("drop", function(e){
      e.preventDefault(); el.classList.remove("soltar");
      var t = arrastrada;
      try{ t = e.dataTransfer.getData("text/plain") || arrastrada; }catch(x){}
      if(t) splitCon(t);
    });
  });
})();
// donde se escribe: click en el panel de al lado lo enfoca, click en la charla grande vuelve

});

// ---------- token ----------
function pedirToken(msg){
  if(timer) clearInterval(timer);
  timer = null;
  token = null;
  frenoHasta = 0; avisoFreno = 0;
  try{ localStorage.removeItem("agente_token"); }catch(x){}
  login.style.display = "flex";
  document.body.classList.add("sinlogin");
  $("login-err").textContent = msg || "";
}
function arrancar(t){
  token = t;
  frenoHasta = 0; avisoFreno = 0;
  try{ localStorage.setItem("agente_token", t); }catch(x){}
  login.style.display = "none";
  document.body.classList.remove("sinlogin");
  msgs = []; render(); vistos = {}; etagCom = null; etagIssue = null;
  $("mas").disabled = false; $("mas").textContent = "cargar más viejo";
  etagWid = null; widUlt = 0;
  etagTabs = null; shaTabs = null; tabsUlt = 0; tabsListo = false; tabsSync = true;
  sincronizar(true)
    .then(function(){ reprogramar(); })
    .catch(function(e){
      if(ruidoso(e)) sistema("error: " + e.message, "error");
      if(e && e.message !== "401") reprogramar();
    });
}
$("entrar").addEventListener("click", function(){

// login por clave (provisorio): clave.json trae el token cifrado (PBKDF2 + AES-GCM, lo publica recetas/web_clave.sh)
function b64a(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function entrarConClave(){
  var c = $("clave").value;
  if(!c) return;
  $("login-err").textContent = "descifrando...";
  fetch("clave.json?v=" + Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no hay clave.json publicado (correr recetas/web_clave.sh)");
    return r.json();
  }).then(function(j){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64a(j.salt), iterations:j.it||300000, hash:"SHA-256"}, base,
                                     {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64a(j.iv)}, key, b64a(j.ct));
    });
  }).then(function(buf){
    $("clave").value = "";
    arrancar(new TextDecoder().decode(buf).trim());
  }).catch(function(e){
    $("login-err").textContent = (e && /decrypt|operation/i.test(e.message)) ? "clave incorrecta" : ("error: " + e.message);
  });
}
$("entrar-clave").addEventListener("click", entrarConClave);
$("clave").addEventListener("keydown", function(e){ if(e.key === "Enter") entrarConClave(); });
$("salir").addEventListener("click", function(){
  var b = $("salir");
  if(b.classList.contains("confirmar")){
    b.classList.remove("confirmar"); b.textContent = "salir";
    pedirToken("token borrado de este teléfono.");
    return;
  }
  b.classList.add("confirmar"); b.textContent = "borrar token?";
  clearTimeout(b.dataset.t);
  b.dataset.t = setTimeout(function(){ b.classList.remove("confirmar"); b.textContent = "salir"; }, 4000);
});

  sugerencias: sugerencias, pintarChips: pintarChips, ultimaRespuesta: ultimaRespuesta,

  },
  chipsVisibles: function(){ return !$("chips").classList.contains("oculta"); },
  tocarChip: function(cmd){
    var ns = document.querySelectorAll("#chips button");
    for(var i = 0; i < ns.length; i++)

  abrirModal: abrirModal, cerrarModal: cerrarModal, modalDe: modalDe,

            acciones: [].map.call($("macc").querySelectorAll("button"), function(b){ return b.textContent; })};

  tocarItem: function(sel){          // click sobre la n-esima fila tocable de los widgets
    var ns = document.querySelectorAll("#widgets [data-it]");
    if(typeof sel === "number") return ns[sel] ? (ns[sel].click(), true) : false;
    for(var i = 0; i < ns.length; i++)

  cargar: function(coms){

    return msgs.map(function(m){ return {id: m.id, tema: m.tema, texto: m.texto}; });

  }
