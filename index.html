// ---------- items tocables (facundo, 2026-09-11) ----------
// cada fila de un widget se registra aca y se envuelve en un `.it`: tocarla abre el modal con el item
// expandido y sus acciones. el registro se limpia en cada repintado.
var itemsW = {}, itemN = 0;
function it(o, html){
  var id = ++itemN;
  itemsW[id] = o;
  return '<span class="it" data-it="' + id + '">' + html + "</span>";
}

// falta hasta el reset, corto: 4d23 / 1h55 / 12m. `s` viene calculado del daemon (falta_s).
function faltaTxt(s){
  if(s === null || s === undefined) return "";
  if(s <= 0) return "ya";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if(d) return d + "d" + (h ? h : "");
  if(h) return h + "h" + (m < 10 ? "0" : "") + m;
  return m + "m";
}
// una barra: el ancho es el % usado, el tick blanco es la linea (la parte de la ventana que ya paso)
// y el color sale del `nivel` que ya calculo widgets_json.py (ok / cerca / sobre / mal).
function barraUso(b){
  var pct = (b.pct === null || b.pct === undefined) ? null : Math.max(0, Math.min(100, b.pct));
  var tick = (b.linea === null || b.linea === undefined) ? null : Math.max(0, Math.min(100, b.linea));
  return '<div class="ub n-' + esc(b.nivel || "sin") + '" title="' +
         esc(b.nombre + ": usado " + (pct === null ? "?" : Math.round(pct)) + "%, linea " +
             (tick === null ? "?" : Math.round(tick)) + "%" +
             (b.ratio ? ", ratio " + b.ratio : "")) + '">' +
         '<span class="ub-n">' + esc(b.nombre) + "</span>" +
         '<span class="ub-pista"><span class="ub-lleno" style="width:' + (pct === null ? 0 : pct) + '%"></span>' +
         (tick === null ? "" : '<span class="ub-tick" style="left:' + tick + '%"></span>') + "</span>" +
         '<span class="ub-p">' + (pct === null ? "?" : Math.round(pct)) + "%</span>" +
         '<span class="ub-r">' + esc(faltaTxt(b.falta_s)) + "</span></div>";
}
// ---------- server (la geekom `claudio`) ----------
// facundo (2026-09-11): un widget dedicado, arriba de usage. si no contesta muestra "apagado / sin red"
// con la ultima vez que se lo vio; las metricas que se pintan son las cacheadas de esa ultima vez.
function bytes(n){
  if(n === null || n === undefined) return "?";
  var u = ["b", "kb", "mb", "gb", "tb"], i = 0;
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function nivelPct(p, cerca, mal){
  if(p === null || p === undefined) return "sin";
  return p >= (mal || 90) ? "mal" : p >= (cerca || 75) ? "cerca" : "ok";
}
function barraPct(nombre, pct, txt){
  return '<div class="ub n-' + nivelPct(pct) + '"><span class="ub-n">' + esc(nombre) + "</span>" +
         '<span class="ub-pista"><span class="ub-lleno" style="width:' + (pct || 0) + '%"></span></span>' +
         '<span class="ub-p">' + (pct === null || pct === undefined ? "?" : Math.round(pct)) + "%</span>" +
         '<span class="ub-r">' + esc(txt || "") + "</span></div>";
}
function upTxt(s){
  if(!s) return "?";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? d + "d" + h + "h" : h ? h + "h" + m + "m" : m + "m";
}
function cajaServer(s){
  if(!s || !s.host) return caja("server", "", vacio("sin datos del server"));
  var on = !!s.online, filas = [];
  var cab = on ? '<span class="v b">' + esc(s.estado || "ok") + "</span>"
               : '<span class="r b">apagado</span> <span class="g">' + esc(s.estado || "") +
                 (s.visto_hace_s !== null && s.visto_hace_s !== undefined
                    ? " · visto hace " + haceSeg(s.visto_hace_s) : " · nunca visto") + "</span>";
  var barras = barraPct("cpu", s.cpu, s.temp ? s.temp + "\u00b0" : "") +
               barraPct("ram", (s.ram || {}).pct, s.ram ? bytes(s.ram.usado) : "") +
               barraPct("disco", (s.disco || {}).pct, s.disco ? bytes(s.disco.total - s.disco.usado) + " libre" : "");
  filas.push(it({tipo: "server", tema: "server", d: s},
    '<div class="usage' + (on ? "" : " off") + '">' + barras + "</div>" +
    '<span class="g">up</span> <span class="b">' + esc(upTxt(s.uptime_s)) + "</span>" +
    '  <span class="g">lan</span> <span class="c">' + esc(s.ip_lan || s.ip || "?") + "</span>" +
    '  <span class="g">ts</span> <span class="c">' + esc(s.ip_tailscale || "?") + "</span>" +
    (s.ping_ms !== null && s.ping_ms !== undefined ? '  <span class="g">ping</span> <span class="b">' + s.ping_ms + "ms</span>" : "")));
  var red = s.red || {}, thr = s.throughput || {};
  filas.push('<span class="g">red</span> ' +
    '<span class="v">&darr;' + bytes(red.rx_s) + "/s</span> " +
    '<span class="c">&uarr;' + bytes(red.tx_s) + "/s</span>" +
    (thr.mbps ? '  <span class="g">mac&rarr;server</span> <span class="m b">' + thr.mbps + " mbps</span>" : ""));
  filas.push('<span class="g">agente</span> ' +
    (s.agente ? '<span class="v b">corriendo</span>' : '<span class="r b">parado</span>') +
    (s.throughput && s.throughput.ts ? '  <span class="g">medido hace ' + hace(s.throughput.ts) + "</span>" : ""));
  var e = s.etapa || {};
  if(e.titulo){
    filas.push(it({tipo: "server", tema: "server", d: s},
      '<span class="a b">' + esc(e.titulo) + "</span>"));
    (e.puntos || []).forEach(function(p){
      filas.push('<span class="g">·</span> ' + esc(String(p).slice(0, 110)));
    });
  }
  var o = s.ordenes || {};
  (o.corriendo || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "corriendo", tema: "server", d: t},
      '<span class="a">&gt;</span> <span class="m b">' + esc(t.modelo) + '</span> <span class="g">' +
      (t.min === null || t.min === undefined ? "?" : t.min) + "m</span> " + esc(String(t.texto || "").slice(0, 90))));
  });
  (o.cola || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "cola", tema: "server", d: t},
      '<span class="a">[ ]</span> ' + esc(String(t.texto || "").slice(0, 90))));
  });
  (o.hechas || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "hecha", tema: "server", d: t},
      '<span class="g">' + esc((t.fecha || "").slice(11, 16) || "--:--") + "</span> " +
      (t.ok ? '<span class="v">ok</span>' : '<span class="r">!!</span>') + " " +
      esc(String(t.texto || "").slice(0, 80))));
  });
  if(!(o.corriendo || []).length && !(o.cola || []).length && !(o.hechas || []).length)
    filas.push(vacio("sin ordenes de server"));
  (s.esperando || []).forEach(function(p){
    filas.push(it({tipo: "server", tema: "server", d: s},
      '<span class="a b">?</span> ' + esc(String(p).slice(0, 100))));
  });
  (s.log || []).slice(0, 3).forEach(function(l){
    filas.push('<span class="g">' + esc(String(l).slice(0, 110)) + "</span>");
  });
  return caja("server", cab, filas.join("\n"));
}

// facundo (2026-09-11): el widget muestra SOLO las barras, tres por cuenta (5h, week, fable).
// presupuesto, horario laboral y costo siguen en el json pero no se pintan aca.
// facundo (2026-09-12, mitad y mitad): arriba dice QUE CUENTA esta eligiendo el agente y POR QUE
// (`u.reparto`, lo calcula `recetas/reparto_cuentas.py` sin gastar tokens), y la elegida queda marcada.
function cajaUsage(u){
  var cuentas = u.cuentas || [], rep = u.reparto || {}, html = "";
  if(!cuentas.length && (u.barras || []).length)
    cuentas = [{nombre: "cuenta", activa: true, barras: u.barras}];
  if(rep.elegida)
    html += it({tipo: "cuenta", tema: "tools", d: rep, completo: rep.porque || ""},
      '<div class="rep"><span class="g">usa</span> <span class="nom">' + esc(rep.elegida) + "</span> " +
      '<span class="' + (rep.reparto ? "a" : "g") + '">' +
      (rep.reparto ? "reparto" : (rep.modo === "auto" ? "auto, espera el corte" : "fija")) + "</span>" +
      (rep.porque ? '<span class="g por">' + esc(rep.porque) + "</span>" : "") + "</div>");
  cuentas.forEach(function(cu){
    var nota = (cu.nota === null || cu.nota === undefined) ? "" : cu.nota + "x";
    html += '<div class="bloque">' +
            it({tipo: "cuenta", tema: "tools", d: cu},
               '<span class="cta"><span class="nom">' + esc(cu.nombre) + "</span>" +
               (cu.elegida ? '<span class="v b">&larr; usa</span>' : "") +
               (cu.activa && !cu.elegida ? '<span class="v">activa</span>' : "") +
               (nota ? '<span class="g">peor ' + esc(String(cu.peor || "")) + " " + esc(nota) + "</span>" : "") +
               (cu.usable === false ? '<span class="r b">' + esc(cu.motivo || "al tope") + "</span>" : "") +
               "</span>") +
            (cu.barras || []).map(barraUso).join("") + "</div>";
  });
  return caja("usage", "", '<div class="usage">' + (html || vacio("sin datos")) + "</div>");
}

function cajaAgente(a){
  var filas = [];
  var est = a.pausa ? '<span class="r b">PAUSA</span>'
          : (a.corriendo || []).length ? '<span class="a b">trabajando</span>' : '<span class="v">idle</span>';
  filas.push('cola <span class="c b">' + a.pendientes + "</span> pendientes  " + est);
  (a.corriendo || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "corriendo", tema: t.tema, d: t},
               '<span class="a">&gt;</span> <span class="m b">' + esc(t.modelo) + '</span> <span class="g">' +
               (t.min === null ? "?" : t.min) + "m</span> " + esc(String(t.texto || "").slice(0, 120))));
  });
  filas.push(a.horas + "h  ok <span class=\"v b\">" + a.ok + '</span>  fallo <span class="r b">' + a.fallo +
             '</span>  <span class="g">chat ' + a.chat + "</span>");
  var ult = (a.hechas || []);
  if(!ult.length) filas.push(vacio("nada terminado todavia"));
  ult.forEach(function(t){
    var hora = (t.fecha || "").slice(11, 16) || "--:--";
    filas.push(it({tipo: "tarea", estado: "hecha", tema: t.tema, d: t},
               '<span class="g">' + esc(hora) + "</span> " +
               (t.ok ? '<span class="v">ok</span>' : '<span class="r">!!</span>') + " " +
               esc(String(t.texto || "").slice(0, 90)) +
               (t.usd ? ' <span class="m">$' + t.usd.toFixed(2) + "</span>" : "")));
  });
  (a.cola || []).slice(0, 4).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "cola", tema: t.tema, d: t},
               '<span class="a">[ ]</span> <span class="g">' + esc(t.tema) + "</span> " +
               esc(String(t.texto).slice(0, 80))));
  });
  var pausa = boton(a.pausa ? "segui" : "pausa", a.pausa ? "segui" : "pausa");
  filas.push(pausa + boton("cola", "cola") + boton("status", "status"));
  return caja("agent", 'cuenta <span class="c b">' + esc(a.cuenta || "?") + "</span>", filas.join("\n"));
}

function cajaVerif(v){
  if(v.verify === undefined) return caja("verification agent", "", vacio("sin cache de jira"));
  var edad = v.edad_min > 30 ? ' <span class="g">(' + v.edad_min + "m)</span>" : "";
  return caja("verification agent", "",
    it({tipo: "verif", tema: "awtomic", d: v},
      'verify <span class="c b">' + v.verify + '</span> · mine <span class="b">' + v.mine +
      '</span> · unassigned <span class="b">' + v.unassigned + "</span>" + edad +
      ' · running <span class="' + (v.running ? "a" : "v") + ' b">' + v.running + "</span>"));
}

function cajaTickets(t){
  if(t.sin_datos) return caja("my tickets", "", vacio("sin jira_mine.json"));
  var filas = (t.mine || []).map(function(x){
    return it({tipo: "ticket", tema: "awtomic", d: x},
      '<span class="c b">' + esc(x.key) + '</span> <span class="a">' + esc(x.estado) + '</span> ' +
      '<span class="g">' + haceSeg(x.hace_s) + "</span> " + esc(x.titulo));
  });
  if(!filas.length) filas.push(vacio("nada asignado en curso"));
  if(t.total > (t.mine || []).length) filas.push('<span class="g">+' + (t.total - t.mine.length) + " mas</span>");
  if(t.ultimo) filas.push('<span class="g">ultimo</span> <span class="b">' + esc(t.ultimo.key) + '</span> <span class="g">hace ' + haceSeg(t.ultimo.hace_s) + "</span>");
  if(t.cx_total) filas.push('<span class="g">cx sin asignar</span> <span class="m b">' + t.cx_total + '</span> <span class="g">' +
                            esc((t.cx[0] || {}).key || "") + " " + haceSeg((t.cx[0] || {}).hace_s) + "</span>");
  return caja("my tickets", t.cache_s > 1800 ? '<span class="g">cache ' + haceSeg(t.cache_s) + "</span>" : "", filas.join("\n"));
}

function cajaOportunidades(o){
  if(o.error) return caja("opportunities", "", '<span class="r">' + esc(o.error) + "</span>");
  // solo las pendientes: apenas facundo decide una, sale de aca y pasa a la caja `decided`
  var pend = o.pendientes || o.items || [];
  if(!pend.length)
    return caja("opportunities", "", vacio("nada pendiente · se rellena solo") +
      (o.hechas ? ' <span class="g">' + o.hechas + " hechas</span>" : ""));
  var filas = [];
  pend.forEach(function(i){
    var sello = i.valor + "/" + i.esfuerzo + (i.dias ? " " + i.dias + "d" : "");
    filas.push(it({tipo: "oportunidad", tema: "tools", d: i},
               '<span class="' + (i.limbo ? "r" : "a") + ' b">' + i.id + '</span> <span class="g">' +
               sello + "</span> " + esc(i.titulo)));
    (i.opciones || []).forEach(function(op){
      var voto = op.letra === i.voto;
      filas.push("  " + boton(op.letra, "op " + i.id + " " + op.letra, voto ? "voto" : "") +
                 (voto ? '<span class="v">' : '<span class="g">') + esc(op.texto) +
                 (op.tiempo ? " (" + esc(op.tiempo) + ")" : "") + "</span>");
    });
  });
  filas.push('<span class="g">toca una letra para elegir' + (o.hechas ? " · " + o.hechas + " hechas" : "") + "</span>" +
             (o.refill_pausado ? ' <span class="r">refill en pausa</span>' : ""));
  return caja("opportunities", "", filas.join("\n"));
}

// las oportunidades que ya decidio facundo (facundo, 2026-09-11: "cuando una opportunity tiene decision
// mia tiene que salir de ese widget e ir a otro lado"). muestra la letra elegida y como viene la orden.
var ORD_ESTADO = {" ": ["en cola", "g"], ">": ["corriendo", "a"], "x": ["hecha", "v"], "!": ["fallo", "r"]};
function cajaDecididas(o){
  var ds = (o || {}).decididas || [];
  if(!ds.length) return "";
  var filas = ds.map(function(d){
    var e = ORD_ESTADO[d.orden_estado] || (d.estado === "descartada" ? ["descartada", "g"] : ["sin orden", "g"]);
    return it({tipo: "decidida", tema: "tools", d: d},
      '<span class="g b">' + d.id + "</span> " +
      (d.letra ? '<span class="c b">' + esc(d.letra) + "</span> " : "") +
      esc(corto(d.titulo, 60)) + ' <span class="' + e[1] + '">' + e[0] + "</span>" +
      (d.decidida ? ' <span class="g">' + esc(String(d.decidida).slice(5, 16)) + "</span>" : ""));
  });
  return caja("decided", "", filas.join("\n"));
}

function cajaSombra(sb){
  if(sb.error) return caja("backup models", "", '<span class="r">' + esc(sb.error) + "</span>");
  var cols = sb.cols || [], cortos = {principal:"prin", gemini:"gem", groq:"groq", openrouter:"orou", mistral:"mist"};
  var filas = ['<span class="g">' + pad("categoria", 11) + cols.map(function(c){ return pad(cortos[c] || c, 5, true); }).join(" ") +
               " " + pad("veredicto", 9) + "</span>"];
  (sb.cats || []).forEach(function(cat){
    var f = (sb.tabla || {})[cat];
    if(!f) return;
    var celdas = cols.map(function(c){
      var x = f[c];
      if(!x) return '<span class="g">' + pad("-", 5, true) + "</span>";
      if(x.acierto === null || x.acierto === undefined){
        var t = x.sin_clave ? "-" : x.pendientes ? "wait" : "err";
        return '<span class="g">' + pad(t, 5, true) + "</span>";
      }
      var cl = x.acierto >= 80 ? "v" : x.acierto >= 50 ? "a" : "r";
      return '<span class="' + cl + ' b">' + pad(x.acierto + "%", 5, true) + "</span>";
    });
    var v = (sb.veredictos || {})[cat] || {};
    var ver = v.veredicto === "apto" ? '<span class="v b">' + pad("ok " + (cortos[v.proveedor] || v.proveedor || ""), 9) + "</span>"
            : v.veredicto === "no apto" ? '<span class="r b">' + pad("no", 9) + "</span>"
            : '<span class="g">' + pad("pocos", 9) + "</span>";
    filas.push(it({tipo: "catbackup", tema: "tools", d: {cat: cat, fila: f, cols: cols, veredicto: v}},
               pad(cat, 11) + celdas.join(" ") + " " + ver));
  });
  if(filas.length === 1) filas.push(vacio("sin corridas todavia"));
  var hoy = sb.hoy || {}, est = hoy.estados || {};
  if(Object.keys(est).length){
    var clEst = {ok:"v", cuota:"a", pago:"r", roto:"r", "sin clave":"g"};
    var chips = Object.keys(est).map(function(p){
      var e = est[p], c = clEst[e.estado] || "g";
      var lat = e.estado === "ok" && e.latencia !== null ? " " + e.latencia + "s" : "";
      return it({tipo: "modelo", tema: "tools",
                 d: {prov: p, hoy: e, info: (sb.modelos || {})[p] || {}, tabla: sb.tabla || {},
                     cats: sb.cats || [], veredictos: sb.veredictos || {}}},
                '<span class="' + c + ' b">' + esc(cortos[p] || p) + "</span>" +
                '<span class="' + c + '">' + esc(" " + e.estado + lat) + "</span>");
    });
    filas.push('<span class="g">' + pad("hoy", 11) + "</span>" + chips.join('<span class="g"> \u00b7 </span>'));
  }
  filas.push('<span class="g">' + (sb.n || 0) + " corridas · apto = 85%+ &lt;5s 20+" +
             ((sb.faltan || []).length ? " · sin clave: " + sb.faltan.length : "") + "</span>");
  return caja("backup models", "", filas.join("\n"), true);
}

function cajaAvisos(av){
  if(!(av || []).length) return caja("avisos", "", vacio("sin avisos"));
  return caja("avisos", "", av.map(function(l){
    var m = /^(\d{4}-\d\d-\d\d \d\d:\d\d)\s+([\s\S]*)$/.exec(l);
    var t = m ? '<span class="g">' + esc(m[1].slice(5, 16)) + "</span> " + esc(m[2]) : esc(l);
    return it({tipo: "aviso", d: {texto: m ? m[2] : l, fecha: m ? m[1] : null}},
              t.length > 400 ? t.slice(0, 400) + "…" : t);
  }).join("\n"));
}

function cajaPropuestas(pr){
  if(!(pr || []).length) return caja("propuestas", "", vacio("nada esperando un dale"));
  return caja("propuestas", "", pr.map(function(p){
    return it({tipo: "propuesta", tema: p.tema, d: p},
      '<span class="a b">' + p.n + '</span> <span class="g">' + esc(p.tema) + "</span> " +
      esc(String(p.orden).slice(0, 220))) + "\n  " + boton("dale", "dale " + p.n, "dale");
  }).join("\n"));
}

function link(url, texto){
  return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(texto) + "</a>";
}

function cajaPodcast(p){
  var eps = p.episodios || [];
  var btn = '<button class="btn" type="button" data-pod="1">' + (podAbierto ? "cerrar" : "podcast") + "</button>";
  var extra = eps.length ? '<span class="g">' + eps.length + " ep</span>" : "";
  if(!podAbierto) return caja("podcast", extra, btn + '<span class="g">' + (eps.length ? "tocá para ver los links" : "sin episodios") + "</span>");
  var filas = [btn + link(p.web || "#", "la web del podcast")];
  if(!eps.length) filas.push(vacio("sin episodios"));
  eps.forEach(function(e){
    filas.push(it({tipo: "episodio", tema: "tools", d: e},
               '<span class="g">' + esc((e.fecha || "").slice(5)) + "</span> " + esc(e.titulo)));
    filas.push("  " + (e.voces || []).map(function(v){
      return link(v.url, v.voz + (v.min ? " " + v.min + "m" : ""));
    }).join(" · "));
  });
  return caja("podcast", extra, filas.join("\n"));
}

function cajaDj(p){
  // motor `fuzzer/dj`: la cola nocturna de spotify. orden fijo, huecos aleatorios.
  if(!p.plan) return caja("dj", '<span class="g">fuzzer</span>',
    '<span class="g">' + esc(p.texto || "sin plan") + "</span>");
  var extra = '<span class="a b">' + p.hechos + "/" + p.bloques + "</span>";
  var filas = ['<span class="g">noche ' + esc(p.noche) + " · " + p.reproducciones + " reproducciones</span>"];
  if(p.sonando) filas.push('<span class="v b">suena</span> ' + esc(p.sonando));
  else if(p.proximo) filas.push('<span class="g">proximo bloque</span> ' + esc(p.proximo));
  if(!p.listo) filas.push('<span class="r">falta el oauth de spotify (premium)</span>');
  (p.top || []).forEach(function(t){
    filas.push('  <span class="g">' + esc(t.tema) + "</span> " + t.n + "×");
  });
  return caja("dj", extra, filas.join("\n"));
}

function pintarWidgets(d, err){
  if(!d && !widDatos){
    widgetsEl.innerHTML = caja("widgets", "", err ? '<span class="r">' + esc(err) + "</span>" : vacio("cargando..."));
    return;
  }
  if(d) widDatos = d;
  d = widDatos;
  itemsW = {}; itemN = 0;            // los items del repintado anterior ya no existen
  var edad = haceSeg((Date.now() - fecha(d.ts)) / 1000);
  var partes = [
    cajaServer(d.server || {}),
    cajaUsage(d.usage || {}),
    cajaAgente(d.agente || {}),
    cajaVerif(d.verificaciones || {}),
    cajaTickets(d.tickets || {}),
    cajaOportunidades(d.oportunidades || {}),
    cajaDecididas(d.oportunidades || {}),
    cajaSombra(d.sombra || {}),
    cajaPropuestas(d.propuestas || []),
    cajaAvisos(d.avisos || []),
    cajaPodcast(d.podcast || {}),
    cajaDj(d.dj || {}),
    '<div class="caja"><div class="cuerpo g">datos de hace ' + edad +
      (err ? ' · <span class="r">' + esc(err) + "</span>" : "") + "</div></div>"
  ];
  var y = $("panel-widgets").scrollTop;
  widgetsEl.innerHTML = partes.join("");
  $("panel-widgets").scrollTop = y;
  pintarChips();                // los chips `op N X` usan las opciones reales de este json
}

function cargarWidgets(){
  widUlt = Date.now();
  return api("GET", "/repos/" + REPO + "/contents/widgets.json", null, etagWid,
             "application/vnd.github.raw+json").then(function(r){
    if(r.status === 304){ pintarWidgets(null); return; }
    etagWid = r.etag;
    pintarWidgets(r.json);
  });
}

widgetsEl.addEventListener("click", function(e){

function corto(t, n){
  t = String(t === null || t === undefined ? "" : t).replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}
function temaItem(o){
  var t = o.tema || clasificar(String((o.d || {}).texto || (o.d || {}).titulo || "")).tema || "tools";
  t = normTema(t);
  return esTema(t) ? t : "tools";
}
// un mensaje que sale del modal: a la pestaña del tema del item (los crudos no llevan prefijo ni saltan)
function actuar(tema, msg, crudo){
  cerrarModal();
  if(!crudo && esTema(tema) && temaActivo() !== tema) abrirTab(tema);
  mandar(msg, esTema(tema) ? tema : temaActivo(), crudo);
}
// "hablar de esto": deja el chat en la pestaña del tema, con el contexto del item ya escrito
function hablar(o, contexto){
  cerrarModal();
  var tema = temaItem(o);
  if(temaActivo() !== tema) abrirTab(tema);
  ponerCaja("sobre " + contexto + ": ");
  guardarBorrador(temaActivo(), txt.value, true);
  if(window.innerWidth < 900) verPanel(foco === 1 ? "lado" : "chat");
  txt.focus();
}

// ---------- menu contextual (facundo, 2026-09-11) ----------
// tap and hold (~500 ms, sin disparar el scroll ni la seleccion) en el celu y click derecho en desktop:
// sobre un mensaje del chat (responder / copiar / editar / mandar a otra pestaña), sobre una fila de un
// widget (abre el modal a/b/c que ya existe, o copiar) y sobre una pestaña (cerrar / renombrar / al lado
// de los widgets). se cierra con esc, tocando afuera o al scrollear.
var HOLD_MS = 500;      // cuanto hay que mantener el dedo apoyado
var HOLD_PX = 10;       // si se mueve mas que esto, era un scroll: no hay menu
var MENU_MS = 400;      // el click que viene atras del hold no cierra el menu recien abierto
var CITA_LINEAS = 3, CITA_CHARS = 120;
var menuAbierto = null, menuTs = 0, menuNodo = null;

function cerrarMenu(){
  menuAbierto = null;
  $("ctx").classList.add("oculta"); $("ctx").innerHTML = "";
  $("ctxfondo").classList.add("oculta");
  document.body.classList.remove("sinsel");
  if(menuNodo){ menuNodo.classList.remove("marcado"); menuNodo = null; }
}
// `opciones` es [texto, funcion]. (x, y) es donde se toco: el menu se acomoda para no salirse.
function menu(x, y, titulo, opciones, nodo){
  cerrarMenu();
  var d = $("ctx");
  if(titulo){
    var t = document.createElement("div");
    t.className = "ctit"; t.textContent = titulo;
    d.appendChild(t);
  }
  opciones.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[0];
    b.addEventListener("click", function(){ cerrarMenu(); o[1](); });
    d.appendChild(b);
  });
  menuAbierto = {titulo: titulo || "", opciones: opciones.map(function(o){ return o[0]; })};
  menuTs = Date.now();
  d.classList.remove("oculta");
  $("ctxfondo").classList.remove("oculta");
  document.body.classList.add("sinsel");
  d.style.left = "0px"; d.style.top = "0px";
  var r = d.getBoundingClientRect();
  d.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + "px";
  d.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + "px";
  if(nodo && nodo.classList){ nodo.classList.add("marcado"); menuNodo = nodo; }
  return true;
}
// el gesto, delegado en el contenedor (los mensajes se repintan enteros en cada render).
// `pedir(target, x, y)` devuelve true si abrio un menu.
function gestos(el, pedir){
  if(!el) return;
  el.addEventListener("contextmenu", function(e){
    if(pedir(e.target, e.clientX, e.clientY)) e.preventDefault();
  });
  var t = null, x0 = 0, y0 = 0, blanco = null;
  function cancelar(){ if(t){ clearTimeout(t); t = null; } }
  el.addEventListener("touchstart", function(e){
    cancelar();
    if(e.touches.length !== 1) return;
    blanco = e.target; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t = setTimeout(function(){
      t = null;
      if(pedir(blanco, x0, y0)){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){} }
    }, HOLD_MS);
  }, {passive: true});
  el.addEventListener("touchmove", function(e){
    var p = e.touches[0];
    if(!t || !p) return;
    if(Math.abs(p.clientX - x0) > HOLD_PX || Math.abs(p.clientY - y0) > HOLD_PX) cancelar();
  }, {passive: true});
  ["touchend", "touchcancel"].forEach(function(ev){ el.addEventListener(ev, cancelar, {passive: true}); });
}

function copiarViejo(texto, listo){
  var a = document.createElement("textarea");
  a.value = texto; a.style.position = "fixed"; a.style.top = "-1000px"; a.style.opacity = "0";
  document.body.appendChild(a); a.focus(); a.select();
  var pudo = false;
  try{ pudo = document.execCommand("copy"); }catch(x){}
  document.body.removeChild(a);
  if(pudo) listo(); else sistema("no pude copiar", "error");
}

    x = x.replace(/\s+/g, " ").trim();
    if(x.length > CITA_CHARS) x = x.slice(0, CITA_CHARS - 1) + "…";

// arrastrar una pestaña (estilo vscode, facundo 2026-09-11: ya no hay boton de split).
// pointer events, asi anda igual con mouse y con dedo: soltarla sobre la zona resaltada la manda
// al lado de los widgets, soltarla sobre la barra la devuelve al panel de chat.
(function(){
  var barra = $("tabs"), est = null;
  var UMBRAL_MOUSE = 6, UMBRAL_TOUCH = 12, HOLD = 400;   // px y ms para que arranque el arrastre
  // la zona de drop tapa todo lo que esta a la derecha del chat (widgets + panel de al lado).
  // en el celu hay una vista a la vez y el panel de widgets puede no estar en pantalla: ahi la
  // zona es una franja sobre el borde derecho.
  function rectZona(){
    var cuerpo = $("cuerpo").getBoundingClientRect();
    if(!cuerpo.width || !cuerpo.height) return null;
    if(anchoDesktop()){
      var chat = $("panel-chat").getBoundingClientRect();
      var izq = Math.max(chat.right, cuerpo.left + cuerpo.width * 0.35);
      return {left: izq, top: cuerpo.top, width: Math.max(60, cuerpo.right - izq), height: cuerpo.height};
    }
    var ancho = Math.max(90, cuerpo.width * 0.42);
    return {left: cuerpo.right - ancho, top: cuerpo.top, width: ancho, height: cuerpo.height};
  }
  function mostrarZona(si){
    var z = $("zona-drop");
    if(!si){ z.classList.add("oculta"); z.classList.remove("activa"); return; }
    var r = rectZona();
    if(!r){ z.classList.add("oculta"); return; }
    z.style.left = Math.round(r.left) + "px"; z.style.top = Math.round(r.top) + "px";
    z.style.width = Math.round(r.width) + "px"; z.style.height = Math.round(r.height) + "px";
    z.classList.remove("oculta");
  }
  function dentro(r, x, y){ return !!r && x >= r.left && x <= r.left + r.width && y >= r.top && y <= r.top + r.height; }
  function sobreBarra(x, y){
    var r = barra.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }
  function limpiar(){
    if(!est) return;
    clearTimeout(est.timer);
    if(est.el) est.el.classList.remove("arrastrando");
    try{ if(est.activa) est.el.releasePointerCapture(est.id); }catch(x){}
    if(est.fantasma && est.fantasma.parentNode) est.fantasma.parentNode.removeChild(est.fantasma);
    mostrarZona(false);
    barra.classList.remove("soltar");
    document.body.classList.remove("arrastrando-tab");
    est = null;
  }
  function arrancar(){
    if(!est || est.activa) return;
    est.activa = true;
    clearTimeout(est.timer);
    est.el.classList.add("arrastrando");
    document.body.classList.add("arrastrando-tab");
    try{ est.el.setPointerCapture(est.id); }catch(x){}
    var f = document.createElement("div");
    f.id = "fantasma-tab"; f.textContent = ETIQUETA[est.tema] || est.tema;
    document.body.appendChild(f);
    est.fantasma = f;
    mostrarZona(true);
    pintarDestino(est.x, est.y);
  }
  function pintarDestino(x, y){
    if(!est || !est.activa) return;
    if(est.fantasma){ est.fantasma.style.left = x + "px"; est.fantasma.style.top = y + "px"; }
    var enZona = dentro(rectZona(), x, y);
    $("zona-drop").classList.toggle("activa", enZona);
    barra.classList.toggle("soltar", !enZona && sobreBarra(x, y));
  }
  // soltar: la zona la manda al lado de los widgets; la barra la devuelve al panel de chat
  function soltarEn(x, y){
    var tema = est.tema;
    if(dentro(rectZona(), x, y)){ limpiar(); splitCon(tema); return; }
    if(sobreBarra(x, y)){
      limpiar();
      if(paneles.length === 2 && paneles[1] === tema) unPanel();
      focoEn(0); abrirTab(tema);
      if(window.innerWidth < 900) verPanel("chat");
      return;
    }
    limpiar();
  }
  barra.addEventListener("pointerdown", function(e){
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest("[data-cerrar]") || e.target.closest("[data-accion]")) return;
    var t = e.target.closest("[data-tema]");
    if(!t) return;
    limpiar();
    est = {tema: t.dataset.tema, el: t, id: e.pointerId, x0: e.clientX, y0: e.clientY,
           x: e.clientX, y: e.clientY, tactil: e.pointerType !== "mouse", activa: false, timer: 0};
    est.timer = setTimeout(arrancar, HOLD);        // mantener apretado tambien arranca el arrastre
  });
  document.addEventListener("pointermove", function(e){
    if(!est || e.pointerId !== est.id) return;
    est.x = e.clientX; est.y = e.clientY;
    var dx = e.clientX - est.x0, dy = e.clientY - est.y0;
    if(est.activa){ pintarDestino(e.clientX, e.clientY); e.preventDefault(); return; }
    if(!est.tactil){
      if(Math.abs(dx) > UMBRAL_MOUSE || Math.abs(dy) > UMBRAL_MOUSE) arrancar();
      return;
    }
    // con el dedo: el movimiento vertical arranca el arrastre (el horizontal scrollea la barra)
    if(Math.abs(dy) > UMBRAL_TOUCH && Math.abs(dy) > Math.abs(dx)){ arrancar(); e.preventDefault(); return; }
    if(Math.abs(dx) > UMBRAL_TOUCH) limpiar();     // se fue a scrollear: no era un arrastre
  });
  document.addEventListener("pointerup", function(e){
    if(!est || e.pointerId !== est.id) return;
    if(!est.activa){ limpiar(); return; }          // fue un click: lo atiende el handler de click
    e.preventDefault();
    ultArrastre = Date.now();
    soltarEn(e.clientX, e.clientY);
  });
  document.addEventListener("pointercancel", function(e){
    if(est && e.pointerId === est.id) limpiar();
  });
  // el click de cierre del gesto no tiene que abrir la pestaña de nuevo
  var ultArrastre = 0;
  barra.addEventListener("click", function(e){
    if(Date.now() - ultArrastre < 400){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  window.addEventListener("blur", limpiar);
  window.addEventListener("resize", function(){ if(est && est.activa) mostrarZona(true); });
  // ganchos para la prueba sin mouse de verdad
  window.__arrastre = {
    rectZona: rectZona,
    estado: function(){
      return est ? {tema: est.tema, activa: est.activa,
                    zona: $("zona-drop").classList.contains("activa"),
                    barra: barra.classList.contains("soltar")} : null;
    }
  };
})();

// login por clave (provisorio): clave.json trae el token cifrado (PBKDF2 + AES-GCM, lo publica recetas/web_clave.sh)
function b64a(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function entrarConClave(){
  var c = $("clave").value;
  if(!c) return;
  $("login-err").textContent = "descifrando...";
  fetch("clave.json?v=" + Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no hay clave.json publicado (correr recetas/web_clave.sh)");
    return r.json();
  }).then(function(j){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64a(j.salt), iterations:j.it||300000, hash:"SHA-256"}, base,
                                     {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64a(j.iv)}, key, b64a(j.ct));
    });
  }).then(function(buf){
    $("clave").value = "";
    arrancar(new TextDecoder().decode(buf).trim());
  }).catch(function(e){
    $("login-err").textContent = (e && /decrypt|operation/i.test(e.message)) ? "clave incorrecta" : ("error: " + e.message);
  });
}

  stubFoto: function(f){ fotoStub = f || null; },
  tocarCamara: function(){ $("camara").click(); },
  fotoTope: FOTO_TOPE,
  // audios: `prueba_web_audio` graba sin microfono (manda el blob a mano) y chequea los [▶]
  mandarAudio: mandarAudio, nombreAudio: nombreAudio, extAudio: extAudio, mimeAudio: mimeAudio,
  conAudios: conAudios, reproductor: reproductor, audioTope: AUDIO_TOPE, audioMinMs: AUDIO_MIN_MS,
  empezarGrabacion: empezarGrabacion, terminarGrabacion: terminarGrabacion,
  grabando: function(){ return {grabando: !!grabador, micro: !!stream,
                                marcado: $("grabar").classList.contains("grabando"),
                                reloj: $("grabinfo").textContent}; },
  plays: function(){        // los [▶] que hay pintados ahora, con de donde sale cada uno
    return [].map.call(document.querySelectorAll(".play"), function(b){
      return {src: b.dataset.src, donde: b.parentNode.className.indexOf("aud") >= 0 ? "cuerpo" : "cabecera"};
    });
  },
  stubAudioUrl: function(src, url){ if(url) audioUrls[src] = url; else delete audioUrls[src]; },
  gapInput: function(){          // px entre el borde de abajo del input y el borde de abajo del pie
    var f = $("fila").getBoundingClientRect(), p = $("pie").getBoundingClientRect();
    return Math.round(p.bottom - f.bottom);
  },
  teclado: function(on){         // simula el teclado del celu (visualViewport no se puede falsear)
    document.body.classList.toggle("teclado", !!on);
  },
  // envio idempotente: dos enter rapidos no mandan dos veces (prueba_web_tabs lo chequea)
  envios: function(){ return {enviando: enviando, ultimo: ultimoTexto, repeMs: REPE_MS}; },
  stubApi: function(f){ apiStub = f || null; },
  normTema: normTema, padreTema: padreTema,
  resaltar: resaltar, pintarWidgets: pintarWidgets,
  // modal de items de widget: `recetas/prueba_web_tabs` lo abre y lee lo que quedo pintado
  abrirModal: abrirModal, cerrarModal: cerrarModal, modalDe: modalDe,
  items: function(){ return itemsW; },
  modalInfo: function(){
    if(!modalAbierto) return null;
    return {titulo: $("mtitulo").textContent, cuerpo: $("mcuerpo").textContent, tema: modalAbierto.tema,
            acciones: [].map.call($("macc").querySelectorAll("button"), function(b){ return b.textContent; })};
  },
  // menu contextual: `recetas/prueba_web_tabs` pide el menu sobre un mensaje y lee lo que quedo
  menu: menu, cerrarMenu: cerrarMenu, citaDe: citaDe, holdMs: HOLD_MS,
  menuInfo: function(){
    if(!menuAbierto) return null;
    return {titulo: $("ctx").querySelector(".ctit") ? $("ctx").querySelector(".ctit").textContent : "",
            opciones: [].map.call($("ctx").querySelectorAll("button"), function(b){ return b.textContent; }),
            visible: !$("ctx").classList.contains("oculta"),
            dentro: (function(){ var r = $("ctx").getBoundingClientRect();
                                 return r.left >= 0 && r.top >= 0 &&
                                        r.right <= window.innerWidth && r.bottom <= window.innerHeight; })()};
  },
  // dispara el gesto como lo haria el click derecho (el hold del celu termina en lo mismo)
  menuEn: function(sel, n){
    var ns = document.querySelectorAll(sel);
    var nodo = ns[n || 0];
    if(!nodo) return false;
    var r = nodo.getBoundingClientRect();
    nodo.dispatchEvent(new MouseEvent("contextmenu", {bubbles: true, cancelable: true,
                                                      clientX: Math.round(r.left + 5),
                                                      clientY: Math.round(r.top + 5)}));
    return !!menuAbierto;
  },
  tocarMenu: function(texto){
    var bs = $("ctx").querySelectorAll("button");
    for(var i = 0; i < bs.length; i++)
      if((bs[i].textContent || "").indexOf(texto) >= 0){ bs[i].click(); return true; }
    return false;
  },
  tocarItem: function(sel){          // click sobre la n-esima fila tocable de los widgets
    var ns = document.querySelectorAll("#widgets [data-it]");
    if(typeof sel === "number") return ns[sel] ? (ns[sel].click(), true) : false;
    for(var i = 0; i < ns.length; i++)
      if((ns[i].textContent || "").indexOf(sel) >= 0){ ns[i].click(); return true; }
    return false;
  },
  cargar: function(coms){
    msgsCom = []; vistos = {};
    coms.forEach(function(c){ agregar(c, false); });
    mezclar(); render();
    return msgs.map(function(m){ return {id: m.id, tema: m.tema, texto: m.texto}; });
  },
  // historial por tema: lo que publica el daemon en `chat/<tema>.json`
  cargarChat: cargarChat, cargarChatTema: cargarChatTema, recibirChat: recibirChat, render: render,
  temasACargar: temasACargar, archivoChat: archivoChat, mezclar: mezclar, claveMsg: claveMsg,
  hist: function(t){ return (msgsHist[normTema(t)] || []).map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso, audio: m.audio || null}; }); },
  charla: function(){ return msgs.map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso}; }); },
  chatIndex: function(){ return chatIndex; },
  limpiarChat: function(){ msgsHist = {}; msgsCom = []; chatIndex = null; etagChat = {};
                           msgs = []; render(); },
  enPanel: function(j){
    var l = listaDe(j);
    return l ? l.querySelectorAll(".msg").length : -1;
  }
};

})();
</script>
</body>
</html>
