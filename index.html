// mientras el micro esta abierto (`grabando`) o el m4a viaja (`subiendo`) se avisa al endpoint de la lan y se
// renueva cada OCUPADO_RENUEVA ms: si el navegador se cierra, el flag vence solo en el server (nunca frena mas
// que su tope). sin endpoint lan (solo buzon) no hay por donde avisar: el reinicio no espera.
var OCUPADO_RENUEVA = 10000, ocupadoTimers = {};
function pingOcupado(que, on){
  if(!lan.base || (!token && !lanStub)) return Promise.resolve(false);
  return lanFetch(lan.base + "/ping?ocupado=" + encodeURIComponent(que) + "&on=" + (on ? "1" : "0"),
                  {headers: {"authorization": "Bearer " + token}, cache: "no-store", keepalive: true})
    .then(function(r){ return !!(r && r.ok); }, function(){ return false; });
}
function marcarOcupado(que, on){
  if(ocupadoTimers[que]){ clearInterval(ocupadoTimers[que]); delete ocupadoTimers[que]; }
  if(on) ocupadoTimers[que] = setInterval(function(){ pingOcupado(que, true); }, OCUPADO_RENUEVA);
  if(on && !lan.base) return probarLan().then(function(){ return pingOcupado(que, true); });
  return pingOcupado(que, on);
}

function lanRuta(metodo, ruta){
  var pre = "/repos/" + REPO + "/";
  if(ruta.indexOf(pre) !== 0) return false;
  var resto = ruta.slice(pre.length);
  if(metodo === "GET") return /^(contents\/|issues\/\d+(\/comments)?(\?|$))/.test(resto);
  return metodo === "POST" && resto === "issues/" + ISSUE + "/comments";
}
function lidNuevo(){ return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function apiLan(metodo, ruta, cuerpo, etag, accept){
  var h = {"authorization": "Bearer " + token, "accept": accept || "application/vnd.github+json"};
  var url = lan.base + ruta, opts = {method: metodo, headers: h, cache: "no-store"}, lid = null;
  function caido(motivo){ var e = new Error("lan: " + motivo); e.lanCaido = true; e.lid = lid; return e; }
  if(metodo === "POST"){
    lid = lidNuevo();
    url = lan.base + "/msg";
    h["content-type"] = "application/json";
    opts.body = JSON.stringify({body: cuerpo.body, lid: lid});
  }
  if(etag) h["if-none-match"] = etag;
  return lanFetch(url, opts).then(function(r){
    if(r.status === 304) return {status: 304};
    // modo minimo (orden 1096): el server vive pero github no contesta. no es la lan caida: "nada nuevo" y se
    // sigue por el endpoint (widgets, charla y envio no dependen de github)
    if(r.status === 503 && r.headers && r.headers.get && r.headers.get("x-claudio-sin-github")){
      if(!lan.sinGithub){ lan.sinGithub = true; pintarVia(); }
      return {status: 304, sinGithub: true};
    }
    if(lan.sinGithub && r.ok && metodo === "GET" && /\/issues\//.test(ruta)){ lan.sinGithub = false; pintarVia(); }
    if(!r.ok) throw caido("http " + r.status);
    return r.json().then(function(j){
      if(lid && j && j.lid) lanMsgs[j.lid] = true;
      return {status: r.status, json: j, etag: r.headers && r.headers.get ? r.headers.get("etag") : null};
    });
  }, function(e){ throw caido((e && e.message) || "sin respuesta"); });
}
// bytes de `img/...` o `audio/...`: del endpoint si esta, si no (o si no lo tiene) del buzon
function bajarBlob(repo){
  function github(){
    if(!token) return Promise.reject(new Error("401"));
    var ruta = API + "/repos/" + REPO + "/contents/" + repo.split("/").map(encodeURIComponent).join("/");
    return fetch(ruta, {headers: {"authorization": "Bearer " + token, "accept": "application/vnd.github.raw"}})
      .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.blob(); });
  }
  if(!lan.base || !/^(img|audio)\//.test(repo)) return github();
  return lanFetch(lan.base + "/" + repo.split("/").map(encodeURIComponent).join("/"),
                  {headers: {"authorization": "Bearer " + token}, cache: "no-store"})
    .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.blob(); })
    .catch(function(){ return github(); });
}

// `recetas/prueba_web_tabs` enchufa aca un POST falso para probar el envio sin tocar github.
// en produccion es null y esta linea no hace nada.
var apiStub = null;
function api(metodo, ruta, cuerpo, etag, accept){
  if(lan.base && lanRuta(metodo, ruta)){
    return apiLan(metodo, ruta, cuerpo, etag, accept).catch(function(e){
      if(!e || !e.lanCaido) throw e;
      lanPoner(null);                                     // respaldo: el buzon, en el acto y sin perder el mensaje
      // si el endpoint alcanzo a atenderlo, el daemon ve el mismo lid y no lo contesta dos veces
      if(e.lid && cuerpo && cuerpo.body) cuerpo = {body: cuerpo.body + "\n<!--lan:" + e.lid + "-->"};
      return api(metodo, ruta, cuerpo, null, accept);
    });
  }
  if(apiStub) return apiStub(metodo, ruta, cuerpo, etag, accept);
  if(!token) return Promise.reject(new Error("401"));
  if(Date.now() < frenoHasta && metodo === "GET"){
    return Promise.reject(new Error("freno"));   // el poll no insiste; mandar un mensaje si
  }
  var h = {
    "authorization": "Bearer " + token,
    "accept": accept || "application/vnd.github+json"
  };
  if(cuerpo) h["content-type"] = "application/json";
  if(etag) h["if-none-match"] = etag;
  return fetch(API + ruta, {
    method: metodo, headers: h,
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    cache: "no-store"
  }).then(function(r){
    if(r.status === 304) return {status:304};
    if(r.status === 401 || r.status === 403 || r.status === 429){
      return r.json().catch(function(){ return {}; }).then(function(j){
        var msg = (j && j.message) || ("http " + r.status);
        if(r.status === 401){
          pedirToken("token rechazado por github (401): " + msg);
          throw new Error("401");
        }
        // 403 puede ser rate limit (frena) o falta de permisos (el token no sirve para este repo)
        var lim = limiteGithub(r.status, r.headers, msg);
        if(lim){
          frenar(lim.seg + 5, r.status + " " + (lim.secundario ? "límite secundario" : "sin cuota"),
                 metodo === "POST" && /\/comments$/.test(ruta));
          throw new Error("freno");
        }
        pedirToken("el token no tiene permiso sobre " + REPO + " (403): " + msg);
        throw new Error("401");
      });
    }
    if(!r.ok){
      return r.json().catch(function(){ return {}; }).then(function(j){
        throw new Error("http " + r.status + ((j && j.message) ? " " + j.message : ""));
      });
    }
    return r.json().then(function(j){ return {status:r.status, json:j, etag:r.headers.get("etag")}; });
  });
}

// ---------- estado (body del issue) ----------
// el header ya no pinta nada del daemon (facundo, 2026-09-11): vivo/caido esta en el widget `agent`.
// esto solo deja el boton pausa/segui al dia.
function pintarEstado(body){
  var m = body && body.match(/```json\s*([\s\S]*?)```/);
  if(!m) return;
  var e;
  try{ e = JSON.parse(m[1]); }catch(x){ return; }
  enPausa = !!e.pausa;
  // el boton de pausa vive en el widget `agent` (la fila `#rapidos` se saco, 2026-09-11)
  var bp = $("btn-pausa");
  if(bp){ bp.textContent = enPausa ? "segui" : "pausa"; bp.dataset.cmd = enPausa ? "segui" : "pausa"; }
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------- carga ----------
function cargarEstado(){
  return api("GET", "/repos/" + REPO + "/issues/" + ISSUE, null, etagIssue).then(function(r){
    if(r.status === 304) return;
    etagIssue = r.etag;
    pintarEstado(r.json.body || "");
  });
}

function ruta(desdeIso){
  return "/repos/" + REPO + "/issues/" + ISSUE + "/comments?per_page=100&since=" + desdeIso;
}
// el daemon contesta con `[tema] ...` adelante (con_tag_tema): ese tag manda la respuesta a su
// pestaña y no se muestra como texto (ya lo dice la pestaña). los comandos cortos (status, cola,
// op N X) contestan sin tag: caen en la pestaña del mensaje anterior, que es desde donde salieron.
function agregar(c, arriba){
  vistos[c.id] = true;
  var b = (c.body || "").replace(RE_LAN_MARCA, ""), m;
  if(b.indexOf(MARCA) === 0){
    // `<!--nodo:cloud modelo:fable dur:12 cuello:modelo-->` va al header, no al cuerpo
    var lm = leerMeta(b.slice(MARCA.length).replace(/^\n/, "")), mm = lm.meta;
    var cuerpo = lm.cuerpo, mt = /^\[([\w\/-]+)\]\s*/.exec(cuerpo), tag = null;
    // 1237: los `aviso: ...` que el daemon viejo comentaba en el buzon no se pintan: van a la campanita
    if(/^aviso: /.test(cuerpo)) return null;
    if(mt && esTema(mt[1])){ tag = normTema(mt[1]); cuerpo = cuerpo.slice(mt[0].length); }
    m = {id: c.id, clase: "agente", quien: QUIEN_AGENTE, texto: cuerpo, iso: c.created_at, tag: tag,
         nodo: mm.nodo || null, modelo: mm.modelo ? modeloCorto(mm.modelo) : null,
         duracion_s: mm.dur !== undefined ? mm.dur : null, cuello: mm.cuello || null};
  }else{
    var sd = sacarDesde(b), se = sacarEnviado(sd.texto), tg = null, texto = se.texto;
    var mp = RE_TEMA.exec(texto);
    if(mp && esTema(mp[1])){ tg = normTema(mp[1]); texto = texto.slice(mp[0].length); }
    // la hora de ENVIO manda sobre la que le puso github al comentario (1191): un audio se postea
    // recien cuando termino de subir, asi que `created_at` llega tarde
    m = {id: c.id, clase: "yo", quien: QUIEN_F, texto: texto,
         iso: se.enviado ? new Date(se.enviado).toISOString() : c.created_at, tag: tg,
         desde: sd.desde, disp: dispDe(sd.desde) || null, modo: modoDe(sd.desde) || null};
  }
  if(arriba) msgsCom.unshift(m); else msgsCom.push(m);
  return m;
}

// poll: pide solo desde el ultimo comentario que ya tengo. la url se queda quieta mientras no
// pasa nada, asi que el etag devuelve 304 y no gasta rate limit.
function cargarComentarios(reemplazar){
  if(reemplazar){ ultimoIso = null; }
  var ventana = new Date(Date.now() - horas * 3600 * 1000).toISOString();
  var desdeIso = (!reemplazar && ultimoIso) ? ultimoIso : ventana;
  return api("GET", ruta(desdeIso), null, reemplazar ? null : etagCom).then(function(r){
    if(r.status === 304) return;
    if(!reemplazar) etagCom = r.etag;
    var cs = r.json || [];
    if(reemplazar){ msgsCom = []; vistos = {}; lanMsgs = {}; }
    var pego = seguirAlFinal() || reemplazar;
    var nuevos = 0;
    cs.sort(function(a, b){ return a.id - b.id; }).forEach(function(c){
      if(vistos[c.id]) return;
      var ld = RE_LAN_MARCA.exec(c.body || "");
      if(ld && lanMsgs[ld[1]]){ vistos[c.id] = true; ultimoIso = c.created_at; return; }   // ya se pinto al salir por la lan
      agregar(c, false);
      ultimoIso = c.created_at;
      nuevos++;
    });
    if(nuevos) etagCom = null;  // la url del proximo poll cambia (since nuevo)
    // el tema de cada mensaje depende del anterior, asi que se recalcula la charla entera y se
    // reparte de nuevo entre las pestañas (es una pasada por un par de cientos de mensajes)
    if(nuevos || reemplazar){ mezclar(); render(); }
    // un mensaje nuevo siempre se lee entero y al fondo, aunque estuvieras mirando mas arriba
    if(pego || nuevos) alFinal();
  });
}


// ---------- historial por tema, completo, desde el buzon (facundo, 2026-09-11) ----------
// "cada vez que prendo el celu lo primero que veo es una conversacion re vieja": la web armaba el
// historial con los comentarios de las ultimas N horas y despues los repartia entre pestañas, asi que
// una pestaña con poca actividad reciente (`server`) abria vacia. ahora el daemon publica en el buzon
// `chat/<tema>.json` con TODA la charla de ese tema (`logs/chat-<tema>.jsonl`) y `chat/index.json`
// con `{tema: {ts, n}}`; cada pestaña baja la suya de una sola pasada, sin "cargar mas viejo".
var CHAT_INDEX = "chat/index.json";
var chatUlt = 0;           // ultima bajada del historial por el tick (el sync al abrir lo resetea)
var chatIndex = null;      // {tema: {ts, n}}
var etagChat = {};         // etag por archivo del buzon
function archivoChat(tema){ return "chat/" + normTema(tema).replace(/\//g, "-") + ".json"; }
function crudo(ruta, etag){
  return api("GET", "/repos/" + REPO + "/contents/" + ruta, null, etag,
             "application/vnd.github.raw+json");
}
// el archivo de un tema convertido en mensajes: cada fila del log es pregunta + respuesta completa.
var chatCambio = false;    // `recibirChat` la prende: el tick solo repinta si de verdad llego algo
function recibirChat(tema, d){
  chatCambio = true;
  var t = normTema(tema), filas = ((d && d.filas) || []).slice(), out = [], resp = {};
  // por la hora de ENVIO (1191): el daemon ya las publica ordenadas asi, esto cubre los archivos viejos
  filas.sort(function(a, b){ return fecha(a.ts) - fecha(b.ts); });
  filas.forEach(function(f, i){
    var base = t + "-" + i;
    // `(aviso de claudio)`, `(tarea 12: ...)`, `(menu de claudio)`: filas que escribe el agente solo, no son de f
    // 1237: el fin de tarea ahora dice `(tarea <nombre>: ...)` y trae `fuente: tarea`; la linea queda en el jsonl
    // como contexto del chat pero no se pinta como mensaje de f
    var propia = f.fuente === "tarea" || f.fuente === "menu" ||
        /^\((aviso de [fc]laudio|menu de [fc]laudio|turno nocturno|tarea [^:()\s]+:)/.test(String(f.pregunta || ""));
    if(f.pregunta && !propia) out.push({id: "h:" + base + ":q", clase: "yo", quien: QUIEN_F, texto: f.pregunta,
                             iso: f.ts, tema: t, explicito: true, disp: dispDe(f.desde) || null,
                             modo: modoDe(f.desde) || null});
    var r = String(f.respuesta || ""), mt = /^\s*\[([\w\/-]+)\]\s*/.exec(r);
    if(/^aviso: /.test(r)) return;   // 1237: los avisos van solo a la campanita, nunca al chat
    if(mt && esTema(mt[1])) r = r.slice(mt[0].length);   // el `[tema]` ya lo dice la pestaña
    var lm = leerMeta(r), nodo = f.nodo || lm.meta.nodo || null;   // el `[cloud]` viejo sale del cuerpo
    r = lm.cuerpo;
    // un mensaje partido en dos temas tuvo UNA sola respuesta: no se pinta dos veces
    var k = f.ts + "|" + r.slice(0, 80);
    if(r && !resp[k]){
      resp[k] = true;
      // nodo, modelo y mini estado solo en las filas que los traen (las viejas no tienen `nodo`: no se pinta nada)
      // la respuesta se pinta con la hora en que se escribio (`ts_llegada`); la pregunta, con la de envio
      out.push({id: "h:" + base + ":r", clase: "agente", quien: QUIEN_AGENTE, texto: r, iso: f.ts_llegada || f.ts,
                clave: "r:" + t + "|" + (f.ts_llegada || f.ts || "") + "|" + hashTexto(r),   // 1211: no por posicion
                tema: t, explicito: true, tag: t, audio: f.audio || null, nodo: nodo, tarea: f.tarea || null,
                modelo: f.nodo && f.modelo ? modeloCorto(f.modelo) : null,
                duracion_s: f.duracion_s !== undefined ? f.duracion_s : null, cuello: f.cuello || null,
                opciones: f.opciones || null});
    }
  });
  msgsHist[t] = out;
  if(notiPush) setTimeout(refrescarNotiPush, 0);   // 1350: llego la fila de la tarea del modal abierto
  return out.length;
}
function cargarChatTema(tema){
  var arch = archivoChat(tema), t = normTema(tema);
  return crudo(arch, etagChat[arch]).then(function(r){
    if(r.status === 304) return (msgsHist[t] || []).length;
    etagChat[arch] = r.etag;
    return recibirChat(t, r.json);
  }).catch(function(e){
    var m = (e && e.message) || "";
    if(/http 404/.test(m)){ msgsHist[t] = msgsHist[t] || []; return 0; }   // tema sin charla todavia
    if(m === "401" || m === "freno") return 0;
    throw e;
  });
}
function cargarChatIndex(){
  return crudo(CHAT_INDEX, etagChat[CHAT_INDEX]).then(function(r){
    if(r.status === 304) return chatIndex;
    etagChat[CHAT_INDEX] = r.etag;
    chatIndex = (r.json && r.json.temas) || {};
    return chatIndex;
  }).catch(function(e){
    var m = (e && e.message) || "";
    if(/http 404/.test(m) || m === "401" || m === "freno"){ chatIndex = chatIndex || {}; return chatIndex; }
    throw e;
  });
}
// que charlas hacen falta: la de la pestaña activa primero, las de las demas pestañas abiertas, y si esta
// abierta la general (`auto`), todas las del indice: la general junta lo que no tiene pestaña propia.
function temasACargar(){
  var out = [];
  function sumar(t){ t = normTema(t); if(t && t !== AUTO && out.indexOf(t) < 0) out.push(t); }
  sumar(temaActivo());
  if(tabs.indexOf(AUTO) >= 0) Object.keys(chatIndex || {}).forEach(sumar);
  // lo que el daemon publica en la general misma (el menu a/b/c al volver, 1117) viene en `chat/auto.json`
  if(tabs.indexOf(AUTO) >= 0 && chatIndex && chatIndex[AUTO] && out.indexOf(AUTO) < 0) out.push(AUTO);
  tabs.forEach(sumar);
  return out;
}
function cargarChat(){
  return cargarChatIndex().then(function(){
    return Promise.all(temasACargar().map(cargarChatTema));
  }).then(function(ns){
    return (ns || []).reduce(function(a, b){ return a + (b || 0); }, 0);
  });
}
// abrir una pestaña que nunca se bajo: su charla llega sola, sin esperar al proximo sync
function chatDeTab(tema){
  var t = normTema(tema);
  if(!token || t === AUTO || msgsHist[t]) return Promise.resolve(0);
  return cargarChatTema(t).then(function(n){
    if(n){ mezclar(); render(); irDonde(); }
    return n;
  }).catch(function(){ return 0; });
}

function tick(){
  if(Date.now() - lan.ult > LAN_CADA) probarLan();   // lan primero: cada 60 s se vuelve a probar el endpoint
  vaciarSalida();   // lo que github freno sale solo apenas levanta el freno
  Promise.all([cargarEstado(), cargarComentarios(false)])
    .catch(function(e){ if(ruidoso(e)) sistema("error: " + e.message, "error"); });
  // los widgets y las pestañas van a 30 s a la vista y 120 s en background (facundo, 2026-09-13):
  // el daemon publica `widgets.json` cada 60 s (`widgets_web`), pedir cada 10 s traia el mismo archivo.
  // al abrir o volver al foco se sincroniza aparte, asi que el celu no ve datos viejos por esto.
  var cada = document.hidden ? 120000 : 30000;
  if(Date.now() - widUlt > cada){
    cargarWidgets().catch(function(e){ if(ruidoso(e)) pintarWidgets(null, e.message); });
  }
  // las pestañas van al mismo ritmo: si las cambiaste en el celu, el desktop las ve en <= 30 s
  if(tabsSync && Date.now() - tabsUlt > cada){
    cargarTabs().catch(function(e){ if(ruidoso(e)) sistema("pestañas: " + e.message, "error"); });
  }
  // y el historial tambien: el daemon republica `chat/<tema>.json` cuando termina de renderizar el
  // audio de una respuesta, asi que el `[▶]` aparece a los pocos segundos sin volver al foco.
  // con etag esto es un 304 y no gasta rate limit; solo repinta si `recibirChat` trajo algo.
  if(token && Date.now() - chatUlt > cada){
    chatUlt = Date.now();
    chatCambio = false;
    cargarChat().then(function(){
      if(!chatCambio) return;
      var pego = seguirAlFinal();
      mezclar(); render();
      if(pego) alFinal(); else restaurarVistas();
    }).catch(function(e){ if(ruidoso(e)) sistema("chat: " + e.message, "error"); });
  }
}

// ---------- sincronizacion al abrir y al volver al foco (facundo, 2026-09-11) ----------
// "cuando vuelvo a la interfaz desde el telefono se ven cosas re viejas y va actualizando": el cache
// de localStorage se pintaba como si fuera el estado real. ahora, al abrir la web o al recuperar el
// foco, se baja **todo el buzon en paralelo** (chat, `widgets.json`, `tabs.json`) y hasta que llega se
// ve `sincronizando…` con lo cacheado apagado. si github no contesta, el cartel lo dice y la cache
// queda como lo que es: modo offline.
var sincronizando = false, syncUlt = 0, syncEnVuelo = null;
function pintarSync(estado, texto){
  var n = $("sync");
  if(!n) return;
  sincronizando = estado === "sync";
  document.body.classList.toggle("sincronizando", sincronizando);
  n.classList.toggle("oculta", !estado);
  n.classList.toggle("off", estado === "off");
  if(estado) n.textContent = texto || "sincronizando…";
}
// una sola sincronizacion a la vez; las que llegan encima se cuelgan de la que ya esta en vuelo
function sincronizar(primera){
  if(!token) return Promise.resolve();
  if(syncEnVuelo) return syncEnVuelo;
  syncUlt = Date.now();
  if(primera || Date.now() - lan.ult > LAN_CADA) probarLan();   // no frena la sync: si contesta, lo que sigue va por ahi
  widUlt = 0; tabsUlt = 0; chatUlt = Date.now();   // que el tick no las saltee (ni repita el chat)
  var cartel = setTimeout(function(){ pintarSync("sync"); }, primera ? 0 : 250);
  syncEnVuelo = Promise.all([
    cargarEstado(),
    // el historial completo de cada pestaña y la franja reciente de comentarios, en paralelo
    cargarChat(),
    cargarComentarios(!!primera),
    cargarWidgets().catch(function(e){ if(ruidoso(e)) pintarWidgets(null, e.message); }),
    cargarTabs()
  ]).then(function(){
    mezclar(); render();               // una sola pasada de pintado, ya con todo abajo
    clearTimeout(cartel); pintarSync(null);
    irDonde();                         // y te deja donde estabas leyendo esa pestaña
  }).catch(function(e){
    clearTimeout(cartel);
    if(e && e.message === "401"){ pintarSync(null); throw e; }
    pintarSync("off", "sin conexión con el buzón: esto es la copia local");
    if(ruidoso(e)) throw e;
  }).then(function(){ syncEnVuelo = null; }, function(e){ syncEnVuelo = null; throw e; });
  return syncEnVuelo;
}
// volver al foco: sincroniza ya. con un piso corto para que alt-tab no dispare una bajada por segundo.

// "se puede poner una funcion tipo camara aca? como en whatsapp". el boton abre la camara (en el celu;
// en desktop el selector de archivos), la foto se achica a menos de FOTO_TOPE, se sube al **mismo repo
// del buzon** que widgets.json y tabs.json (`img/<hash>-<nombre>.jpg`, contents api, mismo token) y
// sale como un mensaje normal de la pestaña activa con su `tema x:`. la web la pinta inline con el
// mismo camino que las imagenes del daemon (`bajarImagen`), y el daemon la baja a tmp/ y le pasa la
// ruta local al modelo (`recetas/mostrar_imagen.recibir_web`).
var FOTO_TOPE = 2 * 1024 * 1024;    // tope de subida: menos de 2 mb

var subiendoFoto = false;

function leerImagen(file){

    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ res({im: im, url: url}); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("no pude leer la imagen")); };
    im.src = url;

// achica y recomprime hasta entrar en FOTO_TOPE. si el navegador no puede decodificarla (heic) y el
// archivo ya entra, se sube tal cual.
function comprimirFoto(file){
  return leerImagen(file).then(function(r){
    var esc = Math.min(1, FOTO_LADO / Math.max(r.im.width, r.im.height, 1));
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(r.im.width * esc));
    c.height = Math.max(1, Math.round(r.im.height * esc));
    c.getContext("2d").drawImage(r.im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(r.url);
    var i = 0;
    function intento(){
      return new Promise(function(res, rej){
        c.toBlob(function(b){ b ? res(b) : rej(new Error("no pude comprimir la foto")); },
                 "image/jpeg", FOTO_Q[i]);
      }).then(function(b){
        if(b.size <= FOTO_TOPE || i >= FOTO_Q.length - 1) return b;
        i++; return intento();
      });
    }
    return intento();
  }).catch(function(e){
    if(file.size <= FOTO_TOPE) return file;      // heic o similar: va tal cual si entra
    throw e;
  });
}
function bytesAb64(u8){

  if(claveNotiCtx(buscarNotiPush(notiPush)) !== notiClave) pintarNotiPush();
}
function abrirNotiPush(p){
  p = p || {};
  if(!notiVuelta){
    notiVuelta = {tema: temaActivo(), scroll: hist.scrollTop, abajo: pegadoAbajo(), alto: hist.scrollHeight,
                  widgets: document.body.classList.contains("ver-widgets")};
  }
  notiPush = {id: p.id || null, tema: p.tema || null, ts: p.ts || null, titulo: p.titulo || "", cuerpo: p.cuerpo || ""};
  $("nmtxt").value = "";
  estadoNotiPush("");
  $("notimodal").classList.remove("oculta");
  pintarNotiPush();
  posNotiModal();
  var c = notiPush.ctx;
  // la fila de la tarea puede no estar bajada (tema sin abrir) o ser mas nueva que lo bajado
  if(!c.noti && !c.m && token && c.tema && c.tema !== AUTO) cargarChatTema(c.tema).catch(function(){});
  try{ pushVisto(true); }catch(x){}
  return true;
}
function responderNotiPush(texto, crudo){
  texto = String(texto || "").trim();
  var p = notiPush;
  if(!p || !texto) return false;
  if(enviando){ estadoNotiPush("hay un mensaje saliendo: probá en un segundo"); return false; }
  var c = p.ctx || buscarNotiPush(p);
  mandarAparte = true;
  try{ mandar(crudo ? texto : citaNotiPush(c) + texto, c.tema, crudo); }
  finally{ mandarAparte = false; }
  if(c.noti) marcarLeidos([c.noti.id]);
  estadoNotiPush("mandado a " + c.tema);
  return true;
}
function cerrarNotiPush(){
  if(!notiPush) return false;
  var c = notiPush.ctx, v = notiVuelta;
  if(grabador && audioDestino) terminarGrabacion(false);
  audioDestino = null;
  var o = $("nmoir");
  if(sonando && sonando.__parar && o.contains(sonando)) sonando.__parar();
  pararHablaNoti();
  o.innerHTML = "";
  notiPush = null; notiVuelta = null;
  $("notimodal").classList.add("oculta");
  if(c && c.noti) marcarLeidos([c.noti.id]);
  // el modal nunca cambia la pestaña: si igual cambio (llego tabs.json en el arranque en frio) no se pisa
  if(v && temaActivo() === v.tema && v.alto > 0){
    if(document.body.classList.contains("ver-widgets") !== v.widgets){
      document.body.classList.toggle("ver-widgets", v.widgets);
      $("ver-chat").classList.toggle("on", !v.widgets);
      $("ver-widgets").classList.toggle("on", v.widgets);
    }
    var volver = function(){ if(v.abajo) hist.scrollTop = hist.scrollHeight; else hist.scrollTop = v.scroll; };
    volver();
    requestAnimationFrame(volver);
  }
  return true;
}

// voz: mantener apretado graba con el micro de siempre (abre al grabar, se para al soltar, 1372) y soltar manda al tema de la notificacion
(function(){
  var b = $("nmgrabar"), apretado = false;
  b.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if(!notiPush || grabador || subiendoAudio) return;
    apretado = true;
    if(b.setPointerCapture && e.pointerId != null){ try{ b.setPointerCapture(e.pointerId); }catch(err){} }
    var c = notiPush.ctx || buscarNotiPush(notiPush);
    audioDestino = {tema: c.tema, cita: citaNotiPush(c), noti: c.noti ? c.noti.id : null};
    pararHablaNoti();
    b.classList.add("grabando");
    estadoNotiPush("grabando...");
    empezarGrabacion().then(function(ok){
      if(!ok){ audioDestino = null; b.classList.remove("grabando"); estadoNotiPush("no pude usar el micro"); return; }
      if(!apretado) terminarGrabacion(false);   // se solto antes de que el micro terminara de abrir
    });
  });
  function soltar(enviar){
    return function(e){
      if(!apretado) return;
      apretado = false;
      if(e) e.preventDefault();
      b.classList.remove("grabando");
      if(!grabador) return;
      estadoNotiPush(enviar ? "subiendo el audio..." : "");
      terminarGrabacion(enviar);
    };
  }
  b.addEventListener("pointerup", soltar(true));
  b.addEventListener("pointercancel", soltar(false));
  b.addEventListener("pointerleave", soltar(false));
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();
// el camino entero: comprimir -> hash -> subir -> mandar el mensaje de la pestaña activa.
function mandarFoto(file, pieTexto, tsEnvio){
  if(!file) return Promise.resolve();
  if(subiendoFoto) return Promise.resolve();
  tsEnvio = tsEnvio || Date.now();      // se mando ahora, aunque el mensaje salga cuando termine de subir
  if(!token && !fotoStub){ sistema("no se puede subir la foto sin token", "error"); return Promise.resolve(); }
  subiendoFoto = true;
  $("camara").disabled = true;
  sistema("subiendo la foto...", "sistema");
  var blob, ruta;
  return comprimirFoto(file).then(function(b){
    blob = b;
    if(blob.size > FOTO_TOPE) throw new Error("la foto pesa " + Math.round(blob.size / 1024) + " kb");
    return blob.arrayBuffer();
  }).then(function(buf){
    return sha12(buf).then(function(h){
      ruta = nombreFoto(h, file);
      return subirFoto(ruta, bytesAb64(new Uint8Array(buf)), new Uint8Array(buf));
    });
  }).then(function(){
    imgUrls[ruta] = URL.createObjectURL(blob);    // ya la tengo: no la bajo de nuevo para pintarla
    var pie = (pieTexto !== undefined ? pieTexto : txt.value || "").trim();
    txt.value = ""; txt.style.height = "";
    return mandar((pie ? pie + "\n" : "") + "![" + (file.name || "foto") + "](" + ruta + ")",
                  temaActivo(), false, tsEnvio);
  }).catch(function(e){
    sistema("no pude subir la foto: " + e.message, "error");
    ruta = null;                                  // fallo: el que la mando la puede volver a adjuntar
  }).then(function(){
    subiendoFoto = false; $("camara").disabled = false; $("foto").value = "";
    return ruta;
  });
}
$("camara").addEventListener("click", function(){ $("foto").click(); });
$("foto").addEventListener("change", function(e){
  var f = (e.target.files || [])[0];
  if(f) adjuntarFoto(f);
  $("foto").value = "";                          // asi elegir dos veces la misma foto vuelve a disparar
});

// ---------- adjunto pendiente: la foto o el audio no se mandan solos (facundo, 2026-09-12) ----------
// "cuando suba una foto tengo que poder borrarla o escribir algo. es decir que no se mande
// automaticamente el mensaje". al elegir una imagen (camara, galeria, pegar, arrastrar) o al soltar
// el `[●]`, el archivo queda **pendiente** arriba del input: miniatura (o duracion + play) con una `×`
// que lo descarta. el input sigue editable y recien al tocar enviar (o enter en desktop) se sube al
// buzon y sale **un solo mensaje** con el `![](...)` / `[audio](...)` mas el texto que escribio.
// vive solo en memoria: no viaja en el borrador de `tabs.json` (un adjunto no se continua en otro
// dispositivo, el archivo no esta ahi).
var adjunto = null;      // {tipo:"img"|"aud", file|blob, mime, nombre, url, ms}

function pintarAdjunto(){
  var caja = $("adjunto");
  caja.innerHTML = "";
  if(!adjunto){ caja.classList.add("oculta"); return; }
  caja.classList.remove("oculta");
  var info = document.createElement("span");
  info.className = "adj-info";
  var n = document.createElement("span");
  n.className = "n";
  if(adjunto.tipo === "img"){
    var im = document.createElement("img");
    im.src = adjunto.url; im.alt = adjunto.nombre;
    caja.appendChild(im);
    n.textContent = adjunto.nombre;
    info.appendChild(n);
    info.appendChild(document.createTextNode("foto lista, escribí algo y mandá"));
  }else{
    caja.appendChild(reproductor(adjunto.url, "escuchar antes de mandar"));
    n.textContent = "audio " + mmss(Math.round((adjunto.ms || 0) / 1000));
    info.appendChild(n);
    info.appendChild(document.createTextNode("audio listo, escribí algo y mandá"));
    if(adjunto.dicho){                       // el celu ya lo transcribio: se lee antes de mandar (1209)
      var dd = document.createElement("span");
      dd.className = "adj-dicho";
      dd.textContent = "«" + adjunto.dicho + "»";
      dd.title = "lo transcribió el celu: va en el mensaje y el server no usa whisper";
      info.appendChild(dd);
    }
  }
  caja.appendChild(info);
  var x = document.createElement("button");
  x.type = "button"; x.className = "adj-x"; x.textContent = "×";
  x.title = "descartar"; x.setAttribute("aria-label", "descartar el adjunto");
  x.addEventListener("click", function(){ descartarAdjunto(); txt.focus(); });
  caja.appendChild(x);
  ajustarCaja();
}
function descartarAdjunto(){
  if(adjunto && adjunto.url && /^blob:/.test(adjunto.url)){
    try{ URL.revokeObjectURL(adjunto.url); }catch(e){}
  }
  adjunto = null;
  pintarAdjunto();
}
function adjuntarFoto(file){
  if(!file) return null;
  if(subiendoFoto || subiendoAudio) return null;
  descartarAdjunto();                            // uno a la vez: el nuevo reemplaza al anterior
  adjunto = {tipo: "img", file: file, mime: file.type || "image/jpeg",
             nombre: file.name || "foto.jpg", url: URL.createObjectURL(file)};
  pintarAdjunto();
  txt.focus();
  return adjunto;
}
function adjuntarAudio(blob, mime, ms, dicho){
  if(!blob || !blob.size) return null;
  if(subiendoFoto || subiendoAudio) return null;
  descartarAdjunto();
  adjunto = {tipo: "aud", blob: blob, mime: mime || blob.type || "audio/webm",
             nombre: "audio", ms: ms || 0, url: URL.createObjectURL(blob),
             // lo que entendio el celu (1209): se ve antes de mandar y viaja en el mensaje
             dicho: (dicho && dicho.texto) || "", dictLocal: !!(dicho && dicho.local)};
  pintarAdjunto();
  return adjunto;
}
// enviar con adjunto: sube y manda **un solo** mensaje con el texto de la caja adentro.
function mandarAdjunto(texto){
  if(!adjunto) return Promise.resolve();
  var a = adjunto, pie = (texto || "").trim(), ts = Date.now();   // apretar enviar es la hora del mensaje
  adjunto = null;                                // se saca del pie ya: no se manda dos veces
  pintarAdjunto();
  txt.value = ""; txt.style.height = "";
  borrarBorrador(temaCaja || temaActivo());
  var p = a.tipo === "img" ? mandarFoto(a.file, pie, ts)
                          : mandarAudio(a.blob, a.mime, pie, ts, a.dicho ? {texto: a.dicho, local: a.dictLocal} : null);
  return Promise.resolve(p).then(function(r){
    if(r){                                       // salio: recien ahi se suelta el object url
      if(a.url && /^blob:/.test(a.url)){ try{ URL.revokeObjectURL(a.url); }catch(e){} }
      return r;
    }
    if(!adjunto){ adjunto = a; pintarAdjunto(); } // fallo la subida: vuelve al pie, no se pierde
    if(pie && !txt.value.trim()){ ponerCaja(pie); }
    return null;
  });
}

// ---------- dictado en el celu: el texto lo saca el telefono (facundo, 2026-09-14, orden 1209) ----------
// "audio del chat transcripto en el celu antes de mandar". si el navegador tiene reconocimiento de voz
// (`SpeechRecognition` / `webkitSpeechRecognition` de safari ios, en rioplatense), corre **en paralelo** al
// MediaRecorder mientras grabas: al soltar el texto ya esta y sale en el mismo mensaje marcado como audio,
// asi el server no gasta whisper ni te hace esperar. si no hay reconocimiento, falla, o no se entendio nada,
// el mensaje va como siempre (solo el archivo) y lo transcribe whisper local en el server
// (`recetas/transcribir_audio.py`). **el dictado nunca puede romper la grabacion**: arranca despues del
// MediaRecorder, cualquier error se come aca y el archivo se manda igual.
var DICT_LANGS = ["es-AR", "es-419", "es-ES"];
var DICT_GRACIA = 2500;        // ms de gracia despues del stop(), esperando el ultimo resultado final
var MARCA_CELU = "(audio de facundo, transcripto en el celu): ";   // la lee `recetas/transcribir_audio.py`
var dictStub = null;           // `prueba_web_audio` enchufa un reconocedor de mentira
var dictado = null;            // el reconocedor de esta grabacion: {rec, partes, local, err, cerrado}
var dictOnDevice = null;       // "available" | "downloadable" | "unavailable" | "sin_dato" | null (sin api)

function claseDictado(){
  if(dictStub) return dictStub.clase || null;
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function hayDictado(){ return !!claseDictado(); }
// chrome 138+ sabe decir si el modelo esta **en el telefono** (`available({processLocally: true})`); safari
// no expone nada y usa el dictado del sistema, asi que ahi queda `sin_dato`: se dicta igual (lo hace el celu)
// pero no se puede afirmar que el reconocimiento sea on-device. el archivo de audio no sale de la lan en
// ninguno de los dos casos. se pregunta una vez al cargar: al soltar el boton la respuesta ya esta.
function prepararDictado(){
  var C = claseDictado();
  if(!C){ dictOnDevice = null; return Promise.resolve(null); }
  if(typeof C.available !== "function"){ dictOnDevice = "sin_dato"; return Promise.resolve(dictOnDevice); }
  try{
    return Promise.resolve(C.available({langs: [DICT_LANGS[0]], processLocally: true})).then(
      function(v){ dictOnDevice = String(v || "unavailable"); return dictOnDevice; },
      function(){ dictOnDevice = "sin_dato"; return dictOnDevice; });
  }catch(e){ dictOnDevice = "sin_dato"; return Promise.resolve(dictOnDevice); }
}
function empezarDictado(){
  dictado = null;
  var C = claseDictado();
  if(!C) return null;
  try{
    var rec = new C(), d = {rec: rec, partes: [], local: dictOnDevice === "available", err: null, cerrado: false, fin: null};
    rec.lang = DICT_LANGS[0];
    try{ rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 1; }catch(e){}
    if(d.local && "processLocally" in rec){ try{ rec.processLocally = true; }catch(e){} }
    rec.onresult = function(e){
      var rs = e && e.results; if(!rs) return;
      for(var i = e.resultIndex || 0; i < rs.length; i++)
        if(rs[i] && rs[i].isFinal && rs[i][0]) d.partes.push(String(rs[i][0].transcript || "").trim());
    };
    rec.onerror = function(e){ d.err = (e && (e.error || e.message)) || "error"; };
    rec.onend = function(){ d.cerrado = true; if(d.fin) d.fin(); };
    rec.start();
    dictado = d;
    return d;
  }catch(e){ dictado = null; return null; }    // sin dictado se sigue con whisper: no se avisa nada
}
// cancelar (arrastrar el dedo afuera, toque corto, salir de la pagina): el reconocedor se suelta igual
function cortarDictado(){
  var d = dictado; dictado = null;
  if(!d) return;
  try{ if(d.rec.abort) d.rec.abort(); else d.rec.stop(); }catch(e){}
}
// el texto final, o null si no hubo dictado / no se entendio nada. nunca tira y nunca espera de mas.
function terminarDictado(){
  var d = dictado; dictado = null;
  if(!d) return Promise.resolve(null);
  return new Promise(function(res){
    var listo = false;
    function cerrar(){
      if(listo) return;
      listo = true;
      var t = d.partes.join(" ").replace(/\s+/g, " ").trim();
      res(t ? {texto: t, local: !!d.local} : null);
    }
    d.fin = cerrar;
    setTimeout(cerrar, DICT_GRACIA);
    try{ d.rec.stop(); }catch(e){ cerrar(); }
    if(d.cerrado) cerrar();
  });
}

// ---------- audios: mandarlos como en whatsapp y escuchar las respuestas (facundo, 2026-09-11) ----------
// "estaria bueno poder mandarte audios como en whatsapp, y tus respuestas tienen que tener un play para
// que me los lea daniela en un formato que ocupe lo menos posible de audio".
//
// entrantes: tap and hold en `[●]` graba con MediaRecorder (opus si el navegador puede, mp4 en safari),
// al soltar se sube al **mismo repo del buzon** que las fotos (`audio/<hash>.<ext>`, contents api, mismo
// token) y sale como un mensaje normal de la pestaña activa con su `tema x:`, con el marcador
// `[audio](audio/<hash>.webm)`. el daemon lo baja y lo transcribe local con whisper
// (`recetas/transcribir_audio.py`), asi que al modelo le llega texto y no gasta un token de mas.
//
// salientes: el daemon renderiza cada respuesta con daniela (piper) y publica `audio/r-<hash>.m4a`;
// la fila del chat trae el campo `audio` y aca se pinta un `[▶]` al lado del `[tema]`.
var AUDIO_TOPE = 8 * 1024 * 1024;      // 8 mb: son ~25 minutos de opus a 24 kbps
var AUDIO_MAX_MS = 10 * 60 * 1000;     // y un corte duro a 10 min, por las dudas
var AUDIO_MIN_MS = 600;                // menos que esto fue un toque sin querer, no un audio
// el minimo legible, medido de verdad (orden 1209, `prueba_web_audio --compresion`): mono 16 khz y opus a
// 16 kbps. whisper `small` saca el mismo texto que el wav crudo y el archivo pesa ~30% menos que a 24 kbps
// (un minuto de audio son ~120 kb). a 8 kbps ya se come las primeras palabras, asi que 16 es el piso.
var AUDIO_BPS = 16000;
var AUDIO_PISTA = {channelCount: {ideal: 1}, sampleRate: {ideal: 16000},
                   echoCancellation: true, noiseSuppression: true, autoGainControl: true};
var MIMES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg;codecs=opus"];
var grabador = null, trozosAudio = [], stream = null, desdeGrab = 0, relojGrab = null, cortarGrab = null;
var vacioStub = false;        // `prueba_web_audio`: simula un micro que no dejo ni un byte (ios peleando el audio)
var subiendoAudio = false;

function mimeAudio(){
  if(typeof MediaRecorder === "undefined") return null;
  for(var i = 0; i < MIMES.length; i++)
    if(!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(MIMES[i])) return MIMES[i];
  return "";                            // el navegador elige solo
}
function extAudio(mime){
  if(/mp4|aac/.test(mime || "")) return "m4a";
  if(/ogg/.test(mime || "")) return "ogg";
  return "webm";
}
// el celu puede no aceptar las constraints (safari ignora `sampleRate`): si las rechaza, micro pelado
function abrirMicro(){
  return navigator.mediaDevices.getUserMedia({audio: AUDIO_PISTA}).catch(function(){
    return navigator.mediaDevices.getUserMedia({audio: true});
  });
}
// ---------- el micro se pide en cada audio (facundo, 2026-09-14, orden 1372) ----------
// "prefiero que me pida cada vez que quiero mandar un audio como antes". se saco el reuso de la 1349 (un
// stream abierto toda la apertura) y el arreglo a medias de la 1357: en **todas las plataformas** cada
// grabacion abre su `getUserMedia` y `soltarMicro` para todas las pistas. nada se abre al cargar la app, y el
// punto del micro aparece solo mientras se graba. que safari pida permiso en cada audio es lo esperado.
var microUltimo = null;       // el ultimo stream abierto: `prueba_web_audio` mira que quede sin pistas `live`
function pistasVivas(st){
  return ((st && st.getTracks && st.getTracks()) || []).filter(function(t){ return t.readyState === "live"; }).length;
}
function pararPistas(st){
  ((st && st.getTracks && st.getTracks()) || []).forEach(function(t){ try{ t.stop(); }catch(e){} });
}
function hayGrabacion(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && mimeAudio() !== null);
}
// **lo que abro lo cierro**: la grabacion se suelta siempre, aunque la subida falle. va en el `finally` de
// todos los caminos, y para **todas** las pistas del micro (1372): no queda ningun stream vivo.
function soltarMicro(){
  marcarOcupado("grabando", false);   // se apaga aca: es el finally de todos los caminos del micro
  if(relojGrab){ clearInterval(relojGrab); relojGrab = null; }
  if(cortarGrab){ clearTimeout(cortarGrab); cortarGrab = null; }
  pararPistas(stream);
  pararPistas(microUltimo);           // por si un camino perdio `stream` antes de llegar aca
  stream = null;
  grabador = null;
  $("grabar").classList.remove("grabando");
  $("grabinfo").classList.remove("viendo");
  $("grabinfo").textContent = "";
}
function relojTexto(ms){
  var s = Math.floor(ms / 1000);
  return "● " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
}
function empezarGrabacion(){
  if(grabador || subiendoAudio) return Promise.resolve(false);
  if(!hayGrabacion()){ sistema("este navegador no graba audio", "error"); return Promise.resolve(false); }
  return abrirMicro().then(function(st){
    stream = st; microUltimo = st;
    var mime = mimeAudio();
    grabador = new MediaRecorder(st, mime ? {mimeType: mime, audioBitsPerSecond: AUDIO_BPS} : {});
    trozosAudio = [];
    grabador.ondataavailable = function(e){ if(e.data && e.data.size) trozosAudio.push(e.data); };
    grabador.start();
    empezarDictado();                  // el celu transcribe mientras grabas (1209). si no puede, whisper
    marcarOcupado("grabando", true);   // el daemon no reinicia mientras el micro esta abierto (1204)
    desdeGrab = Date.now();
    $("grabar").classList.add("grabando");
    $("grabinfo").classList.add("viendo");
    $("grabinfo").textContent = relojTexto(0);
    relojGrab = setInterval(function(){ $("grabinfo").textContent = relojTexto(Date.now() - desdeGrab); }, 500);
    cortarGrab = setTimeout(function(){ terminarGrabacion(true); }, AUDIO_MAX_MS);
    return true;
  }).catch(function(e){
    soltarMicro(); cortarDictado();
    sistema("no pude usar el microfono: " + (e && e.message || e), "error");
    return false;
  });
}
// soltar manda; `enviar=false` (arrastrar el dedo afuera, o un toque de menos de AUDIO_MIN_MS) descarta.
function terminarGrabacion(enviar){
  if(!grabador) return Promise.resolve(null);
  var g = grabador, ms = Date.now() - desdeGrab, mime = g.mimeType || mimeAudio() || "audio/webm";
  if(enviar && ms < AUDIO_MIN_MS){ enviar = false; sistema("mantené apretado para grabar", "sistema"); }
  return new Promise(function(res){
    g.onstop = function(){ res(new Blob(vacioStub ? [] : trozosAudio, {type: mime})); };
    try{ g.stop(); }catch(e){ res(null); }
  }).then(function(blob){
    soltarMicro();
    if(!enviar){ audioDestino = null; cortarDictado(); return null; }
    if(!blob || !blob.size){
      // el micro no dejo nada (en ios el reconocedor puede pelearle la sesion de audio): si el celu igual

  var b = document.createElement("button");

  b.title = titulo || "escuchar";

    if(sonando === b) sonando = null;
  }
  b.__parar = parar;
  b.addEventListener("click", function(e){
    e.stopPropagation();

    if(au && !au.paused){ parar(); return; }
    b.disabled = true; b.textContent = "[…]";
    bajarAudio(src).then(function(url){

// facundo (2026-09-14, orden 1218): el widget usage rehecho. menos informacion: arriba UNA barra de proyeccion
// general (las dos cuentas como un solo tanque, `u.proyeccion.combinada`, con su lectura corta), una linea por
// modelo (a que cuenta va y por que, corto) y abajo las dos cuentas en DOS COLUMNAS (facu izquierda, orugote
// derecha) con `5h`, `week` y `fable` a la misma altura. un numero por barra; el tick de la linea sigue igual.
// caidas de hoy quedan en el dato esencial del header. todo lo calcula python (`proyeccion_uso`, `reparto_cuentas`).
var USAGE_ORDEN = ["facu", "orugote"];
var USAGE_BARRAS = [["five_hour", "5h"], ["seven_day", "week"], ["fable", "fable"]];
function cajaUsage(u){
  var cuentas = (u.cuentas || []).slice(), rep = u.reparto || {}, pr = u.proyeccion || {}, html = "";
  if(!cuentas.length && (u.barras || []).length)
    cuentas = [{nombre: "cuenta", activa: true, barras: u.barras}];
  var soloCta = wset("usage", "cuentas");
  if(soloCta && soloCta !== "todas")
    cuentas = cuentas.filter(function(c){ return c.nombre === soloCta; });
  cuentas.sort(function(x, y){
    var ix = USAGE_ORDEN.indexOf(x.nombre), iy = USAGE_ORDEN.indexOf(y.nombre);
    return (ix < 0 ? 9 : ix) - (iy < 0 ? 9 : iy);
  });
  // orden 1376/1377 (facundo, 2026-09-14): el titulo dice `CLAUDE` y al lado va solo la bateria. afuera la
  // proyeccion general, las lineas por modelo, excluidas y brecha. arriba de las cuentas UNA linea del reparto.
  if(rep.linea)
    // orden 1396 (facundo, 2026-09-15): tipo propio. como `cuenta` salia "cuenta undefined" (el reparto no tiene nombre)
    html += it({tipo: "reparto", tema: "tools", d: rep,
                completo: rep.linea + (rep.porque && rep.porque !== rep.linea ? " (" + rep.porque + ")" : "")},
               '<div class="urep">' + esc(rep.linea) + "</div>");
  // las dos columnas: el nombre pintado por `estado` (ok verde clarito, warn amarillo, mal rojo)
  var cols = cuentas.map(function(cu){
    var est = cu.estado || (cu.sin_login ? "mal" : "");
    var cab = '<span class="cta"><span class="nom' + (est ? " e-" + esc(est) : "") + '">' + esc(cu.nombre) + "</span></span>";
    var cuerpo;
    if(cu.sin_login){
      // sin login propio: no se repiten los numeros de la otra, pero el hueco guarda la altura de las barras
      cuerpo = USAGE_BARRAS.map(function(){ return '<div class="ub-hueco"></div>'; }).join("");
    } else {
      var bs = cu.barras || [];
      cuerpo = USAGE_BARRAS.map(function(k){
        var b = bs.filter(function(x){ return x.clave === k[0] || x.nombre === k[1]; })[0];
        return barraUso(b || {nombre: k[1], pct: null, linea: null, nivel: "sin"});
      }).join("");
    }
    return '<div class="ucol' + (cu.elegida ? " elegida" : "") + '">' +
      it({tipo: "cuenta", tema: "tools", d: cu, completo: cu.motivo || ""}, cab) + cuerpo + "</div>";
  });
  if(cols.length) html += '<div class="ucols">' + cols.join("") + "</div>";
  html += graficoSemana(u.semana);
  // al lado del titulo solo la bateria: sin numero, sin texto y sin tooltip
  return caja("CLAUDE", bateriaUso(u.bateria), '<div class="usage">' + (html || vacio("sin datos")) + "</div>",
              false, "usage");
}
// orden 1377: lo que QUEDA (promedio de week y fable del tanque de las dos cuentas, lo calcula widgets_json).
// llena = verde, se vacia proporcional, con 15% o menos le aparece el borde rojo.
function bateriaUso(b){
  if(!b || b.carga === null || b.carga === undefined) return "";
  var c = Math.max(0, Math.min(100, +b.carga || 0));
  return '<span class="ubat' + (c <= 15 ? " baja" : "") + '"><span class="ubat-c" style="width:' + c + '%"></span></span>';
}
// orden 1379: una barrita por dia de los ultimos 7 (uso sumado de las dos cuentas en % de un cupo) y la linea de
// cuanto usar por dia para llegar al 100% de week en cada reset. los dias viejos son aproximados (ver uso_historial.py).
function graficoSemana(s){
  if(!s || !(s.dias || []).length) return "";
  var mx = Math.max(+s.max || 1, 1);
  var alto = function(v){ return Math.max(0, Math.min(100, Math.round(v / mx * 100))); };
  var barras = s.dias.map(function(d){
    var sin = d.pct === null || d.pct === undefined;
    var sobre = !sin && s.linea !== null && s.linea !== undefined && d.pct > s.linea;
    return '<span class="usd' + (sin ? " sin" : "") + (sobre ? " sobre" : "") + '" style="height:' +
           (sin ? 0 : Math.max(6, alto(d.pct))) + '%"></span>';
  }).join("");
  var ln = (s.linea === null || s.linea === undefined) ? "" :
           '<span class="usem-l" style="bottom:' + alto(s.linea) + '%"></span>';
  var ets = s.dias.map(function(d){ return "<span>" + esc(d.et || "") + "</span>"; }).join("");
  return it({tipo: "cuenta", tema: "tools", d: s,
             completo: "uso por dia de las dos cuentas (% de un cupo semanal); la linea es " + s.linea +
                       "% por dia para llegar al 100% de week en cada reset" + (s.aprox ? ". los dias viejos son aproximados" : "")},
            '<div class="usem"><div class="usem-g">' + ln + barras + '</div><div class="usem-et">' + ets + "</div></div>");
}

function cajaSombra(sb){

               " " + pad("veredicto", 9) + "</span>"];
  (sb.cats || []).forEach(function(cat){

// llego la lista de leidas del buzon (o del cache): se suman. "remoto" = sume alguna del otro, "mio" = yo tengo
// alguna que el otro no (hay que publicar), "igual" = nada nuevo. false si no vino nada.
function recibirLeidos(rem){
  if(!rem || typeof rem !== "object") return false;

  Object.keys(avLeidos).forEach(function(i){ if(!(i in rem)) tengo = true; });
  if(sume){ guardarCache(); pintarNotis(); }
  return tengo ? "mio" : sume ? "remoto" : "igual";   // con alguna mia de mas se publica: los dos quedan con la suma
}

// ---------- arrastrar una caja para reordenarla (facundo, 2026-09-12) ----------
// se agarra del header (no de los botones `[↻]` `[⚙]`, que siguen funcionando): en la compu con el
// mouse (arranca al mover ARR_PX), en el celu con tap and hold de HOLD_MS, el mismo del menu
// contextual, que en el header no se pide. mientras se arrastra el panel no scrollea. el orden que
// queda se guarda en `tabs.json` (`orden_widgets`).
var ARR_PX = 5;
var arrW = null, arrUlt = 0, arrHold = null, arrTocado = null;
function cajaDeHeader(target){
  if(!target || !target.closest) return null;
  if(target.closest(".wbtn")) return null;
  var t = target.closest(".caja > .tit");
  if(!t) return null;
  var c = t.parentNode;
  return c && c.dataset && c.dataset.w ? c : null;
}
function arrEmpezar(nodo, y){
  if(arrW) return;
  var r = nodo.getBoundingClientRect();
  var ph = document.createElement("div");
  ph.className = "caja fantasma";
  ph.style.height = r.height + "px";
  nodo.parentNode.insertBefore(ph, nodo);
  nodo.classList.add("arrastrando");
  nodo.style.position = "fixed";
  nodo.style.left = r.left + "px";
  nodo.style.top = r.top + "px";
  nodo.style.width = r.width + "px";
  nodo.style.zIndex = "60";
  arrW = {clave: nodo.dataset.w, nodo: nodo, ph: ph, dy: y - r.top};
  document.body.classList.add("arrastrando-w");
}
// donde caeria: la primera caja cuyo centro queda abajo del dedo
function arrMover(y){
  if(!arrW) return;
  arrW.nodo.style.top = (y - arrW.dy) + "px";
  var cs = [].filter.call(widgetsEl.children, function(c){
    return c !== arrW.nodo && c !== arrW.ph && c.dataset && c.dataset.w;
  });
  for(var i = 0; i < cs.length; i++){
    var r = cs[i].getBoundingClientRect();
    if(y < r.top + r.height / 2){
      if(arrW.ph.nextSibling !== cs[i]) widgetsEl.insertBefore(arrW.ph, cs[i]);
      return;
    }
  }
  if(cs.length) widgetsEl.insertBefore(arrW.ph, cs[cs.length - 1].nextSibling);
}
function arrSoltar(){
  if(!arrW) return;
  var a = arrW; arrW = null; arrUlt = Date.now();
  document.body.classList.remove("arrastrando-w");
  a.nodo.classList.remove("arrastrando");
  a.nodo.removeAttribute("style");
  a.ph.parentNode.insertBefore(a.nodo, a.ph);
  a.ph.parentNode.removeChild(a.ph);
  var vis = [].map.call(widgetsEl.children, function(c){ return (c.dataset || {}).w || ""; })
              .filter(function(x){ return x; });
  guardarOrden(mezclarOcultas(vis), true);
}
function arrCancelarHold(){ if(arrHold){ clearTimeout(arrHold); arrHold = null; } arrTocado = null; }

widgetsEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "touch" || e.button !== 0) return;    // el celu va por touchstart (hold)
  var c = cajaDeHeader(e.target);
  if(!c) return;
  var y0 = e.clientY, listo = false;
  function mover(ev){
    if(!listo){
      if(Math.abs(ev.clientY - y0) < ARR_PX) return;
      listo = true;
      arrEmpezar(c, y0);
    }
    arrMover(ev.clientY);
    ev.preventDefault();
  }
  function fin(){
    document.removeEventListener("pointermove", mover);
    document.removeEventListener("pointerup", fin);
    document.removeEventListener("pointercancel", fin);
    if(listo) arrSoltar();
  }
  document.addEventListener("pointermove", mover);
  document.addEventListener("pointerup", fin);
  document.addEventListener("pointercancel", fin);
});

// "los widgets tienen que tener una opcion que sea escribir, asi te puedo decir algo ahi y ya tenes el
// contexto": el `[✎]` del header (y `escribir` en el modal de cada fila) lleva a la pestaña del tema
// del widget y deja una cita `> widget <nombre>: ...` + linea vacia en el input, sin mandar nada. el
// daemon la separa del pedido con `marcas_chat` (igual que `responder`) y se la pasa al modelo.
var TEMA_WIDGET = {server: "server", salud: "tools", usage: "tools", agent: "tools", cola: "tools", verificaciones: "awtomic/qa",
                   tickets: "awtomic", oportunidades: "tools", decided: "tools", sombra: "tools",
                   propuestas: "tools", podcast: "podcast", dj: "fuzzer", mail: "fuzzer",
                   que_ver: "personal"};

  var t = TEMA_WIDGET[clave] || "tools";
  return esTema(t) ? normTema(t) : "tools";

function unaLinea(t, n){
  t = String(t || "").replace(/\s+/g, " ").trim();
  return n && t.length > n ? t.slice(0, n - 1) + "…" : t;
}
function escribirEn(tema, cita){
  cerrarModal();
  if(temaActivo() !== tema) abrirTab(tema);
  var resto = txt.value;
  if(/^> widget /.test(resto)) resto = resto.replace(/^(>[^\n]*\n)+\n?/, "");   // una sola cita de widget
  ponerCaja(cita + "\n\n" + resto);
  guardarBorrador(temaCaja || temaActivo(), txt.value, true);
  if(esVistaMobile()) verPanel("chat");
  txt.focus();

  var c = document.querySelector('#widgets .caja[data-w="' + clave + '"]');
  var tit = c && c.querySelector(".wtit"), ese = c && c.querySelector(".wesc");
  var nombre = tit ? tit.textContent : clave;
  // `CLAUDE` no tiene texto al lado del titulo (solo la bateria): la cita lleva la linea del reparto
  var txEse = ese ? ese.textContent.trim() : "", rep = c && c.querySelector(".usage .urep");
  var dato = unaLinea(txEse || (rep ? rep.textContent : ""), ESC_CHARS);
  escribirEn(temaWidget(clave), "> widget " + nombre + ":" + (dato ? " " + dato : ""));

// la clave del widget donde esta pintada una fila (el item no la sabe: se busca en el dom)
function claveDeItem(o){

    var c = document.querySelector('#widgets [data-it="' + id + '"]');
    c = c && c.closest(".caja[data-w]");

  var nombre = c ? c.textContent : (clave || o.tipo || "widget");

// ---------- menu contextual (facundo, 2026-09-11) ----------
// tap and hold (~500 ms, sin disparar el scroll ni la seleccion) en el celu y click derecho en desktop:
// sobre un mensaje del chat (responder / copiar / editar / mandar a otra pestaña), sobre una fila de un
// widget (abre el modal a/b/c que ya existe, o copiar) y sobre una pestaña (cerrar / renombrar / al lado
// de los widgets). se cierra con esc, tocando afuera o al scrollear.
var HOLD_MS = 500;      // cuanto hay que mantener el dedo apoyado
var HOLD_PX = 10;       // si se mueve mas que esto, era un scroll: no hay menu
var MENU_MS = 400;      // el click que viene atras del hold no cierra el menu recien abierto
var CITA_LINEAS = 3, CITA_CHARS = 120;
var menuAbierto = null, menuTs = 0, menuNodo = null;

function cerrarMenu(){
  menuAbierto = null;

  $("ctxfondo").classList.add("oculta");

// `opciones` es [texto, funcion]. (x, y) es donde se toco: el menu se acomoda para no salirse.
function menu(x, y, titulo, opciones, nodo){
  cerrarMenu();
  var d = $("ctx");
  if(titulo){
    var t = document.createElement("div");
    t.className = "ctit"; t.textContent = titulo;
    d.appendChild(t);
  }
  opciones.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[0];
    b.addEventListener("click", function(){ cerrarMenu(); o[1](); });
    d.appendChild(b);
  });
  menuAbierto = {titulo: titulo || "", opciones: opciones.map(function(o){ return o[0]; })};
  menuTs = Date.now();
  d.classList.remove("oculta");
  $("ctxfondo").classList.remove("oculta");
  document.body.classList.add("sinsel");
  d.style.left = "0px"; d.style.top = "0px";
  var r = d.getBoundingClientRect();
  d.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + "px";
  d.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + "px";
  if(nodo && nodo.classList){ nodo.classList.add("marcado"); menuNodo = nodo; }
  return true;
}
// el gesto, delegado en el contenedor (los mensajes se repintan enteros en cada render).
// `pedir(target, x, y)` devuelve true si abrio un menu.
function gestos(el, pedir){
  if(!el) return;
  el.addEventListener("contextmenu", function(e){
    if(pedir(e.target, e.clientX, e.clientY)) e.preventDefault();
  });
  var t = null, x0 = 0, y0 = 0, blanco = null;
  function cancelar(){ if(t){ clearTimeout(t); t = null; } }
  el.addEventListener("touchstart", function(e){
    cancelar();
    if(e.touches.length !== 1) return;
    blanco = e.target; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t = setTimeout(function(){
      t = null;
      if(pedir(blanco, x0, y0)){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){} }
    }, HOLD_MS);
  }, {passive: true});
  el.addEventListener("touchmove", function(e){
    var p = e.touches[0];
    if(!t || !p) return;
    if(Math.abs(p.clientX - x0) > HOLD_PX || Math.abs(p.clientY - y0) > HOLD_PX) cancelar();
  }, {passive: true});
  ["touchend", "touchcancel"].forEach(function(ev){ el.addEventListener(ev, cancelar, {passive: true}); });
}

// fallback de seleccion: safari ios no copia con `a.select()` a secas, necesita un rango sobre el nodo y
// `setSelectionRange`; `readonly` y 16px para que no abra el teclado ni haga zoom.
function copiaSeleccion(texto){
  var a = document.createElement("textarea"), pudo = false;
  a.value = texto; a.setAttribute("readonly", ""); a.contentEditable = "true";
  a.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px";
  document.body.appendChild(a);
  var antes = document.activeElement;
  try{
    try{ a.focus({preventScroll: true}); }catch(x){ a.focus(); }
    var r = document.createRange(); r.selectNodeContents(a);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    a.setSelectionRange(0, texto.length);
    pudo = document.execCommand("copy");
  }catch(x){}
  document.body.removeChild(a);
  try{ window.getSelection().removeAllRanges(); }catch(x){}
  try{ if(antes && antes.focus && antes !== document.body) antes.focus({preventScroll: true}); }catch(x){}
  return pudo;
}
function copiarViejo(texto, listo){
  if(copiaSeleccion(texto)) listo(); else sistema("no pude copiar", "error");
}
function copiar(texto){
  texto = texto || "";
  var listo = function(){ sistema("copiado: " + corto(texto, 60)); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(texto).then(listo, function(){ copiarViejo(texto, listo); });
  }catch(x){}
  copiarViejo(texto, listo);
}

// ---------- 1214: botones `copiar` de un toque en las respuestas de claudio ----------
// links, `code` con url / clave / token, valores `clave: ...` y los bloques ``` (drafts). el portapapeles se
// pide adentro del click (gesto del usuario); si safari lo rechaza, fallback de seleccion.
var COPIADO_MS = 1000;
var RE_CLAVE_LBL = /(?:^|[^\w<&])(clave|contraseña|password|passwd|pass|token|api[ _-]?key|secret|secreto|pin|usuario|user)\s*:\s*$/i;
var RE_CLAVE_TXT = /(^|[^\w<&])(clave|contraseña|password|passwd|pass|token|api[ _-]?key|secret|secreto|pin|usuario|user)(\s*:\s*)([^\s<>`]{3,})/i;
function copiarSeguro(texto){
  return new Promise(function(res){
    var viejo = function(){ res(copiaSeleccion(texto)); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        return navigator.clipboard.writeText(texto).then(function(){ res(true); }, viejo);
    }catch(x){}
    viejo();
  });
}
function tocarCopiar(bt, texto){
  return copiarSeguro(texto).then(function(ok){
    var poner = function(t){ if(bt.classList.contains("cp")) bt.dataset.t = t; else bt.textContent = t; };
    poner(ok ? "copiado" : "no pude");
    bt.classList.toggle("ok", ok);
    clearTimeout(bt.__t);
    bt.__t = setTimeout(function(){ poner("copiar"); bt.classList.remove("ok"); }, COPIADO_MS);
    if(!ok) sistema("no pude copiar", "error");
    return ok;
  });
}
function armarCopiar(bt, texto){
  bt.type = "button"; bt.dataset.copia = texto;
  bt.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); tocarCopiar(bt, texto); });
  bt.addEventListener("contextmenu", function(e){ e.preventDefault(); e.stopPropagation(); });
  return bt;
}
function botonCopiar(texto){
  var bt = document.createElement("button");
  bt.className = "cp"; bt.dataset.t = "copiar"; bt.setAttribute("aria-label", "copiar");
  return armarCopiar(bt, texto);
}
// token o clave suelta: prefijos conocidos, uuid, hex largo, o 24+ chars sin espacios con mayuscula,
// minuscula y numero. rutas y nombres de archivo no (tienen `.` o arrancan con `/` `~`).
function esClave(t){
  t = String(t || "").trim();
  if(!t || /\s/.test(t)) return false;
  if(/^(sk-|sk_|ghp_|gho_|ghs_|github_pat_|xox[abpcsd]-|tskey-|AIza|ya29\.|glpat-|ATATT|shpat_|shpss_)\S{8,}$/.test(t)) return true;
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(t)) return true;
  if(/^[0-9a-f]{32,}$/i.test(t)) return true;
  return t.length >= 24 && /^[A-Za-z0-9_\-+\/=]+$/.test(t) && !/^[\/~]/.test(t) &&
         /[A-Z]/.test(t) && /[a-z]/.test(t) && /\d/.test(t);
}
function ponerCopiar(b){
  if(!b || !b.querySelectorAll) return;
  var despues = function(nodo, texto){ nodo.parentNode.insertBefore(botonCopiar(texto), nodo.nextSibling); };
  [].forEach.call(b.querySelectorAll("a[href]"), function(a){
    if(/^https?:/i.test(a.getAttribute("href"))) despues(a, a.getAttribute("href"));
  });
  [].forEach.call(b.querySelectorAll(".cod"), function(sp){
    var t = sp.textContent.trim(), prev = sp.previousSibling;
    var lbl = prev && prev.nodeType === 3 && RE_CLAVE_LBL.test(prev.nodeValue);
    if(t && (/^https?:\/\/\S+$/.test(t) || esClave(t) || lbl)) despues(sp, t);
  });
  // `clave: valor` en texto pelado (no adentro de code, links ni botones). `<clave: algo>` es un tapado de la
  // boveda, no un valor: se saltea.
  var w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT, null), textos = [];
  while(w.nextNode()) textos.push(w.currentNode);
  textos.forEach(function(n){
    if(n.parentNode.closest && n.parentNode.closest(".cod,a,button")) return;
    for(var vueltas = 0; n && vueltas < 20; vueltas++){
      var m = RE_CLAVE_TXT.exec(n.nodeValue);
      if(!m) return;
      var val = m[4].replace(/[.,;:)]+$/, "");
      var fin = m.index + m[1].length + m[2].length + m[3].length + val.length;
      // una palabra suelta en prosa ("el token: vence") no es un valor: tiene que tener numero, mayuscula o
      // simbolo, o ser larga
      if(val.length >= 3 && (/[0-9A-Z_\-.@!#$%*+=\/]/.test(val) || val.length >= 8)){
        var resto = n.splitText(fin);
        n.parentNode.insertBefore(botonCopiar(val), resto);
        n = resto;
      }else n = n.splitText(fin);
    }
  });
}

// el bloque de cita que deja "responder" en la caja: `> <quien>: <primeras lineas>` y una linea vacia.
// el daemon la reconoce (`marcas_chat`) y se la pasa al modelo como contexto, no como parte del pedido.
function citaDe(m){
  var ls = String(m.texto || "").split("\n").filter(function(x){ return x.trim() !== ""; });
  ls = ls.slice(0, CITA_LINEAS);
  if(!ls.length) ls = [""];
  return ls.map(function(x, i){
    x = x.replace(/\s+/g, " ").trim();
    if(x.length > CITA_CHARS) x = x.slice(0, CITA_CHARS - 1) + "…";
    return "> " + (i === 0 ? (m.quien || QUIEN_F) + ": " : "") + x;
  }).join("\n") + "\n\n";
}
function responderA(m){
  var cita = citaDe(m), resto = txt.value;
  ponerCaja(resto.indexOf(cita) === 0 ? resto : cita + resto);
  guardarBorrador(temaCaja || temaActivo(), txt.value, true);
  txt.focus();
}
// editar un mensaje propio: sale con el prefijo que el daemon guarda como `edita_ts` y el modelo
// trata como aclaracion del anterior, no como un pedido nuevo suelto.
function editarMsg(m){
  ponerCaja("edicion del mensaje de " + desde(m.iso) + ": " + (m.texto || ""));

}

// arrastrar el separador: pointer events, asi anda igual con mouse y con dedo en tablet.
// mientras se arrastra solo se pinta; el ancho se guarda y se publica al soltar.
(function(){
  var sep = $("sep"), arr = false;
  function pctDe(e){
    var r = $("cuerpo").getBoundingClientRect();
    if(!r.width) return null;
    return (e.clientX - r.left) / r.width * 100;
  }
  sep.addEventListener("pointerdown", function(e){
    if(!anchoDesktop()) return;
    arr = true;
    sep.classList.add("arrastrando");
    document.body.classList.add("arrastrando-sep");
    try{ sep.setPointerCapture(e.pointerId); }catch(x){}
    e.preventDefault();
  });
  sep.addEventListener("pointermove", function(e){
    if(!arr) return;
    var p = pctDe(e);
    if(p !== null) guardarSplit(p, false, true);      // en vivo, sin escribir en cada pixel
    e.preventDefault();
  });
  function soltar(e){
    if(!arr) return;
    arr = false;
    sep.classList.remove("arrastrando");

// login por clave (provisorio): clave.json trae el token cifrado (PBKDF2 + AES-GCM, lo publica recetas/web_clave.sh)
function b64a(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function entrarConClave(){
  var c = $("clave").value;
  if(!c) return;
  $("login-err").textContent = "descifrando...";
  fetch("clave.json?v=" + Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no hay clave.json publicado (correr recetas/web_clave.sh)");
    return r.json();
  }).then(function(j){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64a(j.salt), iterations:j.it||300000, hash:"SHA-256"}, base,
                                     {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64a(j.iv)}, key, b64a(j.ct));
    });
  }).then(function(buf){
    $("clave").value = "";
    arrancar(new TextDecoder().decode(buf).trim());
  }).catch(function(e){
    $("login-err").textContent = (e && /decrypt|operation/i.test(e.message)) ? "clave incorrecta" : ("error: " + e.message);
  });
}

                      texto: (f.querySelector(".nt") || {}).textContent, alto: Math.round(r.height),

                                        r.right <= window.innerWidth && r.bottom <= window.innerHeight; })()};
  },

    var ns = document.querySelectorAll(sel);
    var nodo = ns[n || 0];
    if(!nodo) return false;
    var r = nodo.getBoundingClientRect();
