// ---------- reproducir: un [▶] con look terminal, uno solo sonando a la vez ----------
var audioUrls = {};          // ruta del buzon -> object url (una sola bajada por archivo)
var sonando = null;
function bajarAudio(src){
  if(/^(https?:|blob:|data:)/i.test(src)) return Promise.resolve(src);
  if(audioUrls[src]) return Promise.resolve(audioUrls[src]);
  return bajarBlob(src).then(function(b){
      audioUrls[src] = URL.createObjectURL(b);
      return audioUrls[src];
    });
}
function mmss(seg){
  seg = Math.max(0, Math.round(seg || 0));
  return Math.floor(seg / 60) + ":" + ("0" + (seg % 60)).slice(-2);
}
// devuelve el boton. `etiqueta` es lo que dice al lado (la duracion cuando se sabe).
function reproductor(src, titulo){
  var b = document.createElement("button");
  b.type = "button"; b.className = "play"; b.textContent = "[▶]";
  b.title = titulo || "escuchar";
  b.dataset.src = src;
  var au = null;
  function parar(){
    if(au){ au.pause(); }
    b.textContent = "[▶]"; b.classList.remove("sonando");
    if(sonando === b) sonando = null;
  }
  b.__parar = parar;
  b.addEventListener("click", function(e){
    e.stopPropagation();
    if(sonando && sonando !== b && sonando.__parar) sonando.__parar();
    if(au && !au.paused){ parar(); return; }
    b.disabled = true; b.textContent = "[…]";
    bajarAudio(src).then(function(url){
      if(!au){
        au = new Audio(url);
        au.addEventListener("ended", parar);
        au.addEventListener("error", function(){ b.textContent = "[x]"; b.title = "no se pudo reproducir"; });
      }
      sonando = b;
      b.classList.add("sonando"); b.textContent = "[■]";
      return au.play();
    }).catch(function(err){
      b.textContent = "[x]"; b.title = "no pude bajar el audio (" + (err && err.message) + ")";
    }).then(function(){ b.disabled = false; });
  });
  return b;
}
// los audios que mando facundo viven en el cuerpo del mensaje como `[audio](audio/<hash>.webm)`:
// `resaltar` los deja como un hueco y aca se les enchufa el reproductor.
var RE_AUD = /!?\[([^\]\n]*)\]\(\s*(audio\/[\w][\w.@%+-]*)\s*\)/g;
function conAudios(l){
  RE_AUD.lastIndex = 0;
  if(l.indexOf("](audio/") < 0 || !RE_AUD.test(l)) return null;
  RE_AUD.lastIndex = 0;
  return l.replace(RE_AUD, function(m0, alt, src){
    return '<span class="aud" data-src="' + att(src) + '"><span class="dur">audio</span></span>';
  });
}
function cargarAudios(nodo){
  var spans = nodo.querySelectorAll ? nodo.querySelectorAll(".aud[data-src]") : [];
  Array.prototype.forEach.call(spans, function(sp){
    if(sp.dataset.listo) return;
    sp.dataset.listo = "1";
    var src = sp.dataset.src;
    sp.insertBefore(reproductor(src, "escuchar el audio"), sp.firstChild);
  });
}

// `capture` salio del input (en el celu forzaba la camara y no dejaba elegir de la galeria).
function imagenDe(dt){
  if(!dt) return null;
  var fs = dt.files || [];
  for(var i = 0; i < fs.length; i++) if((fs[i].type || "").indexOf("image/") === 0) return fs[i];
  var it = dt.items || [];
  for(var j = 0; j < it.length; j++)
    if(it[j].kind === "file" && (it[j].type || "").indexOf("image/") === 0){
      var f = it[j].getAsFile();
      if(f) return f;
    }

}

// ---------- widgets (web 2): widgets.json que publica el daemon en el buzon ----------
// misma estetica que la consola: verde ok, rojo fallo, amarillo pendiente, cian corriendo, magenta $.
// el json lo arma `recetas/widgets_json.py` y lo sube el script `widgets_web` del daemon cada 60 s.
var widgetsEl = $("widgets");
var podAbierto = null;   // el desplegable de podcast: null = lo que diga la setting `abierto`
function abiertoPod(){ return podAbierto === null ? !!wset("podcast", "abierto") : podAbierto; }

function kilo(n){
  n = n || 0;
  if(n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if(n >= 1000) return Math.round(n / 1000) + "k";
  return String(Math.round(n));
}
function clasePct(p){ return p >= 80 ? "alto" : p >= 50 ? "med" : "ok"; }
function bar(p, ancho){
  ancho = ancho || 10;
  var v = (p === null || p === undefined) ? null : Math.max(0, Math.min(100, p));
  var n = v === null ? 0 : Math.round(v * ancho / 100);
  var cl = v === null ? "" : clasePct(v);
  return '<span class="bar ' + cl + '"><span class="lleno">' + "█".repeat(n) + '</span>' +
         '<span class="hueco">' + "░".repeat(ancho - n) + "</span></span> " +
         '<span class="pct ' + (cl || "g") + '">' + (v === null ? "?" : Math.round(v)) + "%</span>";
}
function horaLocal(iso){
  if(!iso) return "";
  var t = fecha(iso);
  if(!t) return "";
  var d = new Date(t), hoy = new Date();
  var dias = ["dom","lun","mar","mie","jue","vie","sab"];
  var mismo = d.toDateString() === hoy.toDateString();
  return (mismo ? "hoy " : dias[d.getDay()] + " ") + desde(iso);
}
// duracion compacta, la misma que `chat_estado.fmt_tiempo` (facundo, 2026-09-13): `9s`, `1m 7s`, `1h 2m 5s`,
// y negativo = se paso: `+3s`. se usa en el eta, el header de cada respuesta y los avisos de espera.
function fmtTiempo(s){
  if(s === null || s === undefined || s === "" || isNaN(+s)) return "";
  var n = Math.round(+s), signo = n < 0 ? "+" : "";
  n = Math.abs(n);
  var h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), seg = n % 60, p = [];
  if(h) p.push(h + "h");
  if(m) p.push(m + "m");
  if(seg || !(h || m)) p.push(seg + "s");
  return signo + p.join(" ");
}
function haceSeg(s){
  if(s === null || s === undefined) return "?";
  if(s < 60) return Math.round(s) + "s";
  if(s < 3600) return Math.round(s / 60) + "m";
  if(s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
// la edad del widgets.json en el header de cada caja (facundo, 2026-09-13): con menos de 5 min no se
// muestra nada (el daemon publica cada 60 s, un `hace 40s` es ruido); pasados los 5 min `hace N min` en
// ambar, y pasados los 30 en rojo: el dato esta viejo, algo pasa. el reloj de 1 s (`refrescarEdad`)
// solo reescribe los `.wedad`, sin repintar las cajas.
function edadWid(){
  if(!widTs) return "";
  var min = Math.floor((Date.now() - widTs) / 60000);
  if(min < 5) return "";
  var txt = min < 120 ? min + " min" : haceSeg(min * 60);
  return '<span class="wage ' + (min >= 30 ? "wage-muy" : "wage-vieja") + '">hace ' + esc(txt) + "</span>";
}
function refrescarEdad(){
  var h = edadWid(), els = document.querySelectorAll("#widgets .wedad");
  for(var i = 0; i < els.length; i++) if(els[i].innerHTML !== h) els[i].innerHTML = h;
}
setInterval(refrescarEdad, 1000);
function pad(t, n, der){
  t = String(t === null || t === undefined ? "" : t);
  if(t.length > n) t = t.slice(0, n);
  var h = " ".repeat(n - t.length);
  return der ? h + t : t + h;
}
function boton(texto, msg, clase){
  return '<button class="btn ' + (clase || "") + '" type="button" data-msg="' + esc(msg) + '">' + esc(texto) + "</button>";
}
// una caja de widget con su header (facundo, 2026-09-12): a la izquierda el titulo (tocarlo pliega)
// y `extra`, el dato esencial de una linea; a la derecha `hace Xs`, `[↻]` actualizar y `[⚙]` settings.
// `clave` es el nombre con el que se guardan las settings en `tabs.json` (default: el titulo).
function caja(tit, extra, cuerpo, tabla, clave){
  clave = clave || tit;
  var pleg = !!wset(clave, "plegado");
  return '<div class="caja' + (pleg ? " plegada" : "") + '" data-w="' + esc(clave) + '">' +
         '<div class="tit"><span class="wtit" data-fold="' + esc(clave) + '" title="' +
         (pleg ? "desplegar" : "plegar") + '">' + esc(tit) + "</span>" +
         '<span class="wesc">' + (extra || "") + "</span>" +
         '<span class="wacc"><span class="wedad">' + edadWid() + "</span>" +
         '<button class="wbtn" type="button" data-esc="' + esc(clave) + '" title="escribir sobre este widget">✎</button>' +
         '<button class="wbtn" type="button" data-ref="' + esc(clave) + '" title="actualizar">\u21bb</button>' +
         '<button class="wbtn" type="button" data-set="' + esc(clave) + '" title="settings">\u2699</button>' +
         "</span></div>" +
         '<div class="cuerpo' + (tabla ? " tabla" : "") + '">' + cuerpo + "</div></div>";
}
// las filas que se ven: la setting `filas` de cada widget (0 = todas)
function limFilas(clave, filas){
  var n = +wset(clave, "filas") || 0;
  if(!n || filas.length <= n) return filas;
  return filas.slice(0, n).concat(['<span class="vacio">+' + (filas.length - n) +
                                   " m\u00e1s (\u2699 filas)</span>"]);
}
// opciones que dependen de los datos de ahora (para el modal de settings)

function fuentesQueVer(){

function vacio(t){ return '<span class="vacio">' + esc(t) + "</span>"; }

// ---------- items tocables (facundo, 2026-09-11) ----------
// cada fila de un widget se registra aca y se envuelve en un `.it`: tocarla abre el modal con el item
// expandido y sus acciones. el registro se limpia en cada repintado.
var itemsW = {}, itemN = 0;
function it(o, html){
  var id = ++itemN;
  itemsW[id] = o;
  return '<span class="it" data-it="' + id + '">' + html + "</span>";
}

// falta hasta el reset, corto: 4d23 / 1h55 / 12m. `s` viene calculado del daemon (falta_s).
function faltaTxt(s){
  if(s === null || s === undefined) return "";
  if(s <= 0) return "ya";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if(d) return d + "d" + (h ? h : "");
  if(h) return h + "h" + (m < 10 ? "0" : "") + m;
  return m + "m";
}
// una barra: el ancho es el % usado, el tick blanco es la linea (la parte de la ventana que ya paso)
// y el color es el `color` continuo que ya calculo reparto_cuentas.py por distancia a la linea
// (verde bien abajo, amarillo justo en la linea, rojo arriba). la clase `n-*` queda de fallback.
function colorUso(c){ return /^hsl\(\s*\d+(\.\d+)?\s*,\s*\d+(\.\d+)?%\s*,\s*\d+(\.\d+)?%\s*\)$/.test(c || "") ? c : null; }
function barraUso(b){
  var pct = (b.pct === null || b.pct === undefined) ? null : Math.max(0, Math.min(100, b.pct));
  var tick = (b.linea === null || b.linea === undefined) ? null : Math.max(0, Math.min(100, b.linea));
  var col = colorUso(b.color), est = col ? 'style="color:' + col + '"' : "";
  return '<div class="ub n-' + esc(b.nivel || "sin") + '" title="' +
         esc(b.nombre + ": usado " + (pct === null ? "?" : Math.round(pct)) + "%, linea " +
             (tick === null ? "?" : Math.round(tick)) + "%" +
             (b.ratio ? ", ratio " + b.ratio : "") +
             (b.dist === null || b.dist === undefined ? "" :
              ", " + (b.dist > 0 ? "+" : "") + b.dist + " de la linea")) + '">' +
         '<span class="ub-n">' + esc(b.nombre) + "</span>" +
         '<span class="ub-pista"><span class="ub-lleno" style="width:' + (pct === null ? 0 : pct) + '%' +
         (col ? ";background:" + col : "") + '"></span>' +
         (tick === null ? "" : '<span class="ub-tick" style="left:' + tick + '%"></span>') + "</span>" +
         '<span class="ub-p" ' + est + ">" + (pct === null ? "?" : Math.round(pct)) + "%</span>" +
         '<span class="ub-r">' + esc(faltaTxt(b.falta_s)) + "</span></div>";
}
// ---------- server (la geekom `claudio`) ----------
// facundo (2026-09-11): un widget dedicado, arriba de usage. si no contesta muestra "apagado / sin red"
// con la ultima vez que se lo vio; las metricas que se pintan son las cacheadas de esa ultima vez.
function bytes(n){
  if(n === null || n === undefined) return "?";
  var u = ["b", "kb", "mb", "gb", "tb"], i = 0;
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function nivelPct(p, cerca, mal){
  if(p === null || p === undefined) return "sin";
  return p >= (mal || 90) ? "mal" : p >= (cerca || 75) ? "cerca" : "ok";
}
function barraPct(nombre, pct, txt){
  return '<div class="ub n-' + nivelPct(pct) + '"><span class="ub-n">' + esc(nombre) + "</span>" +
         '<span class="ub-pista"><span class="ub-lleno" style="width:' + (pct || 0) + '%"></span></span>' +
         '<span class="ub-p">' + (pct === null || pct === undefined ? "?" : Math.round(pct)) + "%</span>" +
         '<span class="ub-r">' + esc(txt || "") + "</span></div>";
}
function upTxt(s){
  if(!s) return "?";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? d + "d" + h + "h" : h ? h + "h" + m + "m" : m + "m";
}
function cajaServer(s){
  if(!s || !s.host) return caja("server", "", vacio("sin datos del server"), false, "server");
  var on = !!s.online, filas = [];
  var cab = on ? '<span class="v b">' + esc(s.estado || "ok") + "</span>"
               : '<span class="r b">apagado</span> <span class="g">' + esc(s.estado || "") +
                 (s.visto_hace_s !== null && s.visto_hace_s !== undefined
                    ? " · visto hace " + haceSeg(s.visto_hace_s) : " · nunca visto") + "</span>";
  var barras = barraPct("cpu", s.cpu, s.temp ? s.temp + "\u00b0" : "") +
               barraPct("ram", (s.ram || {}).pct, s.ram ? bytes(s.ram.usado) : "") +
               barraPct("disco", (s.disco || {}).pct, s.disco ? bytes(s.disco.total - s.disco.usado) + " libre" : "");
  filas.push(it({tipo: "server", tema: "server", d: s},
    '<div class="usage' + (on ? "" : " off") + '">' + barras + "</div>" +
    '<span class="g">up</span> <span class="b">' + esc(upTxt(s.uptime_s)) + "</span>" +
    '  <span class="g">lan</span> <span class="c">' + esc(s.ip_lan || s.ip || "?") + "</span>" +
    '  <span class="g">ts</span> <span class="c">' + esc(s.ip_tailscale || "?") + "</span>" +
    (s.ping_ms !== null && s.ping_ms !== undefined ? '  <span class="g">ping</span> <span class="b">' + s.ping_ms + "ms</span>" : "")));
  var red = s.red || {}, thr = s.throughput || {};
  filas.push('<span class="g">red</span> ' +
    '<span class="v">&darr;' + bytes(red.rx_s) + "/s</span> " +
    '<span class="c">&uarr;' + bytes(red.tx_s) + "/s</span>" +
    (thr.mbps ? '  <span class="g">mac&rarr;server</span> <span class="m b">' + thr.mbps + " mbps</span>" : ""));
  filas.push('<span class="g">agente</span> ' +
    (s.agente ? '<span class="v b">corriendo</span>' : '<span class="r b">parado</span>') +
    (s.throughput && s.throughput.ts ? '  <span class="g">medido hace ' + hace(s.throughput.ts) + "</span>" : ""));
  var e = s.etapa || {};
  if(e.titulo){
    filas.push(it({tipo: "server", tema: "server", d: s},
      '<span class="a b">' + esc(e.titulo) + "</span>"));
    (e.puntos || []).forEach(function(p){
      filas.push('<span class="g">·</span> ' + esc(String(p).slice(0, 110)));
    });
  }
  var o = s.ordenes || {};
  (o.corriendo || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "corriendo", tema: "server", d: t},
      '<span class="a">&gt;</span> <span class="m b">' + esc(t.modelo) + '</span> <span class="g">' +
      (t.min === null || t.min === undefined ? "?" : t.min) + "m</span> " + esc(String(t.texto || "").slice(0, 90))));
  });
  (o.cola || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "cola", tema: "server", d: t},
      '<span class="a">[ ]</span> ' + esc(String(t.texto || "").slice(0, 90))));
  });
  (o.hechas || []).forEach(function(t){
    filas.push(it({tipo: "tarea", estado: "hecha", tema: "server", d: t},
      '<span class="g">' + esc((t.fecha || "").slice(11, 16) || "--:--") + "</span> " +
      (t.ok ? '<span class="v">ok</span>' : '<span class="r">!!</span>') + " " +
      esc(String(t.texto || "").slice(0, 80))));
  });
  if(!(o.corriendo || []).length && !(o.cola || []).length && !(o.hechas || []).length)
    filas.push(vacio("sin ordenes de server"));
  (s.esperando || []).forEach(function(p){
    filas.push(it({tipo: "server", tema: "server", d: s},
      '<span class="a b">?</span> ' + esc(String(p).slice(0, 100))));
  });
  if(wset("server", "log"))
    (s.log || []).slice(0, 3).forEach(function(l){
      filas.push('<span class="g">' + esc(String(l).slice(0, 110)) + "</span>");
    });
  // dato esencial: vivo o apagado, y como viene la cpu
  var ese = cab + (s.cpu === null || s.cpu === undefined ? "" :
    ' <span class="g">cpu</span> <span class="' + (nivelPct(s.cpu) === "mal" ? "r" : "b") + '">' +
    Math.round(s.cpu) + "%</span>");
  return caja("server", ese, limFilas("server", filas).join("\n"), false, "server");
}

// salud (facundo, 2026-09-13, PLAN-INVENCIBLE capa 4): cuando vence cada credencial. lo arma
// recetas/salud.py cada 10 min; rojo y amarillo arriba, tocar una fila da el arreglo como boton.
var SALUD_COLOR = {rojo: "r", amarillo: "a", verde: "v", gris: "g"};
function cajaSalud(s){
  if(!s || !s.filas) return caja("salud", "", vacio((s && s.error) || "salud todavia no corrio"), false, "salud");
  var r = s.resumen || {}, filas = [], solo = !!wset("salud", "solo_problemas");
  s.filas.forEach(function(f){
    if(solo && (f.estado === "verde" || f.estado === "gris")) return;
    var vence = (f.falta_s !== null && f.falta_s !== undefined && f.grupo !== "oauth" && f.estado !== "rojo")
      ? '<span class="g">vence en</span> <span class="b">' + faltaTxt(f.falta_s) + "</span> " : "";
    filas.push(it({tipo: "salud", tema: "tools", d: f},
      '<span class="' + (SALUD_COLOR[f.estado] || "g") + ' b">' + esc(f.estado || "?") + "</span> " +
      '<span class="b">' + esc(f.nombre || "") + "</span> " + vence +
      '<span class="g">' + esc(String(f.detalle || "").slice(0, 70)) + "</span>"));
  });
  if(!filas.length) filas.push(vacio("todo verde"));
  var ese = (r.rojo ? '<span class="r b">' + r.rojo + " rojo</span> " : "") +
            (r.amarillo ? '<span class="a b">' + r.amarillo + " amarillo</span> " : "") +
            (!r.rojo && !r.amarillo ? '<span class="v b">todo verde</span> ' : "") +
            '<span class="g">' + (r.verde || 0) + " verde</span>";
  return caja("salud", ese, limFilas("salud", filas).join("\n"), false, "salud");
}

// facundo (2026-09-11): el widget muestra SOLO las barras, tres por cuenta (5h, week, fable).
// presupuesto, horario laboral y costo siguen en el json pero no se pintan aca.
// facundo (2026-09-12, mitad y mitad): arriba dice QUE CUENTA esta eligiendo el agente y POR QUE
// (`u.reparto`, lo calcula `recetas/reparto_cuentas.py` sin gastar tokens), y la elegida queda marcada.
function cajaUsage(u){
  var cuentas = u.cuentas || [], rep = u.reparto || {}, html = "";
  if(!cuentas.length && (u.barras || []).length)
    cuentas = [{nombre: "cuenta", activa: true, barras: u.barras}];
  var soloCta = wset("usage", "cuentas");
  if(soloCta && soloCta !== "todas")
    cuentas = cuentas.filter(function(c){ return c.nombre === soloCta; });
  // caidas de hoy (facundo, 2026-09-12): cuantas veces y cuanto tiempo claudio estuvo sin claude hoy,
  // con hora y causa de cada una. lo calcula `recetas/autosalvataje.py` leyendo `log.md`, cero tokens.
  var ca = u.caidas || {};
  if(ca.n)
    html += it({tipo: "caidas", tema: "tools", d: ca, completo: ca.texto || ""},
      '<div class="rep"><span class="g">caidas hoy</span> ' +
      '<span class="' + (ca.abierta ? "r" : "a") + ' b">' + esc(String(ca.n)) + "</span>" +
      '<span class="g">' + esc(String(ca.minutos || 0)) + " min</span>" +
      '<span class="g por">' + esc((ca.episodios || []).map(function(e){
        return e.desde + "-" + e.hasta + " " + e.causa + (e.abierta ? " (sigue)" : "");
      }).join(" \u00b7 ")) + "</span></div>");
  // eta del chat (2026-09-13): lo aprende `recetas/eta_chat.py` sin tokens; el error es el medio de la semana,
  // estimado contra el total real de cada intercambio
  var et = u.eta_chat;
  if(et && et.texto)
    html += '<div class="rep"><span class="g">eta chat</span> <span class="nom">' + esc(fmtTiempo(et.eta_s || 0)) +
      '</span><span class="g por">' + esc(et.error_semana_pct === null || et.error_semana_pct === undefined ? "sin datos todavia" :
      "error semana " + et.error_semana_pct + "% (±" + fmtTiempo(et.mae_semana_s) + ", " + et.n_semana + ")") + "</span></div>";
  if(rep.elegida)
    html += it({tipo: "cuenta", tema: "tools", d: rep, completo: rep.porque || ""},
      '<div class="rep"><span class="g">usa</span> <span class="nom">' + esc(rep.elegida) + "</span> " +
      '<span class="' + (rep.reparto ? "a" : "g") + '">' +
      (rep.reparto ? "reparto" : (rep.modo === "auto" ? "auto, espera el corte" : "fija")) + "</span>" +
      (rep.porque ? '<span class="g por">' + esc(rep.porque) + "</span>" : "") + "</div>");
  // por modelo (facundo, 2026-09-13): opus no mira la barra fable, asi que cada modelo puede salir con
  // otra cuenta. una linea por modelo: "opus -> facu: week 80%, resetea mie 18:00".
  (rep.modelos || []).forEach(function(mo){
    html += it({tipo: "cuenta", tema: "tools", d: mo, completo: mo.porque || mo.linea || ""},
      '<div class="rep modelo"><span class="g">' + esc(mo.modelo || "") + '</span> <span class="nom">' +
      esc(mo.elegida || "") + '</span><span class="g por">' + esc(mo.linea || "") + "</span></div>");
  });
  cuentas.forEach(function(cu){
    var nota = (cu.nota === null || cu.nota === undefined) ? "" : cu.nota + "x";
    // sin login propio en esta maquina (o el mismo login que otra: el symlink del server): se dice,
    // no se pintan barras. antes se repetian los numeros de la otra cuenta como si estuviera medida.
    if(cu.sin_login){
      html += '<div class="bloque">' +
              it({tipo: "cuenta", tema: "tools", d: cu, completo: cu.motivo || ""},
                 '<span class="cta"><span class="nom">' + esc(cu.nombre) + "</span>" +
                 '<span class="r b">sin login</span>' +
                 (cu.motivo ? '<span class="g por">' + esc(cu.motivo) + "</span>" : "") + "</span>") +
              "</div>";
      return;
    }
    html += '<div class="bloque">' +
            it({tipo: "cuenta", tema: "tools", d: cu},
               '<span class="cta"><span class="nom">' + esc(cu.nombre) + "</span>" +
               (cu.elegida ? '<span class="v b">&larr; usa</span>' : "") +
               (cu.activa && !cu.elegida ? '<span class="v">activa</span>' : "") +
               (nota ? '<span class="g">peor ' + esc(String(cu.peor || "")) + " " + esc(nota) + "</span>" : "") +
               (cu.usable === false ? '<span class="r b">' + esc(cu.motivo || "al tope") + "</span>" : "") +
               "</span>") +
            (cu.barras || []).map(barraUso).join("") + "</div>";
  });
  // dato esencial: por cuenta, el limite mas cerca de la linea (el `peor` que ya calcula el reparto)
  var ese = cuentas.map(function(cu){
    if(cu.sin_login) return '<span class="b">' + esc(cu.nombre) + '</span> <span class="r">sin login</span>';
    // `peor` es el NOMBRE de la barra (5h / week / fable) que calcula reparto_cuentas; si no vino,
    // la de ratio mas alto (la mas pasada de la linea).
    var bs = cu.barras || [];
    var b = bs.filter(function(x){ return x.nombre === cu.peor; })[0];
    if(!b) b = bs.slice().sort(function(x, y){ return (y.ratio || 0) - (x.ratio || 0); })[0];
    if(!b) return esc(cu.nombre);
    var col = colorUso(b.color);
    return '<span class="b">' + esc(cu.nombre) + "</span> " +
           '<span class="uw n-' + esc(b.nivel || "sin") + '"' + (col ? ' style="color:' + col + '"' : "") +
           ">" + esc(b.nombre) + " " +
           (b.pct === null || b.pct === undefined ? "?" : Math.round(b.pct)) + "%</span>";
  }).join('<span class="g"> \u00b7 </span>');
  if(ca.n) ese += '<span class="g"> \u00b7 </span><span class="' + (ca.abierta ? "r" : "a") +
                  '">' + esc(String(ca.n)) + " caida" + (ca.n > 1 ? "s" : "") + " hoy</span>";
  return caja("usage", ese, '<div class="usage">' + (html || vacio("sin datos")) + "</div>",
              false, "usage");
}

function cajaSombra(sb){
  if(sb.error)
    return caja("backup models", "", '<span class="r">' + esc(sb.error) + "</span>", false, "sombra");
  var cols = sb.cols || [], cortos = {principal:"prin", gemini:"gem", groq:"groq", openrouter:"orou", mistral:"mist"};
  var filas = ['<span class="g">' + pad("categoria", 11) + cols.map(function(c){ return pad(cortos[c] || c, 5, true); }).join(" ") +
               " " + pad("veredicto", 9) + "</span>"];
  (sb.cats || []).forEach(function(cat){
    var f = (sb.tabla || {})[cat];
    if(!f) return;
    var celdas = cols.map(function(c){
      var x = f[c];
      if(!x) return '<span class="g">' + pad("-", 5, true) + "</span>";
      if(x.acierto === null || x.acierto === undefined){
        var t = x.sin_clave ? "-" : x.pendientes ? "wait" : "err";
        return '<span class="g">' + pad(t, 5, true) + "</span>";
      }
      var cl = x.acierto >= 80 ? "v" : x.acierto >= 50 ? "a" : "r";
      return '<span class="' + cl + ' b">' + pad(x.acierto + "%", 5, true) + "</span>";
    });
    var v = (sb.veredictos || {})[cat] || {};
    var ver = v.veredicto === "apto" ? '<span class="v b">' + pad("ok " + (cortos[v.proveedor] || v.proveedor || ""), 9) + "</span>"
            : v.veredicto === "no apto" ? '<span class="r b">' + pad("no", 9) + "</span>"
            : '<span class="g">' + pad("pocos", 9) + "</span>";
    filas.push(it({tipo: "catbackup", tema: "tools", d: {cat: cat, fila: f, cols: cols, veredicto: v}},
               pad(cat, 11) + celdas.join(" ") + " " + ver));
  });
  if(filas.length === 1) filas.push(vacio("sin corridas todavia"));
  var hoy = sb.hoy || {}, est = hoy.estados || {};
  if(Object.keys(est).length){
    var clEst = {ok:"v", cuota:"a", pago:"r", roto:"r", "sin clave":"g"};
    var chips = Object.keys(est).map(function(p){
      var e = est[p], c = clEst[e.estado] || "g";
      var lat = e.estado === "ok" && e.latencia !== null ? " " + e.latencia + "s" : "";
      return it({tipo: "modelo", tema: "tools",
                 d: {prov: p, hoy: e, info: (sb.modelos || {})[p] || {}, tabla: sb.tabla || {},
                     cats: sb.cats || [], veredictos: sb.veredictos || {}}},
                '<span class="' + c + ' b">' + esc(cortos[p] || p) + "</span>" +
                '<span class="' + c + '">' + esc(" " + e.estado + lat) + "</span>");
    });
    filas.push('<span class="g">' + pad("hoy", 11) + "</span>" + chips.join('<span class="g"> \u00b7 </span>'));
  }
  filas.push('<span class="g">' + (sb.n || 0) + " corridas · apto = 85%+ &lt;5s 20+" +
             ((sb.faltan || []).length ? " · sin clave: " + sb.faltan.length : "") + "</span>");
  // dato esencial: el ultimo veredicto (el primer proveedor apto, o que no hay)
  var apto = null;
  (sb.cats || []).forEach(function(c){
    var v = (sb.veredictos || {})[c] || {};
    if(!apto && v.veredicto === "apto") apto = (cortos[v.proveedor] || v.proveedor || "") + " en " + c;
  });
  var ese = apto ? '<span class="v b">apto</span> <span class="g">' + esc(apto) + "</span>"
                 : '<span class="g">sin apto todavia</span>';
  return caja("backup models", ese, limFilas("sombra", filas).join("\n"), true, "sombra");
}

// que filas se ven segun el `[⚙]`: fuente, cuantas por fuente y "solo lo nuevo". el json trae
// `candidatos` (todo lo que hay), asi que cambiar una setting no vuelve a pedirle nada a nadie.
function filasQueVer(p){
  var cand = p.candidatos || p.items || [];
  var fu = wset("que_ver", "fuentes"), porF = +wset("que_ver", "por_fuente") || 2;
  var nuevos = !!wset("que_ver", "solo_nuevos"), tope = +p.tope || 5;
  var libres = cand.filter(function(i){
    if(fu && fu !== "todas" && i.nombre !== fu) return false;
    if(nuevos && String(i.porque || "").indexOf("nuevo") !== 0) return false;
    return true;
  });
  if(fu === "todas" && porF === 2 && !nuevos && (p.items || []).length) return p.items;
  var out = [], cuenta = {};
  [porF, tope].forEach(function(lim){
    libres.forEach(function(i){
      if(out.length >= tope || out.indexOf(i) >= 0) return;
      if((cuenta[i.fuente] || 0) >= lim) return;
      out.push(i); cuenta[i.fuente] = (cuenta[i.fuente] || 0) + 1;
    });
  });
  return out;
}

  var its = filasQueVer(p);

    false, "que_ver");
  var extra = '<span class="v b">' + its.length + "</span> " +

// ---------- arrastrar una caja para reordenarla (facundo, 2026-09-12) ----------
// se agarra del header (no de los botones `[↻]` `[⚙]`, que siguen funcionando): en la compu con el
// mouse (arranca al mover ARR_PX), en el celu con tap and hold de HOLD_MS, el mismo del menu
// contextual, que en el header no se pide. mientras se arrastra el panel no scrollea. el orden que
// queda se guarda en `tabs.json` (`orden_widgets`).
var ARR_PX = 5;
var arrW = null, arrUlt = 0, arrHold = null, arrTocado = null;
function cajaDeHeader(target){
  if(!target || !target.closest) return null;
  if(target.closest(".wbtn")) return null;
  var t = target.closest(".caja > .tit");
  if(!t) return null;
  var c = t.parentNode;
  return c && c.dataset && c.dataset.w ? c : null;
}
function arrEmpezar(nodo, y){
  if(arrW) return;
  var r = nodo.getBoundingClientRect();
  var ph = document.createElement("div");
  ph.className = "caja fantasma";
  ph.style.height = r.height + "px";
  nodo.parentNode.insertBefore(ph, nodo);
  nodo.classList.add("arrastrando");
  nodo.style.position = "fixed";
  nodo.style.left = r.left + "px";
  nodo.style.top = r.top + "px";
  nodo.style.width = r.width + "px";
  nodo.style.zIndex = "60";
  arrW = {clave: nodo.dataset.w, nodo: nodo, ph: ph, dy: y - r.top};
  document.body.classList.add("arrastrando-w");
}
// donde caeria: la primera caja cuyo centro queda abajo del dedo
function arrMover(y){
  if(!arrW) return;
  arrW.nodo.style.top = (y - arrW.dy) + "px";
  var cs = [].filter.call(widgetsEl.children, function(c){
    return c !== arrW.nodo && c !== arrW.ph && c.dataset && c.dataset.w;
  });
  for(var i = 0; i < cs.length; i++){
    var r = cs[i].getBoundingClientRect();
    if(y < r.top + r.height / 2){
      if(arrW.ph.nextSibling !== cs[i]) widgetsEl.insertBefore(arrW.ph, cs[i]);
      return;
    }
  }
  if(cs.length) widgetsEl.insertBefore(arrW.ph, cs[cs.length - 1].nextSibling);
}
function arrSoltar(){
  if(!arrW) return;
  var a = arrW; arrW = null; arrUlt = Date.now();
  document.body.classList.remove("arrastrando-w");
  a.nodo.classList.remove("arrastrando");
  a.nodo.removeAttribute("style");
  a.ph.parentNode.insertBefore(a.nodo, a.ph);
  a.ph.parentNode.removeChild(a.ph);
  var vis = [].map.call(widgetsEl.children, function(c){ return (c.dataset || {}).w || ""; })
              .filter(function(x){ return x; });
  guardarOrden(mezclarOcultas(vis), true);
}
function arrCancelarHold(){ if(arrHold){ clearTimeout(arrHold); arrHold = null; } arrTocado = null; }

widgetsEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "touch" || e.button !== 0) return;    // el celu va por touchstart (hold)
  var c = cajaDeHeader(e.target);
  if(!c) return;
  var y0 = e.clientY, listo = false;
  function mover(ev){
    if(!listo){
      if(Math.abs(ev.clientY - y0) < ARR_PX) return;
      listo = true;
      arrEmpezar(c, y0);
    }
    arrMover(ev.clientY);
    ev.preventDefault();
  }
  function fin(){
    document.removeEventListener("pointermove", mover);
    document.removeEventListener("pointerup", fin);
    document.removeEventListener("pointercancel", fin);
    if(listo) arrSoltar();
  }
  document.addEventListener("pointermove", mover);
  document.addEventListener("pointerup", fin);
  document.addEventListener("pointercancel", fin);
});

widgetsEl.addEventListener("touchstart", function(e){
  arrCancelarHold();
  if(e.touches.length !== 1 || arrW) return;
  var c = cajaDeHeader(e.target);
  if(!c) return;
  var t = e.touches[0];
  arrTocado = {nodo: c, x: t.clientX, y: t.clientY};
  arrHold = setTimeout(function(){
    arrHold = null;
    if(!arrTocado) return;
    arrEmpezar(arrTocado.nodo, arrTocado.y);
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){}
  }, HOLD_MS);
}, {passive: true});
// no pasivo a proposito: una vez que agarro la caja, el dedo la mueve y no scrollea el panel
widgetsEl.addEventListener("touchmove", function(e){
  var p = e.touches[0];
  if(!p) return;
  if(arrHold && arrTocado &&
     (Math.abs(p.clientX - arrTocado.x) > HOLD_PX || Math.abs(p.clientY - arrTocado.y) > HOLD_PX)){
    arrCancelarHold();       // era un scroll, no un arrastre
    return;
  }
  if(arrW){ arrMover(p.clientY); e.preventDefault(); }
}, {passive: false});
["touchend", "touchcancel"].forEach(function(ev){
  widgetsEl.addEventListener(ev, function(){
    arrCancelarHold();
    if(arrW) arrSoltar();
  }, {passive: true});
});

// ---------- settings de un widget (facundo, 2026-09-12) ----------
// el `[⚙]` del header abre el MISMO modal con look terminal: una accion por setting, que la cambia
// en el momento (bool: si/no; opciones: cicla la lista) y repinta. se guardan en `tabs.json`.
function valorTxt(v){
  if(v === true) return "si";
  if(v === false) return "no";
  if(v === 0) return "todas";
  return String(v);
}
function modalSets(clave){
  var ls = setsDe(clave);
  var pos = ordenarClaves(clavesW.slice()).indexOf(clave);
  var m = {titulo: "settings \u00b7 " + clave, tema: "tools", acciones: [],
           cuerpo: '<span class="g">se guardan en el buz\u00f3n: las ves igual en el celu y en la compu.' +
                   (pos >= 0 ? " caja " + (pos + 1) + " de " + clavesW.length +
                               " (se arrastra del header).</span>" : "</span>")};
  ls.forEach(function(st){
    var v = wset(clave, st.k);
    m.acciones.push([st.et + ": " + valorTxt(v), function(){
      var nuevo;
      if(st.tipo === "bool") nuevo = !v;
      else{
        var ops = st.ops || [], i = ops.indexOf(v);
        nuevo = ops[(i + 1) % (ops.length || 1)];
        if(nuevo === undefined) nuevo = st.def;
      }
      guardarWset(clave, st.k, nuevo);
      pintarModal(modalSets(clave));      // el modal se queda abierto con el valor nuevo
    }, false]);
  });
  if(clave === "avisos"){
    // ios pide permiso solo dentro de un toque: la accion llama directo a activarPush
    m.acciones.push(["notificaciones: " + pushTexto(), function(){
      activarPush().then(function(){ pintarModal(modalSets(clave)); });
    }, false]);
  }
  // la alternativa sin arrastrar (facundo, 2026-09-12: "por si el drag no va")
  m.acciones.push(["subir", function(){
    moverWidget(clave, -1); pintarModal(modalSets(clave));
  }, false]);
  m.acciones.push(["bajar", function(){
    moverWidget(clave, 1); pintarModal(modalSets(clave));
  }, false]);
  m.acciones.push(["volver a los valores de f\u00e1brica", function(){
    wsets[clave] = {ts: Math.max(Date.now(), (+((wsets[clave] || {}).ts) || 0) + 1)};
    guardarCache(); publicarTabs(false, WSETS_DEBOUNCE); repintarWidgets();
    pintarModal(modalSets(clave));
  }, false]);
  m.acciones.push(["cerrar", cerrarModal, true]);
  return m;
}
function abrirSets(clave){ pintarModal(modalSets(clave)); }

function pintarModal(m){
  modalAbierto = m;
  $("mtitulo").textContent = m.titulo || "item";
  $("mcuerpo").innerHTML = m.cuerpo || "";
  var acc = $("macc");
  acc.innerHTML = "";
  (m.acciones || []).forEach(function(a, i){
    var b = document.createElement("button");
    b.type = "button";
    if(a[2]) b.className = "principal";
    if(a[3]) b.classList.add(a[3]);
    b.innerHTML = '<span class="let">' + LETRAS[i] + ")</span>" + esc(a[0]);
    b.addEventListener("click", a[1]);
    acc.appendChild(b);
  });
  $("modal").classList.remove("oculta");
  $("mfondo").classList.remove("oculta");
}
function cerrarModal(){
  modalAbierto = null;
  $("modal").classList.add("oculta");
  $("mfondo").classList.add("oculta");
  $("macc").innerHTML = "";
}
$("mfondo").addEventListener("click", cerrarModal);
$("mcerrar").addEventListener("click", cerrarModal);

// ---------- menu contextual (facundo, 2026-09-11) ----------
// tap and hold (~500 ms, sin disparar el scroll ni la seleccion) en el celu y click derecho en desktop:
// sobre un mensaje del chat (responder / copiar / editar / mandar a otra pestaña), sobre una fila de un
// widget (abre el modal a/b/c que ya existe, o copiar) y sobre una pestaña (cerrar / renombrar / al lado
// de los widgets). se cierra con esc, tocando afuera o al scrollear.
var HOLD_MS = 500;      // cuanto hay que mantener el dedo apoyado
var HOLD_PX = 10;       // si se mueve mas que esto, era un scroll: no hay menu
var MENU_MS = 400;      // el click que viene atras del hold no cierra el menu recien abierto
var CITA_LINEAS = 3, CITA_CHARS = 120;
var menuAbierto = null, menuTs = 0, menuNodo = null;

function cerrarMenu(){
  menuAbierto = null;
  $("ctx").classList.add("oculta"); $("ctx").innerHTML = "";
  $("ctxfondo").classList.add("oculta");
  document.body.classList.remove("sinsel");
  if(menuNodo){ menuNodo.classList.remove("marcado"); menuNodo = null; }
}
// `opciones` es [texto, funcion]. (x, y) es donde se toco: el menu se acomoda para no salirse.
function menu(x, y, titulo, opciones, nodo){
  cerrarMenu();
  var d = $("ctx");
  if(titulo){
    var t = document.createElement("div");
    t.className = "ctit"; t.textContent = titulo;
    d.appendChild(t);
  }
  opciones.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[0];
    b.addEventListener("click", function(){ cerrarMenu(); o[1](); });

// login por clave (provisorio): clave.json trae el token cifrado (PBKDF2 + AES-GCM, lo publica recetas/web_clave.sh)
function b64a(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function entrarConClave(){
  var c = $("clave").value;
  if(!c) return;
  $("login-err").textContent = "descifrando...";
  fetch("clave.json?v=" + Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no hay clave.json publicado (correr recetas/web_clave.sh)");
    return r.json();
  }).then(function(j){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64a(j.salt), iterations:j.it||300000, hash:"SHA-256"}, base,
                                     {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64a(j.iv)}, key, b64a(j.ct));
    });
  }).then(function(buf){
    $("clave").value = "";
    arrancar(new TextDecoder().decode(buf).trim());
  }).catch(function(e){
    $("login-err").textContent = (e && /decrypt|operation/i.test(e.message)) ? "clave incorrecta" : ("error: " + e.message);
  });
}

  // separador arrastrable entre chat y widgets
  split: function(){
    var chat = $("panel-chat"), w = $("panel-widgets"), sep = $("sep");
    return {pct: splitPct(), guardado: splitLimpio(),
            anchoChat: chat.getBoundingClientRect().width,
            anchoWidgets: w.getBoundingClientRect().width,
            sepVisible: sep.offsetWidth > 0};
  },
  guardarSplit: guardarSplit, recibirSplit: recibirSplit, aplicarSplit: aplicarSplit,
  verPanel: verPanel,
  limitarPct: limitarPct, splitMin: SPLIT_MIN,
  guardarVista: guardarVista, recibirVistas: recibirVistas, aplicarVista: aplicarVista,
  restaurarVistas: restaurarVistas, anclaDe: anclaDe,
  sync: function(){ return {sincronizando: sincronizando, texto: $("sync").textContent,
                            visible: !$("sync").classList.contains("oculta"),
                            off: $("sync").classList.contains("off")}; },
  pintarSync: pintarSync, sincronizar: sincronizar, alVolver: alVolver,
  caja: function(){ return {tema: temaCaja, texto: txt.value, sel: txt.selectionStart}; },
  // sugerencias de respuesta arriba del input (cero tokens): salen de la ultima respuesta de la pestaña
  sugerencias: sugerencias, pintarChips: pintarChips, ultimaRespuesta: ultimaRespuesta,
  chips: function(){
    return [].map.call(document.querySelectorAll("#chips button"), function(b){
      return {cmd: b.dataset.cmd, texto: b.textContent};
    });
  },
  chipsVisibles: function(){ return !$("chips").classList.contains("oculta"); },
  tocarChip: function(cmd){
    var ns = document.querySelectorAll("#chips button");
    for(var i = 0; i < ns.length; i++)
      if(ns[i].dataset.cmd === cmd){ ns[i].click(); return true; }
    return false;
  },
  cuerpoMsg: cuerpoMsg, deEstaTab: deEstaTab, enviarMensaje: enviarMensaje, mandar: mandar,
  // camara: `prueba_web_tabs` enchufa un `fetch` falso y manda un File de juguete
  mandarFoto: mandarFoto, comprimirFoto: comprimirFoto, nombreFoto: nombreFoto, sha12: sha12,
  // adjunto pendiente: la foto y el audio no se mandan solos, esperan a enviar (prueba_web_tabs)
  adjuntarFoto: adjuntarFoto, adjuntarAudio: adjuntarAudio, mandarAdjunto: mandarAdjunto,
  descartarAdjunto: descartarAdjunto,
  adjunto: function(){
    if(!adjunto) return null;
    var c = $("adjunto");
    return {tipo: adjunto.tipo, nombre: adjunto.nombre, ms: adjunto.ms || 0,
            visible: !c.classList.contains("oculta"),
            mini: !!c.querySelector("img"), play: !!c.querySelector(".play"),
            texto: (c.querySelector(".adj-info") || {}).textContent || ""};
  },
  tocarAdjuntoX: function(){
    var b = $("adjunto").querySelector(".adj-x");
    if(!b) return false;
    b.click(); return true;
  },
  stubFoto: function(f){ fotoStub = f || null; },
  tocarCamara: function(){ $("camara").click(); },
  imagenDe: imagenDe,
  fotoTope: FOTO_TOPE,
  // audios: `prueba_web_audio` graba sin microfono (manda el blob a mano) y chequea los [▶]
  mandarAudio: mandarAudio, nombreAudio: nombreAudio, extAudio: extAudio, mimeAudio: mimeAudio,
  conAudios: conAudios, reproductor: reproductor, audioTope: AUDIO_TOPE, audioMinMs: AUDIO_MIN_MS,
  empezarGrabacion: empezarGrabacion, terminarGrabacion: terminarGrabacion,
  grabando: function(){ return {grabando: !!grabador, micro: !!stream,
                                marcado: $("grabar").classList.contains("grabando"),
                                reloj: $("grabinfo").textContent}; },
  plays: function(){        // los [▶] que hay pintados ahora, con de donde sale cada uno
    return [].map.call(document.querySelectorAll(".play"), function(b){
      return {src: b.dataset.src, donde: b.parentNode.className.indexOf("aud") >= 0 ? "cuerpo" : "cabecera"};
    });
  },
  stubAudioUrl: function(src, url){ if(url) audioUrls[src] = url; else delete audioUrls[src]; },
  gapInput: function(){          // px entre el borde de abajo del input y el borde de abajo del pie
    var f = $("fila").getBoundingClientRect(), p = $("pie").getBoundingClientRect();
    return Math.round(p.bottom - f.bottom);
  },
  gapChips: function(){          // px entre el chip mas bajo y la caja de texto (tiene que ser 0)
    var b = $("chips").querySelector("button"), f = $("txt").getBoundingClientRect();
    if(!b) return -1;
    return Math.round(f.top - b.getBoundingClientRect().bottom);
  },
  teclado: function(on){         // simula el teclado del celu (visualViewport no se puede falsear)
    document.body.classList.toggle("teclado", !!on);
  },
  // `visualViewport` no se puede falsear: se stubea y se llama a `ajustarAlto` a mano.
  stubVV: function(v){ vvStub = v || null; ajustarAlto(); },
  ajustarAlto: ajustarAlto,
  viewportInfo: function(){          // donde quedaron el body y el pie respecto del viewport visible
    var p = $("pie").getBoundingClientRect(), v = vvActual() || {height: window.innerHeight, offsetTop: 0};
    return {alto: getComputedStyle(document.documentElement).getPropertyValue("--alto").trim(),
            transform: document.body.style.transform,
            posHtml: getComputedStyle(document.documentElement).position,
            posBody: getComputedStyle(document.body).position,
            ovHtml: getComputedStyle(document.documentElement).overflow,
            scrollY: window.scrollY || window.pageYOffset || 0,
            // 0 = el pie termina justo en el borde de abajo del viewport visible (sin franja negra)
            sobra: Math.round((v.offsetTop || 0) + v.height - p.bottom)};
  },
  seguirAlFinal: seguirAlFinal,
  // envio idempotente: dos enter rapidos no mandan dos veces (prueba_web_tabs lo chequea)
  envios: function(){ return {enviando: enviando, ultimo: ultimoTexto, repeMs: REPE_MS}; },
  stubApi: function(f){ apiStub = f || null; },
  // lan primero (prueba_web_tabs simula el endpoint vivo y caido)
  stubLan: function(f){ lanStub = f || null; }, probarLan: probarLan, lanPoner: lanPoner, lanCandidatos: lanCandidatos,
  // la prueba corre sin login: un token de mentira solo mientras se arma el PUT (el stub de la lan no lo mira)
  ponerTabs: function(){ var t0 = token; token = token || "t-prueba"; tabsListo = true; tabsSync = true;
                         frenoHasta = 0; var p = ponerTabs(false); token = t0; return p; },
  sinGithub: function(){ return !!lan.sinGithub; },
  lan: function(){ return {base: lan.base, via: lan.via, texto: ($("via") || {}).textContent}; },
  subirBuzon: subirBuzon, cargarComentarios: cargarComentarios, cargarWidgets: cargarWidgets, bajarBlob: bajarBlob,
  normTema: normTema, padreTema: padreTema,
  resaltar: resaltar, pintarWidgets: pintarWidgets, refrescarEdad: refrescarEdad,
  // modal de items de widget: `recetas/prueba_web_tabs` lo abre y lee lo que quedo pintado
  abrirModal: abrirModal, cerrarModal: cerrarModal, modalDe: modalDe,
  items: function(){ return itemsW; },
  modalInfo: function(){
    if(!modalAbierto) return null;
    return {titulo: $("mtitulo").textContent, cuerpo: $("mcuerpo").textContent, tema: modalAbierto.tema,
            acciones: [].map.call($("macc").querySelectorAll("button"), function(b){ return b.textContent; })};
  },
  // menu contextual: `recetas/prueba_web_tabs` pide el menu sobre un mensaje y lee lo que quedo
  menu: menu, cerrarMenu: cerrarMenu, citaDe: citaDe, holdMs: HOLD_MS,
  menuInfo: function(){
    if(!menuAbierto) return null;
    return {titulo: $("ctx").querySelector(".ctit") ? $("ctx").querySelector(".ctit").textContent : "",
            opciones: [].map.call($("ctx").querySelectorAll("button"), function(b){ return b.textContent; }),
            visible: !$("ctx").classList.contains("oculta"),
            dentro: (function(){ var r = $("ctx").getBoundingClientRect();
                                 return r.left >= 0 && r.top >= 0 &&
                                        r.right <= window.innerWidth && r.bottom <= window.innerHeight; })()};
  },
  // dispara el gesto como lo haria el click derecho (el hold del celu termina en lo mismo)
  menuEn: function(sel, n){
    var ns = document.querySelectorAll(sel);
    var nodo = ns[n || 0];
    if(!nodo) return false;
    var r = nodo.getBoundingClientRect();
    nodo.dispatchEvent(new MouseEvent("contextmenu", {bubbles: true, cancelable: true,
                                                      clientX: Math.round(r.left + 5),
                                                      clientY: Math.round(r.top + 5)}));
    return !!menuAbierto;
  },
  tocarMenu: function(texto){
    var bs = $("ctx").querySelectorAll("button");
    for(var i = 0; i < bs.length; i++)
      if((bs[i].textContent || "").indexOf(texto) >= 0){ bs[i].click(); return true; }
    return false;
  },
  tocarItem: function(sel){          // click sobre la n-esima fila tocable de los widgets
    var ns = document.querySelectorAll("#widgets [data-it]");
    if(typeof sel === "number") return ns[sel] ? (ns[sel].click(), true) : false;
    for(var i = 0; i < ns.length; i++)
      if((ns[i].textContent || "").indexOf(sel) >= 0){ ns[i].click(); return true; }
    return false;
  },
  cargar: function(coms){
    msgsCom = []; vistos = {};
    coms.forEach(function(c){ agregar(c, false); });
    mezclar(); render();
    return msgs.map(function(m){ return {id: m.id, tema: m.tema, texto: m.texto}; });
  },
  // historial por tema: lo que publica el daemon en `chat/<tema>.json`
  cargarChat: cargarChat, cargarChatTema: cargarChatTema, recibirChat: recibirChat, render: render,
  temasACargar: temasACargar, archivoChat: archivoChat, mezclar: mezclar, claveMsg: claveMsg,
  hist: function(t){ return (msgsHist[normTema(t)] || []).map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso, audio: m.audio || null}; }); },
  charla: function(){ return msgs.map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso}; }); },
  chatIndex: function(){ return chatIndex; },
  limpiarChat: function(){ msgsHist = {}; msgsCom = []; chatIndex = null; etagChat = {};
                           msgs = []; render(); },
  // el chat es un panel unico: `enPanel()` cuenta los mensajes pintados en la pestaña activa
  enPanel: function(){ return lista ? lista.querySelectorAll(".msg:not(.vuelo)").length : -1; },
  // estado en vivo y una sola respuesta por mensaje (2026-09-13, prueba_web_tabs lo chequea)
  leerMeta: leerMeta, modeloCorto: modeloCorto, sinDobles: sinDobles, claveEstado: claveEstado,
  vueloIniciar: vueloIniciar, vueloTerminar: vueloTerminar, recibirEstado: recibirEstado,
  vuelo: function(){ return vuelo ? {clave: vuelo.clave, palabra: vuelo.palabra, eta: vuelo.eta, giro: vuelo.giro} : null; }
};

})();
</script>
</body>
