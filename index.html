    if(!j || j.error) throw new Error(j && j.error || "no existe");
    docs.doc = j; docs.aviso = "";
    docsCacheGuardar("doc:" + id, j);
    docsPintar();
    return j;
  }).catch(function(e){
    docs.aviso = "no llegué al server (" + (e && e.message || e) + ")" + (docs.doc && docs.doc.html ? ": esto es lo último que tenía" : "");
    if(docs.doc) docs.doc.cargando = false;

}
function docsCerrarDoc(){ docs.doc = null; docs.aviso = ""; docsPintar(); return docsCargarIndice(); }
function docsSolapa(cual){
  docs.solapa = cual === "archivados" ? "archivados" : "docs";

// tildar una fila, dejarle una nota o archivar el informe: el server contesta el doc entero ya repintado
function docsMandar(cuerpo){
  var id = (docs.doc || {}).id;
  if(!id) return Promise.resolve(null);
  return docsPedir("/docs/" + encodeURIComponent(id), {method: "POST",
      headers: {"content-type": "application/json"}, body: JSON.stringify(cuerpo)}).then(function(j){
    if(!j || j.error) throw new Error(j && j.error || "no se pudo");
    docs.doc = j; docs.aviso = "";
    docsCacheGuardar("doc:" + id, j);
    docsPintar();
    return j;
  }).catch(function(e){
    docs.aviso = "no se pudo guardar (" + (e && e.message || e) + ")";

  // el indice y el informe son SIEMPRE dos paneles en el dom: en el celu se ve uno solo (sub-vistas separadas,

  $("docscuenta").textContent = hay ? ((docs.doc.tema || "") + (docs.doc.fecha ? " · " + docs.doc.fecha : ""))

  // tildar una fila no vuelve a dibujar los 480 informes ni le mueve el scroll a facundo
  var firma = [docs.solapa, docs.orden, docs.agrupar ? 1 : 0,
               (docs.idx || {}).ts, (docs.idx || {}).total, docs.idx ? 1 : 0].join("|");
  var ix;
  if(docsIxNodo && docsIxFirma === firma){
    ix = docsIxNodo;

  }else{
    ix = document.createElement("div"); ix.className = "dvindice"; ix.id = "docsindice";
    sp.appendChild(ix);          // `docsPintarIndice` busca `#docslista` por id: el panel va al dom ANTES de pintarlo
    docsPintarIndice(ix);
    docsIxNodo = ix; docsIxFirma = firma; docsIxScroll = 0;
  }
  ix.scrollTop = docsIxScroll;
  ix.onscroll = function(){ docsIxScroll = ix.scrollTop; };
  var dd = document.createElement("div"); dd.className = "dvdoc"; dd.id = "docsdoc";
  sp.appendChild(dd);
  if(hay) docsPintarDoc(dd);
  return el.innerHTML;
}

// la lista plana la manda el server (`indice().docs`); un indice viejo cacheado sin ella se aplana aca
function docsPlano(){
  var idx = docs.idx || {};
  if(idx.docs && idx.docs.length) return idx.docs.slice();
  var out = [];
  (idx.temas || []).forEach(function(t){ (t.docs || []).forEach(function(d){ out.push(d); }); });
  return out;
}
function docsOrdenar(ds){
  var l = ds.slice();
  if(docs.orden === "titulo") l.sort(function(a, b){
    var x = (a.titulo || a.archivo || ""), y = (b.titulo || b.archivo || "");
    return x.localeCompare(y, "es", {sensitivity: "base"}) || (b.mtime || 0) - (a.mtime || 0);
  });
  else l.sort(function(a, b){ return (b.mtime || 0) - (a.mtime || 0); });
  return l;
}
// agrupado si = un grupo por tema, como siempre (el orden de los grupos lo da el primero de la lista ya ordenada);
// agrupado no = UNA sola lista, con el tema como etiqueta chica en cada fila
function docsFiltrados(){
  var q = String(docs.q || "").trim().toLowerCase();
  var plano = docsOrdenar(docsPlano().filter(function(d){
    return !q || (d.titulo || "").toLowerCase().indexOf(q) >= 0 || (d.archivo || "").toLowerCase().indexOf(q) >= 0 ||
           (d.tema || "").toLowerCase().indexOf(q) >= 0;
  }));
  if(!docs.agrupar) return plano.length ? [{tema: "", docs: plano, plano: true}] : [];
  var orden = [], por = {};
  plano.forEach(function(d){
    if(!por[d.tema]){ por[d.tema] = []; orden.push(d.tema); }
    por[d.tema].push(d);
  });
  return orden.map(function(t){ return {tema: t, docs: por[t]}; });
}

      var fe = document.createElement("span"); fe.className = "dvfecha"; fe.textContent = d.fecha || "";
      b.appendChild(ti); b.appendChild(fe);
      if(d.tildes){ var c = document.createElement("span"); c.className = "dvtildes"; c.textContent = "✓ " + d.tildes; b.appendChild(c); }
      if(d.notas){ var nn = document.createElement("span"); nn.className = "dvnotasn"; nn.textContent = "✎ " + d.notas; b.appendChild(nn); }
      b.addEventListener("click", function(){ docsAbrir(d.id); });

// ---------- 1875: el board son VISTAS enteras (facundo, 2026-09-17) ----------
// "el tinder tiene que ser simplemente una vista entera, que se esconde cuando esta activa. chat / widget (o chat Y
// widget) tiene que ser una o dos vistas segun si es mobile o desktop y tambien esconderse el que esta activo".
// cuatro vistas: `chat`, `widgets`, `tinder` (el votador) y `podcast`. el estado es UNA sola (`vistaOn`, la que
// facundo eligio) y el body lleva su clase `v-<vista>`: que en DESKTOP `chat` y `widgets` se vean las dos, una al
// lado de la otra, lo decide el CSS con el mismo media query de siempre, no el js. asi girar el celu o agrandar la
// ventana no puede dejar el board con un layout viejo aunque no llegue ningun evento.
// el icono de la vista activa se esconde (en desktop, con chat o widgets puesta, se esconden los dos) y tocar otro
// icono cambia de vista. cambiar de vista no recarga nada (1793) y el ancla del chat (1813) se guarda por vista.
// 1933 {instatinder} (facundo, 2026-09-17): la vista del votador de instagram se llama `instatinder` en todo lo
// que ve facundo (la clave interna sigue siendo `tinder`) y `votar` es una vista propia: las votaciones puntuales
// que NO son instagram (checkboxes: animaciones, tandas), con su icono fucsia en la barra.
var VISTAS_TODAS = ["chat", "widgets", "tinder", "votar", "podcast", "home", "docs"];
var VISTA_SOLAS = ["tinder", "votar", "podcast", "home", "docs"];       // ocupan la pantalla entera, nunca conviven con otra
var VISTA_LS = "agente_vista";
// 1930 {barra} (facundo, 2026-09-17): "lo que vos tenes que guardar es, en el caso de que yo me haya ido de la vista
// de chat, lo que sea que este viendo de las dos opciones en el celular; y si es en el desktop queda por default chat".
// `vistaDoble` es cual de las dos (`chat` | `widgets`) estabas viendo: se guarda por pestaña y es a la que se vuelve
// al salir de `tinder` o de `podcast`, tambien despues de un reload.
var VISTA_DOBLE_LS = "agente_vista_doble";
var vistaOn = "chat", vistaPrevia = null, vistaAnclas = {}, vistaDoble = "chat";
function vistaNorm(n){ return VISTAS_TODAS.indexOf(n) >= 0 ? n : "chat"; }
// lo que se esta viendo de verdad: en desktop `chat` y `widgets` son la misma vista doble
function vistaSet(){
  if(VISTA_SOLAS.indexOf(vistaOn) >= 0) return [vistaOn];
  return esVistaMobile() ? [vistaOn] : ["chat", "widgets"];
}
function vistaEs(n){ return vistaSet().indexOf(n) >= 0; }
function vistaEsDoble(n){ return n === "chat" || n === "widgets"; }
function vistaGuardar(){
  try{
    sessionStorage.setItem(VISTA_LS, vistaOn);
    sessionStorage.setItem(VISTA_DOBLE_LS, vistaDoble);
  }catch(x){}
}
function vistaPintar(){
  VISTAS_TODAS.forEach(function(n){ document.body.classList.toggle("v-" + n, vistaOn === n); });
  // compat: la vuelta del modal de la campana venia mirando `ver-widgets`
  document.body.classList.toggle("ver-widgets", vistaOn === "widgets");
  // 1930: el icono de la vista activa no se pinta, asi que ninguno de los dos lleva nunca el verde de `.on`
  // el fueguito es el icono de la vista `tinder` y lo esconde `selBoton` (que ademas cuenta lo que hay para votar);
  // los otros tres los esconde el css. esto nunca puede voltear el pintado de las vistas.
  try{ selBoton(); }catch(x){}

// cambia de vista. guarda el ancla del chat antes de sacarlo de pantalla y lo repone al volver (1813)
function vistaPoner(n){
  n = vistaNorm(n);

  if(vistaEs("chat")) vistaAnclas.chat = anclaUlt || anclaMedir();
  vistaPrevia = vistaOn;
  vistaOn = n;
  if(vistaEsDoble(n)) vistaDoble = n;   // 1930: a esta se vuelve al salir del tinder o del podcast
  vistaGuardar();
  // 1922 {vistatinder}: dejar la vista `tinder` por la barra cierra su caja; al volver arranca en `home`
  if(vistaPrevia === "tinder" && n !== "tinder") tinderSalir();
  if(vistaPrevia === "votar" && n !== "votar") votacionSalir();   // 1933 {instatinder}
  if(vistaPrevia === "podcast" && n !== "podcast") pod.ep = null;
  if(vistaPrevia === "docs" && n !== "docs") docs.doc = null;   // 1676: salir por la barra cierra el informe abierto
  vistaPintar();
  if(vistaEs("widgets") && Date.now() - widUlt > 15000) cargarWidgets().catch(function(){});
  if(vistaEs("podcast")) podVistaPintar();
  if(vistaEs("home")) homePintar();   // 2008 paso 10
  if(vistaEs("docs")){ docsPintar(); docsCargarIndice(); }   // 1676 {vista}: la cache pinta, el server manda (2143)
  if(vistaEs("chat")){
    var a = vistaAnclas.chat;
    if(a && anclaPoner(a)){

function b64a(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function entrarConClave(){

  fetch("clave.json?v=" + Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no hay clave.json publicado (correr recetas/web_clave.sh)");
    return r.json();

    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]).then(function(base){

    });

    if(!i) return false;
    i.checked = !!v;
    i.dispatchEvent(new Event("change", {bubbles: true}));
    return true;
  },
  audSegPoner: audSegPoner, audSegs: function(){ return audSegs; },
  notisAccion: function(){ return notisAccion().map(function(g){ return {id: g.noti.id, n: g.n, familia: g.familia}; }); },
  campana: function(){
    var b = $("badge"), c = $("campana"), l = $("nlista"), rc = c.getBoundingClientRect();
    return {n: b.classList.contains("oculta") ? 0 : parseInt(b.textContent, 10) || 0, texto: b.textContent,
            nivel: NIVELES_NOTI.filter(function(x){ return b.classList.contains(x); })[0] || null,
            fondo: getComputedStyle(b).backgroundColor, ancho: Math.round(rc.width), alto: Math.round(rc.height),
            svg: !!c.querySelector("svg"), borde: getComputedStyle(c).borderTopWidth, bg: getComputedStyle(c).backgroundColor,
            izqPersona: rc.right <= $("persona").getBoundingClientRect().left + 1,
            abierta: !l.classList.contains("oculta"), todas: !!l.querySelector("[data-ntodas]"),
            // 2022 {campana}: la solapa puesta, las dos etiquetas y cuantas entran en cada clase
            solapa: campanaSolapa, accion: notisAccion().length, sinLeer: notisNoLeidas().length,
            solapas: [].map.call(l.querySelectorAll(".nsolb"), function(x){
              return {cual: x.dataset.nsol, txt: x.textContent.trim(), on: x.classList.contains("on")}; }),
            filas: [].map.call(l.querySelectorAll(".nfila"), function(f){
              var r = f.getBoundingClientRect(), lz = f.querySelector(".luz");
              return {id: f.dataset.nid, nivel: lz ? lz.className.replace("luz", "").trim() : "",
                      veces: (f.querySelector(".nn") || {}).textContent || "",
                      cerrar: (f.querySelector("[data-ncerrar]") || {dataset: {}}).dataset.ncerrar || "",
                      fondo: lz ? getComputedStyle(lz).backgroundColor : "", hora: (f.querySelector(".nh") || {}).textContent,
                      texto: (f.querySelector(".nt") || {}).textContent, alto: Math.round(r.height),
                      acciones: [].map.call(f.querySelectorAll(".nacc"), function(a){ return a.title || a.textContent; })};
            })};
  },
  persona: function(){
    var p = $("persona"), r = p.getBoundingClientRect(), s = getComputedStyle(p);
    return {svg: !!p.querySelector("svg"), ancho: Math.round(r.width), alto: Math.round(r.height), borde: s.borderTopWidth,
            bg: s.backgroundColor, bb: p.classList.contains("bb"), ajustes: !!$("ajustes")};
  },
  subirBuzon: subirBuzon, cargarComentarios: cargarComentarios, cargarWidgets: cargarWidgets, bajarBlob: bajarBlob,
  normTema: normTema, padreTema: padreTema,
  resaltar: resaltar, pintarWidgets: pintarWidgets, refrescarEdad: refrescarEdad,
  // modal de items de widget: `recetas/prueba_web_tabs` lo abre y lee lo que quedo pintado
  abrirModal: abrirModal, cerrarModal: cerrarModal, modalDe: modalDe,
  // la caja verde `dale` de una accion (1762/1862): `prueba_web_acciones` la arma y la toca
  accionesDe: accionesDe, accMandar: accMandar, accReset: accReset,
  items: function(){ return itemsW; },
  modalInfo: function(){
    if(!modalAbierto) return null;
    var bd = $("macc").querySelector(".accdale");   // 1862: la caja verde `dale` de una accion de la cola
    return {titulo: $("mtitulo").textContent, cuerpo: $("mcuerpo").textContent, tema: modalAbierto.tema,
            dale: bd ? {txt: bd.textContent.trim(), clase: bd.className, aria: bd.getAttribute("aria-label")} : null,
            acciones: [].map.call($("macc").querySelectorAll("button"), function(b){ return b.textContent; })};
  },
  // menu contextual: `recetas/prueba_web_tabs` pide el menu sobre un mensaje y lee lo que quedo
  menu: menu, cerrarMenu: cerrarMenu, citaDe: citaDe, holdMs: HOLD_MS,
  menuInfo: function(){
    if(!menuAbierto) return null;
    return {titulo: $("ctx").querySelector(".ctit") ? $("ctx").querySelector(".ctit").textContent : "",
            opciones: [].map.call($("ctx").querySelectorAll("button"), function(b){ return b.textContent; }),
            visible: !$("ctx").classList.contains("oculta"),
            dentro: (function(){ var r = $("ctx").getBoundingClientRect();
                                 return r.left >= 0 && r.top >= 0 &&
                                        r.right <= window.innerWidth && r.bottom <= window.innerHeight; })()};
  },
  // dispara el gesto como lo haria el click derecho (el hold del celu termina en lo mismo)
  menuEn: function(sel, n){
    var ns = document.querySelectorAll(sel);
    var nodo = ns[n || 0];
    if(!nodo) return false;
    var r = nodo.getBoundingClientRect();
    nodo.dispatchEvent(new MouseEvent("contextmenu", {bubbles: true, cancelable: true,
                                                      clientX: Math.round(r.left + 5),
                                                      clientY: Math.round(r.top + 5)}));
    return !!menuAbierto;
  },
  tocarMenu: function(texto){
    var bs = $("ctx").querySelectorAll("button");
    for(var i = 0; i < bs.length; i++)
      if((bs[i].textContent || "").indexOf(texto) >= 0){ bs[i].click(); return true; }
    return false;
  },
  tocarItem: function(sel){          // click sobre la n-esima fila tocable de los widgets
    var ns = document.querySelectorAll("#widgets [data-it]");
    if(typeof sel === "number") return ns[sel] ? (ns[sel].click(), true) : false;
    for(var i = 0; i < ns.length; i++)
      if((ns[i].textContent || "").indexOf(sel) >= 0){ ns[i].click(); return true; }
    return false;
  },
  cargar: function(coms){
    msgsCom = []; vistos = {};
    coms.forEach(function(c){ agregar(c, false); });
    mezclar(); render();
    return msgs.map(function(m){ return {id: m.id, tema: m.tema, texto: m.texto}; });
  },
  // historial por tema: lo que publica el daemon en `chat/<tema>.json`
  cargarChat: cargarChat, cargarChatTema: cargarChatTema, recibirChat: recibirChat, render: render,
  // 1622 {seleccion}: la pausa del repintado del historial (`prueba_web_seleccion`)
  selTxViva: selTxViva, selTxEstado: selTxEstado, selTxSoltar: selTxSoltar, renderYa: renderYa,
  temasACargar: temasACargar, archivoChat: archivoChat, mezclar: mezclar, claveMsg: claveMsg,
  hist: function(t){ return (msgsHist[normTema(t)] || []).map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso, audio: m.audio || null}; }); },
  charla: function(){ return msgs.map(function(m){
    return {id: m.id, tema: m.tema, clase: m.clase, texto: m.texto, iso: m.iso}; }); },
  chatIndex: function(){ return chatIndex; },
  limpiarChat: function(){ msgsHist = {}; msgsCom = []; chatIndex = null; etagChat = {};
                           msgs = []; render(); },
  // el chat es un panel unico: `enPanel()` cuenta los mensajes pintados en la pestaña activa
  enPanel: function(){ return lista ? lista.querySelectorAll(".msg:not(.vuelo)").length : -1; },
  // estado en vivo y una sola respuesta por mensaje (2026-09-13, prueba_web_tabs lo chequea)
  leerMeta: leerMeta, modeloCorto: modeloCorto, sinDobles: sinDobles, claveEstado: claveEstado,
  vueloIniciar: vueloIniciar, vueloTerminar: vueloTerminar, recibirEstado: recibirEstado,
  vuelo: function(){ return vuelo ? {clave: vuelo.clave, palabra: vuelo.palabra, paso: vuelo.paso || null, eta: vuelo.eta, giro: vuelo.giro} : null; },
  // 1776: el hilo progresivo. `tramos()` = los textos pintados en el chat, en orden (vuelo y respuestas)
  tramos: function(){ return lista ? [].map.call(lista.querySelectorAll(".msg .hilo .tramo"), function(d){
    return {clase: d.className, texto: d.textContent, msg: (d.closest(".msg") || {}).id || ((d.closest(".msg") || {}).dataset || {}).id || ""}; }) : []; },
  tramosSinFinal: tramosSinFinal, normTramo: normTramo,
  // 1793: el board por modulos. `prueba_web_modulos` mira desde aca que un repintado no toque el chat,
  // que `destruir()` no deje timers ni handlers colgados y que el fallback al reload siga estando.
  modulos: MODULOS,
  modInfo: function(){
    return {cargados: MODULOS.filter(function(k){ return !!mods[k]; }), cargas: modsCargas,
            ver: modsVer, error: modsError, cargando: modCargando,
            timers: MODULOS.reduce(function(n, k){ return n + (modsTimers[k] || []).length; }, 0),
            switches: Object.keys(MOLDE_SW).length, nombresSw: Object.keys(MOLDE_SW),
            links: document.querySelectorAll('link[rel="stylesheet"][href*="estilos.css"]').length,
            css: (($("cssppal") || {}).href || "").split("?v=")[1] || null,
            scripts: document.querySelectorAll('script[src*="widgets/"]').length};
  },
  cargarModulos: cargarModulos, repintarMod: repintarMod, soltarMod: soltarMod, swapCss: swapCss,
  mod: function(clave){ return mods[clave] || null; },   // 1849: la prueba le habla al modulo (`recibir`, `vivo`)
  widDatos: function(){ return widDatos; }, visibleForzar: function(v){ visibleForzada = !!v; },
  modHtml: modHtml, partes: function(){ return {vistas: partesVistas, ult: partesUlt}; },
  ponerPartes: function(p){ partesVistas = p || null; },
  partesDistintas: partesDistintas, partePintable: partePintable, aplicarPartes: aplicarPartes
};

})();
