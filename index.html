<!-- agente-web: fuentes chicas, auto actualizacion por version.json cada 60 s, mensajes siempre
     enteros (sin plegado) y **pestañas por tema** (2026-09-11): una pestaña por tema sobre el borde
     de arriba del panel de chat, el tema lo detecta el clasificador sin tokens (copia generada de
     recetas/clasificar_tema.py, bloque TEMAS-JS) y una pestaña se puede mandar al lado de los widgets.
     el texto del chat va en la paleta fluo (resaltar()): **negrita** amarilla, `code` cian, ## magenta,
     tablas con cabecera y filas alternadas, --- verde tenue, [tag] verde, ORDEN:/PROPUESTA: amarillo.
     lo chequea `python3 -m recetas.prueba_web_color` (va adentro de prueba_web). -->
<style>
  :root{
    --verde:#39ff14; --blanco:#e8e8e8; --gris:#666; --cian:#22d3ee;
    --magenta:#ff4fd8; --rojo:#ff4d4d; --amarillo:#ffd60a; --linea:#1c1c1c;
    --verde-tenue:#1f7a12; --linea-clara:#3a3a3a; --yo:#9be88a;
    --naranja:#ff9f1a;
    /* ---------- tonos de fondo (facundo, 2026-09-13, orden 1190) ----------
       look plano: chat, panel de widgets y cajas casi del mismo tono, la diferencia justa para
       distinguir el panel. se ajusta en un solo lugar: `--tono-paso` es cuanto aclara cada nivel
       sobre `--tono-base`. nivel 0 = chat, 1 = panel (y sus barras: notis, sync), 2 = caja y
       pestaña activa, 3 = lo hundido dentro de una caja (pista de las barras de usage).
       los hex de abajo son el fallback si el navegador no tiene `color-mix`. */
    --tono-base:#000000;
    --tono-paso:1.5%;
    --fondo-chat:var(--tono-base);
    --fondo-panel:#040404;
    --fondo-caja:#080808;
    --fondo-hundido:#0b0b0b;
  }
  @supports (background: color-mix(in srgb, #fff 1%, #000)){
    :root{
      --fondo-panel:color-mix(in srgb, #fff var(--tono-paso), var(--tono-base));
      --fondo-caja:color-mix(in srgb, #fff calc(var(--tono-paso) * 2), var(--tono-base));
      --fondo-hundido:color-mix(in srgb, #fff calc(var(--tono-paso) * 3), var(--tono-base));
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:var(--blanco)}
  /* ios safari: al abrir el teclado ademas de achicar el viewport visible scrollea la ventana
     entera, y el body (que mide el alto del viewport visible) se iba para arriba dejando una
     franja negra de ~150 px entre el input y el teclado (facundo, 2026-09-12). la ventana se
     bloquea: nada scrollea salvo `#hist`, asi que `scrollY` es siempre 0 y el unico
     desplazamiento que hay que compensar es el `offsetTop` del visualViewport. */
  html{height:100%;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0}
  body{
    font-family:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
    font-size:12px;line-height:1.55;letter-spacing:.01em;
    height:100dvh;height:var(--alto,100dvh);
    position:fixed;top:0;left:0;right:0;width:100%;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #cabecera{
    flex:0 0 auto;padding:8px 10px calc(8px) 10px;border-bottom:1px solid var(--linea);
    padding-top:calc(8px + env(safe-area-inset-top));background:#000;
    display:flex;gap:8px;align-items:center;justify-content:flex-end;
  }
  /* pwa de escritorio sin barra de titulo (facundo, 2026-09-13): con `window-controls-overlay` la barra
     sube a la franja del titulo (al lado de los semaforos de la mac) y se arrastra la ventana desde ahi.
     los botones y las pestañas no arrastran. en el celu no hay overlay: todo queda igual. */
  #cabecera{-webkit-app-region:drag;app-region:drag}
  #cabecera button,#tabs{-webkit-app-region:no-drag;app-region:no-drag}
  @media (display-mode: window-controls-overlay){
    #cabecera{
      box-sizing:border-box;padding:0 10px;
      margin-left:env(titlebar-area-x, 0px);
      width:env(titlebar-area-width, 100%);
      min-height:env(titlebar-area-height, 0px);
      height:env(titlebar-area-height, auto);
    }
  }
  /* `.bb` = boton de la barra de arriba. los seis (SERVER | MAC | CLOUD, chat | widgets y [⚙])
     usan esta misma clase: mismo alto, padding, fuente y borde (facundo, 2026-09-12). */
  .bb{
    flex:0 0 auto;box-sizing:border-box;background:#000;color:var(--gris);
    border:1px solid var(--linea);border-radius:4px;padding:4px 8px;margin:0;
    font:inherit;font-size:9px;line-height:14px;height:24px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
  }
  .bb:active{background:#111}
  #modal .macc button.confirmar{color:var(--rojo);border-color:var(--rojo)}
  #hist{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .msg{margin:0 0 14px 0;white-space:pre-wrap;word-break:break-word;font-size:12px}
  .msg .ts{color:var(--gris);font-size:10px}
  /* nodo · modelo y mini estado de cada respuesta (2026-09-13) */
  .msg .nodo,.msg .mini{color:var(--gris);font-size:10px;user-select:none}
  .msg .mini{margin-left:6px}
  /* mensaje en vuelo: spinner de texto, fase y eta mientras contesta el agente */
  .msg.vuelo .cuerpo{color:var(--gris)}
  .msg.vuelo .giro{color:var(--verde);display:inline-block;min-width:1ch;cursor:pointer}
  /* animaciones de caracteres (1373): una linea, todos los cuadros del mismo ancho (`Nch` lo pone animPoner), el
     alto fijo de una linea: ni saltan de costado ni empujan el renglon */
  .anim{display:inline-flex;flex-direction:column;white-space:pre;overflow:hidden;vertical-align:top;height:1.25em;line-height:1.25em}
  /* el ancho lo da un cuadro invisible de alto 0 (`data-medida`): `Nch` se quedaba corto con fuentes cuyo `0` no mide
     lo mismo que el resto y cortaba las de 9+ caracteres */
  .anim::after{content:attr(data-medida);display:block;height:0;visibility:hidden}
  /* votador por pares (1373): dos animaciones en vivo, `esta` debajo de cada una y `basta`. lado a lado en la mac,
     una arriba de la otra si no entran (celu) */
  #votar{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)) 10px;background:rgba(0,0,0,.9)}
  #votar.oculta,#votar .oculta{display:none!important}
  #votar .vtcaja{width:100%;max-width:420px;max-height:100%;overflow-y:auto;box-sizing:border-box;display:flex;
    flex-direction:column;gap:12px;padding:14px;background:#000;border:1px solid var(--verde);border-radius:4px}
  #votar .vttit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--verde);font-size:12px}
  #vtcuenta{color:var(--gris);font-size:10.5px}
  /* 1382: facundo pidio "mas angosta aun": cada tarjeta a la mitad (360 -> 180 px en la mac), el alto no cambia */
  #votar .vtpar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  #votar .vtlado{flex:0 1 180px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--linea);border-radius:4px}
  #votar .vtanim{display:flex;align-items:center;justify-content:center;min-height:62px;font-size:28px;color:var(--verde)}
  #votar .vtchico{text-align:center;font-size:12px;color:var(--gris)}
  #votar .vtchico .anim{color:var(--verde)}
  #votar .vtnom{text-align:center;font-size:10.5px;color:var(--gris)}
  #votar .vtbtn{min-height:52px;padding:12px;background:#000;color:var(--verde);border:1px solid var(--verde);border-radius:6px;
    font:inherit;font-size:16px;cursor:pointer;touch-action:manipulation}
  #votar .vtbtn:active{background:var(--verde);color:#000}
  #vtbasta.vtbtn{color:var(--rojo);border-color:var(--rojo)}
  #vtbasta.vtbtn:active{background:var(--rojo);color:#000}
  #votar .vtfin{display:flex;flex-direction:column;gap:8px}
  #vttxt{min-height:90px;padding:8px;background:#000;color:var(--blanco);border:1px solid var(--linea);border-radius:4px;
    font:inherit;font-size:14px;resize:vertical}
  #vtfinbtns{display:flex;gap:8px}
  #vtfinbtns .vtbtn{flex:1 1 0}
  #vtestado{color:var(--gris);font-size:10.5px;min-height:1em}
  /* seleccion con checkboxes (1388): modal generico, un renglon tocable por candidata (entero, no solo el cuadradito),
     texto libre, `aceptar` y `enviar texto`. en el celu ocupa el ancho y scrollea la lista; textarea a 16 px para que
     ios no haga zoom al tocarla */
  #selmodal{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)) 10px;background:rgba(0,0,0,.9)}
  #selmodal.oculta{display:none!important}
  #selmodal .selcaja{width:100%;max-width:520px;max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
    padding:14px;background:#000;border:1px solid var(--verde);border-radius:4px}
  #selmodal .seltit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--verde);font-size:12px}
  #selcuenta{color:var(--gris);font-size:10.5px;white-space:nowrap}
  #sellista{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
  #sellista .selitem{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 10px;box-sizing:border-box;
    border:1px solid var(--linea);border-radius:4px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #sellista .selitem.on{border-color:var(--verde)}
  #sellista input{flex:0 0 auto;width:22px;height:22px;margin:0;accent-color:var(--verde);cursor:pointer}
  #sellista .seltxt{display:flex;flex-direction:column;gap:2px;min-width:0}
  #sellista .selnom{color:var(--blanco);font-size:14px}
  #sellista .seldet,#sellista .selmot{color:var(--gris);font-size:11px;word-break:break-word}
  #sellista .selmot{font-style:italic}
  /* 1398: la candidata puede traer su animacion corriendo en el renglon (`anim`), a la derecha del checkbox */
  #sellista .selanim{flex:0 0 auto;min-width:4ch;color:var(--verde);font-size:18px;text-align:center}
  #seltxt{min-height:64px;padding:8px;background:#000;color:var(--blanco);border:1px solid var(--linea);border-radius:4px;
    font:inherit;font-size:16px;resize:vertical}
  #selmodal .selbtns{display:flex;gap:8px}
  #selmodal .selbtn{flex:1 1 0;min-height:48px;padding:10px;background:#000;color:var(--verde);border:1px solid var(--verde);
    border-radius:6px;font:inherit;font-size:15px;cursor:pointer;touch-action:manipulation}
  #selmodal .selbtn:active{background:var(--verde);color:#000}
  #selmodal .selpie{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #selestado{color:var(--gris);font-size:10.5px;min-height:1em}
  #selcerrar{background:none;border:0;color:var(--gris);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}
  .msg .quien,.msg .ts{user-select:none}
  .msg .quien{color:var(--magenta)}
  .agente .quien{color:var(--magenta)}
  .agente .cuerpo{color:var(--blanco)}
  .yo .quien{color:var(--verde)}   /* `f` en verde (facundo, 2026-09-13) */
  .yo .cuerpo{color:var(--yo)}
  .error .cuerpo{color:var(--rojo)}
  /* cajas a/b/c debajo de una respuesta (facundo, 2026-09-13): A verde (la que haria claudio), B celeste (la
     segura), C fucsia (la transgresora). sin elegir: fondo negro, letra y borde del color. elegida: fondo del
     color, letra negra. **un solo toque manda y la deja marcada** (1202); tocar una caja de una respuesta que
     ya tiene marca pide confirmacion adentro de esa misma caja (`revertir?` / `sumo esta tambien?`) con un
     `si` / `no` de un tap. en fila; si no entran, apiladas. */
  .tnum{font-size:.8em;opacity:.7}
  .drafts{margin:6px 0 2px 0}
  .drafts .draft{position:relative;margin:4px 0}
  .drafts pre{margin:0;padding:6px 8px;background:#07222a;color:var(--cian);border:1px solid #1f3a44;border-radius:4px;
    white-space:pre-wrap;word-break:break-word;font:inherit;font-size:12px;user-select:text;-webkit-user-select:text}
  .drafts .copiar{position:absolute;top:3px;right:3px;background:#000;color:var(--gris);border:1px solid #1f3a44;
    border-radius:3px;font:inherit;font-size:10px;padding:1px 6px;cursor:pointer}
  /* 1214: `copiar` chico al lado de cada link, clave o `code` copiable de una respuesta de claudio. un toque copia
     (sin hold en el iphone) y dice `copiado` 1 s. el texto va por ::after asi no ensucia el textContent del mensaje.
     el hold sobre el boton no abre ni el menu propio ni el callout de ios. */
  .cuerpo .cp{display:inline-block;vertical-align:1px;margin:0 0 0 4px;background:#000;color:var(--gris);
    border:1px solid #1f3a44;border-radius:3px;font:inherit;font-size:9.5px;line-height:1.3;padding:0 5px;
    cursor:pointer;white-space:nowrap}
  .cuerpo .cp::after{content:attr(data-t)}
  .copiar,.cuerpo .cp{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent}
  .copiar.ok,.cuerpo .cp.ok{color:var(--verde);border-color:var(--verde-tenue)}
  .opciones{display:flex;gap:6px;margin:6px 0 2px 0;white-space:normal}
  .opciones .opc{
    flex:1 1 0;min-width:0;box-sizing:border-box;background:#000;border:1px solid;border-radius:4px;
    padding:6px 8px;font:inherit;font-size:11px;line-height:1.35;text-align:left;cursor:pointer;
    min-height:40px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:pan-y;word-break:break-word;
  }
  .opciones .opc .l{font-weight:600;margin-right:5px}
  /* 1203: hora de envio del mensaje que salio al tocar esa caja (hh:mm de buenos aires). chiquita, a la
     derecha; cada letra lleva la suya (al sumar `A y C`, la A conserva la hora de su toque). */
  .opciones .opc .hh{margin-left:6px;font-size:9px;opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
  .opciones .opc .hh:empty{display:none}
  .opciones .opc.conf .hh{display:none}       /* mientras pregunta, la caja es solo la pregunta */
  .opciones .opc.A{color:var(--verde);border-color:var(--verde)}
  .opciones .opc.B{color:var(--cian);border-color:var(--cian)}
  .opciones .opc.C{color:var(--magenta);border-color:var(--magenta)}
  .opciones .opc.A.sel{background:var(--verde);color:#000}
  .opciones .opc.B.sel{background:var(--cian);color:#000}
  .opciones .opc.C.sel{background:var(--magenta);color:#000}
  .opciones.hecho .opc:not(.sel){opacity:.45}          /* las no elegidas se apagan, pero se siguen pudiendo tocar */
  /* la confirmacion vive DENTRO de la caja tocada: le tapa el texto y deja `si` / `no` (facundo, 1202) */
  .opciones .opc .cf{display:none}
  .opciones .opc.conf{opacity:1}
  .opciones .opc.conf .t{display:none}
  .opciones .opc.conf .cf{display:block}
  .opciones .opc .cf .q{display:block;margin-bottom:4px}     /* la pregunta arriba, el sí/no abajo: entra en el celu */
  .opciones .opc .cf .si,.opciones .opc .cf .no{
    display:inline-block;border:1px solid;border-radius:3px;padding:1px 8px;margin-right:8px;font-weight:600;
  }
  @media (max-width:380px){ .opciones{flex-direction:column} }
  .sistema .cuerpo{color:var(--gris)}
  /* los mensajes se muestran siempre enteros: no hay plegado (facundo, 2026-09-10) */
  .cuerpo .ok{color:var(--verde)}
  .cuerpo .fallo{color:var(--rojo)}
  .cuerpo .pend{color:var(--amarillo)}
  .cuerpo .corriendo{color:var(--cian)}
  .cuerpo .costo{color:var(--magenta)}
  .cuerpo .marca{color:var(--gris)}
  /* ---------- color del texto (facundo, 2026-09-11: la paleta fluo tambien adentro del mensaje) ---------- */
  .cuerpo .neg{color:var(--amarillo);font-weight:600}          /* **negrita** */
  .cuerpo .cod{color:var(--cian);background:#07222a;border-radius:3px;padding:0 3px}  /* `code` */
  .cuerpo .tit{color:var(--magenta);font-weight:600}           /* ## titulo */
  .cuerpo .sep{color:var(--verde-tenue)}                       /* --- */
  .cuerpo .orden{color:var(--amarillo)}                        /* ORDEN: / PROPUESTA: */
  .cuerpo .tag{color:var(--verde)}                             /* [tema] / [openrouter/x] */
  .cuerpo .vin{color:var(--verde-tenue)}                       /* el guion de cada bullet */
  /* urls clickeables: una url larga (oauth) se abre tocandola, nunca se copia a mano ni se corta */
  .msg .cuerpo a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44;
                 overflow-wrap:anywhere;word-break:break-all}
  .msg .cuerpo a:active{color:var(--verde)}
  .cuerpo .tcab{color:var(--magenta);font-weight:600}          /* cabecera de tabla */
  .cuerpo .tsep{color:var(--linea-clara)}                      /* |---|---| */
  .cuerpo .tfila{color:var(--blanco)}
  .cuerpo .tfila.par{color:#b9c2c8;background:#0b0b0b}         /* filas alternadas */
  /* imagenes inline (facundo, 2026-09-11): el daemon publica el png en el repo del buzon y aca se
     baja con el mismo token (blob). click = tamaño real en el visor. */
  .cuerpo .img{display:block;margin:6px 0}
  .cuerpo .img img{
    display:block;max-width:100%;max-height:42vh;border:1px solid var(--linea-clara);
    border-radius:4px;background:#000;cursor:zoom-in
  }
  .cuerpo .img .pie{display:block;color:var(--gris);font-size:10px;margin-top:2px}
  .cuerpo .img .cargando{color:var(--cian)}
  .cuerpo .img .rota{color:var(--rojo)}
  #visor{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);overflow:auto;
    display:flex;align-items:center;justify-content:center;cursor:zoom-out
  }
  #visor img{max-width:100%;height:auto}
  #visor .cerrar{position:fixed;top:8px;right:12px;color:var(--verde);font-size:13px}
  #pie{
    flex:0 0 auto;border-top:0;background:transparent;
    padding:4px 10px calc(4px + env(safe-area-inset-bottom)) 10px;
  }
  /* con el teclado abierto ios deja igual el safe-area de abajo y queda una franja negra entre el
     input y el teclado (facundo, 2026-09-11: "hay un gap abajo de la linea del input"). mientras el
     teclado esta arriba el pie va pegado: lo marca `body.teclado` (visualViewport). */
  body.teclado #pie{padding-bottom:4px}
  /* adjunto pendiente (facundo, 2026-09-12: "cuando suba una foto tengo que poder borrarla o escribir
     algo, es decir que no se mande automaticamente el mensaje"). la foto o el audio quedan aca arriba
     del input hasta que facundo toca enviar; la `×` los descarta y no se sube nada. */
  #adjunto{
    display:flex;align-items:center;gap:7px;padding:4px 0 3px 0;margin:0;
  }
  #adjunto.oculta{display:none}
  #adjunto img{
    width:44px;height:44px;object-fit:cover;border:1px solid var(--linea-clara);
    border-radius:4px;background:#000;flex:0 0 auto
  }
  #adjunto .adj-info{flex:1 1 auto;min-width:0;color:var(--gris);font-size:10px;line-height:1.35}
  #adjunto .adj-info .n{color:var(--cian);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* lo que transcribio el celu antes de mandar (1209): se lee y se puede descartar con la × */
  #adjunto .adj-info .adj-dicho{display:block;color:var(--verde);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  #adjunto .adj-play{flex:0 0 auto}
  #adjunto .adj-x{
    flex:0 0 auto;background:#000;color:var(--rojo);border:1px solid transparent;border-radius:4px;
    font:inherit;font-size:12px;line-height:1.3;padding:2px 5px;cursor:pointer;letter-spacing:0;
  }
  #adjunto .adj-x:hover{border-color:var(--rojo)}
  /* la fila de comandos rapidos se saco (facundo, 2026-09-11): esos comandos quedan en el widget `agent` */
  /* sugerencias de respuesta: salen de la ultima respuesta del daemon en esta pestaña (cero tokens) */
  /* pegados a la caja de texto: sin padding ni margen abajo (facundo, 2026-09-12: "entre el input
     y el si/no no quiero que haya nada"). lo chequea `prueba_web_tabs` (chipsPegados). */
  #chips{display:flex;gap:5px;overflow-x:auto;padding:0;margin:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  #chips.oculta,#chips:empty{display:none;padding:0;margin:0}   /* sin chips no ocupa ni alto ni margen */
  #chips button{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid var(--linea);
    border-radius:3px;padding:3px 7px;font:inherit;font-size:10.5px;line-height:1.3;
    cursor:pointer;white-space:nowrap;
  }
  #chips button .l{color:var(--amarillo)}
  #chips button:hover{color:var(--blanco);border-color:#2a2a2a}
  #chips button:active{background:#111}
  /* la fila del input (facundo, 2026-09-13, desde el celu): `f>`, la caja y los tres iconos a la misma altura,
     centrados entre si (align-items:center), y la caja sin borde ni fondo propio: se funde con el panel. */
  #fila{display:flex;gap:4px;align-items:center}
  #prompt{color:var(--verde);flex:0 0 auto;user-select:none;line-height:1.4;font-size:12px}
  #txt{
    flex:1 1 auto;background:transparent;color:var(--blanco);border:0;
    border-radius:0;padding:5px 4px;font:inherit;font-size:12px;line-height:1.4;
    resize:none;max-height:28dvh;min-height:28px;box-sizing:border-box;align-self:center;
  }
  #txt:focus{outline:none;border:0}
  /* los tres iconos: svg de linea en el color del tema, mismo tamaño (18px) y misma caja (32px, 40px en el celu) */
  .ico{
    flex:0 0 auto;box-sizing:border-box;background:transparent;border:0;border-radius:6px;
    width:32px;height:32px;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;
    font:inherit;font-size:12px;line-height:1.4;cursor:pointer;letter-spacing:0;
  }
  .ico svg{width:18px;height:18px;display:block;pointer-events:none}
  #mandar{color:var(--verde);font-size:12px}
  #mandar:active{background:#0a1a06}
  /* camara (facundo, 2026-09-11: "se puede poner una funcion tipo camara aca? como en whatsapp").
     mismo look terminal que el boton de mandar; el input file de verdad esta escondido. */
  #camara{color:var(--cian)}
  #camara:active{background:#001a1a}
  #camara:disabled{color:var(--gris)}
  #foto{display:none}
  /* grabar un audio (facundo, 2026-09-11: "estaria bueno poder mandarte audios como en whatsapp").
     tap and hold como whatsapp: se aprieta y graba, se suelta y manda. */
  #grabar{color:var(--magenta);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  /* mientras graba el microfono se pinta rojo (tap and hold) */
  #grabar.grabando{color:var(--rojo);background:#1a0000;animation:lat 1s steps(2,start) infinite}
  #grabar:disabled{color:var(--gris)}
  @keyframes lat{50%{opacity:.55}}
  #grabinfo{
    flex:0 0 auto;color:var(--rojo);font-size:10.5px;user-select:none;display:none;
  }
  #grabinfo.viendo{display:block}
  /* el [▶] de daniela al lado del [tema] de cada respuesta, y el player de los audios de facundo.
     look terminal: un boton de texto, nada de controles nativos grises. */
  .play{
    background:#000;color:var(--verde);border:1px solid transparent;border-radius:4px;
    font:inherit;font-size:10px;line-height:1.3;padding:0 3px;cursor:pointer;letter-spacing:0;
  }
  .play:disabled{color:var(--gris);cursor:default}
  .play.sonando{color:var(--amarillo)}
  .msg .play{margin-left:6px}
  .cuerpo .aud{display:inline-flex;align-items:center;gap:6px;color:var(--cian)}
  .cuerpo .aud .play{color:var(--cian)}
  .cuerpo .aud .dur{color:var(--gris);font-size:10px}
  #mandar:disabled{color:var(--gris);border-color:transparent}
  #alfinal{
    position:absolute;right:12px;bottom:8px;z-index:5;display:none;
    background:#001a00;color:var(--verde);border:1px solid var(--verde);
    border-radius:14px;padding:6px 12px;font:inherit;font-size:10.5px;cursor:pointer;
  }
  #envoltorio{position:relative;flex:1 1 auto;min-height:0;display:flex}
  #login{padding:16px;display:none;flex-direction:column;gap:10px}
  #login p{color:var(--gris);font-size:10px;margin:0;white-space:pre-wrap}
  #login input{
    background:#000;color:var(--verde);border:1px solid var(--linea);border-radius:4px;
    padding:9px;font:inherit;
  }
  /* ---------- web 2: dos paneles (chat | widgets) ---------- */
  #cuerpo{flex:1 1 auto;min-height:0;display:flex;flex-direction:row}
  #panel-chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--fondo-chat)}
  /* sin bordes (orden 1188): el panel de widgets va un tono arriba del chat y cada caja otro tono mas */
  #panel-widgets{
    flex:0 0 420px;min-width:0;overflow-y:auto;background:var(--fondo-panel);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  /* separador arrastrable entre el chat y los widgets (facundo, 2026-09-11). la linea del medio es
     el borde que antes pintaba #panel-widgets; el area de agarre es mas ancha que la linea. */
  #sep{
    flex:0 0 7px;position:relative;cursor:col-resize;background:transparent;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  /* sin linea en reposo (facundo, 2026-09-13, orden 1188): chat y widgets se separan por el tono del fondo.
     la linea verde solo aparece al pasar el mouse o arrastrar. */
  #sep::after{
    content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;
  }
  #sep:hover::after,#sep.arrastrando::after{background:var(--verde);box-shadow:0 0 6px var(--verde)}
  body.arrastrando-sep{cursor:col-resize}
  body.arrastrando-sep #hist,body.arrastrando-sep #panel-widgets{pointer-events:none}
  .caja{border:0;outline:0;background:var(--fondo-caja);border-radius:6px;padding:7px 9px 8px 9px;margin:0 0 8px 0}
  .caja > .tit{
    color:var(--gris);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    margin:0 0 5px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;
  }
  /* ---------- header de cada widget (facundo, 2026-09-12) ----------
     izquierda: titulo + un dato esencial de una linea. derecha: [↻] actualizar y [⚙] settings. */
  .caja > .tit > .wtit{flex:0 0 auto;cursor:pointer;color:var(--gris)}
  .caja > .tit > .wtit:hover{color:var(--verde)}
  .caja > .tit > .wesc{
    flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-transform:none;letter-spacing:0;font-size:10px;
  }
  .caja > .tit > .wacc{flex:0 0 auto;display:flex;align-items:center;gap:4px}
  .caja > .tit > .wacc .wage{color:#4a4a4a;font-size:8.5px;letter-spacing:0;text-transform:none}
  .caja > .tit > .wacc .wage.wage-vieja{color:var(--amarillo)}
  .caja > .tit > .wacc .wage.wage-muy{color:var(--rojo)}
  /* iconos mas grandes y la `x` que oculta la caja (facundo, 2026-09-13, orden 1166) */
  .wbtn{
    background:transparent;color:var(--gris);border:none;border-radius:4px;
    font:inherit;font-size:17px;line-height:1;padding:2px 5px;cursor:pointer;
  }
  .wbtn:hover{color:var(--verde)}
  .wbtn:active{color:var(--verde)}
  .wbtn.girando{color:var(--verde)}
  /* ---------- arrastrar los widgets (facundo, 2026-09-12) ----------
     se agarran del header: en desktop con el mouse, en el celu con tap and hold. */
  .caja > .tit{cursor:grab}
  .caja.arrastrando{
    opacity:.95;background:#121a14;box-shadow:0 6px 18px rgba(0,0,0,.6);
    pointer-events:none;cursor:grabbing;
  }
  .caja.fantasma{background:#0d1411}
  body.arrastrando-w{user-select:none;-webkit-user-select:none}
  body.arrastrando-w #panel-widgets{overflow:hidden}
  /* los ocultos del pie (orden 1378): texto de la linea, sin pinta de boton, se siguen tocando */
  .wbtn.oc{font:inherit;font-size:inherit;line-height:inherit;color:inherit;letter-spacing:inherit;
           padding:0;margin:0;border:0;background:none;text-decoration:underline dotted;text-underline-offset:2px}
  .caja.plegada > .cuerpo{display:none}
  .caja .cuerpo{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.5}
  .caja .cuerpo.tabla{white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .caja .vacio{color:var(--gris)}
  .caja .cuerpo a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44;
                  overflow-wrap:anywhere;word-break:break-all}
  .caja .cuerpo a:active{color:var(--verde)}
  .bar .lleno{color:var(--verde)}
  .bar.med .lleno{color:var(--amarillo)}
  .bar.alto .lleno{color:var(--rojo)}
  .bar .hueco{color:#333}
  .pct{font-weight:500}
  .pct.ok{color:var(--verde)} .pct.med{color:var(--amarillo)} .pct.alto{color:var(--rojo)}
  /* ---------- widget usage: una barra grafica por limite, con el tick de la linea ---------- */
  /* el color sale del ratio (pct usado / linea = fraccion de la ventana transcurrida), no del pct */
  .usage{white-space:normal}
  .usage .cta{display:flex;align-items:center;gap:6px;margin:0 0 4px 0}
  .usage .cta + .ub{margin-top:0}
  .usage .cta .nom{color:var(--cian);font-weight:600;letter-spacing:.04em}
  .usage .rep{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 6px 0;padding-bottom:5px;border-bottom:1px solid var(--linea)}
  .usage .rep .nom{color:var(--cian);font-weight:600;letter-spacing:.04em}
  .usage .rep .por{flex:1 1 100%;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .usage .bloque + .bloque{margin-top:9px;padding-top:8px;border-top:1px solid var(--linea)}
  .ub{display:flex;align-items:center;gap:6px;margin:0 0 5px 0}
  .ub-n{flex:0 0 40px;min-width:40px;white-space:nowrap;color:var(--gris);font-size:10px;letter-spacing:.04em}
  .ub-pista{
    flex:1 1 auto;min-width:0;position:relative;height:11px;background:var(--fondo-hundido);
    border:1px solid var(--linea);border-radius:2px;overflow:hidden;
  }
  .ub-lleno{position:absolute;left:0;top:0;bottom:0;background:#333;border-radius:1px}
  .ub-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--blanco);opacity:.8}
  .ub-p{flex:0 0 34px;text-align:right;font-weight:600;color:var(--gris)}
  .ub-r{flex:0 0 46px;text-align:right;color:var(--gris);font-size:10px}
  .ub.n-ok .ub-lleno{background:var(--verde)}
  .ub.n-ok .ub-p{color:var(--verde)}
  .ub.n-cerca .ub-lleno{background:var(--amarillo)}
  .ub.n-cerca .ub-p{color:var(--amarillo)}
  .ub.n-sobre .ub-lleno{background:var(--naranja)}
  .ub.n-sobre .ub-p{color:var(--naranja)}
  /* el mismo color del nivel, para el dato esencial del header de usage */
  .wesc .uw.n-ok{color:var(--verde)} .wesc .uw.n-cerca{color:var(--amarillo)}
  .wesc .uw.n-sobre{color:var(--naranja)} .wesc .uw.n-mal{color:var(--rojo);font-weight:700}
  .ub.n-mal .ub-lleno{background:var(--rojo);box-shadow:0 0 7px var(--rojo)}
  .ub.n-mal .ub-p{color:var(--rojo);font-weight:700}
  .usage.off{opacity:.45}
  /* usage en dos columnas (facundo, 2026-09-14): arriba la proyeccion general, abajo facu | orugote con las
     tres barras a la misma altura, mismo alto y mismo ancho. un numero por barra, nada mas. */
  .usage .uproy{margin:0 0 7px 0;padding-bottom:6px;border-bottom:1px solid var(--linea)}
  .usage .uproy .ub{margin-bottom:3px}
  .usage .uproy .lect{display:block;font-size:10px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .usage .umod{display:flex;gap:6px;font-size:10px;margin:0 0 5px 0;white-space:nowrap;overflow:hidden}
  .usage .umod .nom{color:var(--cian);font-weight:600}
  .usage .umod .por{color:var(--gris);overflow:hidden;text-overflow:ellipsis;min-width:0}
  .usage .ucols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .usage .ucol{min-width:0}
  .usage .ucol .cta{height:16px;margin:0 0 4px 0;white-space:nowrap;overflow:hidden}
  .usage .ucol .cta .pj{font-size:10px;color:var(--gris)}
  .usage .ucol.elegida .cta .nom{text-decoration:underline;text-underline-offset:3px}
  .usage .ucols .ub-n{flex:0 0 28px}
  .usage .ucols .ub-p{flex:0 0 30px}
  .usage .ucols .ub-hueco{height:13px;margin:0 0 5px 0}
  /* widget `CLAUDE` (ordenes 1376/1377/1379, facundo 2026-09-14): linea de reparto, color por cuenta, bateria, semana */
  /* orden 1396: la linea entera en varios renglones (en el celu se cortaba con `...`) */
  .usage .urep{margin:0 0 6px 0;white-space:normal;overflow-wrap:anywhere;color:var(--blanco)}
  .usage .ucol .cta .nom.e-ok{color:#a6f5a0}
  .usage .ucol .cta .nom.e-warn{color:var(--amarillo)}
  .usage .ucol .cta .nom.e-mal{color:var(--rojo)}
  .ubat{display:inline-block;vertical-align:middle;position:relative;width:20px;height:9px;margin:0 5px 0 2px;
        border:1px solid #555;border-radius:2px;padding:1px;box-sizing:border-box}
  .ubat::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#555;border-radius:0 1px 1px 0}
  .ubat .ubat-c{display:block;height:100%;background:var(--verde);border-radius:1px}
  .ubat.baja{border-color:var(--rojo)}
  .ubat.baja::after{background:var(--rojo)}
  .usage .usem{margin:8px 0 0 0}
  .usage .usem-g{position:relative;display:flex;align-items:flex-end;gap:3px;height:22px;border-bottom:1px solid #333}
  .usage .usem-g .usd{flex:1 1 0;background:var(--verde);opacity:.75;border-radius:1px 1px 0 0}
  .usage .usem-g .usd.sobre{background:var(--amarillo)}
  .usage .usem-g .usd.sin{opacity:0}
  .usage .usem-g .usem-l{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--blanco);opacity:.7;pointer-events:none}
  .usage .usem-et{display:flex;gap:3px;font-size:8px;color:var(--gris);line-height:1.2}
  .usage .usem-et span{flex:1 1 0;text-align:center}
  .ub.n-sin .ub-lleno{background:#333}
  .v{color:var(--verde)} .r{color:var(--rojo)} .a{color:var(--amarillo)}
  .c{color:var(--cian)} .m{color:var(--magenta)} .g{color:var(--gris)}
  .b{font-weight:500}
  .btn{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:12px;
    padding:2px 9px;font:inherit;font-size:9.5px;cursor:pointer;margin:2px 4px 2px 0;
  }
  .btn:active{background:#111}
  .btn.voto{color:var(--verde);border-color:#1f3a14}
  .btn.dale{color:var(--verde);border-color:var(--verde)}
  /* barra de nodos (facundo, 2026-09-13; pisa el look de boton y el `chat` verde): solo los labels
     server | mac | cloud, sin borde ni fondo, cada uno con un circulito a la izquierda. el label se
     toca y abre el menu del nodo (revivir, guardia). el orden lo pone `uptime_s`: el que lleva mas
     tiempo corriendo a la izquierda (`pintarNodos`, igual que `nodos.orden_uptime`).
     circulito: opacidad 1 el main (el de guardia, al que le habla la web), .9 los otros. color =
     estado real del nodo (`nodos.color_nodo`): verde solo con todo ok, amarillo advertencia, naranja
     problemas sin emergencia, rojo emergencia, gris apagado o sin responder. el motivo va en el title. */
  #nodos{display:flex;align-items:center;gap:18px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
  #nodos::-webkit-scrollbar{display:none}
  #nodos .nodo{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;background:none;border:0;
    padding:0;margin:0;color:var(--blanco);font-size:10px;line-height:14px;cursor:pointer;white-space:nowrap;
    text-transform:lowercase;user-select:none;-webkit-user-select:none}
  #nodos .luz{width:7px;height:7px;border-radius:50%;background:var(--gris);flex:0 0 auto;opacity:.9}
  #nodos .nodo.main .luz{opacity:1}
  #nodos .luz.verde{background:var(--verde)}
  #nodos .luz.amarillo{background:var(--amarillo)}
  #nodos .luz.naranja{background:var(--naranja)}
  #nodos .luz.rojo{background:var(--rojo)}
  #nodos .luz.gris{background:var(--gris)}
  /* campana y persona (facundo, 2026-09-13, orden 1166): iconos svg sin look de boton, como la barra de nodos.
     el cartel `lan / tailscale / buzón` se saco del header: vive en el menu del nodo server ("habla por"). */
  .ib{flex:0 0 auto;position:relative;background:none;border:0;padding:0;margin:0;color:var(--blanco);
    width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .ib svg{width:14px;height:14px}   /* facundo 2026-09-14 (1342): un poco mas chicos */
  .ib:hover,.ib:active,.ib.on{color:var(--verde)}
  #campana .badge{position:absolute;top:-2px;right:-2px;min-width:12px;height:12px;padding:0 3px;border-radius:6px;
    font-size:8px;line-height:12px;font-weight:600;text-align:center;color:#000;background:var(--gris);pointer-events:none}
  #campana .badge.oculta{display:none}
  #campana .badge.gris{color:var(--blanco)}
  /* el nivel de cada notificacion: la misma paleta que `recetas/nodos.py` (`recetas/nivel_aviso.py`) */
  #notis .luz.rojo,#nlista .luz.rojo,#campana .badge.rojo{background:var(--rojo)}
  #notis .luz.naranja,#nlista .luz.naranja,#campana .badge.naranja{background:var(--naranja)}
  #notis .luz.amarillo,#nlista .luz.amarillo,#campana .badge.amarillo{background:var(--amarillo)}
  #notis .luz.verde,#nlista .luz.verde,#campana .badge.verde{background:var(--verde)}
  #notis .luz.gris,#nlista .luz.gris,#campana .badge.gris{background:var(--gris)}
  /* el desplegable de la campana: solo las no leidas, la mas nueva arriba */
  #nfondo{position:fixed;inset:0;z-index:33}
  #nfondo.oculta,#nlista.oculta{display:none}
  #nlista{position:fixed;z-index:34;top:44px;right:8px;width:min(440px,calc(100vw - 16px));max-height:70dvh;
    overflow-y:auto;background:#000;border:1px solid var(--linea-clara);border-radius:5px;padding:4px;
    display:flex;flex-direction:column;gap:1px;box-shadow:0 8px 28px rgba(0,0,0,.85);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #nlista .ntit{color:var(--gris);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:3px 6px 4px 6px;
    border-bottom:1px solid var(--linea);margin-bottom:2px}
  #nlista .nfila{display:flex;align-items:center;min-height:30px;border-radius:3px}
  #nlista .nfila:hover{background:#0d1410}
  #nlista .nabrir{flex:1 1 auto;min-width:0;align-self:stretch;display:flex;align-items:center;gap:6px;background:none;border:0;
    padding:0 0 0 6px;margin:0;color:var(--blanco);font:inherit;font-size:10.5px;text-align:left;cursor:pointer;
    white-space:nowrap;-webkit-tap-highlight-color:transparent}
  #nlista .luz{width:7px;height:7px;border-radius:50%;background:var(--gris);flex:0 0 auto}
  #nlista .nh{color:var(--gris);flex:0 0 auto}
  #nlista .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
  #nlista .nacc{flex:0 0 auto;background:none;border:0;color:var(--gris);font:inherit;font-size:10px;padding:0 6px;
    height:30px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #nlista .nacc.nx{font-size:14px;width:30px;padding:0}
  #nlista .nacc:hover,#nlista .nacc:active{color:var(--blanco)}
  #nlista .ntodas{background:none;border:0;border-top:1px solid var(--linea);margin-top:2px;color:var(--cian);font:inherit;
    font-size:10px;padding:6px;text-align:left;cursor:pointer}
  #nlista .nvacio{color:var(--gris);padding:8px 6px;font-size:10.5px}
  #vistas{display:none;gap:6px;flex:0 0 auto}
  /* chat | widgets sin borde; el que no esta activo en blanco (facundo, 2026-09-14, 1288) */
  #vistas button{border-color:transparent;color:var(--blanco)}
  #vistas button.on{color:var(--verde)}
  body.sinlogin #cabecera,body.sinlogin #cuerpo{display:none}
  /* vista mobile: una vista a la vez, la elige la barra de arriba. puro css, sin js de layout.
     entra cuando la ventana es angosta (celu) O cuando es mas alta que ancha (facundo, 2026-09-11:
     una ventana vertical en la compu, o el celu de pie, tambien quieren el toggle chat | widgets).
     el mismo media query vive en el js como `MQ_MOBILE`: si cambia uno, cambia el otro. */
  @media (max-width:899px), (max-aspect-ratio: 1/1){
    #vistas{display:flex}
    /* orden 1396: la linea del reparto guarda dos renglones, asi el widget no salta de alto en cada refresco */
    .usage .urep{min-height:3.1em}
    /* dedo: los seis botones de la barra se tocan con el pulgar, todos del mismo alto */
    .bb{height:32px;padding:4px 6px;gap:4px}
    #nodos .nodo{min-height:32px}   /* dedo: el label se toca aunque no parezca boton */
    #notis .noti{min-height:40px;font-size:12px}   /* dedo: el aviso y su `x` se tocan con el pulgar */
    #mcuerpo textarea.nresp{font-size:16px}   /* ios no zoomea al enfocar */
    #nodos{gap:10px}
    #vistas{gap:5px}
    #cabecera{gap:6px}
    /* dedo: campana, persona, filas de la campana y el menu de persona con 40px (1166) */
    .ib{width:36px;height:40px;margin:-4px 0}
    .ib svg{width:16px;height:16px}
    #campana .badge{top:4px;right:0}   /* afuera del icono de 16px, que no lo tape (1342) */
    #nlista .nfila{min-height:40px}
    #nlista .nabrir{font-size:12px}
    #nlista .nacc{height:40px;min-width:40px;font-size:11px}
    #nlista .ntodas{min-height:40px;font-size:11px}
    #ctx button{min-height:40px}
    /* dedo: los botones del header de cada widget con area tactil de 40px (facundo, 2026-09-12) */
    .caja > .tit > .wacc .wbtn{min-width:40px;min-height:40px;font-size:20px;padding:0}
    .caja > .tit{min-height:40px}
    #panel-widgets{flex:1 1 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    #sep{display:none}
    /* una vista a la vez: la elige la barra de arriba (chat | widgets) */
    body:not(.ver-widgets) #panel-widgets{display:none}
    body.ver-widgets #panel-chat{display:none}
    /* ios zoomea al enfocar un input de menos de 16px: lo frena maximum-scale=1 en el
       viewport, asi que el input del chat va chico como el resto del chat. los de login
       quedan en 16 (se tocan una vez y ahi no molesta). */
    #login input,#clave,#tok{font-size:16px}
    /* dedo: los tres iconos del input con area de toque de 40px (facundo, 2026-09-13) */
    .ico{width:40px;height:40px}
    /* la caja mide lo mismo que los iconos: el texto queda centrado y los chips siguen pegados arriba */
    #txt{min-height:40px;padding:11px 4px}
  }
  #login button{
    background:#000;color:var(--verde);border:1px solid var(--verde);border-radius:4px;
    padding:9px;font:inherit;cursor:pointer;
  }
  /* ---------- pestañas por tema (2026-09-11, las mismas que la consola) ---------- */
  /* la barra es el borde de arriba del panel de chat (estilo vscode): la pestaña activa se
     come el borde y se funde con la charla, sin renglon extra. */
  #tabs{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:0;overflow-x:auto;
    padding:0 6px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #tabs::-webkit-scrollbar{display:none}
  #tabs .tab{
    flex:0 0 auto;background:#000;color:var(--gris);border:0;
    border-radius:4px 4px 0 0;padding:4px 9px;font:inherit;font-size:10.5px;cursor:pointer;
    white-space:nowrap;
  }
  #tabs .tab.enpanel{color:var(--cian)}
  #tabs .tab.activo{
    color:var(--verde);background:var(--fondo-caja);
  }
  #tabs .tab .x{color:#555;margin-left:7px}
  #tabs .barrabtn{
    flex:0 0 auto;background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:2px 7px;font:inherit;font-size:9.5px;cursor:pointer;white-space:nowrap;
    margin:0 0 3px 5px;
  }
  #tabs .barrabtn:active{background:#111}
  #tabs .relleno{flex:1 1 auto;min-width:8px}
  /* ---------- notificaciones (facundo, 2026-09-13, orden 1162) ----------
     solo el ultimo aviso sin leer, debajo de las pestañas, en una linea (hora + primeras palabras), sin look de
     boton como la barra de nodos. tocar abre el detalle; la `x` lo marca leido y pasa al siguiente (1170: "leer
     mas no, solo la ultima. y que se pueda cerrar"). la lista entera vive en la campanita del header. */
  #notis{flex:0 0 auto;display:flex;align-items:center;padding:0 0 0 10px;background:var(--fondo-panel)}
  #notis.oculta{display:none}
  #notis .noti{flex:1 1 auto;display:flex;align-items:center;gap:6px;min-width:0;background:none;border:0;padding:0;margin:0;
    color:var(--blanco);font-size:10px;line-height:18px;cursor:pointer;white-space:nowrap;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #notis .luz{width:7px;height:7px;border-radius:50%;background:var(--amarillo);flex:0 0 auto}
  #notis .nh{color:var(--gris);flex:0 0 auto}
  #notis .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
  #notis .nx{flex:0 0 auto;width:40px;height:40px;margin:-11px 0;display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;color:var(--gris);font:inherit;font-size:13px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  #notis .nx:active{color:var(--blanco)}
  #mcuerpo textarea.nresp{display:block;width:100%;box-sizing:border-box;margin-top:10px;background:#000;color:var(--blanco);
    border:1px solid var(--linea);border-radius:4px;padding:6px;font:inherit;resize:vertical;min-height:60px}
  /* ---------- sincronizando (facundo, 2026-09-11) ----------
     al abrir la web o al volver al foco, el cache de localStorage no se pinta como si fuera el
     estado real: mientras baja el buzon se ve esta linea y lo cacheado queda apagado. */
  #sync{
    flex:0 0 auto;padding:2px 10px;font-size:10px;color:var(--cian);
    background:var(--fondo-panel);
  }
  #sync.oculta{display:none}
  #sync.off{color:var(--amarillo)}
  body.sincronizando #lista,
  body.sincronizando #widgets,body.sincronizando #tabs .tab{opacity:.45}
  /* soltar una imagen sobre el chat (desktop, facundo 2026-09-11) */
  #panel-chat.soltar-img{position:relative}
  #panel-chat.soltar-img::after{
    content:"soltar la imagen acá";position:absolute;inset:6px;z-index:55;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--verde);border-radius:6px;background:rgba(0,255,120,.10);
    color:var(--verde);font-size:11px;letter-spacing:.04em;
  }
  /* dropdown: pestaña nueva y la pregunta de "esto parece de otro tema" */
  #ddfondo{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.45)}
  #ddfondo.oculta,#dd.oculta{display:none}
  #dd{
    position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:20;
    max-width:460px;margin:0 auto;background:#000;border:1px solid var(--verde);border-radius:6px;
    padding:6px;display:flex;flex-direction:column;gap:4px;max-height:60dvh;overflow-y:auto;
  }
  #dd .ddtit{color:var(--gris);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 4px}
  #dd .ddop{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:4px;
    padding:8px 10px;font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  }
  #dd .ddop:active{background:#111}

  /* ---------- modal de item de widget (facundo, 2026-09-11) ----------
     tocar cualquier fila de un widget la expande y ofrece 2 a 4 acciones a/b/c. look terminal. */
  .it{cursor:pointer;border-radius:3px}
  /* `que ver` (1229): cada fila se swipea en celu (derecha = visto, izquierda = no me interesa) y en
     desktop muestra dos botones al pasar el mouse. sin bordes, tonos de la caja. */
  .qv{position:relative;display:inline-block;width:100%;vertical-align:top;overflow:hidden;border-radius:4px;touch-action:pan-y}
  .qv .qvin{position:relative;display:block;background:var(--fondo-caja);will-change:transform}
  .qv.suelta .qvin{transition:transform .18s ease-out}
  .qv .qvf{position:absolute;inset:0;display:none;align-items:center;padding:0 10px;font-size:10.5px;color:#000;font-weight:700}
  .qv .qvf.qvv{background:var(--verde);justify-content:flex-start}
  .qv .qvf.qvn{background:var(--rojo);justify-content:flex-end}
  .qv.der .qvf.qvv,.qv.izq .qvf.qvn{display:flex}
  .qv.listo .qvf{filter:brightness(1.15)}
  .qv.chau{transition:max-height .2s ease-in .16s,opacity .2s ease-in .16s;max-height:0 !important;opacity:0}
  .qv .qvb{display:none;position:absolute;top:0;right:0;gap:4px;background:var(--fondo-caja);padding:0 0 2px 6px}
  .qv .qvb button{border:0;outline:0;background:#000;color:var(--gris);font:inherit;font-size:10px;padding:1px 6px;border-radius:3px;cursor:pointer}
  .qv .qvb button[data-qvacc="visto"]:hover{color:var(--verde)}
  .qv .qvb button[data-qvacc="no"]:hover{color:var(--rojo)}
  @media (hover:hover) and (pointer:fine){ .qv:hover .qvb{display:flex} }
  .it:hover{background:#0d1410}
  #mfondo{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.65)}
  #mfondo.oculta,#modal.oculta{display:none}
  #modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
    width:min(560px,calc(100vw - 20px));max-height:82dvh;overflow-y:auto;
    background:#000;border:1px solid var(--verde);border-radius:6px;
    box-shadow:0 0 0 1px #06210a,0 10px 40px rgba(0,0,0,.85);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  #modal .mtit{
    position:sticky;top:0;background:#000;display:flex;justify-content:space-between;gap:8px;
    align-items:center;border-bottom:1px solid var(--linea);padding:7px 9px;
    color:var(--verde);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
  }
  #modal .mx{
    background:#000;color:var(--gris);border:1px solid var(--linea);border-radius:4px;
    padding:2px 7px;font:inherit;font-size:9px;cursor:pointer;flex:0 0 auto;
  }
  #modal .mcuerpo{
    padding:9px;font-size:11.5px;line-height:1.55;color:var(--blanco);
    white-space:pre-wrap;word-break:break-word;
  }
  #modal .mcuerpo a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44}
  #modal .macc{display:flex;flex-direction:column;gap:5px;padding:0 9px 10px 9px}
  #modal .macc button{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:4px;
    padding:8px 10px;font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  }
  #modal .macc button:active{background:#111}
  #modal .macc button.principal{color:var(--verde);border-color:var(--verde)}
  #modal .macc .let{color:var(--verde);font-weight:600;margin-right:6px}

  /* ---------- tocar una push (facundo, 2026-09-14, notimodal 1350) ----------
     del tamaño del area del chat, encima del chat y de las pestañas, con el titulo centrado a la altura de la barra.
     la posicion la pone `posNotiModal` con el rect de #panel-chat (igual en el celu y en la mac). */
  #notimodal{
    position:fixed;z-index:28;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;
    background:#000;border:1px solid var(--verde);border-radius:4px;
    box-shadow:0 0 0 1px #06210a,0 10px 40px rgba(0,0,0,.85);
  }
  #notimodal.oculta{display:none}
  #notimodal .nmtit{
    position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    padding:0 44px;border-bottom:1px solid var(--linea);color:var(--verde);font-size:10.5px;
  }
  #nmtitulo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  #notimodal .nmx{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);background:#000;color:var(--gris);
    border:1px solid var(--linea);border-radius:4px;padding:0 8px;font:inherit;font-size:13px;line-height:18px;cursor:pointer;
  }
  #notimodal .nmcuerpo{
    flex:1 1 auto;overflow-y:auto;padding:10px;font-size:12px;line-height:1.55;color:var(--blanco);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  #notimodal .nmtexto{white-space:pre-wrap;word-break:break-word}
  #notimodal .nmtexto a{color:var(--cian);text-decoration:none;border-bottom:1px dotted #1f3a44}
  #notimodal .nmopc{display:flex;flex-direction:column;gap:5px;margin-top:10px}
  #notimodal .nmop{
    background:#000;color:var(--cian);border:1px solid var(--linea);border-radius:4px;
    padding:8px 10px;font:inherit;font-size:11.5px;text-align:left;cursor:pointer;
  }
  #notimodal .nmop .let{color:var(--verde);font-weight:600;margin-right:6px}
  #notimodal .nmop.sel{color:#000;background:var(--verde);border-color:var(--verde)}
  #notimodal .nmop.sel .let{color:#000}
  #notimodal .nmmeta{margin-top:10px;font-size:10px}
  #notimodal .nmpie{
    flex:0 0 auto;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--linea);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
  }
  #notimodal .nmfila{display:flex;align-items:center;gap:6px;min-height:18px}
  #nmoir{display:flex;align-items:center;gap:4px;color:var(--gris);font-size:10.5px}
  #nmoir .nmhabla{background:none;border:0;color:var(--cian);font:inherit;font-size:11px;padding:0;cursor:pointer}
  #nmestado{color:var(--gris);font-size:10px;margin-left:auto}
  #nmtxt{
    flex:1 1 auto;min-width:0;background:#000;color:var(--blanco);border:1px solid var(--linea);border-radius:4px;
    font:inherit;font-size:12px;padding:6px;resize:none;
  }
  #nmgrabar{color:var(--magenta);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #nmmandar{color:var(--verde)}
  #nmgrabar.grabando{color:var(--rojo);background:#1a0000;animation:lat 1s steps(2,start) infinite}

  /* ---------- menu contextual (facundo, 2026-09-11) ----------
     tap and hold en el celu, click derecho en desktop, sobre un mensaje del chat, una fila de widget
     o una pestaña. mismo look terminal que el modal, pero pegado a donde se toco. */
  #ctxfondo{position:fixed;inset:0;z-index:31}
  #ctxfondo.oculta,#ctx.oculta{display:none}
  #ctx{
    position:fixed;z-index:32;min-width:180px;max-width:min(300px,calc(100vw - 16px));
    background:#000;border:1px solid var(--verde);border-radius:5px;padding:4px;
    display:flex;flex-direction:column;gap:2px;
    box-shadow:0 0 0 1px #06210a,0 8px 28px rgba(0,0,0,.85);
  }
  #ctx .ctit{
    color:var(--gris);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:3px 6px 4px 6px;
    border-bottom:1px solid var(--linea);margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #ctx button{
    background:#000;color:var(--cian);border:1px solid transparent;border-radius:4px;
    padding:8px 9px;font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  }
  #ctx button:hover{border-color:var(--linea);background:#0d1410}
  #ctx button:active{background:#111}
  /* lo que se toco queda marcado mientras el menu esta abierto */
  .msg.marcado,#widgets .it.marcado,#tabs .tab.marcado{outline:0;background:#0d1410;border-radius:3px}
  /* el hold no tiene que disparar el menu de ios ("copiar / buscar"): el nuestro lo reemplaza */
  .msg .cuerpo,#tabs .tab{-webkit-touch-callout:none}
  body.sinsel,body.sinsel *{-webkit-user-select:none;user-select:none}
  /* cita de un mensaje anterior (`> ...`), la que deja "responder" */
  .cita{color:#7e8f86}

  @media (max-width:899px), (max-aspect-ratio: 1/1){
    /* en la vista mobile el modal ocupa toda la pantalla */
    #modal{
      left:0;top:0;transform:none;width:100vw;max-width:none;height:100dvh;max-height:none;
      border:none;border-radius:0;padding-bottom:env(safe-area-inset-bottom);
    }
  }
</style>
</head>
<body>

<div id="cabecera">
  <div id="nodos"></div>
  <div id="vistas">
    <button id="ver-chat" class="bb on" type="button">chat</button>
    <button id="ver-widgets" class="bb" type="button">widgets</button>
  </div>
  <button id="campana" class="ib" type="button" title="notificaciones" aria-label="notificaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10.3 20.5a2 2 0 0 0 3.4 0"/></svg><span id="badge" class="badge oculta"></span></button>
  <button id="persona" class="ib" type="button" title="cuenta" aria-label="cuenta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
</div>

<div id="login">
  <p>entrá con la clave (se guarda solo en este teléfono).</p>
  <input id="clave" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="clave">
  <button id="entrar-clave" type="button">entrar con clave</button>
  <p style="opacity:.6">o pegá el token:</p>
  <input id="tok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_... / gho_...">
  <button id="entrar" type="button">entrar</button>
  <p id="login-err" style="color:var(--rojo)"></p>
</div>

<div id="cuerpo">
<div id="panel-chat">
<div id="tabs"></div>
<div id="notis" class="oculta" aria-live="polite"></div>
<div id="sync" class="oculta">sincronizando…</div>
<div id="envoltorio">
  <div id="hist"><div id="lista"></div></div>
  <button id="alfinal" type="button">ir al final</button>
</div>

<div id="pie">
  <div id="adjunto" class="oculta" aria-live="polite"></div>
  <div id="chips" class="oculta"></div>
  <div id="fila">
    <span id="prompt">f&gt;</span>
    <textarea id="txt" rows="1" placeholder="" enterkeyhint="enter" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <span id="grabinfo" aria-live="polite"></span>
    <button id="grabar" class="ico" type="button" title="mantené apretado para grabar un audio" aria-label="grabar audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
    <button id="camara" class="ico" type="button" title="foto (camara o galeria)" aria-label="foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input id="foto" type="file" accept="image/*">
    <button id="mandar" class="ico" type="button" title="mandar" aria-label="mandar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10 14"/><path d="M21 3 14 21l-4-7-7-4z"/></svg></button>
  </div>
</div>
</div><!-- /panel-chat -->
<div id="sep" title="arrastrar para cambiar el ancho" aria-label="separador" role="separator" aria-orientation="vertical"></div>
<div id="panel-widgets"><div id="widgets"></div></div>
</div><!-- /cuerpo -->

<div id="ddfondo" class="oculta"></div>
<div id="dd" class="oculta"></div>

<div id="ctxfondo" class="oculta"></div>
<div id="ctx" class="oculta" role="menu"></div>

<div id="nfondo" class="oculta"></div>
<div id="nlista" class="oculta" role="menu" aria-label="notificaciones"></div>

<div id="mfondo" class="oculta"></div>
<div id="modal" class="oculta" role="dialog" aria-modal="true">
  <div class="mtit"><span id="mtitulo"></span><button id="mcerrar" class="mx" type="button">esc ×</button></div>
  <div class="mcuerpo" id="mcuerpo"></div>

// de donde escribe facundo (facundo, 2026-09-12: "deberias poder saber de donde te escribo"):

var RE_ENVIADO = /\s*\[enviado:\s*(\d{10,16})\]\s*$/;

  var m = RE_DESDE.exec(t || "");

// {tabs, activo} saneado: solo temas conocidos, sin repetidos, la activa dentro de tabs.
// las reglas de siempre: una pestaña por tema, y la general (`auto`) es una mas de la lista.
// los layouts viejos traian `paneles` y `foco` (el split al lado de los widgets, ya sacado): se

function sanearLayout(L){
  if(!L || !L.tabs || !L.tabs.length) return null;

  L.tabs.forEach(function(t){
    t = t === AUTO ? AUTO : normTema(t);                 // `awtomic-qa` viejo -> `awtomic/qa`

// cambio local: sube el reloj, guarda el cache y encola la publicacion. si el layout quedo igual

// por delante lo que dejo el otro dispositivo.
function guardarLayout(){
  if(aplicando || firmaLayout(layoutActual()) === layoutFirma){ guardarCache(); return; }
  layoutTs = Math.max(Date.now(), layoutTs + 1);
  guardarCache();
  publicarTabs();
}

  propuestas:  [{k: "tema", et: "filtro de tema", tipo: "opciones", def: "todos", ops: ["todos"]}],

                     {k: "filas", et: "filas visibles", tipo: "opciones", def: 0, ops: [0, 3, 5, 8, 12]},
                     {k: "oculto", et: "ocultar este widget", tipo: "bool", def: false}];

// ---------- orden de los widgets, arrastrables (facundo, 2026-09-12) ----------
// cada caja se arrastra por su header y el orden viaja en `tabs.json` como `orden_widgets`
// (`{ids, ts}`, gana el `ts` mas nuevo, igual que el split), asi el celu y la compu ven las cajas
// en el mismo orden. un widget nuevo que no este en la lista va al final, nunca se pierde.
// las pestañas del chat NO se arrastran (regla del 2026-09-12: el chat es un panel unico).
var ordenW = {ids: [], ts: 0};
var clavesW = [];                 // las claves del ultimo repintado, ya ordenadas (incluye las ocultas)
function ordenLimpio(){ return ordenW.ids.length ? {ids: ordenW.ids.slice(), ts: +ordenW.ts || 0} : null; }

// llego el orden del buzon (o del cache): gana el `ts` mas nuevo. una lista pelada (formato viejo)
// se acepta con el `ts` mas bajo posible.
function recibirOrden(rem){
  if(!rem) return false;
  if(Array.isArray(rem)) rem = {ids: rem, ts: 1};
  if(!Array.isArray(rem.ids)) return false;
  if((+rem.ts || 0) <= (+ordenW.ts || 0)) return false;
  var ids = [];
  rem.ids.forEach(function(c){ if(typeof c === "string" && c && ids.indexOf(c) < 0) ids.push(c); });

// orden de fabrica
function ordenarClaves(claves){
  var res = [];
  ordenW.ids.forEach(function(c){ if(claves.indexOf(c) >= 0 && res.indexOf(c) < 0) res.push(c); });
  claves.forEach(function(c){ if(res.indexOf(c) < 0) res.push(c); });
  return res;
}
function ocultoW(clave){ return !!wset(clave, "oculto"); }
// `subir` / `bajar` del modal: la alternativa sin arrastrar. salta las cajas ocultas, si no mover
// una vez no cambiaria nada.
function moverWidget(clave, delta){
  var ids = ordenarClaves(clavesW.slice());
  var i = ids.indexOf(clave);
  if(i < 0) return false;
  var j = i + delta;
  while(j >= 0 && j < ids.length && ocultoW(ids[j])) j += delta;
  if(j < 0 || j >= ids.length) return false;
  ids.splice(i, 1);
  ids.splice(j, 0, clave);
  guardarOrden(ids, true);
  return true;
}
// el orden que quedo en el dom despues de arrastrar: las ocultas se quedan donde estaban
function mezclarOcultas(vis){
  var prev = ordenarClaves(clavesW.slice()), q = vis.slice(), res = [];
  prev.forEach(function(c){
    if(ocultoW(c) || vis.indexOf(c) < 0){ res.push(c); return; }
    if(q.length) res.push(q.shift());
  });
  q.forEach(function(c){ res.push(c); });
  return res.filter(function(c, i, a){ return a.indexOf(c) === i; });

// en pantalla tactil (celu, tablet) enter hace salto de linea y manda solo el boton: facundo escribe
// parrafos y terminaba mandando sin querer (2026-09-11). en desktop sigue enter = mandar.
// se decide SOLO por hardware: nunca por ancho de ventana, aspect ratio ni vista (facundo,

function esTactil(){
  try{

      var fino = window.matchMedia("(pointer: fine)");

// llego un layout del buzon: gana el `ts` mas nuevo. si el mio es mas nuevo y lo escribio otro
// dispositivo, publico el mio. devuelve "remoto" | "mio" | "igual" (lo usa la prueba).
function recibirTabs(L){
  var ts = +L.ts || 0;
  // los borradores no se resuelven por el `ts` del layout: uno por uno, el mas nuevo de cada tema
  var borr = recibirBorradores(L.borradores);
  // idem el scroll: donde quedaste leyendo cada pestaña se resuelve por tema, no por layout
  var vis = recibirVistas(L.vistas);
  // idem el ancho de los paneles: por su propio `ts`, no por el del layout
  var sp = recibirSplit(L.split);
  // idem las settings de cada widget: una por una, gana el `ts` de esa caja
  var ws = recibirWsets(L.wsets);
  // idem el orden de los widgets: por su propio `ts`
  var orw = recibirOrden(L.orden_widgets);
  // las notificaciones leidas se suman: si el otro tiene alguna que yo no, se la agrego; si yo tengo de mas, publico
  var avl = recibirLeidos(L.avisos_leidos);
  // la ultima vez que facundo miro el board (el daemon lo usa para poner el badge en 0): gana el mayor
  if(+L.push_leido > pushLeido) pushLeido = +L.push_leido;
  if(ts > layoutTs){ aplicarLayout(L, ts); return "remoto"; }
  if(layoutTs > ts && L.origen !== DISPOSITIVO){ publicarTabs(true); return "mio"; }
  if(borr || vis || sp || ws || orw || avl === "mio") publicarTabs();   // mezcle los dos lados: que el otro vea el resultado
  return "igual";
}
// agrupa los cambios seguidos (abrir una pestaña, cambiar de pestaña, mover el separador) en una
// sola escritura
function publicarTabs(ya, debounce){
  if(!token || !tabsSync || !tabsListo) return;
  if(tabsPendiente) clearTimeout(tabsPendiente);
  var espera = Math.max(ya ? 0 : (debounce || TABS_DEBOUNCE), TABS_MINIMO - (Date.now() - tabsPub));
  tabsPendiente = setTimeout(function(){ tabsPendiente = null; ponerTabs(false); }, espera);
}
function ponerTabs(reintento){
  if(!token || !tabsSync) return Promise.resolve();
  if(Date.now() < frenoHasta){ publicarTabs(); return Promise.resolve(); }
  tabsPub = Date.now();
  var L = layoutActual();
  L.v = 1; L.ts = layoutTs; L.origen = DISPOSITIVO;
  L.borradores = borradoresLimpios();
  L.vistas = vistasLimpias();
  L.split = splitLimpio();
  L.wsets = wsetsLimpias();
  L.orden_widgets = ordenLimpio();
  L.avisos_leidos = leidosLimpios();
  if(pushLeido) L.push_leido = pushLeido;
  var cuerpo = {message: "tabs " + DISPOSITIVO, content: textoAb64(JSON.stringify(L))};
  if(shaTabs) cuerpo.sha = shaTabs;
  // con el endpoint del server vivo, las pestañas se guardan ahi (anda sin github; el daemon las sube despues).
  // si el endpoint no contesta, el PUT de siempre al buzon.
  var ruta = "/repos/" + REPO + "/contents/" + TABS_ARCHIVO;
  if(lan.base && !reintento){
    return lanFetch(lan.base + ruta, {method: "PUT", cache: "no-store", keepalive: true,
      headers: {"authorization": "Bearer " + token, "content-type": "application/json"},
      body: JSON.stringify(cuerpo)
    }).then(function(r){
      if(!r.ok) throw new Error("http " + r.status);
      return r.json().then(function(j){ shaTabs = ((j || {}).content || {}).sha || null; etagTabs = null; });
    }).catch(function(){ return ponerTabs(true); });
  }
  if(shaTabs && /^lan-/.test(shaTabs)){ delete cuerpo.sha; }
  // fetch propio y no `api()`: un 403 de escritura NO tiene que desloguear a facundo del chat
  return fetch(API + ruta, {
    method: "PUT", cache: "no-store", keepalive: true,   // que sobreviva al cierre de la pagina
    headers: {"authorization": "Bearer " + token, "accept": "application/vnd.github+json",
              "content-type": "application/json"},
    body: JSON.stringify(cuerpo)
  }).then(function(r){
    if(r.ok) return r.json().then(function(j){
      shaTabs = ((j || {}).content || {}).sha || null;
      etagTabs = null;                                   // la proxima lectura trae el archivo nuevo
    });
    if((r.status === 409 || r.status === 422) && !reintento){   // otro dispositivo escribio primero
      var antes = firmaLayout(layoutActual());
      shaTabs = null; etagTabs = null;
      return cargarTabs().then(function(){
        if(firmaLayout(layoutActual()) === antes) return ponerTabs(true);   // si gane yo, reintento
      });
    }
    if(r.status === 403 || r.status === 404 || r.status === 429) return r.json().catch(function(){ return {}; })
      .then(function(j){
        var msg = (j && j.message) || ("http " + r.status);
        var lim = limiteGithub(r.status, r.headers, msg);
        if(lim){ frenar(lim.seg + 5, r.status + " al guardar las pestañas"); return; }   // no es permiso
        sinSync(msg);
      });
  }).catch(function(){});                                 // sin red: queda el cache y se reintenta solo
}

function abrirTab(tema){
  tema = tema === AUTO ? AUTO : normTema(tema);
  if(!esTema(tema) && tema !== AUTO){ sistema("tema desconocido: " + tema, "error"); return; }
  if(tabs.indexOf(tema) < 0) tabs.push(tema);
  activo = tema;
  pintarTabs(); render(); irDonde();
  chatDeTab(tema);          // si nunca se bajo su charla, llega sola
}
// renombrar una pestaña (si ya habia una de ese tema, no se duplica). la general ya no se renombra sola
// (facundo, 2026-09-11); queda por si hace falta renombrar a mano.
function renombrarTab(viejo, nuevo){
  if(viejo === nuevo || tabs.indexOf(viejo) < 0) return;
  if(tabs.indexOf(nuevo) >= 0) tabs.splice(tabs.indexOf(viejo), 1);
  else tabs[tabs.indexOf(viejo)] = nuevo;
  if(activo === viejo) activo = nuevo;
  pintarTabs(); render(); irDonde();
}
function cerrarTab(tema){
  if(tabs.length < 2){ sistema("la última pestaña se queda abierta"); return; }
  var j = tabs.indexOf(tema);
  if(j < 0) return;
  tabs.splice(j, 1);
  var reemplazo = tabs[Math.min(j, tabs.length - 1)];
  if(activo === tema) activo = reemplazo;
  pintarTabs(); render(); irDonde();
}
function nuevaTab(){

// urls clickeables (facundo, 2026-09-12: abrio una url de oauth cortada antes de `&state=` y claude.com
// le dijo "Missing state parameter"). el texto YA viene escapado, asi que `&` llega como `&amp;` y va
// igual al href: el html lo decodifica solo. nada de cortar ni de copiar a mano.
var RE_MDLINK = /\[([^\]\n]+)\]\(\s*(https?:\/\/[^)\s]+)\s*\)/g;
var RE_URL = /(https?:\/\/[^\s<>"'`]+)/g;
function unLink(u, texto){
  return '<a href="' + String(u).replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">' +
         (texto === undefined ? u : texto) + "</a>";
}
function enlaces(l){
  // `;` no se saca como puntuacion final: es el cierre de `&amp;`, que trae casi toda url larga
  var COLA = /(?:[).,:!?]|&quot;|&gt;)+$/;
  var hechos = [];                                  // los `[texto](url)` salen del paso, como los `code`
  var x = String(l).replace(RE_MDLINK, function(m0, texto, u){
    hechos.push(unLink(u, texto));
    return "\u0002" + (hechos.length - 1) + "\u0002";
  });
  x = x.replace(RE_URL, function(u){
    var m = COLA.exec(u), cola = m ? m[0] : "";
    if(cola) u = u.slice(0, u.length - cola.length);
    return unLink(u) + cola;
  });
  return x.replace(/\u0002(\d+)\u0002/g, function(m0, i){ return hechos[+i]; });
}

function costos(l){

// markdown-lite en color (facundo, 2026-09-11: "mas color"): `code` cian, **negrita** amarilla,
// ## titulos magenta, tablas con cabecera y filas alternadas, --- verde tenue, [tag] verde,

function enCodigo(l, f){  // saca los `code` antes de tocar el resto y los devuelve al final
