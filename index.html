<script>
(function(){
"use strict";

var REPO = "facundopichetto/agente-buzon";
// los nombres que se pintan (facundo, 2026-09-13): el agente es `claudio` y facundo es `f`. las claves del
// jsonl y del buzon no cambian, solo lo que se ve.
var QUIEN_F = "f", QUIEN_AGENTE = "flaudio";   // antes claudio (2026-09-14, etapa 1 del rename)
var ISSUE = 1;
// el buzón ROTA de issue (2026-09-15 02:40: github cortó el #1 con "Commenting is disabled on issues with more
// than 2500 comments" y la web quedó muda). el número vivo está en `buzon.json` del repo (lo escribe el daemon
// al rotar, `buzon_rotar`): se arranca con el último conocido (localStorage), se relee al entrar, cada 5 min
// desde `tick` y en el acto cuando github contesta ese 403 o 404 del issue (y el pedido se repite al nuevo).
try{ ISSUE = parseInt(localStorage.getItem("agente_issue"), 10) || ISSUE; }catch(x){}
var issueUlt = 0, issueEnVuelo = null;
function cargarIssue(forzar){
  if(!forzar && Date.now() - issueUlt < 300000) return Promise.resolve(false);
  if(issueEnVuelo) return issueEnVuelo;
  issueUlt = Date.now();
  issueEnVuelo = api("GET", "/repos/" + REPO + "/contents/buzon.json", null, null, "application/vnd.github.raw+json")
    .then(function(r){
      var n = r && r.json && parseInt(r.json.issue, 10);
      if(!n || n === ISSUE) return false;
      ISSUE = n; etagCom = null; etagIssue = null;
      try{ localStorage.setItem("agente_issue", String(n)); }catch(x){}
      return true;
    })
    .catch(function(){ return false; })
    .then(function(c){ issueEnVuelo = null; return c; });
  return issueEnVuelo;
}

// de donde escribe facundo (facundo, 2026-09-12: "deberias poder saber de donde te escribo"):
// `celu` o `compu` por HARDWARE (el mismo `esTactil()` que decide si enter manda, nunca el ancho de
// la ventana), mas el id corto del dispositivo y un nombre corto de navegador/os sacado del userAgent.
// viaja pegado al final del mensaje como `[desde: celu abc123 ios/safari]`: el daemon lo saca del texto
// antes de cualquier cosa (asi `status` y los comandos crudos siguen matcheando exacto), lo guarda en
// `logs/chat-<tema>.jsonl` como `desde` y se lo pasa al modelo.
function navCorto(){
  var ua = (navigator.userAgent || "").toLowerCase(), os = "", nav = "";
  if(/iphone|ipad|ipod/.test(ua)) os = "ios";
  else if(/android/.test(ua)) os = "android";
  else if(/mac os x|macintosh/.test(ua)) os = "mac";
  else if(/windows/.test(ua)) os = "win";
  else if(/linux/.test(ua)) os = "linux";
  if(/edg\//.test(ua)) nav = "edge";
  else if(/opr\/|opera/.test(ua)) nav = "opera";
  else if(/firefox|fxios/.test(ua)) nav = "firefox";
  else if(/chrome|crios/.test(ua)) nav = "chrome";
  else if(/safari/.test(ua)) nav = "safari";
  return [os, nav].filter(Boolean).join("/") || "otro";
}
// el dispositivo corto de la cabecera `f · hh:mm · iphone` (1140): iphone e ipad por userAgent, y el ipados
// que se hace pasar por mac (userAgent `Macintosh`) por los puntos tactiles; si el userAgent no lo dice, el
// tamaño de pantalla (lado corto >= 700 = ipad).
var DISPOSITIVOS = ["iphone", "ipad", "mac", "android", "pc"];
function dispActual(ua, toques, lado){
  ua = String(ua === undefined ? navigator.userAgent || "" : ua).toLowerCase();
  toques = toques === undefined ? (navigator.maxTouchPoints || 0) : toques;
  if(lado === undefined){ try{ lado = Math.min(screen.width, screen.height); }catch(x){ lado = 0; } }
  if(/ipad/.test(ua)) return "ipad";
  if(/iphone|ipod/.test(ua)) return lado >= 700 ? "ipad" : "iphone";
  if(/android/.test(ua)) return "android";
  if(/mac os x|macintosh/.test(ua)) return toques > 1 ? "ipad" : "mac";
  return "pc";
}
// lo mismo desde un `desde` guardado (filas del historial, mensajes de otros dispositivos): el `disp` que
// mando la web gana; las marcas viejas sin `disp` se deducen por celu/compu + os. sin marca: "".
function dispDe(d){
  if(!d) return "";
  if(d.disp) return String(d.disp);
  var os = String(d.nav || "").split("/")[0], celu = d.tipo === "celu";
  if(os === "ios") return celu ? "iphone" : "ipad";
  if(os === "mac") return celu ? "ipad" : "mac";
  if(os === "android") return "android";
  return celu || !os ? "" : "pc";
}
// app o navegador (orden 1215): `app` si corre como pwa (`esStandalone()`), `safari` si es safari pelado y
// `navegador` cualquier otro. viaja como quinto tramo de la marca y sale en la cabecera `f · hh:mm · iphone · app`.
var MODOS = ["app", "safari", "navegador"];
function modoActual(standalone, nav){
  if(standalone === undefined) standalone = esStandalone();
  if(standalone) return "app";
  nav = nav === undefined ? navCorto() : String(nav || "");
  return /(^|\/)safari$/.test(nav) ? "safari" : "navegador";
}
function modoDe(d){ return d && MODOS.indexOf(d.modo) >= 0 ? d.modo : ""; }
function desdeActual(){
  return {tipo: esTactil() ? "celu" : "compu", id: DISPOSITIVO, nav: navCorto(), disp: dispActual(), modo: modoActual()};
}
function marcaDesde(){

  return "[desde: " + d.tipo + " " + d.id + " " + d.nav + " " + d.disp + " " + d.modo + "]";
}
// la hora en que facundo apreto mandar (facundo, 2026-09-13, orden 1191): viaja como
// `[enviado: <epoch ms>]` arriba de `[desde: ...]`. sin esto el chat quedaba ordenado por la hora de
// LLEGADA al server, y un audio (que se sube y se transcribe antes de escribirse) caia abajo de un
// texto mandado despues. epoch en ms y no texto: el reloj del celu y el del server no comparten zona.
function marcaEnviado(ts){ return "[enviado: " + (ts || Date.now()) + "]"; }
var RE_ENVIADO = /\s*\[enviado:\s*(\d{10,16})\]\s*$/;
// saca la marca del texto que se pinta: {texto, enviado} (`enviado` = epoch ms o null)
function sacarEnviado(t){
  var m = RE_ENVIADO.exec(t || "");
  if(!m) return {texto: t || "", enviado: null};
  return {texto: (t || "").slice(0, m.index).replace(/\s+$/, ""), enviado: +m[1]};
}

// la forma es cerrada (celu|compu + id + navegador): un mensaje que termine en "[desde: casa]" es
// texto de facundo y no se toca. misma regex que `RE_DESDE` de daemon.py.
var RE_DESDE = /\s*\[desde:\s*(celu|compu)\s+([\w.-]{1,24})(?:\s+([\w./+-]{1,32}))?(?:\s+(iphone|ipad|mac|android|pc))?(?:\s+(app|safari|navegador))?\]\s*$/i;
// saca la marca del texto que se muestra: {texto, desde}
function sacarDesde(t){
  var m = RE_DESDE.exec(t || "");
  if(!m) return {texto: t || "", desde: null};
  var d = {tipo: m[1].toLowerCase(), id: m[2], nav: m[3] || ""};
  if(m[4]) d.disp = m[4].toLowerCase();
  if(m[5]) d.modo = m[5].toLowerCase();
  return {texto: (t || "").slice(0, m.index).replace(/\s+$/, ""), desde: d};
}

// {tabs, activo} saneado: solo temas conocidos, sin repetidos, la activa dentro de tabs.
// las reglas de siempre: una pestaña por tema, y la general (`auto`) es una mas de la lista.
// los layouts viejos traian `paneles` y `foco` (el split al lado de los widgets, ya sacado): se
// leen solo para saber en que pestaña estabas y no se vuelven a escribir.
function sanearLayout(L){
  if(!L || !L.tabs || !L.tabs.length) return null;
  var ts = [];
  L.tabs.forEach(function(t){
    t = t === AUTO ? AUTO : normTema(t);                 // `awtomic-qa` viejo -> `awtomic/qa`
    if((esTema(t) || t === AUTO) && ts.indexOf(t) < 0) ts.push(t);
  });
  if(!ts.length) return null;
  // 1959 {audio}: los modos son pestañas fijas, como la general: si el layout viene sin `audio` (un tabs.json
  // de antes, o un dispositivo que la cerro) igual esta, a la derecha de las de tema y a la izquierda de la general
  MODOS_TAB.forEach(function(m){ if(ts.indexOf(m) < 0) ts.splice(Math.max(0, ts.indexOf(AUTO) < 0 ? ts.length : ts.indexOf(AUTO)), 0, m); });
  var a = L.activo || (L.paneles || [])[0] || ts[0];
  a = a === AUTO ? AUTO : normTema(a);
  if(ts.indexOf(a) < 0) a = ts[0];
  return {tabs: ts, activo: a};
}
function layoutActual(){ return {tabs: tabs, activo: activo}; }
function firmaLayout(L){ return JSON.stringify([L.tabs, L.activo]); }
// pinta un layout (venga del cache o del buzon) sin dispararme una publicacion de vuelta
function aplicarLayout(L, ts){
  var s = sanearLayout(L);
  if(!s) return false;
  var igual = firmaLayout(s) === firmaLayout(layoutActual());
  tabs = s.tabs; activo = s.activo;
  layoutTs = ts || Date.now();
  aplicando = true;
  try{ pintarTabs(); if(!igual){ render(); irDonde(true); } }finally{ aplicando = false; }
  guardarCache();
  return !igual;
}
function guardarCache(){
  layoutFirma = firmaLayout(layoutActual());
  try{
    localStorage.setItem("agente_tabs", JSON.stringify(
      {tabs: tabs, activo: activo, ts: layoutTs, origen: DISPOSITIVO,
       borradores: borradoresLimpios(), vistas: vistasLimpias(), split: splitLimpio(),
       wsets: wsetsLimpias(), orden_widgets: ordenLimpio(), avisos_leidos: leidosLimpios(),
       llegadas: llegadasLimpias()}));
  }catch(x){}
}
// cambio local: sube el reloj, guarda el cache y encola la publicacion. si el layout quedo igual
// (el pintado de siempre, un foco que ya estaba) no toca el `ts`: si no, abrir la pagina se llevaria
// por delante lo que dejo el otro dispositivo.
function guardarLayout(){
  if(aplicando || firmaLayout(layoutActual()) === layoutFirma){ guardarCache(); return; }
  layoutTs = Math.max(Date.now(), layoutTs + 1);
  guardarCache();
  publicarTabs();
}

// ---------- vista mobile: una vista a la vez (facundo, 2026-09-11) ----------

// compu, celu de pie). todo el js decide el layout por aca, nunca leyendo `innerWidth` suelto.
var MQ_MOBILE = "(max-width:899px), (max-aspect-ratio: 1/1)";
var mqMobile = null;
try{ mqMobile = window.matchMedia ? window.matchMedia(MQ_MOBILE) : null; }catch(x){ mqMobile = null; }
function esVistaMobile(){
  if(mqMobile) return !!mqMobile.matches;
  return window.innerWidth < 900 || window.innerHeight >= window.innerWidth;   // navegador viejo
}

// ---------- separador arrastrable entre chat y widgets (facundo, 2026-09-11) ----------
// solo en escritorio: en la vista mobile las vistas van de a una y el separador ni se pinta.
function anchoDesktop(){ return !esVistaMobile(); }
function splitPct(){ return split && typeof split.pct === "number" ? split.pct : null; }
function splitLimpio(){ return split ? {pct: Math.round(split.pct * 100) / 100, ts: +split.ts || 0} : null; }
// el pct que pidieron, recortado para que ningun panel baje de SPLIT_MIN px
function limitarPct(pct){
  if(typeof pct !== "number" || !isFinite(pct)) return null;
  // el pct es sobre el ancho de #cuerpo (el separador va adentro), asi que el minimo de la
  // derecha se mide descontandolo: si no, el bloque de widgets quedaba unos pixeles corto.
  var cuerpo = $("cuerpo"), sep = $("sep");
  var w = cuerpo ? cuerpo.clientWidth : 0, ancho = sep ? sep.offsetWidth : 0;
  if(w - ancho > SPLIT_MIN * 2){
    var min = SPLIT_MIN / w * 100, max = (w - ancho - SPLIT_MIN) / w * 100;
    pct = Math.min(Math.max(pct, min), max);
  }
  return Math.min(Math.max(pct, 5), 95);
}
// pinta el ancho elegido. con un tercer panel (una pestaña al lado de los widgets) el separador
// queda entre el chat y todo el bloque de la derecha: los widgets son los que se estiran.
function aplicarSplit(){
  var chat = $("panel-chat"), w = $("panel-widgets"), pct = splitPct();
  if(!chat || !w) return;
  if(pct === null || !anchoDesktop()){
    chat.style.flex = ""; w.style.flex = "";
    document.body.classList.remove("split");
    return;
  }
  document.body.classList.add("split");
  chat.style.flex = "0 0 " + pct.toFixed(2) + "%";
  w.style.flex = "1 1 auto";
}
// cambio local: `soloVer` = estoy arrastrando (pinta pero no escribe), `ya` = publicar sin esperar
function guardarSplit(pct, ya, soloVer){
  pct = limitarPct(pct);
  if(pct === null) return;
  split = {pct: pct, ts: Math.max(Date.now(), (+(split || {}).ts || 0) + 1)};
  aplicarSplit();
  if(soloVer) return;
  guardarCache();
  publicarTabs(ya);
}
// llego el ancho del buzon (o del cache): gana el `ts` mas nuevo
function recibirSplit(rem){
  if(!rem || typeof rem.pct !== "number") return false;
  if((+rem.ts || 0) <= (+(split || {}).ts || 0)) return false;
  split = {pct: rem.pct, ts: +rem.ts || 0};
  aplicarSplit();
  guardarCache();
  return true;
}

// ---------- settings de cada widget (facundo, 2026-09-12) ----------

// queda de cache offline.
var wsets = {};                   // {clave: {valores..., ts}}
var WSETS_DEBOUNCE = 1200;

// `filas: 0` = todas. la tercera de cada uno es la especifica que pidio facundo.

  dj:          [{k: "cola", et: "mostrar la cola", tipo: "bool", def: true}],
  mail:        [{k: "pendientes", et: "mostrar los pendientes", tipo: "bool", def: true}],
  que_ver:     [{k: "fuentes", et: "fuentes", tipo: "opciones", def: "todas", ops: ["todas"]},

                {k: "solo_nuevos", et: "solo lo nuevo", tipo: "bool", def: false},

  igcola:      [{k: "hechas", et: "mostrar las que ya salieron", tipo: "bool", def: true}],

// 2144 {oportunidades}: widgets retirados del board. la clave puede seguir en el `tabs.json` del buzon
// (o en el cache de localStorage) de cuando existian: se filtra al leer y al publicar, asi la config
// guardada queda limpia sola en la primera pasada y nada la vuelve a resucitar.
var WIDGETS_FUERA = {oportunidades: 1, decided: 1};
function widgetFuera(c){ return !!WIDGETS_FUERA[c]; }
// 2175 {gasto}: el widget `usage` pasa a llamarse `gasto` (ya no es solo claude). la clave vieja puede
// seguir viva en el `tabs.json` del buzon o en el cache de localStorage: se traduce al leer, asi la

var WIDGETS_ALIAS = {usage: "gasto"};
function claveW(c){ return WIDGETS_ALIAS[c] || c; }
var WSETS_COMUNES = [{k: "plegado", et: "plegado por default", tipo: "bool", def: false},

// la lista entera de un widget: las dos comunes primero, despues la suya
function setsDe(clave){
  return WSETS_COMUNES.concat(WSETS[clave] || []).map(function(s){
    var o = {}; for(var k in s) o[k] = s[k];
    if(s.k === "cuentas") o.ops = ["todas"].concat(cuentasConocidas());
    if(s.k === "estado" && clave === "tickets") o.ops = ["todos"].concat(estadosConocidos());
    if(s.k === "tema" && clave === "propuestas") o.ops = ["todos"].concat(temasPropuestas());
    if(s.k === "fuentes" && clave === "que_ver") o.ops = ["todas"].concat(fuentesQueVer());
    return o;

}
function defDe(clave, k){
  var ls = setsDe(clave);
  for(var i = 0; i < ls.length; i++) if(ls[i].k === k) return ls[i].def;
  return null;
}
// el valor de una setting: lo guardado, y si no el default
function wset(clave, k){
  var w = wsets[clave] || {};
  return (w[k] === undefined || w[k] === null) ? defDe(clave, k) : w[k];
}
function guardarWset(clave, k, v){
  var w = wsets[clave] || (wsets[clave] = {});
  w[k] = v;
  w.ts = Math.max(Date.now(), (+w.ts || 0) + 1);

// repinta si el dom de los widgets ya existe (el cache se aplica antes de que se arme)
function repintarWidgets(){ if(typeof widgetsEl !== "undefined" && widgetsEl) pintarWidgets(null); }
function wsetsLimpias(){
  var o = {};
  Object.keys(wsets).forEach(function(c){
    if(widgetFuera(c)) return;

    Object.keys(w).forEach(function(k){ if(k !== "ts" && w[k] !== undefined) n[k] = w[k]; });

  Object.keys(rem).forEach(function(cv){

    if(widgetFuera(c)){ if(wsets[c]){ delete wsets[c]; cambio = true; } return; }
    var r = rem[cv] || {}, mio = wsets[c] || {};
    if((+r.ts || 0) <= (+mio.ts || 0)) return;
    wsets[c] = r; cambio = true;
  });
  if(cambio){ guardarCache(); repintarWidgets(); }
  return cambio;
}

// ---------- orden de los widgets, arrastrables (facundo, 2026-09-12) ----------
// cada caja se arrastra por su header y el orden viaja en `tabs.json` como `orden_widgets`
// (`{ids, ts}`, gana el `ts` mas nuevo, igual que el split), asi el celu y la compu ven las cajas
// en el mismo orden. un widget nuevo que no este en la lista va al final, nunca se pierde.
// las pestañas del chat NO se arrastran (regla del 2026-09-12: el chat es un panel unico).
var ordenW = {ids: [], ts: 0};
var clavesW = [];                 // las claves del ultimo repintado, ya ordenadas (incluye las ocultas)
function ordenLimpio(){
  var ids = ordenW.ids.filter(function(c){ return !widgetFuera(c); });
  return ids.length ? {ids: ids, ts: +ordenW.ts || 0} : null;
}
function guardarOrden(ids, ya){
  ordenW = {ids: ids.slice(), ts: Math.max(Date.now(), (+ordenW.ts || 0) + 1)};
  guardarCache();
  publicarTabs(ya, WSETS_DEBOUNCE);
  repintarWidgets();
}
// llego el orden del buzon (o del cache): gana el `ts` mas nuevo. una lista pelada (formato viejo)
// se acepta con el `ts` mas bajo posible.
function recibirOrden(rem){
  if(!rem) return false;
  if(Array.isArray(rem)) rem = {ids: rem, ts: 1};
  if(!Array.isArray(rem.ids)) return false;
  if((+rem.ts || 0) <= (+ordenW.ts || 0)) return false;
  var ids = [];
  rem.ids.forEach(function(cv){
    var c = typeof cv === "string" ? claveW(cv) : cv;   // 2175: `usage` guardado = `gasto`
    if(typeof c === "string" && c && !widgetFuera(c) && ids.indexOf(c) < 0) ids.push(c);
  });
  ordenW = {ids: ids, ts: +rem.ts || 0};
  guardarCache(); repintarWidgets();
  return true;
}
// el orden de ahora: primero lo guardado (lo que siga existiendo), despues las cajas nuevas en su
// orden de fabrica
function ordenarClaves(claves){
  var res = [];
  ordenW.ids.forEach(function(c){ if(claves.indexOf(c) >= 0 && res.indexOf(c) < 0) res.push(c); });
  claves.forEach(function(c){ if(res.indexOf(c) < 0) res.push(c); });
  return res;
}
function ocultoW(clave){ return !!wset(clave, "oculto"); }
// `subir` / `bajar` del modal: la alternativa sin arrastrar. salta las cajas ocultas, si no mover
// una vez no cambiaria nada.
function moverWidget(clave, delta){
  var ids = ordenarClaves(clavesW.slice());
  var i = ids.indexOf(clave);
  if(i < 0) return false;
  var j = i + delta;
  while(j >= 0 && j < ids.length && ocultoW(ids[j])) j += delta;
  if(j < 0 || j >= ids.length) return false;
  ids.splice(i, 1);
  ids.splice(j, 0, clave);
  guardarOrden(ids, true);
  return true;
}
// el orden que quedo en el dom despues de arrastrar: las ocultas se quedan donde estaban
function mezclarOcultas(vis){
  var prev = ordenarClaves(clavesW.slice()), q = vis.slice(), res = [];
  prev.forEach(function(c){
    if(ocultoW(c) || vis.indexOf(c) < 0){ res.push(c); return; }
    if(q.length) res.push(q.shift());
  });
  q.forEach(function(c){ res.push(c); });
  return res.filter(function(c, i, a){ return a.indexOf(c) === i; });
}

// ---------- borrador del input, continuable en cualquier dispositivo (facundo, 2026-09-11) ----------
// lo que facundo escribe en la caja es un borrador **por pestaña**: se guarda mientras tipea, viaja en
// `tabs.json` y vuelve a aparecer con el cursor al final cuando abre la web en el celu o recarga la

// urls clickeables (facundo, 2026-09-12: abrio una url de oauth cortada antes de `&state=` y claude.com
// le dijo "Missing state parameter"). el texto YA viene escapado, asi que `&` llega como `&amp;` y va
// igual al href: el html lo decodifica solo. nada de cortar ni de copiar a mano.
var RE_MDLINK = /\[([^\]\n]+)\]\(\s*(https?:\/\/[^)\s]+)\s*\)/g;
var RE_URL = /(https?:\/\/[^\s<>"'`]+)/g;
function unLink(u, texto){
  return '<a href="' + String(u).replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">' +
         (texto === undefined ? u : texto) + "</a>";
}
function enlaces(l){
  // `;` no se saca como puntuacion final: es el cierre de `&amp;`, que trae casi toda url larga
  var COLA = /(?:[).,:!?]|&quot;|&gt;)+$/;
  var hechos = [];                                  // los `[texto](url)` salen del paso, como los `code`
  var x = String(l).replace(RE_MDLINK, function(m0, texto, u){
    hechos.push(unLink(u, texto));
    return "\u0002" + (hechos.length - 1) + "\u0002";
  });
  x = x.replace(RE_URL, function(u){
    var m = COLA.exec(u), cola = m ? m[0] : "";
    if(cola) u = u.slice(0, u.length - cola.length);
    return unLink(u) + cola;
  });
  return x.replace(/\u0002(\d+)\u0002/g, function(m0, i){ return hechos[+i]; });
}

function costos(l){
  return l.replace(/\$\d+(?:[.,]\d+)?/g, '<span class="costo">$&</span>')
          .replace(/\brc=(\d+)\b/g, function(m0, n){
            return '<span class="' + (n === "0" ? "ok" : "fallo") + '">' + m0 + "</span>"; });
}
// markdown-lite en color (facundo, 2026-09-11: "mas color"): `code` cian, **negrita** amarilla,
// ## titulos magenta, tablas con cabecera y filas alternadas, --- verde tenue, [tag] verde,
// ORDEN:/PROPUESTA: amarillo. el texto ya viene escapado: aca solo se agregan spans.
function enCodigo(l, f){  // saca los `code` antes de tocar el resto y los devuelve al final
  var trozos = [];
  l = l.replace(/`([^`]+)`/g, function(m0, c){
    trozos.push('<span class="cod">' + c + "</span>");
    return "\u0001" + (trozos.length - 1) + "\u0001";
  });
  l = f(l);
  return l.replace(/\u0001(\d+)\u0001/g, function(m0, i){ return trozos[+i]; });
}
function enLinea(l){
  return enCodigo(l, function(x){
    x = costos(x);
    x = x.replace(/\*\*([^*]+)\*\*/g, function(m0, c){ return '<span class="neg">' + c + "</span>"; });
    return enlaces(x);      // lo ultimo: las urls quedan enteras y clickeables (nunca a mano)
  });
}
// imagenes: `![alt](src)`. el daemon ya publico el archivo local en el repo del buzon

// baja con el mismo token, o una url http(s) que va directo.
var RE_IMG = /!\[([^\]\n]*)\]\(\s*([^)\s]+)\s*\)/g;
function att(s){ return String(s).replace(/"/g, "&quot;"); }   // el texto ya viene escapado
function conImagenes(l){

// bajarla: una foto que carga tarde es la causa mas comun de que el chat pegue el salto.
var IMG_DIM = "agente_img_dim";

  if(v && v[0] === im.naturalWidth && v[1] === im.naturalHeight) return;

function srcBuzon(src){  // ruta local vieja del server (`/home/.../tmp/img/x.png`) -> `img/x.png` del buzon

function bajarImagen(src){

  if(imgUrls[repo]) return Promise.resolve(imgUrls[src] = imgUrls[repo]);
  return bajarBlob(repo).then(function(b){

// 1652 (facundo, 2026-09-15): pinch con dos dedos, arrastre con zoom, doble toque vuelve a 1x, rueda en desktop.
// la imagen nunca se va de la pantalla (`vzLimitar`) y salir anda siempre: `✕` fija, tocar el fondo a 1x, esc (`escTope`)
var VZ_MAX = 5, VZ_DOBLE_MS = 300;
function verImagen(url, alt){
  var v = document.createElement("div");
  v.id = "visor";
  var im = document.createElement("img");
  im.src = url; im.alt = alt || ""; im.draggable = false;
  var x = document.createElement("span");
  x.className = "cerrar"; x.textContent = "✕";
  x.setAttribute("role", "button"); x.setAttribute("aria-label", "cerrar");
  v.appendChild(im); v.appendChild(x);
  var z = {s: 1, tx: 0, ty: 0}, ptrs = {}, gesto = null, movio = false, ultTap = {t: 0, x: 0, y: 0};
  function pintar(){
    im.style.transform = "translate(" + z.tx + "px," + z.ty + "px) scale(" + z.s + ")";
    v.classList.toggle("zoom", z.s > 1.01);
  }
  function limitar(){                               // sin huecos: centrada si entra, bordes pegados si sobra
    z.s = Math.min(VZ_MAX, Math.max(1, z.s));
    var mx = Math.max(0, (im.offsetWidth * z.s - v.clientWidth) / 2);
    var my = Math.max(0, (im.offsetHeight * z.s - v.clientHeight) / 2);
    z.tx = Math.min(mx, Math.max(-mx, z.tx));
    z.ty = Math.min(my, Math.max(-my, z.ty));
  }
  function escalarEn(s2, fx, fy){                  // fx/fy: punto de pantalla que queda quieto
    var r = v.getBoundingClientRect(), cx = fx - r.left - r.width / 2, cy = fy - r.top - r.height / 2;
    s2 = Math.min(VZ_MAX, Math.max(1, s2));
    z.tx = cx - (cx - z.tx) * (s2 / z.s); z.ty = cy - (cy - z.ty) * (s2 / z.s); z.s = s2;
    limitar(); pintar();
  }
  function lista(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
  function arrancar(){
    var p = lista();
    if(p.length >= 2){
      gesto = {tipo: "pinch", d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, s: z.s,
               mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2, tx: z.tx, ty: z.ty};
    } else if(p.length === 1){
      gesto = {tipo: "arrastre", x: p[0].x, y: p[0].y, tx: z.tx, ty: z.ty};
    } else gesto = null;
  }
  v.addEventListener("pointerdown", function(e){
    if(e.target === x) return;
    if(e.isPrimary){ ptrs = {}; movio = false; }   // primer dedo: si quedo un puntero sin soltar (safari, cancel), se limpia
    ptrs[e.pointerId] = {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY};
    try{ v.setPointerCapture(e.pointerId); }catch(err){}
    if(Object.keys(ptrs).length >= 2) movio = true;   // dos dedos nunca es un toque que cierra
    arrancar();
  });
  v.addEventListener("pointermove", function(e){
    var q = ptrs[e.pointerId];
    if(!q || !gesto) return;
    q.x = e.clientX; q.y = e.clientY;
    if(Math.hypot(q.x - q.x0, q.y - q.y0) > 8) movio = true;
    var p = lista();
    if(gesto.tipo === "pinch" && p.length >= 2){
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
      var mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      z.tx = gesto.tx + (mx - gesto.mx); z.ty = gesto.ty + (my - gesto.my);   // el punto medio arrastra
      z.s = gesto.s;
      escalarEn(gesto.s * d / gesto.d, mx, my);
    } else if(gesto.tipo === "arrastre" && z.s > 1.01){
      z.tx = gesto.tx + (q.x - gesto.x); z.ty = gesto.ty + (q.y - gesto.y);
      limitar(); pintar();
    }
    e.preventDefault();
  });
  function soltar(e){
    var q = ptrs[e.pointerId];
    delete ptrs[e.pointerId];
    arrancar();                                     // de dos a un dedo sigue como arrastre, sin salto
    if(!q || e.type === "pointercancel" || movio || Object.keys(ptrs).length) return;
    var t = Date.now();
    if(t - ultTap.t < VZ_DOBLE_MS && Math.hypot(e.clientX - ultTap.x, e.clientY - ultTap.y) < 30){
      ultTap.t = 0;
      if(z.s > 1.01){ z.s = 1; z.tx = 0; z.ty = 0; pintar(); movio = true; }   // doble toque: vuelve a 1x
      else { escalarEn(2.5, e.clientX, e.clientY); movio = true; }

  }
  v.addEventListener("pointerup", soltar);
  v.addEventListener("pointercancel", soltar);
  v.addEventListener("wheel", function(e){          // desktop: rueda o trackpad escala en el cursor
    e.preventDefault();
    escalarEn(z.s * Math.exp(-e.deltaY / 300), e.clientX, e.clientY);
  }, {passive: false});
  ["gesturestart", "gesturechange", "gestureend"].forEach(function(n){   // safari: que no escale la pagina
    v.addEventListener(n, function(e){ e.preventDefault(); }, {passive: false});
  });

  function reacomodar(){ limitar(); pintar(); }
  function cerrar(){
    if(v.parentNode) v.parentNode.removeChild(v);
    window.removeEventListener("resize", reacomodar);
  }
  v.__cerrar = cerrar;
  v.__z = z;                                        // para las pruebas: escala y corrimiento de adentro
  x.addEventListener("click", function(e){ e.stopPropagation(); cerrar(); });
  v.addEventListener("click", function(e){        // el fondo cierra solo a 1x y si no fue un gesto
    if(e.target === im || z.s > 1.01 || movio){ movio = false; return; }
    cerrar();
  });
  window.addEventListener("resize", reacomodar);
  im.addEventListener("load", reacomodar);
  document.body.appendChild(v);
}
// 1400 (facundo, 2026-09-15: "las tablas mejor con css normal y no barritas de texto"): un bloque de filas
// `| a | b |` sale como <table>; sirve con la primera fila vacia (sin encabezado), sin separador, sin el pipe
// del cierre y con separadores de cuadro (`├──┼──┤`). el `---` es una linea css sutil, sin guiones.
function esFila(l){ return /^\s*\|.*\|/.test(l); }
function esSepFila(l){ return /^[\s|:\-+├┼┤┌┐└┘┬┴─│═╪╞╡]+$/.test(l) && /[-─═]/.test(l); }
function celdas(l){                                // parte por `|`, salvo adentro de un `code`
  var x = l.trim(), out = [], cur = "", cod = false;
  if(x[0] === "|") x = x.slice(1);
  if(x.slice(-1) === "|") x = x.slice(0, -1);
  for(var k = 0; k < x.length; k++){
    var ch = x[k];
    if(ch === "`") cod = !cod;
    if(ch === "|" && !cod){ out.push(cur.trim()); cur = ""; } else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function tablaHtml(ls){
  var filas = [], cab = null;
  ls.forEach(function(l, k){
    if(esSepFila(l)){ if(k === 1 && filas.length === 1) cab = filas.shift(); return; }
    filas.push(celdas(l));
  });
  if(cab && cab.every(function(c){ return !c; })) cab = null;   // `| | |`: sin encabezado
  filas = filas.filter(function(f){ return f.some(function(c){ return c; }); });
  var n = Math.max.apply(null, [cab ? cab.length : 0].concat(filas.map(function(f){ return f.length; })));
  function tr(f, tag, clase){
    var h = "";
    for(var k = 0; k < n; k++) h += "<" + tag + ">" + enLinea(f[k] || "") + "</" + tag + ">";
    return "<tr" + (clase ? ' class="' + clase + '"' : "") + ">" + h + "</tr>";
  }
  return '<div class="tmd"><table>' + (cab ? '<thead>' + tr(cab, "th", "tcab") + "</thead>" : "") + "<tbody>" +
         filas.map(function(f, k){ return tr(f, "td", "tfila" + (k % 2 ? " par" : "")); }).join("") + "</tbody></table></div>";
}
function lineaHtml(l, i){
  var aud = conAudios(l);
  if(aud !== null) return aud;
  var img = conImagenes(l);
  if(img !== null) return img;
  var tarea = /^(\s*[-*]\s*)\[( |x|X|!|&gt;)\]/.exec(l);
  if(tarea){
    var c = tarea[2].toLowerCase();
    var clase = c === "x" ? "ok" : c === "!" ? "fallo" : c === " " ? "pend" : "corriendo";
    return '<span class="' + clase + '">' + enLinea(l) + "</span>";
  }
  if(/^\s*&gt;\s?\S/.test(l)) return '<span class="cita">' + enLinea(l) + "</span>";
  if(/^\s*#{1,6}\s+\S/.test(l)) return '<span class="tit">' + enLinea(l) + "</span>";
  if(/^\s*(ORDEN|PROPUESTA|AVISO|PREGUNTA):/.test(l)) return '<span class="orden">' + enLinea(l) + "</span>";
  if(/^\s*(?:\*\*)?APREND[IÍ](?:\*\*)?:/i.test(l)) return '<span class="aprendi">' + enLinea(l) + "</span>";   // 1502
  var linea = enLinea(l);
  if(i === 0){                                     // [tema] / [openrouter/x] al inicio de la respuesta
    linea = linea.replace(/^(\s*)\[([^\]\n]{1,40})\]/, function(m0, sp, dentro){
      return sp + '<span class="tag">[' + dentro + "]</span>";
    });
  }
  return linea.replace(/^(\s*)([-*])(\s)/, function(m0, sp, g, fin){
    return sp + '<span class="vin">' + g + "</span>" + fin;
  });
}
function resaltar(t){
  var lineas = esc(t).split("\n"), out = [];       // {h, b}: b = bloque (tabla, separador), sin \n alrededor
  for(var i = 0; i < lineas.length; i++){
    var l = lineas[i];
    if(esFila(l)){
      var j = i + 1;
      while(j < lineas.length && (esFila(lineas[j]) || esSepFila(lineas[j]))) j++;
      out.push({h: tablaHtml(lineas.slice(i, j)), b: true});
      i = j - 1;
      continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,}|[─═]{3,})\s*$/.test(l)){ out.push({h: '<span class="sep"></span>', b: true}); continue; }
    out.push({h: lineaHtml(l, i), b: false});
  }
  return out.map(function(x, k){ return (k && !x.b && !out[k - 1].b ? "\n" : "") + x.h; }).join("");
}

// ---------- mensajes: uno solo por comentario, repartido a la pestaña de su tema ----------
// msgs es la charla entera en orden; el chat pinta los que caen en la pestaña activa (deEstaTab).
// se arma con dos fuentes: `msgsHist`, la charla COMPLETA de cada tema que publica el daemon en el
// buzon (`chat/<tema>.json`), y `msgsCom`, lo que trae el poll de comentarios del issue (lo de recien
// y las respuestas que el daemon contesta sin modelo, que no van al log de chat). `mezclar()` las une
// por fecha y saca los repetidos: la franja mas nueva esta en las dos.
var msgs = [], msgsHist = {}, msgsCom = [];
// el tema de un mensaje: el que ya trae explicito, el `[tema]` con el que contesto el daemon, el
// `tema x:` que escribio facundo, las palabras clave, y si no hay nada, el del mensaje anterior
// (lo mismo que hace el daemon con `.ultimo-tema`).
function temaDe(m, prev){
  if(m.explicito) return m.tema;
  if(m.tag) return m.tag;
  if(m.clase === "agente") return prev || "tools";
  var c = clasificar(m.texto);
  return c.tema || prev || "tools";
}
function recalcularTemas(){
  var prev = null;
  msgs.forEach(function(m){ m.tema = temaDe(m, prev); prev = m.tema; });
}
// el mismo mensaje puede venir por las dos fuentes (el daemon publica la charla despues de contestar,
// el comentario ya estaba): se compara texto normalizado y fecha cercana, y gana el del historial.
function claveMsg(m){
  return m.clase + "|" + String(m.texto || "").replace(/\s+/g, " ").trim().slice(0, 120).toLowerCase();
}
var CERCA = 1800000;   // 30 min: un texto identico mas lejos que eso es otro mensaje, no el mismo
// mezcla varias listas YA ordenadas en una sola, por fecha. cada lista conserva su orden interno:
// el historial de un tema queda como lo escribio el log y los comentarios como fueron llegando
// (dos comentarios del mismo segundo no se dan vuelta por el sort).
function mezclarOrdenadas(listas){
  var i = listas.map(function(){ return 0; }), out = [];
  for(;;){
    var mejor = -1, mejorT = 0;
    for(var k = 0; k < listas.length; k++){
      if(i[k] >= listas[k].length) continue;
      var t = fecha(listas[k][i[k]].iso);
      if(mejor < 0 || t < mejorT){ mejor = k; mejorT = t; }
    }
    if(mejor < 0) return out;
    out.push(listas[mejor][i[mejor]++]);
  }
}
// 1553: cada respuesta toma su hora de llegada (una respuesta nunca antes de su pregunta) y la lista se reordena
// por esas horas, estable: el orden del chat sigue lo que se ve en las cabeceras
// los comentarios del buzon (`ordenar` false) solo toman la hora: siguen en el orden en que llegaron, que es del
// que dependen las cajas (la respuesta a una caja es el mensaje de f que viene despues) y las vistas guardadas
function conLlegadas(l, ordenar){
  var nuevo = false, ultQ = 0;
  l.forEach(function(m){
    if(m.clase === "yo"){ ultQ = fecha(m.iso); return; }
    if(horaLlegada(m)) nuevo = true;
    if(ordenar && m.srv && ultQ && fecha(m.iso) < ultQ) m.iso = new Date(ultQ).toISOString();
  });
  if(!ordenar) return nuevo;
  var ix = l.map(function(m, i){ return [fecha(m.iso), i, m]; });
  ix.sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; });
  ix.forEach(function(x, i){ l[i] = x[2]; });
  return nuevo;
}
// 1658 (facundo, 2026-09-15): un estado transitorio ("subiendo la foto...", "grabando...") no es un mensaje del
// chat: se ve en el boton, no en la linea de tiempo. si uno quedo pintado en una version vieja (historial del buzon,
// otro dispositivo), aca no se vuelve a dibujar nunca.
var TRANSITORIOS = /^(subiendo (la foto|el audio|la imagen)|grabando|mandando|enviando|procesando)\b/i;
function esEstadoTransitorio(m){

// ---------- audio en curso: el daemon no reinicia mientras grabo o sube (facundo, 2026-09-14) ----------
// un reinicio del daemon a mitad de un audio te come el mensaje (y el microfono queda abierto del otro lado).
// mientras el micro esta abierto (`grabando`) o el m4a viaja (`subiendo`) se avisa al endpoint de la lan y se
// renueva cada OCUPADO_RENUEVA ms: si el navegador se cierra, el flag vence solo en el server (nunca frena mas
// que su tope). sin endpoint lan (solo buzon) no hay por donde avisar: el reinicio no espera.
var OCUPADO_RENUEVA = 10000, ocupadoTimers = {};
function pingOcupado(que, on){
  if(!lan.base || (!token && !lanStub)) return Promise.resolve(false);
  return lanFetch(lan.base + "/ping?ocupado=" + encodeURIComponent(que) + "&on=" + (on ? "1" : "0"),
                  {headers: {"authorization": "Bearer " + token}, cache: "no-store", keepalive: true})
    .then(function(r){ return !!(r && r.ok); }, function(){ return false; });
}
function marcarOcupado(que, on){
  if(ocupadoTimers[que]){ clearInterval(ocupadoTimers[que]); delete ocupadoTimers[que]; }
  if(on) ocupadoTimers[que] = setInterval(function(){ pingOcupado(que, true); }, OCUPADO_RENUEVA);
  if(on && !lan.base) return probarLan().then(function(){ return pingOcupado(que, true); });
  return pingOcupado(que, on);

function lanRuta(metodo, ruta){

  return metodo === "POST" && resto === "issues/" + ISSUE + "/comments";

function lidNuevo(){ return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function apiLan(metodo, ruta, cuerpo, etag, accept){
  var h = {"authorization": "Bearer " + token, "accept": accept || "application/vnd.github+json"};
  var url = lan.base + ruta, opts = {method: metodo, headers: h, cache: "no-store"}, lid = null;
  function caido(motivo){ var e = new Error("lan: " + motivo); e.lanCaido = true; e.lid = lid; return e; }
  if(metodo === "POST"){
    lid = lidNuevo();
    url = lan.base + "/msg";

    opts.body = JSON.stringify({body: cuerpo.body, lid: lid});

  if(etag) h["if-none-match"] = etag;

  if(ctl){ opts.signal = ctl.signal; tmo = setTimeout(function(){ ctl.abort(); }, LAN_FETCH_MS); }

    // sigue por el endpoint (widgets, charla y envio no dependen de github)
    if(r.status === 503 && r.headers && r.headers.get && r.headers.get("x-claudio-sin-github")){

}

      if(!e || !e.lanCaido) throw e;
      lanPoner(null);                                     // respaldo: el buzon, en el acto y sin perder el mensaje
      // si el endpoint alcanzo a atenderlo, el daemon ve el mismo lid y no lo contesta dos veces
      if(e.lid && cuerpo && cuerpo.body) cuerpo = {body: cuerpo.body + "\n<!--lan:" + e.lid + "-->"};

  if(apiStub) return apiStub(metodo, ruta, cuerpo, etag, accept);
  if(!token) return Promise.reject(new Error("401"));
  if(Date.now() < frenoHasta && metodo === "GET"){
    return Promise.reject(new Error("freno"));   // el poll no insiste; mandar un mensaje si
  }
  var h = {
    "authorization": "Bearer " + token,

  };

    method: metodo, headers: h,

    cache: "no-store"
  }).then(function(r){
    if(r.status === 304) return {status:304};

      return r.json().catch(function(){ return {}; }).then(function(j){
        var msg = (j && j.message) || ("http " + r.status);

            throw new Error("el buzón se llenó (2500 comentarios) y el daemon todavía no abrió el nuevo: probá en un minuto");
          });

        // 403 puede ser rate limit (frena) o falta de permisos (el token no sirve para este repo)
        var lim = limiteGithub(r.status, r.headers, msg);
        if(lim){
          frenar(lim.seg + 5, r.status + " " + (lim.secundario ? "límite secundario" : "sin cuota"),
                 metodo === "POST" && /\/comments$/.test(ruta));

    if(!r.ok){

         nodo: mm.nodo || null, modelo: mm.modelo ? modeloCorto(mm.modelo) : null,

function cargarComentarios(reemplazar){

    // 1237: el fin de tarea ahora dice `(tarea <nombre>: ...)` y trae `fuente: tarea`; la linea queda en el jsonl

    if(f.pregunta && !propia) out.push({id: "h:" + base + ":q", clase: "yo", quien: QUIEN_F, texto: f.pregunta,

  resto = (resto || "").trim();
  if(temaCaja === origen && txt.value !== resto) ponerCaja(resto);
  guardarBorrador(origen, resto, true);
}
// `texto` sin el fragmento `trozo` (la primera vez que aparece), pegando lo que queda a los costados
function sinTrozo(texto, trozo){
  texto = texto || ""; trozo = (trozo || "").trim();
  var i = trozo ? texto.indexOf(trozo) : -1;
  if(i < 0) return texto.trim();
  var a = texto.slice(0, i).trim(), b = texto.slice(i + trozo.length).trim();
  return a && b ? a + "\n\n" + b : (a || b);
}
// el tema lo detecta el clasificador (cero tokens) y se cruza con el de la pestaña:
// - `tema x:` escrito a mano: manda, y la charla se va a esa pestaña.
// - pestaña general (`auto`): la puerta de entrada. va sin prefijo (el clasificador es solo el default y el
//   daemon contesta viendo la charla de todos los temas) y **no se renombra nunca** (facundo, 2026-09-11:
//   quiere una puerta de entrada fija ademas de las pestañas de tema). si el tema detectado ya tiene
//   pestaña, salta ahi para que la respuesta se vea donde cae.
// - cualquier otra pestaña: sale directo a la pestaña activa, sin preguntar. el selector "esto parece de X"
//   / "partir" se saco (facundo, 2026-09-14: "cuando toco send quiero enviar").
function enviarMensaje(texto){
  texto = (texto || "").trim();
  // adjunto pendiente (foto o audio): sale un solo mensaje con el archivo y el texto, sin clasificar
  // ni preguntar por tema (siempre a la pestaña activa, como antes de que fuera pendiente).
  if(adjunto) return mandarAdjunto(texto);
  if(!texto) return;
  if(cmdLocal(texto)){ if(txt.value.trim() === texto){ txt.value = ""; txt.style.height = ""; } return; }   // 1631: sin red
  if(RE_CRUDO.test(texto)){ mandar(texto, temaActivo(), true); return; }
  var activo = temaActivo(), c = clasificar(texto);
  if(c.fuente === "prefijo"){
    if(c.tema !== activo){ soltarOrigen(activo, sinTrozo(txt.value, texto)); abrirTab(c.tema); }
    mandar(texto, c.tema);
    return;
  }
  if(activo === AUTO){
    mandar(texto, AUTO);                                       // crudo: la general no fija tema
    if(c.tema && tabs.indexOf(c.tema) >= 0) abrirTab(c.tema);
    return;
  }
  mandar(texto, temaActivo());
}

// ---------- oportunidades: cajas con el texto adentro (1658 {cajas}) ----------
// facundo, 2026-09-21: "se va la fila de chips entera, `op N X` incluidos, y las oportunidades pasan a
// mostrarse como cajas con texto". aca vivia `sugerencias()` con la fila `#chips` (los `A` `B` `C`
// pelados, el `dale`, los `op N X` y el `si`/`no` de una respuesta que termina en pregunta): se fue
// entera, en el chat hay UNA sola forma de decidir, las cajas grandes de `nodoCajas`.
// lo que queda es leer las oportunidades de la respuesta, cero tokens y cero red: el bloque que escribe
// `oportunidades.py --texto` (`N. titulo` y abajo `   A. texto (tiempo)`) sale como cajas con el texto de
// cada opcion adentro, y el toque sigue mandando el `op N X` crudo que resuelve el daemon sin modelo.
var CHIP_TOPE = 30;      // el titulo de una opcion se recorta a esto (`en espera`, y el recorte de `op N X`)
var OP_TOPE = 160;       // el texto de una opcion de oportunidad adentro de su caja
function chipRecorte(t, n){
  t = (t || "").replace(/[`*_]/g, "").replace(/\s+/g, " ").trim();
  n = n || CHIP_TOPE;
  return t.length > n ? t.slice(0, n - 1) + "…" : t;
}
// la ultima respuesta del daemon que cae en esta pestaña (null si todavia no contesto nada)
function ultimaRespuesta(tema){
  for(var i = msgs.length - 1; i >= 0; i--){
    var m = msgs[i];
    if(m.clase === "agente" && deEstaTab(m.tema, tema)) return m.texto || "";
  }
  return null;
}
var RE_OP_ITEM = /^\s*(\d{1,3})[.)]\s+\S/;                    // `2. titulo` abre una oportunidad
var RE_OP_OPC = /^\s+([A-D])[.)]\s+(\S.*?)\s*(?:<-)?\s*$/;     // `   A. texto (2h)` es una de sus opciones
// las opciones de la PRIMERA oportunidad que la respuesta trae escrita entera (`N. titulo` + sus `A.`), o
// las que nombra sueltas (`op 2 B`) si no escribio el bloque. `{lista, cuerpo}` como `opcionesDe`: las
// lineas que se van a ver como caja salen del cuerpo, no se pintan dos veces.
function oportunidadesDe(texto){
  var lineas = String(texto || "").split("\n"), id = null, ops = [], usadas = {}, dentro = false;
  for(var i = 0; i < lineas.length; i++){
    var l = lineas[i];
    if(RE_CERCO.test(l)){ dentro = !dentro; continue; }
    if(dentro) continue;
    var mi = RE_OP_ITEM.exec(l);
    if(mi){
      if(ops.length) break;               // ya junte una entera: la primera manda
      id = mi[1]; ops = []; usadas = {};
      continue;
    }
    var mo = id ? RE_OP_OPC.exec(l) : null;
    if(!mo) continue;
    ops.push({letra: mo[1].toUpperCase(), texto: chipRecorte(mo[2], OP_TOPE),
              cmd: "op " + id + " " + mo[1].toUpperCase()});
    usadas[i] = 1;
  }
  if(ops.length > 1)
    return {lista: ops, cuerpo: lineas.filter(function(l, i){ return !usadas[i]; }).join("\n").replace(/\s+$/, "")};
  // sin bloque escrito: la respuesta nombra `op 2 B` y esa letra es la caja (el cuerpo queda igual)
  var vistos = {}, sueltas = [], m, re = /\bop\s+(\d{1,3})\s+([A-D])\b/gi;
  while((m = re.exec(String(texto || "")))){
    var k = m[1] + m[2].toUpperCase();
    if(vistos[k]) continue;
    vistos[k] = 1;
    sueltas.push({letra: m[2].toUpperCase(), texto: "oportunidad " + m[1] + " " + m[2].toUpperCase(),
                  cmd: "op " + m[1] + " " + m[2].toUpperCase()});
  }
  return {lista: sueltas.length > 1 ? sueltas : [], cuerpo: null};
}

// ---------- camara: una foto desde el celu o la compu (facundo, 2026-09-11) ----------
// "se puede poner una funcion tipo camara aca? como en whatsapp". el boton abre la camara (en el celu;
// en desktop el selector de archivos), la foto se achica a menos de FOTO_TOPE, se sube al **mismo repo
// del buzon** que widgets.json y tabs.json (`img/<hash>-<nombre>.jpg`, contents api, mismo token) y
// sale como un mensaje normal de la pestaña activa con su `tema x:`. la web la pinta inline con el
// mismo camino que las imagenes del daemon (`bajarImagen`), y el daemon la baja a tmp/ y le pasa la
// ruta local al modelo (`recetas/mostrar_imagen.recibir_web`).
var FOTO_TOPE = 2 * 1024 * 1024;    // tope de subida: menos de 2 mb
var FOTO_LADO = 1600;               // lado mayor; alcanza para leer una captura de celu
var FOTO_Q = [0.82, 0.7, 0.6, 0.5, 0.4];
var subiendoFoto = false;

function leerImagen(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ res({im: im, url: url}); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("no pude leer la imagen")); };
    im.src = url;
  });
}
// achica y recomprime hasta entrar en FOTO_TOPE. si el navegador no puede decodificarla (heic) y el
// archivo ya entra, se sube tal cual.
function comprimirFoto(file){
  return leerImagen(file).then(function(r){
    var esc = Math.min(1, FOTO_LADO / Math.max(r.im.width, r.im.height, 1));
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(r.im.width * esc));
    c.height = Math.max(1, Math.round(r.im.height * esc));
    c.getContext("2d").drawImage(r.im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(r.url);
    var i = 0;
    function intento(){
      return new Promise(function(res, rej){
        c.toBlob(function(b){ b ? res(b) : rej(new Error("no pude comprimir la foto")); },
                 "image/jpeg", FOTO_Q[i]);
      }).then(function(b){
        if(b.size <= FOTO_TOPE || i >= FOTO_Q.length - 1) return b;
        i++; return intento();
      });
    }
    return intento();
  }).catch(function(e){
    if(file.size <= FOTO_TOPE) return file;      // heic o similar: va tal cual si entra
    throw e;
  });
}
function bytesAb64(u8){
  var s = "", paso = 0x8000;
  for(var i = 0; i < u8.length; i += paso) s += String.fromCharCode.apply(null, u8.subarray(i, i + paso));
  return btoa(s);
}
function sha12(buf){
  return crypto.subtle.digest("SHA-256", buf).then(function(h){
    return [].map.call(new Uint8Array(h).subarray(0, 6), function(b){
      return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function nombreFoto(hash, file){
  var base = (file.name || "foto.jpg").replace(/[^\w.-]+/g, "-");
  if(!/\.(png|jpe?g|gif|webp)$/i.test(base)) base += ".jpg";
  return "img/" + hash + "-" + base.slice(-60);
}
// sube al repo del buzon con el mismo token. fetch propio (no `api()`): un 403 de escritura no tiene
// que desloguear a facundo del chat, igual que en `ponerTabs`.
var fotoStub = null;     // `prueba_web_tabs` lo enchufa para probar la subida sin tocar github
function subirBuzon(ruta, b64, mensaje, bytes){
  if(fotoStub) return Promise.resolve(fotoStub(ruta, b64)).then(function(){ return ruta; });
  // lan primero: los bytes crudos al endpoint (el daemon la sube al buzon despues, sin que esto espere)
  if(lan.base && bytes && /^(img|audio)\//.test(ruta)){
    return lanFetch(lan.base + "/subir?ruta=" + encodeURIComponent(ruta), {method: "POST", cache: "no-store",
        headers: {"authorization": "Bearer " + token, "content-type": "application/octet-stream"}, body: bytes})
      .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return ruta; })
      .catch(function(){ lanPoner(null); return subirBuzon(ruta, b64, mensaje); });
  }
  return fetch(API + "/repos/" + REPO + "/contents/" + ruta, {
    method: "PUT", cache: "no-store",
    headers: {"authorization": "Bearer " + token, "accept": "application/vnd.github+json",
              "content-type": "application/json"},
    body: JSON.stringify({message: mensaje + " " + DISPOSITIVO, content: b64})
  }).then(function(r){
    if(r.ok || r.status === 422) return ruta;     // 422 = ya existe con ese hash: es el mismo archivo
    return r.text().then(function(t){ throw new Error("http " + r.status + " " + t.slice(0, 80)); });
  });
}
function subirFoto(ruta, b64, bytes){ return subirBuzon(ruta, b64, "foto", bytes); }

// ---------- notificaciones push al iphone (facundo, 2026-09-12) ----------
// ios 16.4+ solo manda push a la pwa agregada a inicio y solo pide permiso dentro de un toque. la
// suscripcion se publica en el buzon como `push/<hash>.json` (una por dispositivo) y el daemon manda con
// `recetas/push.py`. el badge lo pone el sw con el numero del payload; al abrir o volver al foco se
// limpia y `push_leido` viaja en `tabs.json` para que el daemon arranque de 0. detalle en README.md.
var swReg = null, pushSub = null, pushLeido = 0;
var PUSH_LEIDO_MIN = 60000;     // como mucho una publicacion de `push_leido` por minuto
var pushStub = null;            // `prueba_web_tabs` lo enchufa para simular un navegador con push
function esIOS(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
}
function pushSoportado(){
  if(pushStub) return !!pushStub.soportado;
  return !!(window.isSecureContext && location.protocol !== "file:" && "serviceWorker" in navigator &&
            "PushManager" in window && "Notification" in window);
}
// "activas" | "apagadas" | "bloqueadas" | "sin_pwa" (safari sin agregar a inicio) | "sin_soporte"
function pushEstado(){
  if(!pushSoportado()) return esIOS() && !esStandalone() ? "sin_pwa" : "sin_soporte";
  var perm = pushStub ? pushStub.perm : Notification.permission;
  if(perm === "denied") return "bloqueadas";
  return perm === "granted" && pushSub ? "activas" : "apagadas";
}
function pushTexto(){
  return {activas: "activas en este dispositivo", apagadas: "activar",
          bloqueadas: "bloqueadas (ajustes > notificaciones > claudio board o flaudio board)",
          sin_pwa: "agregá a inicio para activar", sin_soporte: "este navegador no tiene push"}[pushEstado()];
}
function b64uABytes(s){
  var b = atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(s).length + 3) % 4));
  var u = new Uint8Array(b.length);
  for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function mismaClave(sub, clave){
  try{
    var a = new Uint8Array(sub.options.applicationServerKey), b = b64uABytes(clave);
    if(a.length !== b.length) return false;
    for(var i = 0; i < a.length; i++) if(a[i] !== b[i]) return false;
    return true;
  }catch(x){ return true; }      // sin `options` (safari viejo) no se puede comparar: se deja
}
// la suscripcion al buzon, una sola vez por endpoint (localStorage recuerda el hash ya publicado)
function publicarSub(s){
  var j = s.toJSON ? s.toJSON() : s;
  return sha12(new TextEncoder().encode(j.endpoint)).then(function(h){
    try{ if(localStorage.getItem("agente_push_pub") === h) return h; }catch(x){}
    var cuerpo = {endpoint: j.endpoint, keys: j.keys, dispositivo: DISPOSITIVO,
                  ua: navigator.userAgent.slice(0, 160), ts: Date.now()};
    return subirBuzon("push/" + h + ".json", textoAb64(JSON.stringify(cuerpo)), "push").then(function(){
      try{ localStorage.setItem("agente_push_pub", h); }catch(x){}
      return h;
    });
  });
}
function iniciarPush(){
  if(!pushSoportado() || pushStub) return;
  navigator.serviceWorker.register("sw.js").then(function(reg){
    swReg = reg;
    return reg.pushManager.getSubscription();
  }).then(function(s){
    pushSub = s || null;
    if(s && Notification.permission === "granted" && token) publicarSub(s).catch(function(){});
    if(s) pushVisto();
    repintarWidgets();
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("message", function(e){
    var d = e.data || {};
    if(d.tipo === "noti") abrirNotiPush(d);                 // 1350: modal encima, la pestaña no se mueve
    if(d.tipo === "abrir") abrirNotiPush({tema: d.tema});   // un sw viejo todavia manda esto
    if(d.tipo === "push" && !document.hidden) pushVisto(true);
  });
}
// el boton: pedir permiso (dentro del toque), suscribirse con la clave vapid y publicar
function activarPush(){
  var e = pushEstado();
  if(e === "sin_pwa"){
    sistema("las notificaciones en iphone andan solo con el board agregado a inicio: en safari, compartir > " +
            "agregar a inicio, abrilo desde el ícono y tocá de nuevo [activar notificaciones].");
    return Promise.resolve(e);
  }
  if(e === "sin_soporte"){ sistema("este navegador no soporta notificaciones push.", "error"); return Promise.resolve(e); }
  if(e === "activas"){ sistema("las notificaciones ya están activas en este dispositivo."); return Promise.resolve(e); }
  var clave = ((widDatos || {}).push || {}).publica;
  if(!clave){
    sistema("todavía no llegó la clave del server (widgets.json): probá de nuevo en un minuto.", "error");
    return Promise.resolve("sin_clave");
  }
  var S = pushStub || {
    permiso: function(){ return Notification.requestPermission(); },
    registro: function(){ return navigator.serviceWorker.register("sw.js").then(function(){ return navigator.serviceWorker.ready; }); }
  };
  return Promise.resolve(S.permiso()).then(function(p){
    if(p !== "granted") throw new Error(p === "denied" ? "las bloqueaste: se destraban en ajustes > notificaciones > claudio board o flaudio board"
                                                       : "no diste permiso");
    return S.registro();
  }).then(function(reg){
    swReg = reg;
    return reg.pushManager.getSubscription().then(function(s){
      if(s && !mismaClave(s, clave)) return s.unsubscribe().then(function(){ return null; });
      return s;
    }).then(function(s){
      return s || reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uABytes(clave)});
    });
  }).then(function(s){
    pushSub = s;
    try{ localStorage.removeItem("agente_push_pub"); }catch(x){}   // suscripcion nueva: se publica si o si
    return publicarSub(s);
  }).then(function(){
    sistema("notificaciones activas en este dispositivo: te llegan los avisos y las respuestas, con el número en el ícono.");
    repintarWidgets();
    return "activas";
  }).catch(function(x){
    sistema("no pude activar las notificaciones: " + ((x && x.message) || x), "error");
    return "error";
  });
}
// facundo esta mirando el board: badge en 0 y `push_leido` al buzon (una vez por minuto)
function pushVisto(ya){
  try{ if(navigator.clearAppBadge) navigator.clearAppBadge().catch(function(){}); }catch(x){}
  if(!pushSub) return false;
  var ahora = Date.now();
  if(!ya && ahora - pushLeido < PUSH_LEIDO_MIN) return false;
  pushLeido = ahora;

  return true;

// ---------- tocar una push: modal encima del chat, sin mover la pestaña (facundo, 2026-09-14, notimodal 1350) ----------
// "cuando toco una notificacion no me lleves a una pestaña que esta con cualquier otra cosa: un modal tamaño chat, por
// arriba del chat y de las pestañas, con el titulo centrado a la altura de las pestañas". el sw manda {tipo: "noti", id,

// ---------- el board por modulos (orden 1793, 2026-09-16: "como las secciones de shopify") ----------
// el shell (este archivo) es el arranque, el transporte, las pestañas y el chat. cada widget migrado vive en

// SOLO el css, se intercambia el `href` del `<link>` (`swapCss`) y no se recarga nada; si cambio SOLO el modulo
// de un widget ya migrado, se vuelve a cargar ese archivo y se repinta ESA caja (`repintarMod`), sin tocar el
// chat, su scroll ni lo que este tipeado. si cambio el shell (o algo que no se sabe repintar), el reload de
// siempre. un modulo no ve el adentro del shell: solo esto.
var MODULOS = ["gasto", "agent", "sombra", "seguidores", "igcola"];   // widgets migrados, en `web/widgets/<clave>.js` (1832: `models` = clave `sombra`)

// 1843 (facundo, 2026-09-17): toda tabla de widget (`queue`, la escalera de `models`) ocupa el 100% del ancho de
// la caja con columnas `fr` proporcionales al contenido, nunca anchos fijos que dejen hueco a la derecha. `cols` es
// una lista por columna con los textos de sus celdas (sin la cabecera: su `min-content` ya pone el piso); el valor
// es `grid-template-columns`. la primera columna es el nombre: `minmax(0, Nfr)`, la unica que se achica y se corta
// con `…`, asi en el celu entra sin scroll horizontal; las demas `Nfr` con piso `auto` (una hora no se parte).
function gridFr(cols){
  return (cols || []).map(function(celdas, i){
    var n = 2;
    (celdas || []).forEach(function(t){ n = Math.max(n, String(t == null ? "" : t).length); });
    return i === 0 ? "minmax(0," + n + "fr)" : n + "fr";
  }).join(" ");
}
var BOARD = {

  registrar: function(clave, api){ mods[clave] = api; delete modsError[clave]; modsCargas++; },
  // lo que un modulo puede usar del shell, y nada mas
  esc: esc, it: it, caja: caja, vacio: vacio, wset: wset, limFilas: limFilas, corto: corto, pad: pad,
  gridFr: gridFr,   // 1843: las columnas de una tabla de widget, en `fr` proporcional al contenido
  barraUso: barraUso, moldeSwitch: moldeSwitch, moldeSwitchReg: moldeSwitchReg,
  moldeSwitchSacar: function(nombre){ delete MOLDE_SW[nombre]; },

  // dejar ese dato en `widDatos` para que el repintado de 30 s no lo pise con uno mas viejo, y repintar su caja

  anclado: function(fn){ anclaClavar(); try{ return fn(); } finally{ anclaSoltar(); } },

function modUrl(clave, v){ return "widgets/" + clave + ".js?v=" + encodeURIComponent(v || verWebCorta()); }
function verWebCorta(){ return (verWeb || verEmbebida || "0").split("/")[0]; }
// `file://` no deja `import()` (lo pide con cors y lo rechaza): ahi el MISMO archivo entra como script clasico.
// por eso los modulos no tienen `export`: se registran en `window.__board` y sirven para las dos formas.
function modScript(url){
  return new Promise(function(res, rej){
    var e = document.createElement("script");
    e.src = url; e.async = false;
    e.onload = function(){ if(e.parentNode) e.parentNode.removeChild(e); res(); };
    e.onerror = function(){ if(e.parentNode) e.parentNode.removeChild(e); rej(new Error("no cargo " + url)); };
    document.head.appendChild(e);

function cargarModulo(clave, v){

function cargarModulos(v){

// cambio el modulo de un widget: se suelta el viejo (timers y listeners incluidos), se carga el nuevo

function repintarMod(clave, v){
  anclaClavar();                      // 1805: repintar una caja de widget no mueve el chat
  soltarMod(clave);

    var nodo = document.querySelector('#widgets [data-w="' + clave + '"]');
    if(nodo && mods[clave]) mods[clave].pintar(modDatos(clave), nodo);

// css: se enchufa el `<link>` nuevo al lado del viejo y recien cuando cargo se saca el viejo (sin parpadeo,
// sin perder scroll, ni lo tipeado, ni un modal abierto). es el hot reload de assets de shopify theme dev.
function swapCss(v){
  var vieja = $("cssppal");
  if(!vieja) return Promise.resolve(false);
  anclaClavar();                      // 1805: el css nuevo puede cambiar los altos del chat
  return new Promise(function(res){
    var n = document.createElement("link");
    n.rel = "stylesheet";
    n.href = "estilos.css?v=" + encodeURIComponent(v);
    vieja.id = "cssviejo";
    var listo = function(){
      if(vieja.parentNode) vieja.parentNode.removeChild(vieja);
      n.id = "cssppal";
      anclaSoltar();
      res(true);
    };
    n.onload = listo;
    n.onerror = listo;
    vieja.parentNode.insertBefore(n, vieja.nextSibling);
  });

// el `[↻]` del header: vuelve a bajar widgets.json aunque no haya cambiado (sin etag) y repinta.
// el json lo republica el script `widgets_web` del daemon cada 60 s, asi que esto trae lo ultimo
// publicado sin gastar un solo token.
// 1841 (facundo, 2026-09-17: "el widget no refresca cuando toco en refrescar"): dos causas. (1) por la lan el endpoint
// servia el json del script de 60 s (ahora `?fresco=1`, `cargarWidgets`). (2) `refrescando` podia quedar trabado en
// `true` para siempre: si `pintarWidgets` tiraba adentro del `catch`, el `then` que lo soltaba no corria y desde ahi
// cada toque del `[↻]` volvia sin hacer nada. ahora se suelta pase lo que pase y un refresco de mas de 15 s se da
// por muerto (`REFRESCO_TRABADO_MS`).
var refrescando = false, refrescos = 0, refrescandoDesde = 0, REFRESCO_TRABADO_MS = 15000;
function refrescarWidgets(clave){
  if(refrescando && Date.now() - refrescandoDesde < REFRESCO_TRABADO_MS) return Promise.resolve();
  refrescando = true; refrescandoDesde = Date.now(); refrescos++;
  var b = document.querySelector('#widgets [data-ref="' + (clave || "").replace(/"/g, "") + '"]');
  if(b) b.classList.add("girando");
  etagWid = null;
  function listo(){
    refrescando = false;
    var n = document.querySelector('#widgets [data-ref="' + (clave || "").replace(/"/g, "") + '"]');
    if(n) n.classList.remove("girando");
  }
  return cargarWidgets(true).catch(function(e){
    if(ruidoso(e)) pintarWidgets(null, e.message);
  }).then(listo, function(e){ listo(); throw e; });
}

// se agarra del header (no de los botones `[↻]` `[⚙]`, que siguen funcionando): en la compu con el
// mouse (arranca al mover ARR_PX), en el celu con tap and hold de HOLD_MS, el mismo del menu
// contextual, que en el header no se pide. mientras se arrastra el panel no scrollea. el orden que
// queda se guarda en `tabs.json` (`orden_widgets`).
var ARR_PX = 5;

function cajaDeHeader(target){
  if(!target || !target.closest) return null;

function arrEmpezar(nodo, y){
  if(arrW) return;
  var r = nodo.getBoundingClientRect();
  var ph = document.createElement("div");
  ph.className = "caja fantasma";
  ph.style.height = r.height + "px";
  nodo.parentNode.insertBefore(ph, nodo);
  nodo.classList.add("arrastrando");
  nodo.style.position = "fixed";
  nodo.style.left = r.left + "px";
  nodo.style.top = r.top + "px";
  nodo.style.width = r.width + "px";
  nodo.style.zIndex = "60";

function arrMover(y){
  if(!arrW) return;

  var cs = [].filter.call(widgetsEl.children, function(c){
    return c !== arrW.nodo && c !== arrW.ph && c.dataset && c.dataset.w;
  });
  for(var i = 0; i < cs.length; i++){
    var r = cs[i].getBoundingClientRect();
    if(y < r.top + r.height / 2){
      if(arrW.ph.nextSibling !== cs[i]) widgetsEl.insertBefore(arrW.ph, cs[i]);
      return;
    }

function arrSoltar(){
  if(!arrW) return;

widgetsEl.addEventListener("pointerdown", function(e){

  var c = cajaDeHeader(e.target);

  function mover(ev){
    if(!listo){

// ---------- menu contextual (facundo, 2026-09-11) ----------
// tap and hold (~500 ms, sin disparar el scroll ni la seleccion) en el celu y click derecho en desktop:
// sobre un mensaje del chat (responder / copiar / editar / mandar a otra pestaña), sobre una fila de un
// widget (abre el modal a/b/c que ya existe, o copiar) y sobre una pestaña (cerrar / renombrar / al lado
// de los widgets). se cierra con esc, tocando afuera o al scrollear.
var HOLD_MS = 500;      // cuanto hay que mantener el dedo apoyado
var HOLD_PX = 10;       // si se mueve mas que esto, era un scroll: no hay menu
var MENU_MS = 400;      // el click que viene atras del hold no cierra el menu recien abierto
var CITA_LINEAS = 3, CITA_CHARS = 120;
var menuAbierto = null, menuTs = 0, menuNodo = null;

function cerrarMenu(){
  menuAbierto = null;
  $("ctx").classList.add("oculta"); $("ctx").innerHTML = "";
  $("ctxfondo").classList.add("oculta");
  document.body.classList.remove("sinsel");
  if(menuNodo){ menuNodo.classList.remove("marcado"); menuNodo = null; }
}
// `opciones` es [texto, funcion]. (x, y) es donde se toco: el menu se acomoda para no salirse.
function menu(x, y, titulo, opciones, nodo){
  cerrarMenu();
  var d = $("ctx");
  if(titulo){
    var t = document.createElement("div");
    t.className = "ctit"; t.textContent = titulo;
    d.appendChild(t);
  }
  opciones.forEach(function(o){
    // 2086 {notificaciones}: una opcion puede ser una fila propia (`{nodo}` ya armado, o `{html}`) y no un boton:
    // es lo que deja meter el checkbox `notificaciones de audio enviado` adentro del dropdown, con el molde
    // `moldeCheck`. la fila NO cierra el menu al tocarla (un control que se cierra encima parece que no guardo).
    if(o && (o.nodo || o.html !== undefined)){
      var f = o.nodo;
      if(!f){ f = document.createElement("div"); f.className = "cfila"; f.innerHTML = o.html; }
      d.appendChild(f);
      return;
    }
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[0];
    b.addEventListener("click", function(){ cerrarMenu(); o[1](); });
    d.appendChild(b);
  });
  menuAbierto = {titulo: titulo || "", opciones: opciones.map(function(o){
    return o && (o.nodo || o.html !== undefined) ? (o.nombre || "") : o[0]; })};
  menuTs = Date.now();
  d.classList.remove("oculta");
  $("ctxfondo").classList.remove("oculta");
  document.body.classList.add("sinsel");
  d.style.left = "0px"; d.style.top = "0px";
  var r = d.getBoundingClientRect();
  d.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + "px";
  d.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + "px";
  if(nodo && nodo.classList){ nodo.classList.add("marcado"); menuNodo = nodo; }
  return true;
}
// el gesto, delegado en el contenedor (los mensajes se repintan enteros en cada render).
// `pedir(target, x, y)` devuelve true si abrio un menu.
function gestos(el, pedir){
  if(!el) return;
  el.addEventListener("contextmenu", function(e){
    if(pedir(e.target, e.clientX, e.clientY)) e.preventDefault();
  });
  var t = null, x0 = 0, y0 = 0, blanco = null;
  function cancelar(){ if(t){ clearTimeout(t); t = null; } }
  el.addEventListener("touchstart", function(e){
    cancelar();
    if(e.touches.length !== 1) return;
    blanco = e.target; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t = setTimeout(function(){
      t = null;
      if(pedir(blanco, x0, y0)){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){} }
    }, HOLD_MS);
  }, {passive: true});
  el.addEventListener("touchmove", function(e){
    var p = e.touches[0];
    if(!t || !p) return;
    if(Math.abs(p.clientX - x0) > HOLD_PX || Math.abs(p.clientY - y0) > HOLD_PX) cancelar();
  }, {passive: true});
  ["touchend", "touchcancel"].forEach(function(ev){ el.addEventListener(ev, cancelar, {passive: true}); });
}

// fallback de seleccion: safari ios no copia con `a.select()` a secas, necesita un rango sobre el nodo y
// `setSelectionRange`; `readonly` para que no abra el teclado (el zoom lo frena maximum-scale=1; tope 1541).
function copiaSeleccion(texto){
  var a = document.createElement("textarea"), pudo = false;
  a.value = texto; a.setAttribute("readonly", ""); a.contentEditable = "true";
  a.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:var(--texto-max)";
  document.body.appendChild(a);
  var antes = document.activeElement;
  try{
    try{ a.focus({preventScroll: true}); }catch(x){ a.focus(); }
    var r = document.createRange(); r.selectNodeContents(a);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    a.setSelectionRange(0, texto.length);
    pudo = document.execCommand("copy");
  }catch(x){}
  document.body.removeChild(a);
  try{ window.getSelection().removeAllRanges(); }catch(x){}
  try{ if(antes && antes.focus && antes !== document.body) antes.focus({preventScroll: true}); }catch(x){}
  return pudo;
}
function copiarViejo(texto, listo){
  if(copiaSeleccion(texto)) listo(); else sistema("no pude copiar", "error");
}
function copiar(texto){
  texto = texto || "";
  var listo = function(){ sistema("copiado: " + corto(texto, 60)); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(texto).then(listo, function(){ copiarViejo(texto, listo); });
  }catch(x){}
  copiarViejo(texto, listo);
}

// ---------- 1214: botones `copiar` de un toque en las respuestas de claudio ----------
// links, `code` con url / clave / token, valores `clave: ...` y los bloques ``` (drafts). el portapapeles se
// pide adentro del click (gesto del usuario); si safari lo rechaza, fallback de seleccion.
var COPIADO_MS = 1000;
var RE_CLAVE_LBL = /(?:^|[^\w<&])(clave|contraseña|password|passwd|pass|token|api[ _-]?key|secret|secreto|pin|usuario|user)\s*:\s*$/i;
var RE_CLAVE_TXT = /(^|[^\w<&])(clave|contraseña|password|passwd|pass|token|api[ _-]?key|secret|secreto|pin|usuario|user)(\s*:\s*)([^\s<>`]{3,})/i;
function copiarSeguro(texto){
  return new Promise(function(res){
    var viejo = function(){ res(copiaSeleccion(texto)); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        return navigator.clipboard.writeText(texto).then(function(){ res(true); }, viejo);
    }catch(x){}
    viejo();
  });
}
function tocarCopiar(bt, texto){
  return copiarSeguro(texto).then(function(ok){
    var poner = function(t){ if(bt.classList.contains("cp")) bt.dataset.t = t; else bt.textContent = t; };
    poner(ok ? "copiado" : "no pude");
    bt.classList.toggle("ok", ok);
    clearTimeout(bt.__t);
    bt.__t = setTimeout(function(){ poner("copiar"); bt.classList.remove("ok"); }, COPIADO_MS);
    if(!ok) sistema("no pude copiar", "error");
    return ok;
  });
}
function armarCopiar(bt, texto){
  bt.type = "button"; bt.dataset.copia = texto;
  bt.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); tocarCopiar(bt, texto); });
  bt.addEventListener("contextmenu", function(e){ e.preventDefault(); e.stopPropagation(); });
  return bt;
}
function botonCopiar(texto){
  var bt = document.createElement("button");
  bt.className = "cp"; bt.dataset.t = "copiar"; bt.setAttribute("aria-label", "copiar");
  return armarCopiar(bt, texto);
}
// token o clave suelta: prefijos conocidos, uuid, hex largo, o 24+ chars sin espacios con mayuscula,
// minuscula y numero. rutas y nombres de archivo no (tienen `.` o arrancan con `/` `~`).
function esClave(t){
  t = String(t || "").trim();
  if(!t || /\s/.test(t)) return false;
  if(/^(sk-|sk_|ghp_|gho_|ghs_|github_pat_|xox[abpcsd]-|tskey-|AIza|ya29\.|glpat-|ATATT|shpat_|shpss_)\S{8,}$/.test(t)) return true;
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(t)) return true;
  if(/^[0-9a-f]{32,}$/i.test(t)) return true;
  return t.length >= 24 && /^[A-Za-z0-9_\-+\/=]+$/.test(t) && !/^[\/~]/.test(t) &&
         /[A-Z]/.test(t) && /[a-z]/.test(t) && /\d/.test(t);
}
function ponerCopiar(b){
  if(!b || !b.querySelectorAll) return;
  var despues = function(nodo, texto){ nodo.parentNode.insertBefore(botonCopiar(texto), nodo.nextSibling); };
  [].forEach.call(b.querySelectorAll("a[href]"), function(a){
    if(/^https?:/i.test(a.getAttribute("href"))) despues(a, a.getAttribute("href"));
  });
  [].forEach.call(b.querySelectorAll(".cod"), function(sp){
    var t = sp.textContent.trim(), prev = sp.previousSibling;
    var lbl = prev && prev.nodeType === 3 && RE_CLAVE_LBL.test(prev.nodeValue);
    if(t && (/^https?:\/\/\S+$/.test(t) || esClave(t) || lbl)) despues(sp, t);
  });
  // `clave: valor` en texto pelado (no adentro de code, links ni botones). `<clave: algo>` es un tapado de la
  // boveda, no un valor: se saltea.
  var w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT, null), textos = [];
  while(w.nextNode()) textos.push(w.currentNode);
  textos.forEach(function(n){
    if(n.parentNode.closest && n.parentNode.closest(".cod,a,button")) return;
    for(var vueltas = 0; n && vueltas < 20; vueltas++){
      var m = RE_CLAVE_TXT.exec(n.nodeValue);
      if(!m) return;
      var val = m[4].replace(/[.,;:)]+$/, "");
      var fin = m.index + m[1].length + m[2].length + m[3].length + val.length;
      // una palabra suelta en prosa ("el token: vence") no es un valor: tiene que tener numero, mayuscula o
      // simbolo, o ser larga
      if(val.length >= 3 && (/[0-9A-Z_\-.@!#$%*+=\/]/.test(val) || val.length >= 8)){
        var resto = n.splitText(fin);
        n.parentNode.insertBefore(botonCopiar(val), resto);
        n = resto;
      }else n = n.splitText(fin);
    }
  });
}

// el bloque de cita que deja "responder" en la caja: `> <quien>: <primeras lineas>` y una linea vacia.
// el daemon la reconoce (`marcas_chat`) y se la pasa al modelo como contexto, no como parte del pedido.
function citaDe(m){
  var ls = String(m.texto || "").split("\n").filter(function(x){ return x.trim() !== ""; });
  ls = ls.slice(0, CITA_LINEAS);
  if(!ls.length) ls = [""];
  return ls.map(function(x, i){
    x = x.replace(/\s+/g, " ").trim();
    if(x.length > CITA_CHARS) x = x.slice(0, CITA_CHARS - 1) + "…";
    return "> " + (i === 0 ? (m.quien || QUIEN_F) + ": " : "") + x;
  }).join("\n") + "\n\n";
}
function responderA(m){
  var cita = citaDe(m), resto = txt.value;
  ponerCaja(resto.indexOf(cita) === 0 ? resto : cita + resto);
  guardarBorrador(temaCaja || temaActivo(), txt.value, true);
  txt.focus();
}
// editar un mensaje propio: sale con el prefijo que el daemon guarda como `edita_ts` y el modelo
// trata como aclaracion del anterior, no como un pedido nuevo suelto.
function editarMsg(m){
  ponerCaja("edicion del mensaje de " + desde(m.iso) + ": " + (m.texto || ""));
  guardarBorrador(temaCaja || temaActivo(), txt.value, true);
  txt.focus();
}
function aOtraPestana(m){
  var ops = [];
  TEMAS.forEach(function(t){
    if(t !== m.tema) ops.push([t + (tabs.indexOf(t) < 0 ? " (abre la pestaña)" : ""), t]);
  });
  dd("mandar este mensaje a...", ops, function(t){ abrirTab(t); mandar(m.texto, t); });
}
function menuMsg(nodo, x, y){
  var m = nodo.__msg;
  if(!m) return false;
  var ops = [["responder", function(){ responderA(m); }],
             ["copiar", function(){ copiar(m.texto); }]];
  if(m.clase === "yo"){
    ops.push(["editar", function(){ editarMsg(m); }]);
    ops.push(["mandar a otra pestaña", function(){ aOtraPestana(m); }]);
  }
  return menu(x, y, (m.quien || "") + " " + desde(m.iso) + " · " + corto(m.texto, 40), ops, nodo);
}
function menuItem(nodo, x, y){
  var o = itemsW[nodo.dataset.it];
  if(!o) return false;
  return menu(x, y, o.tipo || "item", [
    ["ver y decidir (a/b/c)", function(){ abrirModal(o); }],
    ["copiar", function(){ copiar((nodo.textContent || "").replace(/\s+/g, " ").trim()); }]
  ], nodo);
}
function menuTab(nodo, x, y){
  var t = nodo.dataset.tema;
  if(!t) return false;
  var ops = [];
  if(t !== AUTO){          // la general no se renombra nunca (es la puerta de entrada)
    ops.push(["renombrar tema", function(){
      var op = [];
      TEMAS.forEach(function(otro){ if(otro !== t) op.push([otro, otro]); });
      dd("renombrar «" + (ETIQUETA[t] || t) + "» a...", op, function(n){ renombrarTab(t, n); });
    }]);
  }
  ops.push(["cerrar la pestaña", function(){ cerrarTab(t); }]);
  return menu(x, y, "pestaña " + (ETIQUETA[t] || t), ops, nodo);
}
function pedirMenuMsg(target, x, y){
  if(target && target.closest && target.closest(".cp,.copiar")) return false;   // 1214: el hold del boton no abre menu
  var n = target && target.closest && target.closest(".msg");
  return n ? menuMsg(n, x, y) : false;
}
gestos(lista, pedirMenuMsg);
gestos($("widgets"), function(target, x, y){
  var n = target && target.closest && target.closest("[data-it]");
  return n ? menuItem(n, x, y) : false;
});
gestos($("tabs"), function(target, x, y){
  var n = target && target.closest && target.closest("[data-tema]");
  return n ? menuTab(n, x, y) : false;
});
$("ctxfondo").addEventListener("click", function(){ if(Date.now() - menuTs > MENU_MS) cerrarMenu(); });
$("ctxfondo").addEventListener("contextmenu", function(e){ e.preventDefault(); cerrarMenu(); });
// scroll no burbujea: con captura se ve el de cualquier panel
document.addEventListener("scroll", function(){ if(menuAbierto) cerrarMenu(); }, true);

// ---------- 1676 {vista}: la vista `docs` (facundo, 2026-09-22) ----------
// "agregar al board una vista nueva `docs` que muestre los informes en markdown que el agente escribe dentro de
// `~/.claudio/<tema>/`, leible desde el celu y desde la mac". todo lo pesado es del server
// (`recetas/docs_vista.py`, `GET /docs`, `GET /docs/<id>`, `POST /docs/<id>`): indexar, renderizar el markdown a
// html y guardar lo que facundo tilda. la web pide, pinta y manda el toque; no parsea markdown ni escribe nunca un
// `.md`. cada fila de una tabla trae su tilde (`lo bajé`) y su nota, y eso vive en un `.estado.json` al lado.
// 2143 {cache}: lo ultimo que llego queda en localStorage y pinta el primer frame, pero entrar a la vista o abrir
// un informe SIEMPRE pide fresco; si el pedido falla queda lo cacheado CON aviso, nunca una pantalla en blanco.
// 1691 {vista} (facundo, 2026-09-22): "deberia poder ordenarse por fecha y agruparse O NO por tema". los dos
// controles viven arriba del indice y se recuerdan entre visitas en el localStorage del board, como el resto de
// las preferencias de vista (`agente_vista`). el server manda las dos vistas del mismo indice (`temas` agrupado y
// `docs` plano): ordenar o desagrupar NO vuelve a pedir nada.
var docs = {idx: null, doc: null, q: "", solapa: "docs", aviso: "", cargando: false, agrupar: true, orden: "fecha"};
var DOCS_LS = "agente_docs";
var DOCS_PREF_LS = "agente_docs_pref";
function docsPrefLeer(){
  try{
    var d = JSON.parse(localStorage.getItem(DOCS_PREF_LS) || "{}");
    if(typeof d.agrupar === "boolean") docs.agrupar = d.agrupar;
    if(d.orden === "titulo" || d.orden === "fecha") docs.orden = d.orden;
  }catch(x){}
  return {agrupar: docs.agrupar, orden: docs.orden};
}
function docsPrefGuardar(){
  try{ localStorage.setItem(DOCS_PREF_LS, JSON.stringify({agrupar: !!docs.agrupar, orden: docs.orden})); }catch(x){}
}
docsPrefLeer();
function docsAgrupar(si){ docs.agrupar = !!si; docsPrefGuardar(); docsPintar(); return docs.agrupar; }
function docsOrden(cual){ docs.orden = cual === "titulo" ? "titulo" : "fecha"; docsPrefGuardar(); docsPintar(); return docs.orden; }
function docsCacheLeer(k){
  try{ var d = JSON.parse(localStorage.getItem(DOCS_LS) || "{}"); return d[k] || null; }catch(x){ return null; }
}
function docsCacheGuardar(k, v){
  try{
    var d = JSON.parse(localStorage.getItem(DOCS_LS) || "{}");
    d[k] = v;
    var ks = Object.keys(d);
    if(ks.length > 12) ks.slice(0, ks.length - 12).forEach(function(x){ if(x !== "idx") delete d[x]; });
    localStorage.setItem(DOCS_LS, JSON.stringify(d));
  }catch(x){}
}
function docsPedir(ruta, opts){
  return votLan().then(function(base){
    if(!base) throw new Error("sin lan");
    var o = opts || {};
    o.cache = "no-store";
    o.headers = Object.assign({"authorization": "Bearer " + token}, o.headers || {});
    return lanFetch(base + ruta, o);
  }).then(function(r){
    if(!r || !r.ok) throw new Error("http " + (r && r.status));
    return r.json();
  });
}
// el indice: siempre fresco del server, con lo cacheado pintado mientras llega
function docsCargarIndice(){
  var cache = docsCacheLeer("idx:" + docs.solapa);
  if(!docs.idx && cache){ docs.idx = cache; docs.aviso = ""; docsPintar(); }
  docs.cargando = true;
  return docsPedir("/docs" + (docs.solapa === "archivados" ? "?archivados=1" : "")).then(function(j){
    docs.idx = j; docs.aviso = ""; docs.cargando = false;
    docsCacheGuardar("idx:" + docs.solapa, j);
    docsPintar();
    return j;
  }).catch(function(e){
    docs.cargando = false;
    docs.aviso = "no llegué al server (" + (e && e.message || e) + ")" + (docs.idx ? ": esto es lo último que tenía" : "");
    docsPintar();

function docsAbrir(id){

  docs.aviso = "";
