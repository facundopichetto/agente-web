<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>flos · chat aislado</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #151b23;
      --borde: #263040;
      --texto: #e6edf3;
      --tenue: #8b949e;
      --acento: #38bdf8;
      --verde: #3fb950;
      --amarillo: #d29922;
      --rojo: #f85149;
      --burbuja-yo: #1b2a3a;
      --burbuja-ag: #161e29;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--texto);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
    }
    #app-amigo {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      border-left: 1px solid var(--borde);
      border-right: 1px solid var(--borde);
      background: var(--bg);
    }
    #cabecera-amigo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--borde);
    }
    .marca {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--acento);
    }
    .chip {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--borde);
      background: #10161f;
      color: var(--tenue);
    }
    .chip.ok { color: var(--verde); border-color: rgba(63, 185, 80, 0.35); }
    .chip.alerta { color: var(--amarillo); border-color: rgba(210, 153, 34, 0.4); }
    .chip.tope { color: var(--rojo); border-color: rgba(248, 81, 73, 0.4); }
    #barra-estado {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 14px;
      background: #10161e;
      border-bottom: 1px solid var(--borde);
      font-size: 12px;
      color: var(--tenue);
    }
    #panel-memoria {
      display: none;
      padding: 10px 14px;
      background: #111822;
      border-bottom: 1px solid var(--borde);
      font-size: 12px;
      white-space: pre-wrap;
      color: var(--texto);
    }
    #panel-memoria.abierto { display: block; }
    #panel-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #hist {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--borde);
      line-height: 1.45;
      word-break: break-word;
    }
    .msg.amigo {
      align-self: flex-end;
      background: var(--burbuja-yo);
      max-width: 85%;
    }
    .msg.asistente {
      align-self: flex-start;
      background: var(--burbuja-ag);
      max-width: 92%;
    }
    .meta {
      font-size: 11px;
      color: var(--tenue);
      margin-bottom: 4px;
    }
    #pie {
      padding: 10px 14px;
      background: var(--panel);
      border-top: 1px solid var(--borde);
    }
    #fila {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #txt {
      flex: 1;
      min-height: 42px;
      max-height: 140px;
      resize: vertical;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      background: #0b0f14;
      color: var(--texto);
      font-family: inherit;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      background: #1b2636;
      color: var(--texto);
      font-family: inherit;
      font-size: 13px;
    }
    button.primario {
      background: var(--acento);
      color: #061018;
      border-color: var(--acento);
      font-weight: 700;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body data-chat-unico="true" data-sin-pestanas="true">
  <div id="app-amigo">
    <header id="cabecera-amigo">
      <div class="marca">
        <span id="titulo-amigo">flos · chat</span>
        <span class="chip ok" id="chip-aislado">instancia aislada · sin pestañas</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="chip" id="chip-plan">2 semanas gratis · luego 30 USD/mes · sin cobro automático</span>
        <button type="button" id="btn-memoria">memoria</button>
      </div>
    </header>

    <div id="barra-estado">
      <span id="estado-consumo">consumo: $0.00 / $10.00 USD · 0 msgs hoy</span>
      <span id="estado-modelos">chat: agy/gemini-3.8-flash (low) · órdenes: agy/gemini-4-argon (high)</span>
    </div>

    <section id="panel-memoria" aria-label="Memoria propia aislada"></section>

    <main id="panel-chat">
      <div id="hist">
        <div id="lista"></div>
      </div>
      <footer id="pie">
        <div id="fila">
          <textarea id="txt" placeholder="Escribí en tu chat único (o empezá con 'acordate que...' para guardar en tu memoria)..."></textarea>
          <button type="button" id="btn-orden" title="Correr como orden aislada en high effort">orden</button>
          <button type="button" class="primario" id="mandar">enviar</button>
        </div>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      const qs = new URLSearchParams(window.location.search);
      const amigo = (qs.get("amigo") || "demo").trim().toLowerCase();
      const claveStorage = "flos_amigo_" + amigo + "_acceso";
      const accesoUrl = (qs.get("acceso") || qs.get("token") || "").trim();
      if (accesoUrl) {
        try { localStorage.setItem(claveStorage, accesoUrl); } catch (_) {}
      }
      function obtenerAcceso() {
        if (accesoUrl) return accesoUrl;
        try { return localStorage.getItem(claveStorage) || ""; } catch (_) { return ""; }
      }

      const elTitulo = document.getElementById("titulo-amigo");
      const elPlan = document.getElementById("chip-plan");
      const elConsumo = document.getElementById("estado-consumo");
      const elModelos = document.getElementById("estado-modelos");
      const elLista = document.getElementById("lista");
      const elMemoria = document.getElementById("panel-memoria");
      const elTxt = document.getElementById("txt");
      const btnMandar = document.getElementById("mandar");
      const btnOrden = document.getElementById("btn-orden");
      const btnMemoria = document.getElementById("btn-memoria");

      elTitulo.textContent = "flos · " + amigo;

      function headersAmigo() {
        return {
          "Content-Type": "application/json",
          "X-Amigo-Acceso": obtenerAcceso()
        };
      }

      function pintarMensajes(mensajes) {
        elLista.innerHTML = "";
        (mensajes || []).forEach(function (m) {
          const div = document.createElement("div");
          const clase = m.origen === "amigo" ? "amigo" : "asistente";
          div.className = "msg " + clase;
          const meta = document.createElement("div");
          meta.className = "meta";
          const etiqueta = m.origen === "amigo" ? amigo : ("flos (" + (m.modelo || "chat") + ")");
          meta.textContent = etiqueta + " · " + (m.ts || "");
          const cuerpo = document.createElement("div");
          cuerpo.className = "cuerpo";
          cuerpo.textContent = m.texto || "";
          div.appendChild(meta);
          div.appendChild(cuerpo);
          elLista.appendChild(div);
        });
      }

      async function cargarEstado() {
        const res = await fetch("/api/amigo/estado?amigo=" + encodeURIComponent(amigo), {
          headers: headersAmigo()
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.ok || !data.estado) return;
        const est = data.estado;
        const sub = est.suscripcion || {};
        const cons = est.consumo || {};
        const topes = est.topes || {};
        elTitulo.textContent = "flos · " + (est.nombre || est.amigo_id);
        elPlan.textContent =
          sub.semanas_gratis + " semanas gratis (" + sub.dias_gratis_restantes + " d restantes) · luego $" +
          sub.precio_usd + " USD/mes · sin cobro automático";
        elConsumo.textContent =
          "consumo: $" + Number(cons.costo_usd_mes || 0).toFixed(4) + " / $" +
          Number(topes.tope_mensual_usd || 0).toFixed(2) + " USD · " +
          (cons.mensajes_hoy || 0) + "/" + (topes.tope_mensajes_dia || 0) + " msgs hoy";
        if (est.modelos && est.modelos.chat && est.modelos.orden) {
          elModelos.textContent =
            "chat: " + est.modelos.chat.modelo + " (" + est.modelos.chat.effort + ") · " +
            "órdenes: " + est.modelos.orden.modelo + " (" + est.modelos.orden.effort + ")";
        }
        btnMandar.disabled = !est.permitido_hablar;
        btnOrden.disabled = !est.permitido_hablar;
      }

      async function cargarCharla() {
        const res = await fetch("/api/amigo/charla?amigo=" + encodeURIComponent(amigo), {
          headers: headersAmigo()
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.ok) pintarMensajes(data.mensajes || []);
      }

      async function cargarMemoria() {
        const res = await fetch("/api/amigo/memoria?amigo=" + encodeURIComponent(amigo), {
          headers: headersAmigo()
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.ok) elMemoria.textContent = data.memoria || "(sin notas en memoria)";
      }

      async function enviar(modo) {
        const texto = (elTxt.value || "").trim();
        if (!texto) return;
        btnMandar.disabled = true;
        btnOrden.disabled = true;
        try {
          const endpoint = modo === "orden" ? "/api/amigo/orden" : "/api/amigo/mensaje";
          const payload = modo === "orden"
            ? { amigo: amigo, instruccion: texto, acceso: obtenerAcceso() }
            : { amigo: amigo, texto: texto, modo: "chat", acceso: obtenerAcceso() };
          const res = await fetch(endpoint, {
            method: "POST",
            headers: headersAmigo(),
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            elTxt.value = "";
            await cargarCharla();
            await cargarEstado();
            if (elMemoria.classList.contains("abierto")) await cargarMemoria();
          }
        } finally {
          await cargarEstado();
        }
      }

      btnMandar.addEventListener("click", function () { enviar("chat"); });
      btnOrden.addEventListener("click", function () { enviar("orden"); });
      btnMemoria.addEventListener("click", async function () {
        elMemoria.classList.toggle("abierto");
        if (elMemoria.classList.contains("abierto")) await cargarMemoria();
      });
      elTxt.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          enviar("chat");
        }
      });

      cargarEstado();
      cargarCharla();
    })();
  </script>
</body>
</html>
